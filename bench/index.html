<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Build a computer</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f5f7;
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --line: #d2d2d7;
    --card: rgba(255,255,255,.72);
    --accent: #0071e3;
    --chip: #1d1d1f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg) !important; color: var(--ink); font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  body { min-height: 100dvh; padding: 28px 22px 48px; }
  header { display: flex; align-items: center; gap: 8px; width: min(980px, 100%); margin: 0 auto; }
  h1 { font-size: clamp(40px, 6vw, 64px); line-height: .95; letter-spacing: -0.045em; font-weight: 600; margin: 0; flex: 1; }
  .icon, .back {
    min-width: 44px; min-height: 44px; border-radius: 980px; border: 0;
    background: transparent; color: var(--accent); font-size: 17px; font-weight: 500;
  }
  .pitch { width: min(980px, 100%); margin: 10px auto 18px; color: var(--muted); font-size: 21px; font-weight: 400; letter-spacing: -0.02em; }
  a.use {
    display: flex; align-items: center; justify-content: space-between;
    width: min(980px, 100%); min-height: 56px; margin: 0 auto 22px; padding: 0 4px;
    color: var(--accent); font-weight: 500; text-decoration: none; font-size: 19px;
  }
  .budget { width: min(980px, 100%); margin: 0 auto 18px; }
  .budget b { font-size: clamp(40px, 6vw, 56px); letter-spacing: -0.04em; font-weight: 600; }
  input[type="range"] { width: 100%; accent-color: var(--accent); height: 28px; }
  .grid { width: min(980px, 100%); margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice, .row, .card, .langbtn {
    min-height: 64px; border-radius: 18px; border: 0;
    background: var(--card); text-align: left; padding: 14px 16px; width: 100%;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  .choice.on { outline: 2px solid var(--accent); }
  .choice b { display: block; font-size: 20px; letter-spacing: -0.02em; font-weight: 600; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 8px; background: transparent; border-radius: 0; box-shadow: none; border-bottom: 1px solid var(--line); min-height: 72px; }
  .price { font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; white-space: nowrap; }
  .tag { display: inline-block; margin: 6px 6px 0 0; background: #f5f5f7; color: var(--muted); border-radius: 999px; padding: 3px 8px; font-size: 12px; letter-spacing: 0.02em; }
  .muted { color: var(--muted); }
  .warn { color: #b42318; }
  input[type="search"], input[type="password"] {
    width: 100%; font-size: 17px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line);
    background: #fff; color: var(--ink);
  }
  .go { min-height: 52px; width: 100%; border: 0; border-radius: 980px; background: var(--chip); color: #fff; font-weight: 600; font-size: 17px; margin-top: 8px; }
  .layout { width: min(980px, 100%); margin: 28px auto 0; display: grid; gap: 28px; }
  body.desk .layout { grid-template-columns: 280px 1fr; align-items: start; }
  body.phone .layout, body.phone .grid { grid-template-columns: 1fr !important; }
  /* Side rails. On a wide screen the picker stays in the middle column.
     #railL (progress) takes the left gutter. #railR (the box) takes the right. */
  #railL, #railR {
    background: var(--card);
    border-radius: 18px;
    padding: 16px 16px 8px;
    margin: 12px auto;
    width: min(980px, 100%);
  }
  .rail-kicker { margin: 0 0 10px; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--ink); }
  #meterLabel { margin: 8px 0 0; font-variant-numeric: tabular-nums; }
  .ticks { list-style: none; margin: 8px 0 0; padding: 0; }
  .ticks li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .ticks .ok { color: var(--ink); }
  .ticks .no { color: var(--muted); }
  body.desk #app {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(480px, 720px) minmax(250px, 1fr);
    column-gap: 22px;
    align-items: start;
    width: min(1480px, 100%);
    margin: 0 auto;
  }
  body.desk #app > header,
  body.desk #app > .pitch,
  body.desk #app > a.use,
  body.desk #app > .budget,
  body.desk #app > #jobs,
  body.desk #app > #sell,
  body.desk #app > #parts { grid-column: 2; width: auto; margin-left: 0; margin-right: 0; }
  body.desk #app > #railL { grid-column: 1; grid-row: 1 / span 8; position: sticky; top: 12px; width: auto; margin: 0; }
  body.desk #app > #railR { grid-column: 3; grid-row: 1 / span 8; position: sticky; top: 12px; width: auto; margin: 0; }
  body.phone #app { display: flex; flex-direction: column; }
  body.phone #app > #railL { order: 6; }
  body.phone #app > #railR { order: 7; }
  body.phone #app > #parts { order: 8; }
  @media (prefers-reduced-motion: reduce) {
    .bay.go, .bay.drop.go { animation: none; }
  }
  #phoneBtn.on, #deskBtn.on { background: var(--chip); color: #fff; }
  .stage { background: transparent; padding: 0; }
  .machine { font: 13px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space: pre; color: var(--muted); }
  .bay { display: block; min-height: 1.25em; }
  .bay.go { animation: slide .65s ease; }
  .bay.drop.go { animation: drop .7s ease; }
  @keyframes slide { from { transform: translateX(-18px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes drop { from { transform: translateY(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
  .art { margin: 0 0 8px; color: var(--accent); font: 13px/1.3 ui-monospace, Menlo, monospace; white-space: pre; }
  #langs { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 5; padding: 24px; overflow: auto; }
  #langs.open { display: block; }
  #gate { position: fixed; inset: 0; background: rgba(245,245,247,.86); backdrop-filter: blur(18px); display: grid; place-items: center; padding: 16px; z-index: 6; }
  #gate form { width: min(420px, 100%); background: #fff; padding: 28px 24px; border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.12); }
  #gate[hidden] { display: none !important; }
  .dock { display: none; }
  body.phone .dock {
    display: flex; position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 4;
    justify-content: space-between; align-items: center;
    padding: 14px 18px; border-radius: 22px;
    background: rgba(255,255,255,.86); backdrop-filter: blur(18px);
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }
  body.phone { padding-bottom: 108px; }
  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #000; --ink: #f5f5f7; --muted: #a1a1a6; --line: #2c2c2e; --card: #1c1c1e; --accent: #2997ff; --chip: #f5f5f7;
  }
  html[data-theme="dark"] .go, html[data-theme="dark"] #phoneBtn.on, html[data-theme="dark"] #deskBtn.on { color: #000; }
  html[data-theme="dark"] body.phone .dock, html[data-theme="dark"] #gate form, html[data-theme="dark"] input { background: #1c1c1e; color: #f5f5f7; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } body { padding: 18px 16px 48px; } }
</style>
</head>
<body>
<div id="gate">
  <form id="gateForm">
    <h1 id="gateTitle">Build a computer</h1>
    <p id="gateLabel">Password</p>
    <input id="pass" type="password" autocomplete="current-password" />
    <p id="bad" class="warn"></p>
    <button class="go" id="gateOpen" type="submit">Open</button>
  </form>
</div>
<div id="app">
<aside id="railL" aria-label="Build progress">
  <p class="rail-kicker">In the box</p>
  <div class="meter" aria-hidden="true"><div id="meterFill"></div></div>
  <p id="meterLabel" class="muted">0 / 8</p>
  <ul class="ticks" id="meterList"></ul>
</aside>
<header>
  <button class="back" id="back" type="button">←</button>
  <h1 id="title">Build a computer</h1>
  <button class="icon" id="phoneBtn" type="button" aria-label="Mobile layout">📱</button>
  <button class="icon" id="deskBtn" type="button" aria-label="Desktop layout">🖥️</button>
  <button class="icon" id="langBtn" type="button" aria-label="Language">🔤</button>
</header>
<p class="pitch" id="pitch"></p>
<a class="use" href="use.html">For one game or program <span>→</span></a>
<div class="budget">
  <div><span id="budgetWord">Budget</span> <b id="budgetLabel">$700</b></div>
  <input id="budget" type="range" min="0" max="20000" step="50" value="700" />
  <div class="muted">$0 <span style="float:right">$20,000</span></div>
</div>
<div id="jobs" class="grid"></div>
<p class="muted" id="sell"></p>
<aside id="railR" aria-label="The computer so far">
  <p class="rail-kicker">The box</p>
  <pre class="art" id="art"></pre>
  <div class="machine" id="machine"></div>
  <p class="muted" id="story"></p>
</aside>
<section id="parts"></section>
</div>
<div id="langs"></div>
<div class="dock"><span>Paper total</span><b id="dockTotal">$0</b><button class="icon" id="codeBtn" type="button">QR</button></div>
<canvas id="code" hidden></canvas>
<script src="qr.js"></script>
<script src="bulb.js"></script>

    ["memory", "|  RAM   " + (parts.memory ? "||  ||   click" : "|   |   |")],
    ["storage", "|  NVME  " + (parts.storage && /NVME|M\.2/i.test(parts.storage.name) ? "[====] slide" : "[    ]")],
    ["gpu", "|  GPU   " + (parts.gpu ? "[==========>]" : "[           ]")],
    ["storage", "|  SSD   " + (parts.storage ? "[====]" : "[    ]")],
    ["psu", "|  PSU   " + (parts.psu ? "[####] " + wattOf(parts.psu) + "W" : "[    ]")],
    ["case", "  '------------------------------'"]
  ];
  let told = "";
  rows.forEach((row) => {
    const div = document.createElement("div");
    const id = row[0];
    const now = parts[id] && parts[id].id;
    const fresh = now && seen[id] !== now;
    div.className = "bay" + (id === "memory" || id === "cpu" ? " drop" : "") + (fresh ? " go" : "");
    div.textContent = row[1];
    box.appendChild(div);
    if (fresh) told = lineFor(id);
  });
  CATS.forEach((id) => { if (parts[id]) seen[id] = parts[id].id; });
  document.getElementById("story").textContent = told || t("story");
}
function currentParts() {
  const map = {};
  CATS.forEach((id) => { if (byId[build[id]]) map[id] = byId[build[id]]; });
  return map;
}
function applySuggestion() {
  const suggestion = keepFitting(assemble(job, budget));
  const next = {};
  Object.keys(suggestion).forEach((id) => { if (suggestion[id]) next[id] = suggestion[id].id; });
  build = next;
}
function preferredLayout(){
  try { const saved = sessionStorage.getItem("drew-layout"); if (saved === "phone" || saved === "desk") return saved; } catch (e) {}
  return window.matchMedia("(max-width: 820px)").matches ? "phone" : "desk";
}
let layout = preferredLayout();
function setLayout(next){
  layout = next;
  try { sessionStorage.setItem("drew-layout", next); } catch (e) {}
  document.body.classList.toggle("phone", layout === "phone");
  document.body.classList.toggle("desk", layout === "desk");
  const phone = document.getElementById("phoneBtn");
  const desk = document.getElementById("deskBtn");
  if (phone) phone.classList.toggle("on", layout === "phone");
  if (desk) desk.classList.toggle("on", layout === "desk");
}
function render() {
  setLayout(layout);
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang === "yue" ? "zh-Hant" : lang;
  document.documentElement.dir = (lang === "ar" || lang === "ur") ? "rtl" : "ltr";
  document.getElementById("title").textContent = t("title");
  document.getElementById("pitch").textContent = t("pitch");
  document.getElementById("budgetWord").textContent = t("budget");
  document.getElementById("budgetLabel").textContent = money.format(budget);
  document.getElementById("gateTitle").textContent = t("title");
  document.getElementById("gateLabel").textContent = t("pass");
  document.getElementById("gateOpen").textContent = t("open");
  const jobs = document.getElementById("jobs");
  jobs.replaceChildren();
  JOBS.forEach((id) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice" + (id === job ? " on" : "");
    const b = document.createElement("b");
    b.textContent = jobName(id);
    button.appendChild(b);
    button.onclick = () => { job = id; swap = ""; lock = false; seen = {}; applySuggestion(); render(); };
    jobs.appendChild(button);
  });
  if (PARTS.length && !lock) applySuggestion();
  const parts = currentParts();
  if (PARTS.length) writeCart(parts);
  try { parent.postMessage({ type: "drew-progress", n: CATS.filter(function (id) { return parts[id]; }).length, total: CATS.length }, "*"); } catch (e) {}
  const total = CATS.reduce((sum, id) => sum + (parts[id] ? parts[id].price : 0), 0);
  paintRails(parts, total);
  const sell = document.getElementById("sell");
  if (total > budget + 1) sell.textContent = t("over") + " " + money.format(total);
  else if (budget - total > 250) sell.textContent = t("under") + " " + money.format(total);
  else sell.textContent = money.format(total);
  const dockTotal = document.getElementById("dockTotal");
  if (dockTotal) dockTotal.textContent = money.format(total);
  paintArt();
  paintMachine(parts);
  const list = document.getElementById("parts");
  list.replaceChildren();
  if (swap) {
    const input = document.createElement("input");
    input.type = "search";
    input.placeholder = catLabel(swap);
    list.appendChild(input);
    const now = currentParts();
    const pool = PARTS.filter((p) => p.cat === swap && !junk(p) && !fitWhy(p, now)).sort((a, b) => a.price - b.price).slice(0, 60);
    const hint = document.createElement("p");
    hint.className = "pitch";
    hint.textContent = pool.length ? "Only parts that fit are shown. One of each. Memory is one kit, and the sticks in that kit have to fit the board." : "Nothing on the list fits. Change the processor or the motherboard first.";
    list.appendChild(hint);
    pool.forEach((part) => list.appendChild(card(part, () => {
      const why = fitWhy(part, currentParts());
      if (why) { hint.textContent = "Not added. " + why; return; }
      build[part.cat] = part.id;
      lock = true;
      swap = "";
      render();
    })));
    input.oninput = () => {
      const q = input.value.toLowerCase();
      [...list.querySelectorAll(".card")].forEach((node) => { node.hidden = q && !node.dataset.name.includes(q); });
    };
    return;
  }
  CATS.forEach((id) => {
    const part = parts[id];
    const button = document.createElement("button");
    button.type = "button";
    button.className = "row";
    const text = document.createElement("span");
    const name = document.createElement("b");
    name.textContent = catLabel(id);
    text.appendChild(name);
    text.appendChild(document.createTextNode(part ? " " + part.name : ""));
    if (part) {
      const tags = document.createElement("span");
      tagsOf(part).forEach((tag) => { const s = document.createElement("span"); s.className = "tag"; s.textContent = tag; tags.appendChild(s); });
      text.appendChild(tags);
    }
    button.appendChild(text);
    const price = document.createElement("span");
    price.className = "price";
    price.textContent = part ? money.format(part.price) : "";
    button.appendChild(price);
    button.onclick = () => { swap = id; render(); };
    list.appendChild(button);
  });
}
function card(part, onclick) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "card";
  button.dataset.name = part.name.toLowerCase();
  const text = document.createElement("span");
  text.textContent = part.name;
  tagsOf(part).forEach((tag) => { const s = document.createElement("span"); s.className = "tag"; s.textContent = tag; text.appendChild(s); });
  button.appendChild(text);
  const price = document.createElement("span");
  price.className = "price";
  price.textContent = money.format(part.price);
  button.appendChild(price);
  button.onclick = onclick;
  return button;
}
function paintRails(parts, total) {
  /* Left rail: 8 categories. A row is .ok once that part is in the build. */
  var filled = 0;
  var list = document.getElementById("meterList");
  var fill = document.getElementById("meterFill");
  var label = document.getElementById("meterLabel");
  if (list) list.replaceChildren();
  CATS.forEach(function (id) {
    var part = parts[id];
    if (part) filled++;
    if (!list) return;
    var li = document.createElement("li");
    li.className = part ? "ok" : "no";
    var name = document.createElement("span");
    name.textContent = (part ? "● " : "○ ") + catLabel(id);
    var val = document.createElement("span");
    val.textContent = part ? money.format(part.price) : "—";
    li.append(name, val);
    list.appendChild(li);
  });
  if (fill) fill.style.width = Math.round((filled / CATS.length) * 100) + "%";
  if (label) label.textContent = filled + " / " + CATS.length + "  ·  " + money.format(total || 0);
}
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(function () { renderQueued = false; render(); });
}
document.getElementById("budget").oninput = (event) => {
  budget = +event.target.value;
  lock = false;
  swap = "";
  document.getElementById("budgetLabel").textContent = money.format(budget);
  scheduleRender();
};
document.getElementById("back").onclick = () => { if (swap) { swap = ""; render(); } };
document.getElementById("phoneBtn").onclick = () => { layout = "phone"; render(); };
document.getElementById("deskBtn").onclick = () => { layout = "desk"; render(); };
document.getElementById("langBtn").onclick = () => {
  const box = document.getElementById("langs");
  box.classList.add("open");
  box.replaceChildren();
  Object.keys(LANG).forEach((id) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "langbtn";
    button.textContent = LANG[id].name;
    button.onclick = () => { lang = id; localStorage.setItem("bench-lang", lang); box.classList.remove("open"); render(); };
    box.appendChild(button);
  });
};
document.getElementById("codeBtn").onclick = () => {
  const lines = CATS.map((id) => byId[build[id]] ? id + ": " + byId[build[id]].name : "").filter(Boolean);
  const canvas = document.getElementById("code");
  canvas.hidden = false;
  if (window.drewQR) window.drewQR.draw(canvas, lines.join("\n").slice(0, 640), 3);
};
document.getElementById("gateForm").onsubmit = (event) => {
  event.preventDefault();
  if (document.getElementById("pass").value === "Password1") {
    try { sessionStorage.setItem("drew-bench", "1"); } catch (err) {}
    boot();
  } else document.getElementById("bad").textContent = t("bad");
};
function readCart() { try { return JSON.parse(localStorage.getItem("drew-cart") || "{}"); } catch (e) { return {}; } }
function writeCart(parts) {
  var out = {};
  CATS.forEach(function (id) { if (parts[id]) out[id] = parts[id].id; });
  try { localStorage.setItem("drew-cart", JSON.stringify(out)); } catch (e) {}
}
function boot() {
  document.getElementById("gate").hidden = true;
  fetch("parts.json").then((res) => res.json()).then((data) => {
    PARTS = data; byId = {}; PARTS.forEach((p) => { byId[p.id] = p; });
    var cart = readCart();
    var any = false;
    Object.keys(cart).forEach(function (cat) {
      if (byId[cart[cat]] && byId[cart[cat]].cat === cat) { build[cat] = cart[cat]; any = true; }
    });
    if (any) lock = true;
    render();
  });
}
setInterval(() => { artTick++; paintArt(); }, 1600);
render();
if (sessionStorage.getItem("drew-bench") === "1") boot();
</script>
</body>
</html>
