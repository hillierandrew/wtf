<style>

  .total { font-size: 28px; font-weight: 800; color: #ffe14a; }

  .choice, .tier, .row, .card, .langbtn {

  }
  .choice b, .tier b { display: block; font-size: 26px; }
  .choice small, .tier small, .muted { color: #ddd; font-size: 18px; }
  .tier { margin-bottom: 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }
  .row span { display: block; }
  .price { color: #ffe14a; font-weight: 800; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag, .chip {
    display: inline-block; background: #333; color: #ffe14a; border-radius: 999px;
    padding: 4px 10px; font-size: 16px; font-weight: 700;
  }
  .chip { border: 2px solid #fff; background: #111; color: #fff; min-height: 44px; }
  .chip.on { background: #ffe14a; color: #111; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  input[type="search"], input[type="password"] {
    width: 100%; font-size: 22px; padding: 16px; border-radius: 16px; border: 3px solid #fff;
    background: #000; color: #fff;
  }
  .go {
    min-height: 72px; width: 100%; border: 0; border-radius: 18px; background: #ffe14a; color: #111;
    font-weight: 800; font-size: 24px; margin-top: 8px;
  }
  .warn { color: #ffb4c4; font-size: 20px; }
  #langs {
    position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; z-index: 5;
    padding: max(16px, env(safe-area-inset-top)) 12px 16px; overflow: auto;
  }
  #langs.open { display: block; }
  #gate { position: fixed; inset: 0; background: #111; display: grid; place-items: center; padding: 16px; z-index: 6; }
  #gate form { width: min(440px, 100%); }
  #gate[hidden], .hide { display: none !important; }
  pre { font: 16px/1.15 ui-monospace, Menlo, monospace; white-space: pre; overflow-x: auto; background: #000; padding: 8px; border-radius: 12px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } header h1 { font-size: 22px; } }
</style>

const money = new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD" });
let lang = localStorage.getItem("bench-lang") || "en";
let PARTS = [];
let byId = {};
let build = {};
let screen = "use";
let use = "school";
let shown = 12;
let fits = true;
let active = "cpu";
let tag = "";
const app = document.getElementById("app");
const langs = document.getElementById("langs");
function t(key) { return (LANG[lang] && LANG[lang][key]) || LANG.en[key] || key; }
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang === "yue" ? "zh-Hant" : lang;
  document.documentElement.dir = (lang === "ar" || lang === "ur") ? "rtl" : "ltr";
  document.getElementById("title").textContent = t("title");
  document.getElementById("back").setAttribute("aria-label", t("back"));
  document.getElementById("gateTitle").textContent = t("title");
  document.getElementById("gateLabel").textContent = t("pass");
  document.getElementById("gateOpen").textContent = t("open");
  localStorage.setItem("bench-lang", lang);
  if (!document.getElementById("gate").hidden) return;
  render();
}
function tagsOf(part) {
  const n = part.name.toUpperCase();
  const tags = [];
  if (part.form && SIZE[part.form]) tags.push(SIZE[part.form]);
  if (part.socket) tags.push(part.socket);
  if (part.ram) tags.push(part.ram);
  if (/MINI-?ITX|\bITX\b/.test(n) && tags.indexOf("Mini-ITX") < 0) tags.push("Mini-ITX");
  if (/MICRO-?ATX|M-ATX|\bMATX\b/.test(n) && tags.indexOf("Micro-ATX") < 0) tags.push("Micro-ATX");
  if (/\bATX\b/.test(n) && tags.indexOf("ATX") < 0 && tags.indexOf("Micro-ATX") < 0 && tags.indexOf("Mini-ITX") < 0) tags.push("ATX");
  const rad = n.match(/\b(120|140|240|280|360|420)\s?MM\b/);
  if (rad) tags.push(rad[1] + "mm");
  if (/NVME|M\.2/.test(n)) tags.push("M.2");
  if (/SSD/.test(n)) tags.push("SSD");
  if (/HDD|HARD DRIVE|\bRPM\b|7200|5400/.test(n)) tags.push("HDD");
  if (/WIFI|WI-FI/.test(n)) tags.push("Wi-Fi");
  if (/DDR5/.test(n)) tags.push("DDR5");
  if (/DDR4/.test(n)) tags.push("DDR4");
  let watt = part.watt;
  if (!watt) { const m = n.match(/(\d{3,4})\s?W\b/); if (m) watt = +m[1]; }
  if (watt) tags.push(watt + "W");
  if (/SFX/.test(n)) tags.push("SFX");
  return [...new Set(tags)].slice(0, 6);
}
function chosen() {
  const map = {};
  CATS.forEach((id) => { if (byId[build[id]]) map[id] = byId[build[id]]; });
  return map;
}
function gpuDraw(name) {
  const n = name.toUpperCase();
  if (/5090|4090/.test(n)) return 450;
  if (/5080|4080|5070 TI|9070/.test(n)) return 300;
  if (/5070|4070/.test(n)) return 220;
  if (/5060|4060|7600/.test(n)) return 150;
  if (/3050|1030/.test(n)) return 80;
  return 150;
}
function drawOf(parts) {
  return (parts.cpu ? (parts.cpu.watt || 105) : 0) + (parts.gpu ? gpuDraw(parts.gpu.name) : 0) + (parts.cpu ? 80 : 0);
}
function problems(parts) {
  const notes = [];
  if (parts.cpu && parts.motherboard && parts.cpu.socket && parts.motherboard.socket && parts.cpu.socket !== parts.motherboard.socket) notes.push(parts.cpu.socket + " / " + parts.motherboard.socket);
  const expect = (parts.motherboard && parts.motherboard.ram) || (parts.cpu && SOCKET_RAM[parts.cpu.socket]);
  if (parts.memory && parts.memory.ram && expect && parts.memory.ram !== expect) notes.push(parts.memory.ram);
  if (parts.case && parts.motherboard && parts.case.form && parts.motherboard.form && (BOARD_SIZE[parts.motherboard.form] || 0) > (CASE_FIT[parts.case.form] || 0)) notes.push(SIZE[parts.case.form] || "");
  const draw = drawOf(parts);
  const watt = parts.psu && (parts.psu.watt || ((parts.psu.name.match(/(\d{3,4})\s?W/i) || [])[1] | 0));
  if (watt && draw > watt) notes.push(draw + "W / " + watt + "W");
  return notes;
}
function save() { localStorage.setItem("bench-build", JSON.stringify(build)); }
function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function paintTotal(parts) {
  const total = CATS.reduce((sum, id) => sum + (parts[id] ? parts[id].price : 0), 0);
  document.getElementById("total").textContent = money.format(total);
  const draw = drawOf(parts);
  document.getElementById("watts").textContent = draw ? t("about") + " " + draw + " " + t("watts") : "";
}
function render() {
  const parts = chosen();
  paintTotal(parts);
  app.replaceChildren();
  if (screen === "use") {
    app.appendChild(el("p", "muted", t("askUse")));
    const grid = el("div", "grid");
    USES.forEach((id) => {
      const button = el("button", "choice");
      button.type = "button";
      button.appendChild(el("b", "", t(id)));
      button.onclick = () => { use = id; screen = "tier"; render(); };
      grid.appendChild(button);
    });
    app.appendChild(grid);
    return;
  }
  if (screen === "tier") {
    app.appendChild(el("p", "muted", t(use) + " — " + t("askTier")));
    TIERS.forEach((tier) => {
      const found = BUILDS.find((item) => item.use === use && item.tier === tier);
      const button = el("button", "tier");
      button.type = "button";
      button.appendChild(el("b", "", t(tier)));
      button.appendChild(el("small", "", found ? money.format(found.total) : ""));
      button.onclick = () => {
        build = Object.assign({}, found ? found.parts : {});
        save();
        screen = "done";
        render();
      };
      app.appendChild(button);
    });
    return;
  }
  if (screen === "swap") {
    const input = document.createElement("input");
    input.type = "search";
    input.placeholder = t("search");
    input.id = "q";
    app.appendChild(input);
    const tools = el("div", "tools");
    const fit = el("button", "chip" + (fits ? " on" : ""), t("fits"));
    fit.type = "button";
    fit.onclick = () => { fits = !fits; render(); };
    tools.appendChild(fit);
    const pool = PARTS.filter((part) => part.cat === active);
    const tagset = [];
    pool.forEach((part) => tagsOf(part).forEach((name) => { if (tagset.indexOf(name) < 0 && tagset.length < 8) tagset.push(name); }));
    tagset.forEach((name) => {
      const chip = el("button", "chip" + (tag === name ? " on" : ""), name);
      chip.type = "button";
      chip.onclick = () => { tag = tag === name ? "" : name; shown = 12; render(); };
      tools.appendChild(chip);
    });
    app.appendChild(tools);
    const q = (document.getElementById("q") ? document.getElementById("q").value : "").trim().toLowerCase();
    const list = pool.filter((part) => !q || part.name.toLowerCase().includes(q) || (part.brand || "").toLowerCase().includes(q))
      .filter((part) => !tag || tagsOf(part).indexOf(tag) >= 0)
      .filter((part) => !fits || !clash(part, parts))
      .sort((a, b) => a.price - b.price);
    list.slice(0, shown).forEach((part) => app.appendChild(card(part, () => { build[part.cat] = part.id; save(); screen = "done"; render(); })));
    if (list.length > shown) {
      const more = el("button", "go", t("more"));
      more.type = "button";
      more.onclick = () => { shown += 12; render(); };
      app.appendChild(more);
    }
    input.addEventListener("input", () => { shown = 12; renderKeep(); });
    return;
  }
  app.appendChild(el("p", "muted", t("ready")));
  app.appendChild(el("pre", "", tower(parts)));
  const note = el("p", "warn", problems(parts).join("  "));
  app.appendChild(note);
  CATS.forEach((id) => {
    const part = parts[id];
    const button = el("button", "row");
    button.type = "button";
    const text = el("span");
    text.appendChild(el("b", "", t(id)));
    text.appendChild(document.createTextNode(part ? part.name : (id === "gpu" ? t("builtin") : t("change"))));
    if (part) {
      const tags = el("span", "tags");
      tagsOf(part).forEach((name) => tags.appendChild(el("span", "tag", name)));
      text.appendChild(tags);
    }
    button.appendChild(text);
    button.appendChild(el("span", "price", part ? money.format(part.price) : ""));
    button.onclick = () => { active = id; tag = ""; shown = 12; screen = "swap"; render(); };
    app.appendChild(button);
  });
  const again = el("button", "go", t("start"));
  again.type = "button";
  again.onclick = () => { screen = "use"; render(); };
  app.appendChild(again);
}
function renderKeep() {
  const q = document.getElementById("q");
  const value = q ? q.value : "";
  render();
  const next = document.getElementById("q");
  if (next) { next.value = value; next.focus(); }
}
function card(part, onclick) {
  const button = el("button", "card");
  button.type = "button";
  const text = el("span");
  text.appendChild(document.createTextNode(part.name));
  const tags = el("span", "tags");
  tagsOf(part).forEach((name) => tags.appendChild(el("span", "tag", name)));
  text.appendChild(tags);
  button.appendChild(text);
  button.appendChild(el("span", "price", money.format(part.price)));
  button.onclick = onclick;
  return button;
}
function clash(part, parts) {
  const next = Object.assign({}, parts);
  next[part.cat] = part;
  if (next.cpu && next.motherboard && next.cpu.socket && next.motherboard.socket && next.cpu.socket !== next.motherboard.socket) return true;
  const expect = (next.motherboard && next.motherboard.ram) || (next.cpu && SOCKET_RAM[next.cpu.socket]);
  if (next.memory && next.memory.ram && expect && next.memory.ram !== expect) return true;
  if (next.case && next.motherboard && next.case.form && next.motherboard.form && (BOARD_SIZE[next.motherboard.form] || 0) > (CASE_FIT[next.case.form] || 0)) return true;
  return false;
}
function tower(parts) {
  const line = (s) => "|" + (s + "                                ").slice(0, 32) + "|";
  return [
    "+--------------------------------+",
    line(parts.case ? "CASE" : "case"),
    line("  +------------------------+"),
    line("  |CPU  " + (parts.cpu ? "[####]" : "[    ]")),
    line("  |BOARD" + (parts.motherboard ? "[########]" : "[        ]")),
    line("  |FAN  " + (parts.cooler ? "(())" : "(  )")),
    line("  |RAM  " + (parts.memory ? "[##][##]" : "[  ][  ]")),
    line("  |GPU  " + (parts.gpu ? "[======>]" : "[      ]")),
    line("  |SSD  " + (parts.storage ? "[====]" : "[    ]")),
    line("  |PWR  " + (parts.psu ? "[====]" : "[    ]")),
    line("  +------------------------+"),
    "+--------------------------------+"
  ].join("\n");
}
function openLangs() {
  langs.classList.add("open");
  langs.replaceChildren();
  const close = el("button", "go", t("back"));
  close.type = "button";
  close.onclick = () => langs.classList.remove("open");
  langs.appendChild(el("p", "", t("lang")));
  Object.keys(LANG).forEach((id) => {
    const button = el("button", "langbtn", LANG[id].name);
    button.type = "button";
    button.onclick = () => { lang = id; langs.classList.remove("open"); applyLang(); };
    langs.appendChild(button);
  });
  langs.appendChild(close);
}
document.getElementById("langBtn").onclick = openLangs;
document.getElementById("back").onclick = () => {
  if (screen === "swap") screen = "done";
  else if (screen === "done") screen = "tier";
  else if (screen === "tier") screen = "use";
  else return;
  render();
};
document.getElementById("gateForm").onsubmit = (event) => {
  event.preventDefault();
  if (document.getElementById("pass").value === "Password1") {
    try { sessionStorage.setItem("drew-bench", "1"); } catch (err) {}
    boot();
  } else document.getElementById("bad").textContent = t("bad");
};
function boot() {
  document.getElementById("gate").hidden = true;
  fetch("parts.json").then((res) => res.json()).then((data) => {
    PARTS = data;
    byId = {};
    PARTS.forEach((part) => { byId[part.id] = part; });
    try { build = JSON.parse(localStorage.getItem("bench-build") || "{}") || {}; } catch (err) { build = {}; }
    if (build.cpu) screen = "done";
    render();
  });
}
applyLang();
if (sessionStorage.getItem("drew-bench") === "1") boot();
</script>
