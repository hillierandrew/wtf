}

function gbOf(p) { const m = p.name.toUpperCase().match(/\b(4|8|16|32|64)GB\b/); return m ? +m[1] : 0; }
function wattOf(p) { if (!p) return 0; if (p.watt) return p.watt; const m = p.name.toUpperCase().match(/(\d{3,4})\s?W/); return m ? +m[1] : 0; }
function gpuTier(p) {
  const n = p.name.toUpperCase();
  if (/5090|4090/.test(n)) return 6;
  if (/5080|4080|5070\s?TI|9070\s?XT/.test(n)) return 5;
  if (/\b5070\b|\b9070\b|4070/.test(n)) return 4;
  if (/5060|7600|4060/.test(n)) return 3;
  if (/3050|1650|6500/.test(n)) return 2;
  if (/1030/.test(n)) return 1;
  return 0;
}
function bestGpu(cap, maxTier) {
  let best = null;
  for (const p of PARTS) {
    if (p.cat !== "gpu" || junk(p) || p.price > cap + 0.001) continue;
    const tier = gpuTier(p);
    if (tier < 1 || tier > maxTier) continue;
    if (!best || tier > gpuTier(best) || (tier === gpuTier(best) && p.price < best.price)) best = p;
  }
  return best;
}
function spendOf(out) { return Object.values(out).reduce((sum, p) => sum + (p ? p.price : 0), 0); }
function assemble(jobId, moneyCap) {
  const need = NEED[jobId];
  const out = {};
  const am5 = moneyCap >= 2400 && need.gpu >= 3;
  if (need.gpu === 0 || moneyCap < 850) out.cpu = cheapest("cpu", (p) => /5500GT/.test(p.name));
  else if (!am5) out.cpu = cheapest("cpu", (p) => /Ryzen 5 5500 /.test(p.name)) || cheapest("cpu", (p) => /5500GT/.test(p.name));
  else if (moneyCap < 4000) out.cpu = cheapest("cpu", (p) => /Ryzen 5 7600/.test(p.name));
  else out.cpu = cheapest("cpu", (p) => /9700X/.test(p.name)) || cheapest("cpu", (p) => /7700X/.test(p.name));
  if (!out.cpu) return {};
  const socket = out.cpu.socket || "AM4";
  const ramKind = (socket === "AM5" || socket === "LGA1851") ? "DDR5" : "DDR4";
  out.motherboard = cheapest("motherboard", (p) => p.socket === socket && (!p.ram || p.ram === ramKind || (socket === "LGA1700" && (p.ram === "DDR4" || p.ram === "DDR5"))));
  const boardRam = (out.motherboard && out.motherboard.ram) || ramKind;
  let want = need.ram;
  if (moneyCap < 700) want = Math.min(want, 8);
  else if (moneyCap < 1200) want = Math.min(want, 16);
  const slots = dimmSlots(out.motherboard);
  const mem = (gb, loose) => (p) => (p.ram === boardRam) && gbOf(p) === gb && sticksOf(p) <= slots && (sticksOf(p) === 2 || (loose && (sticksOf(p) === 1 || sticksOf(p) === 4)));
  out.memory = cheapest("memory", mem(want, false)) || cheapest("memory", mem(want, true)) || cheapest("memory", (p) => p.ram === boardRam && gbOf(p) >= 8 && sticksOf(p) === 2 && sticksOf(p) <= slots);
  const ssd = (p) => /SSD|NVME|M\.2/.test(p.name.toUpperCase()) && !/HARD DRIVE|\bHDD\b/i.test(p.name);
  const disk = moneyCap < 700 ? "512GB" : need.disk;
  out.storage = cheapest("storage", (p) => ssd(p) && p.name.toUpperCase().includes(disk) && (moneyCap >= 800 ? /NVME|M\.2/.test(p.name.toUpperCase()) : true)) || cheapest("storage", ssd);
  out.case = cheapest("case", (p) => fitsCase(p, out.motherboard)) || cheapest("case");
  let maxTier = need.gpu;
  if (moneyCap >= 1100 && need.gpu >= 1) maxTier = Math.max(maxTier, 2);
  if (moneyCap >= 1500 && need.gpu >= 2) maxTier = Math.max(maxTier, 3);
  if (moneyCap >= 2200 && need.gpu >= 3) maxTier = Math.max(maxTier, 4);
  if (moneyCap >= 5000 && need.gpu >= 3) maxTier = 5;
  const apu = /graphics|5500GT|5600GT|8500G|8600G/i.test(out.cpu.name);
  function sizePsu() {
    const tier = out.gpu ? gpuTier(out.gpu) : 0;
    const needW = tier >= 4 ? 750 : tier >= 3 ? 650 : tier >= 2 ? 550 : tier >= 1 ? 450 : 400;
    out.psu = cheapest("psu", (p) => wattOf(p) >= needW && wattOf(p) <= needW + 250) || cheapest("psu", (p) => wattOf(p) >= needW);
  }
  sizePsu();
  if (maxTier >= 2 || (maxTier >= 1 && !apu)) {
    const g = bestGpu(Math.max(0, moneyCap - spendOf(out)), maxTier);
    if (g) out.gpu = g;
    sizePsu();
  }
  if (!/cooler/i.test(out.cpu.name) || (need.gpu >= 3 && moneyCap > 2200)) {
    out.cooler = need.gpu >= 3 && moneyCap > 2200 ? cheapest("cooler", (p) => /\b240\s?MM\b/i.test(p.name)) : cheapest("cooler");
    if (out.cooler && spendOf(out) > moneyCap) delete out.cooler;
  }
  function tryMem(gb) {
    const found = cheapest("memory", mem(gb, false)) || cheapest("memory", mem(gb, true));
    if (found && spendOf(out) - out.memory.price + found.price <= moneyCap) out.memory = found;
  }
  function tryDisk(size) {
    const found = cheapest("storage", (p) => ssd(p) && /NVME|M\.2/.test(p.name.toUpperCase()) && p.name.toUpperCase().includes(size));
    if (found && spendOf(out) - out.storage.price + found.price <= moneyCap) out.storage = found;
  }
  if (gbOf(out.memory) < 16) tryMem(16);
  if (need.ram >= 32 && gbOf(out.memory) < 32) tryMem(32);
  if (!/1TB|2TB/.test(out.storage.name)) tryDisk("1TB");
  if (/2TB/.test(need.disk)) tryDisk("2TB");
  let guard = 0;
  while (spendOf(out) > moneyCap + 1 && guard++ < 8) {
    if (out.cooler) { delete out.cooler; continue; }
    if (out.gpu && gpuTier(out.gpu) > 1) {
      const lower = bestGpu(out.gpu.price - 1, gpuTier(out.gpu) - 1);
      if (lower) { out.gpu = lower; sizePsu(); continue; }
      delete out.gpu; sizePsu(); continue;
    }
    if (out.gpu) { delete out.gpu; sizePsu(); continue; }
    if (out.memory && gbOf(out.memory) > 8) { out.memory = cheapest("memory", mem(8, true)) || out.memory; continue; }
    break;
  }
  return out;
}
function tagsOf(part) {
  const tags = [];
  const n = part.name.toUpperCase();
  if (part.form) tags.push(part.form.toUpperCase());
  if (part.socket) tags.push(part.socket);
  if (part.ram) tags.push(part.ram);
  const rad = n.match(/\b(120|140|240|280|360|420)\s?MM\b/);
  if (rad) tags.push(rad[1] + "mm");
  if (/NVME|M\.2/.test(n)) tags.push("NVMe");
  if (/SSD/.test(n)) tags.push("SSD");
  if (part.watt) tags.push(part.watt + "W");
  return tags.slice(0, 5);
}
function catLabel(id) { return t(id) || id; }
function lineFor(id) {
  const map = { cpu:"cpuLine", memory:"ramLine", gpu:"gpuLine", storage:"nvmeLine", case:"caseLine", psu:"psuLine", cooler:"coolLine", motherboard:"boardLine" };
  return t(map[id] || "story");
}
function paintArt() {
  document.getElementById("art").textContent = ARTS[artTick % ARTS.length];
}
function paintMachine(parts) {
  const box = document.getElementById("machine");
  box.replaceChildren();
  const rows = [
    ["case", "  .------------------------------."],
    ["case", " / " + ((parts.case && parts.case.name) || "empty case").slice(0, 28)],
    ["motherboard", "|  BOARD " + (parts.motherboard ? "[##########]" : "[          ]")],
    ["cpu", "|  CPU   " + (parts.cpu ? "[####]  drops in" : "[    ]")],
    ["cooler", "|  FAN   " + (parts.cooler || (parts.cpu && /cooler/i.test(parts.cpu.name)) ? "((( o )))" : "(       )")],
    ["memory", "|  RAM   " + (parts.memory ? "||  ||   click" : "|   |   |")],
    ["storage", "|  NVME  " + (parts.storage && /NVME|M\.2/i.test(parts.storage.name) ? "[====] slide" : "[    ]")],
    ["gpu", "|  GPU   " + (parts.gpu ? "[==========>]" : "[           ]")],
    ["storage", "|  SSD   " + (parts.storage ? "[====]" : "[    ]")],
    ["psu", "|  PSU   " + (parts.psu ? "[####] " + wattOf(parts.psu) + "W" : "[    ]")],
    ["case", "  '------------------------------'"]
  ];
  let told = "";
  rows.forEach((row) => {
    const div = document.createElement("div");
    const id = row[0];
    const now = parts[id] && parts[id].id;
    const fresh = now && seen[id] !== now;
    div.className = "bay" + (id === "memory" || id === "cpu" ? " drop" : "") + (fresh ? " go" : "");
    div.textContent = row[1];
    box.appendChild(div);
    if (fresh) told = lineFor(id);
  });
  CATS.forEach((id) => { if (parts[id]) seen[id] = parts[id].id; });
  document.getElementById("story").textContent = told || t("story");
}
function currentParts() {
  const map = {};
  CATS.forEach((id) => { if (byId[build[id]]) map[id] = byId[build[id]]; });
  return map;
}
function applySuggestion() {
  const suggestion = keepFitting(assemble(job, budget));
  const next = {};
  Object.keys(suggestion).forEach((id) => { if (suggestion[id]) next[id] = suggestion[id].id; });
  build = next;
}
function preferredLayout(){
  try { const saved = sessionStorage.getItem("drew-layout"); if (saved === "phone" || saved === "desk") return saved; } catch (e) {}
  return window.matchMedia("(max-width: 820px)").matches ? "phone" : "desk";
}
let layout = preferredLayout();
function setLayout(next){
  layout = next;
  try { sessionStorage.setItem("drew-layout", next); } catch (e) {}
  document.body.classList.toggle("phone", layout === "phone");
  document.body.classList.toggle("desk", layout === "desk");
  const phone = document.getElementById("phoneBtn");
  const desk = document.getElementById("deskBtn");
  if (phone) phone.classList.toggle("on", layout === "phone");
  if (desk) desk.classList.toggle("on", layout === "desk");
}
function render() {
  setLayout(layout);
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang === "yue" ? "zh-Hant" : lang;
  document.documentElement.dir = (lang === "ar" || lang === "ur") ? "rtl" : "ltr";
  document.getElementById("title").textContent = t("title");
  document.getElementById("pitch").textContent = t("pitch");
  document.getElementById("budgetWord").textContent = t("budget");
  document.getElementById("budgetLabel").textContent = money.format(budget);
  document.getElementById("gateTitle").textContent = t("title");
  document.getElementById("gateLabel").textContent = t("pass");
  document.getElementById("gateOpen").textContent = t("open");
  const jobs = document.getElementById("jobs");
  jobs.replaceChildren();
  JOBS.forEach((id) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice" + (id === job ? " on" : "");
    const b = document.createElement("b");
    b.textContent = jobName(id);
    button.appendChild(b);
    button.onclick = () => { job = id; swap = ""; lock = false; seen = {}; applySuggestion(); render(); };
    jobs.appendChild(button);
  });
  if (PARTS.length && !lock) applySuggestion();
  const parts = currentParts();
  try { parent.postMessage({ type: "drew-progress", n: CATS.filter(function (id) { return parts[id]; }).length, total: CATS.length }, "*"); } catch (e) {}
  const total = CATS.reduce((sum, id) => sum + (parts[id] ? parts[id].price : 0), 0);
  const sell = document.getElementById("sell");
  if (total > budget + 1) sell.textContent = t("over") + " " + money.format(total);
  else if (budget - total > 250) sell.textContent = t("under") + " " + money.format(total);
  else sell.textContent = money.format(total);
  const dockTotal = document.getElementById("dockTotal");
  if (dockTotal) dockTotal.textContent = money.format(total);
  paintArt();
  paintMachine(parts);
  const list = document.getElementById("parts");
  list.replaceChildren();
  if (swap) {
    const input = document.createElement("input");
    input.type = "search";
    input.placeholder = catLabel(swap);
    list.appendChild(input);
    const now = currentParts();
    const pool = PARTS.filter((p) => p.cat === swap && !junk(p) && !fitWhy(p, now)).sort((a, b) => a.price - b.price).slice(0, 60);
    const hint = document.createElement("p");
    hint.className = "pitch";
    hint.textContent = pool.length ? "Only parts that fit are shown. One of each. Memory is one kit, and the sticks in that kit have to fit the board." : "Nothing on the list fits. Change the processor or the motherboard first.";
    list.appendChild(hint);
    pool.forEach((part) => list.appendChild(card(part, () => {
      const why = fitWhy(part, currentParts());
      if (why) { hint.textContent = "Not added. " + why; return; }
      build[part.cat] = part.id;
      lock = true;
      swap = "";
      render();
    })));
    input.oninput = () => {
      const q = input.value.toLowerCase();
      [...list.querySelectorAll(".card")].forEach((node) => { node.hidden = q && !node.dataset.name.includes(q); });
    };
    return;
  }
  CATS.forEach((id) => {
    const part = parts[id];
    const button = document.createElement("button");
    button.type = "button";
    button.className = "row";
    const text = document.createElement("span");
    const name = document.createElement("b");
    name.textContent = catLabel(id);
    text.appendChild(name);
    text.appendChild(document.createTextNode(part ? " " + part.name : ""));
    if (part) {
      const tags = document.createElement("span");
      tagsOf(part).forEach((tag) => { const s = document.createElement("span"); s.className = "tag"; s.textContent = tag; tags.appendChild(s); });
      text.appendChild(tags);
    }
    button.appendChild(text);
    const price = document.createElement("span");
    price.className = "price";
    price.textContent = part ? money.format(part.price) : "";
    button.appendChild(price);
    button.onclick = () => { swap = id; render(); };
    list.appendChild(button);
  });
}
function card(part, onclick) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "card";
  button.dataset.name = part.name.toLowerCase();
  const text = document.createElement("span");
  text.textContent = part.name;
  tagsOf(part).forEach((tag) => { const s = document.createElement("span"); s.className = "tag"; s.textContent = tag; text.appendChild(s); });
  button.appendChild(text);
  const price = document.createElement("span");
  price.className = "price";
  price.textContent = money.format(part.price);
  button.appendChild(price);
  button.onclick = onclick;
  return button;
}
document.getElementById("budget").oninput = (event) => {
  budget = +event.target.value;
  lock = false;
  swap = "";
  render();
};
document.getElementById("back").onclick = () => { if (swap) { swap = ""; render(); } };
document.getElementById("phoneBtn").onclick = () => { layout = "phone"; render(); };
document.getElementById("deskBtn").onclick = () => { layout = "desk"; render(); };
document.getElementById("langBtn").onclick = () => {
  const box = document.getElementById("langs");
  box.classList.add("open");
  box.replaceChildren();
  Object.keys(LANG).forEach((id) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "langbtn";
    button.textContent = LANG[id].name;
    button.onclick = () => { lang = id; localStorage.setItem("bench-lang", lang); box.classList.remove("open"); render(); };
    box.appendChild(button);
  });
};
document.getElementById("gateForm").onsubmit = (event) => {
  event.preventDefault();
  if (document.getElementById("pass").value === "Password1") {
    try { sessionStorage.setItem("drew-bench", "1"); } catch (err) {}
    boot();
  } else document.getElementById("bad").textContent = t("bad");
};
function boot() {
  document.getElementById("gate").hidden = true;
  fetch("parts.json").then((res) => res.json()).then((data) => { PARTS = data; byId = {}; PARTS.forEach((p) => { byId[p.id] = p; }); render(); });
}
setInterval(() => { artTick++; paintArt(); }, 1600);
render();
if (sessionStorage.getItem("drew-bench") === "1") boot();
</script>
