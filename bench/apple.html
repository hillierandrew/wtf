<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Build</title>
<style>
  :root { color-scheme: light; --bg:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --card:#fff; --warn:#b45309; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  #lock { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: var(--bg); padding: 24px; }
  #lock[hidden] { display: none !important; }
  #lock form { width: min(420px, 100%); }
  #lock input { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 8px 12px; }
  .go { min-height: 44px; border: 0; border-radius: 980px; background: #1d1d1f; color: #fff; padding: 0 18px; font-weight: 600; }
  header { padding: 28px 22px 8px; width: min(980px, 100%); margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(40px, 6vw, 64px); letter-spacing: -0.045em; font-weight: 600; line-height: .95; }
  .lede { color: var(--muted); font-size: 19px; max-width: 36em; margin: 10px 0 0; }
  .uses, .tiers, .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .uses { margin-top: 18px; }
  .uses button, .tiers button, .pills button {
    min-height: 44px; border-radius: 980px; border: 0; background: #e8e8ed; padding: 0 14px;
  }
  .uses button.on, .tiers button.on, .pills button.on { background: #1d1d1f; color: #fff; }
  .pills button:disabled { opacity: .35; cursor: not-allowed; }
  main { width: min(980px, 100%); margin: 0 auto; padding: 8px 22px 34vh; }
  section { padding: 28px 0; border-top: 1px solid var(--line); content-visibility: auto; contain-intrinsic-size: 320px; }
  h2 { margin: 0 0 6px; font-size: clamp(28px, 4vw, 40px); letter-spacing: -0.04em; font-weight: 600; }
  .note, .meta, .hint { color: var(--muted); font-size: 14px; margin: 6px 0 12px; }
  .warn { color: var(--warn); font-size: 14px; margin: 8px 0; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row, .row.off {
    display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 2px 12px; align-items: start;
    width: 100%; text-align: left; background: var(--card); border: 0; border-radius: 16px; padding: 14px 16px;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
  }
  .row.on { outline: 2px solid #1d1d1f; }
  .row b, .cart b { font-weight: 600; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  .row .meta { grid-column: 1 / -1; margin: 0; }
  .price { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.03em; white-space: nowrap; }
  .row.off { opacity: .4; cursor: not-allowed; }
  #cart {
    position: fixed; z-index: 6; left: 12px; bottom: max(12px, env(safe-area-inset-bottom));
    width: min(380px, calc(100% - 24px)); max-height: 25vh; overflow: auto;
    background: rgba(255,255,255,.9); color: #1d1d1f; backdrop-filter: blur(16px);
    border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 10px 12px 12px;
  }
  #cart h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #6e6e73; }
  .line { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #e5e5ea; animation: in .35s ease; }
  .line .x, .line .plus { width: 32px; height: 32px; border: 0; border-radius: 999px; background: #e8e8ed; }
  .qty { font-variant-numeric: tabular-nums; }
  @keyframes in { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }
  html[data-theme="dark"] #cart { background: rgba(28,28,30,.92); color: #f5f5f7; }
  html[data-theme="dark"] .uses button, html[data-theme="dark"] .pills button, html[data-theme="dark"] .tiers button { background: #2c2c2e; }
  html[data-theme="dark"] .row.on { outline-color: #f5f5f7; }
  @media (max-width: 800px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    #cart { left: 0; right: 0; width: auto; border-radius: 18px 18px 0 0; }
  }
</style>
</head>
<body>
<div id="lock"><form id="lockForm"><p class="note">Password4</p><h1>Build.</h1><input id="lockPass" type="password" autocomplete="current-password" aria-label="Password" /><p id="lockBad" class="warn"></p><button class="go" type="submit">Continue</button></form></div>
<header>
  <h1>What is it for?</h1>
  <p class="lede">Tell me the job. I will show a few honest computers, then you can change any part. Nothing here is a sale.</p>
  <div class="uses" id="uses"></div>
  <div class="tiers" id="tiers"></div>
  <p class="note" id="useNote"></p>
</header>
<main id="list"></main>
<aside id="cart" aria-live="polite"></aside>
<script src="bulb.js"></script>
<script>
const USES = [
  { name:"Roblox", gpuMin:0, gpuMax:2, ram:16, disk:500, note:"A child's Roblox computer. The processor's own graphics are enough. A 5090 is the wrong product." },
  { name:"Minecraft", gpuMin:0, gpuMax:2, ram:16, disk:500, note:"Minecraft, even with a few mods, is fine on a small card or none." },
  { name:"Fortnite", gpuMin:2, gpuMax:4, ram:16, disk:500, note:"Fortnite wants a modest card for smooth play, not a flagship." },
  { name:"Dota 2", gpuMin:1, gpuMax:3, ram:16, disk:500, note:"Dota 2 runs well on a small graphics card." },
  { name:"League of Legends", gpuMin:0, gpuMax:2, ram:16, disk:500, note:"League does not need a gaming card." },
  { name:"Valorant", gpuMin:1, gpuMax:3, ram:16, disk:500, note:"Valorant likes a steady frame rate from a modest card." },
  { name:"Counter-Strike 2", gpuMin:2, gpuMax:4, ram:16, disk:500, note:"Counter-Strike likes frames. A mid card is the right spend." },
  { name:"Apex Legends", gpuMin:2, gpuMax:4, ram:16, disk:1000, note:"Apex is comfortable on a mid-range card." },
  { name:"Call of Duty", gpuMin:3, gpuMax:5, ram:16, disk:1000, note:"Call of Duty is large. A mid card and a fast SSD. Not a 90-class card." },
  { name:"Diablo IV", gpuMin:2, gpuMax:4, ram:16, disk:1000, note:"Diablo is fine on a mid card. Extra money belongs in the processor and the SSD." },
  { name:"Escape from Tarkov", gpuMin:3, gpuMax:5, ram:32, disk:1000, note:"Tarkov cares about the processor and 32 GB as much as the card." },
  { name:"World of Warcraft", gpuMin:2, gpuMax:4, ram:16, disk:500, note:"Raids like a decent processor and 16 GB. A mid card is plenty." },
  { name:"Halo Infinite", gpuMin:2, gpuMax:4, ram:16, disk:500, note:"Halo is comfortable on a mid card." },
  { name:"Age of Empires IV", gpuMin:1, gpuMax:3, ram:16, disk:500, note:"Big battles like a processor. The card can stay modest." },
  { name:"School", gpuMin:0, gpuMax:0, ram:16, disk:500, note:"Essays, class video, and a browser. No graphics card." },
  { name:"Office", gpuMin:0, gpuMax:0, ram:16, disk:500, note:"Word, Excel, Zoom, and email. No graphics card." },
  { name:"Photo", gpuMin:2, gpuMax:3, ram:32, disk:1000, note:"Photo work wants 32 GB and a modest card." },
  { name:"Video editing", gpuMin:3, gpuMax:5, ram:32, disk:2000, note:"Editing wants memory, a fast SSD, and a mid card." },
  { name:"CAD", gpuMin:3, gpuMax:5, ram:32, disk:1000, note:"3D drawings want a mid card and 32 GB. This is not a certified workstation." },
  { name:"Spreadsheets and code", gpuMin:0, gpuMax:1, ram:32, disk:1000, note:"Big sheets and code want memory and a processor, not a graphics card." }
];
const HASH = {
  "GT 1030":"not a mining card", "RTX 3050":"about 20 MH/s", "RTX 3060":"about 45 MH/s",
  "RTX 5050":"about 25 MH/s", "RTX 5060":"about 30 MH/s", "RTX 5060 TI":"about 35 MH/s",
  "RTX 5070":"about 50 MH/s", "RTX 5070 TI":"about 60 MH/s", "RTX 5080":"about 75 MH/s",
  "RX 6800":"about 60 MH/s", "RX 7600":"about 30 MH/s", "RX 9060 XT":"about 40 MH/s",
  "RX 9070":"about 55 MH/s", "RX 9070 GRE":"about 50 MH/s", "RX 9070 XT":"about 70 MH/s"
};
const WATT = { "GT 1030":30, "RTX 3050":130, "RTX 3060":170, "RTX 5050":130, "RTX 5060":150, "RTX 5060 TI":180, "RTX 5070":250, "RTX 5070 TI":300, "RTX 5080":360, "RX 6800":250, "RX 7600":165, "RX 9060 XT":180, "RX 9070":220, "RX 9070 GRE":220, "RX 9070 XT":304 };
const FORMS = [["itx","Mini-ITX"],["matx","Micro-ATX"],["atx","ATX"],["eatx","E-ATX"]];
const money = new Intl.NumberFormat("en-CA", { style:"currency", currency:"CAD" });
let PARTS = [], byId = {};
let s = { use:"Roblox", tier:"", cpuBrand:"AMD", socket:"AM4", form:"matx", ramKind:"", gpuBrand:"NVIDIA", driveKind:"NVME", coolKind:"air", cpu:"", board:"", kits:[], gpu:"", drives:[], box:"", cooler:"", psu:"" };
function junk(p){ return !p || /open\s?box|\[openbox\]|renewed|recertified|sodimm|surveillance|purple|laptop|\becc\b/i.test(p.name) || p.price < 12; }
function sticksOf(p){ const m = (p.name||"").match(/\((\d+)\s*[x×]/i) || (p.name||"").match(/\b(\d+)\s*[x×]\s*\d+\s*GB/i); return m ? +m[1] : 1; }
function ramKindOf(p){ if (!p) return ""; if (p.ram) return p.ram; const m = (p.name||"").toUpperCase().match(/DDR[345]/); if (m) return m[0]; if (p.socket === "AM5" || p.socket === "LGA1851") return "DDR5"; if (p.socket === "AM4" || p.socket === "LGA1700") return "DDR4"; return ""; }
function formOf(p){ if (!p) return ""; if (p.form) return p.form === "full" ? "atx" : p.form; const n = (p.name||"").toUpperCase(); if (/E-?ATX|XL-ATX/.test(n)) return "eatx"; if (/MINI-?ITX|\bITX\b/.test(n)) return "itx"; if (/MICRO|MATX|M-ATX/.test(n)) return "matx"; if (/ATX/.test(n)) return "atx"; return ""; }
function fitsCase(box, board){ const r = { itx:1, matx:2, atx:3, eatx:4 }; return (r[formOf(box)] || 3) >= (r[formOf(board)] || 2); }
function dimmSlots(board){ if (!board) return 4; if (/2\s*DIMM/i.test(board.name||"")) return 2; if (formOf(board) === "itx") return 2; return 4; }
function gbOf(p){ const m = (p.name||"").toUpperCase().match(/\b(4|8|16|32|64|96|128)\s?GB\b/); return m ? +m[1] : 0; }
function diskGb(p){ const n = (p.name||"").toUpperCase(); const tb = n.match(/(\d+)\s?TB/); if (tb) return +tb[1]*1000; const gb = n.match(/(\d+)\s?GB/); return gb ? +gb[1] : 0; }
function wattOf(p){ if (!p) return 0; if (p.watt) return p.watt; const m = (p.name||"").toUpperCase().match(/(\d{3,4})\s?W/); return m ? +m[1] : 0; }
function cores(p){ const m = (p.name||"").match(/(\d+)\s*[- ]?Core/i); return m ? +m[1] : 4; }
function cpuBrand(p){ if (/AMD|RYZEN|AM[45]/i.test((p.brand||"")+" "+p.name+" "+(p.socket||""))) return "AMD"; if (/INTEL|LGA|CORE/i.test((p.brand||"")+" "+p.name+" "+(p.socket||""))) return "INTEL"; return "OTHER"; }
function gpuBrand(p){ const n = (p.name||"").toUpperCase(); if (/RTX|GTX|GEFORCE|NVIDIA/.test(n)) return "NVIDIA"; if (/RADEON|\bRX\s?\d/.test(n)) return "AMD"; if (/ARC|INTEL/.test(n)) return "INTEL"; return "OTHER"; }
function chipOf(p){
  const n = (p.name||"").toUpperCase().replace(/\s+/g," ");
  const m = n.match(/RTX\s?(\d{4})\s?(TI|SUPER)?|RX\s?(\d{4})\s?(XT|GRE)?|GT\s?(\d{3,4})/);
  if (!m) return "";
  if (m[1]) return ("RTX " + m[1] + (m[2] ? " " + m[2] : "")).replace("TI","TI");
  if (m[3]) return "RX " + m[3] + (m[4] ? " " + m[4] : "");
  return "GT " + m[5];
}
function gpuClass(p){ const n = (p.name||"").toUpperCase(); if (/5080|5070\s?TI|9070\s?XT/.test(n)) return 6; if (/5070|9070|4070/.test(n)) return 5; if (/5060\s?TI|5060|9060/.test(n)) return 4; if (/5050|3060|6800|7600/.test(n)) return 3; if (/3050|1660|1650/.test(n)) return 2; if (/1030/.test(n)) return 1; return 0; }
function gpuWatt(p){ return WATT[chipOf(p)] || wattOf(p) || (gpuClass(p) >= 6 ? 320 : gpuClass(p) >= 4 ? 180 : 130); }
function driveKind(p){ const n = (p.name||"").toUpperCase(); if (/NVME|M\.2|PCIE|PCI-?E/.test(n)) return "NVME"; if (/HDD|HARD DRIVE|3\.5/.test(n)) return "HDD"; return "SSD"; }
function isAio(p){ return /LIQUID|AIO|RADIATOR|\b240\b|\b280\b|\b360\b/i.test(p.name||""); }
function clean(cat){ return PARTS.filter(p => p.cat === cat && !junk(p)); }
function slotsOf(board){ const f = formOf(board); return { m2: f === "itx" ? 2 : 2, sata: f === "itx" ? 4 : 4, dimm: dimmSlots(board) }; }
function usedDrives(){ let m2 = 0, sata = 0; s.drives.forEach(id => { const p = byId[id]; if (!p) return; if (driveKind(p) === "NVME") m2++; else sata++; }); return { m2, sata }; }
function ramSticks(){ return s.kits.reduce((n,k) => n + (byId[k.id] ? sticksOf(byId[k.id]) * k.qty : 0), 0); }
function powerMath(){
  let draw = 80 + s.drives.length * 8;
  if (byId[s.cpu]) draw += wattOf(byId[s.cpu]) || 65;
  if (byId[s.gpu]) draw += gpuWatt(byId[s.gpu]);
  let need = 450;
  if (draw > 300) need = 550;
  if (draw > 400) need = 650;
  if (draw > 500) need = 750;
  if (draw > 620) need = 850;
  if (draw > 760) need = 1000;
  return { draw, need };
}
function useNow(){ return USES.filter(u => u.name === s.use)[0] || USES[0]; }
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  Object.keys(attrs||{}).forEach(k => { if (k === "text") n.textContent = attrs[k]; else if (k === "html") n.innerHTML = attrs[k]; else if (k === "class") n.className = attrs[k]; else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), attrs[k]); else n.setAttribute(k, attrs[k]); });
  (kids||[]).forEach(c => c && n.appendChild(c));
  return n;
}
function pill(label, on, fn, disabled){
  const attrs = { type:"button", class:on?"on":"", text:label };
  const b = el("button", attrs);
  if (disabled) b.setAttribute("disabled", "disabled");
  else b.onclick = fn;
  return b;
}
function paintUses(){
  const box = document.getElementById("uses");
  box.replaceChildren();
  USES.forEach(u => box.appendChild(pill(u.name, u.name === s.use, () => { s.use = u.name; s.tier = ""; render(); })));
  const tiers = document.getElementById("tiers");
  tiers.replaceChildren();
  [["enough","Enough"],["comfortable","Comfortable"],["more","A bit more"]].forEach(pair => {
    tiers.appendChild(pill(pair[1], s.tier === pair[0], () => applyPlan(pair[0])));
  });
  document.getElementById("useNote").textContent = useNow().note;
}
function pickCpu(list, tier){
  const six = list.filter(p => cores(p) >= 6);
  const bag = six.length ? six : list;
  if (!bag.length) return null;
  if (tier === "enough") return bag[0];
  if (tier === "comfortable") return bag[Math.min(2, bag.length - 1)];
  return bag.filter(p => cores(p) <= 8 && p.price < 450).pop() || bag[Math.min(4, bag.length - 1)];
}
function applyPlan(tier){
  const use = useNow();
  s.tier = tier;
  const target = tier === "enough" ? use.gpuMin : tier === "comfortable" ? Math.min(use.gpuMax, Math.max(use.gpuMin, use.gpuMin + 1)) : use.gpuMax;
  const socket = target >= 3 || use.ram >= 32 ? "AM5" : "AM4";
  const cpus = clean("cpu").filter(p => p.socket === socket).sort((a,b) => a.price - b.price);
  const cpu = pickCpu(cpus, tier) || pickCpu(clean("cpu").sort((a,b)=>a.price-b.price), tier);
  s.cpu = cpu ? cpu.id : "";
  s.cpuBrand = cpu ? cpuBrand(cpu) : "AMD";
  s.socket = cpu ? cpu.socket : socket;
  const boards = clean("motherboard").filter(p => p.socket === s.socket && formOf(p) === "matx").sort((a,b)=>a.price-b.price);
  const board = boards[0] || clean("motherboard").filter(p => p.socket === s.socket).sort((a,b)=>a.price-b.price)[0];
  s.board = board ? board.id : "";
  s.form = board ? (formOf(board) || "atx") : "matx";
  const kind = ramKindOf(board) || (s.socket === "AM5" ? "DDR5" : "DDR4");
  s.ramKind = kind;
  const kits = clean("memory").filter(p => ramKindOf(p) === kind && sticksOf(p) === 2 && gbOf(p) >= use.ram).sort((a,b)=>a.price-b.price);
  const kit = kits[0] || clean("memory").filter(p => ramKindOf(p) === kind && sticksOf(p) <= dimmSlots(board)).sort((a,b)=>a.price-b.price)[0];
  s.kits = kit ? [{ id:kit.id, qty:1 }] : [];
  const drives = clean("storage").filter(p => driveKind(p) === "NVME" && diskGb(p) >= use.disk).sort((a,b)=>a.price-b.price);
  s.drives = [(drives[0] || clean("storage").filter(p => driveKind(p) !== "HDD").sort((a,b)=>a.price-b.price)[0] || {}).id].filter(Boolean);
  s.driveKind = "NVME";
  if (target <= 0) s.gpu = "";
  else {
    const cards = clean("gpu").filter(p => gpuClass(p) >= target && gpuClass(p) <= use.gpuMax).sort((a,b)=>a.price-b.price);
    const card = cards[0] || null;
    s.gpu = card ? card.id : "";
    if (card) s.gpuBrand = gpuBrand(card);
  }
  const cool = clean("cooler").filter(p => !isAio(p)).sort((a,b)=>a.price-b.price)[0];
  s.cooler = cool ? cool.id : "";
  s.coolKind = "air";
  const box = clean("case").filter(p => !board || fitsCase(p, board)).sort((a,b)=>a.price-b.price)[0];
  s.box = box ? box.id : "";
  const need = powerMath().need;
  const psu = clean("psu").filter(p => wattOf(p) >= need).sort((a,b)=>a.price-b.price)[0];
  s.psu = psu ? psu.id : "";
  render();
}
function row(part, on, fn, off, why){
  const b = el("button", { type:"button", class: off ? "row off" : (on ? "row on" : "row") });
  b.appendChild(el("b", { text: part.name }));
  b.appendChild(el("span", { class:"price", text: money.format(part.price) }));
  const meta = el("div", { class:"meta", text: why || specLine(part) });
  b.appendChild(meta);
  if (!off) b.onclick = fn;
  return b;
}
function specLine(p){
  if (p.cat === "gpu") {
    const chip = chipOf(p);
    const v = gbOf(p);
    return (v ? v + " GB" : "VRAM not listed") + " · about " + gpuWatt(p) + " W · " + (HASH[chip] || "hash rate not listed") + " · rough comparison, not a quote";
  }
  if (p.cat === "memory") return ramKindOf(p) + " · " + gbOf(p) + " GB · " + sticksOf(p) + " stick" + (sticksOf(p) > 1 ? "s" : "");
  if (p.cat === "storage") return driveKind(p) + " · " + (diskGb(p) >= 1000 ? (diskGb(p)/1000) + " TB" : diskGb(p) + " GB");
  if (p.cat === "psu") return (wattOf(p) || "?") + " W";
  if (p.cat === "cpu") return (p.socket || "") + " · " + cores(p) + " cores · " + (wattOf(p) || "?") + " W";
  if (p.cat === "motherboard") return [p.socket, formOf(p).toUpperCase(), ramKindOf(p)].filter(Boolean).join(" · ");
  if (p.cat === "cooler") return isAio(p) ? "Liquid cooler" : "Fan cooler";
  if (p.cat === "case") return (formOf(p) || "case").toUpperCase();
  return "";
}
function section(title, hint, pills, rows){
  const sec = el("section");
  sec.appendChild(el("h2", { text: title }));
  if (hint) sec.appendChild(el("p", { class:"hint", text: hint }));
  if (pills) sec.appendChild(pills);
  const box = el("div", { class:"rows" });
  rows.forEach(r => box.appendChild(r));
  sec.appendChild(box);
  return sec;
}
function render(){
  paintUses();
  const main = document.getElementById("list");
  main.replaceChildren();
  const board = byId[s.board];
  const cpu = byId[s.cpu];
  const wantRam = ramKindOf(board) || s.ramKind;
  const sockets = Array.from(new Set(clean("cpu").filter(p => cpuBrand(p) === s.cpuBrand).map(p => p.socket).filter(Boolean)));
  const cpuPills = el("div", { class:"pills" });
  ["AMD","INTEL"].forEach(b => cpuPills.appendChild(pill(b === "INTEL" ? "Intel" : "AMD", s.cpuBrand === b, () => { s.cpuBrand = b; s.socket = socketsOf(b)[0] || ""; render(); })));
  socketsOf(s.cpuBrand).forEach(sk => cpuPills.appendChild(pill(sk, s.socket === sk, () => { s.socket = sk; render(); })));
  const cpus = clean("cpu").filter(p => cpuBrand(p) === s.cpuBrand && (!s.socket || p.socket === s.socket)).sort((a,b)=>a.price-b.price).slice(0, 18);
  main.appendChild(section("Processor", "Start with the brand, then the socket.", cpuPills, cpus.map(p => row(p, p.id === s.cpu, () => { s.cpu = p.id; if (board && board.socket !== p.socket) s.board = ""; render(); }))));

  const formPills = el("div", { class:"pills" });
  FORMS.forEach(pair => formPills.appendChild(pill(pair[1], s.form === pair[0], () => { s.form = pair[0]; render(); })));
  const boards = clean("motherboard").filter(p => (!cpu || p.socket === cpu.socket) && formOf(p) === s.form).sort((a,b)=>a.price-b.price).slice(0, 16);
  const boardRows = boards.map(p => row(p, p.id === s.board, () => {
    const nextKind = ramKindOf(p);
    if (s.kits.some(k => ramKindOf(byId[k.id]) && ramKindOf(byId[k.id]) !== nextKind)) s.kits = [];
    s.board = p.id; s.ramKind = nextKind; render();
  }));
  if (!boardRows.length) boardRows.push(el("p", { class:"note", text:"No " + s.form.toUpperCase() + " board for this socket." }));
  main.appendChild(section("Motherboard", "Size first, so the names are not stacked on top of each other.", formPills, boardRows));

  const ramPills = el("div", { class:"pills" });
  ["DDR3","DDR4","DDR5"].forEach(k => {
    const bad = !!(wantRam && k !== wantRam);
    ramPills.appendChild(pill(k, s.ramKind === k, () => { s.ramKind = k; render(); }, bad));
  });
  const kind = s.ramKind || wantRam || "DDR5";
  const mem = clean("memory").filter(p => ramKindOf(p) === kind).sort((a,b)=>a.price-b.price).slice(0, 16);
  const wrong = wantRam ? clean("memory").filter(p => ramKindOf(p) && ramKindOf(p) !== wantRam).slice(0, 3) : [];
  const memRows = mem.map(p => row(p, s.kits.some(k => k.id === p.id), () => addKit(p)));
  wrong.forEach(p => memRows.push(row(p, false, null, true, ramKindOf(p) + " does not fit this board.")));
  main.appendChild(section("Memory", wantRam ? "This board takes " + wantRam + ". The other kinds are gray and cannot be added." : "Pick the kind, then the kit.", ramPills, memRows));

  const gpuPills = el("div", { class:"pills" });
  ["NVIDIA","AMD","INTEL"].forEach(b => gpuPills.appendChild(pill(b === "NVIDIA" ? "Nvidia" : b === "AMD" ? "AMD" : "Intel", s.gpuBrand === b, () => { s.gpuBrand = b; render(); })));
  const cards = clean("gpu").filter(p => gpuBrand(p) === s.gpuBrand).sort((a,b)=>a.price-b.price).slice(0, 18);
  const gpu = byId[s.gpu];
  const gpuHint = gpu ? "This card wants a " + powerMath().need + " W power supply, once the rest of the computer is counted." : "Brand first. VRAM, watts, and a rough hash rate are under each card.";
  main.appendChild(section("Graphics", gpuHint, gpuPills, cards.map(p => row(p, p.id === s.gpu, () => { s.gpu = p.id; render(); }))));

  const dPills = el("div", { class:"pills" });
  [["NVME","NVMe"],["SSD","SSD"],["HDD","Hard drive"]].forEach(pair => dPills.appendChild(pill(pair[1], s.driveKind === pair[0], () => { s.driveKind = pair[0]; render(); })));
  const slot = slotsOf(board);
  const used = usedDrives();
  const dHint = "A board this size has about " + slot.m2 + " NVMe and " + slot.sata + " SATA connections. Using " + used.m2 + " NVMe and " + used.sata + " SATA.";
  const disks = clean("storage").filter(p => driveKind(p) === s.driveKind).sort((a,b)=>a.price-b.price).slice(0, 14);
  main.appendChild(section("Storage", dHint, dPills, disks.map(p => row(p, s.drives.indexOf(p.id) >= 0, () => addDrive(p)))));

  const cPills = el("div", { class:"pills" });
  cPills.appendChild(pill("Fan cooler", s.coolKind === "air", () => { s.coolKind = "air"; render(); }));
  cPills.appendChild(pill("Liquid cooler", s.coolKind === "aio", () => { s.coolKind = "aio"; render(); }));
  const cools = clean("cooler").filter(p => s.coolKind === "aio" ? isAio(p) : !isAio(p)).sort((a,b)=>a.price-b.price).slice(0, 12);
  main.appendChild(section("Cooling", "A fan cooler is the efficient choice. It costs less, has no pump to fail, and is usually quieter. A liquid cooler is for a hot chip or a cramped case, not for more speed.", cPills, cools.map(p => row(p, p.id === s.cooler, () => { s.cooler = p.id; render(); }))));

  const boxes = clean("case").filter(p => !board || fitsCase(p, board)).sort((a,b)=>a.price-b.price).slice(0, 12);
  main.appendChild(section("Case", board ? "Only cases that can hold this board." : "Pick a board first if you want the case filtered.", null, boxes.map(p => row(p, p.id === s.box, () => { s.box = p.id; render(); }))));

  const pow = powerMath();
  const psu = byId[s.psu];
  const low = psu && wattOf(psu) && wattOf(psu) < pow.need;
  const psus = clean("psu").filter(p => wattOf(p) >= 400).sort((a,b)=>a.price-b.price).slice(0, 14);
  const powerSec = section("Power", "The parts draw about " + pow.draw + " W. Buy a " + pow.need + " W supply so it is not running flat out.", null, psus.map(p => row(p, p.id === s.psu, () => { s.psu = p.id; render(); }, wattOf(p) && wattOf(p) < pow.need, wattOf(p) && wattOf(p) < pow.need ? "Too small for this computer." : "")));
  if (low) powerSec.appendChild(el("p", { class:"warn", text:"This power supply is too low. Choose one of " + pow.need + " W or more." }));
  main.appendChild(powerSec);
  paintCart();
  writeCart();
  tell();
}
function socketsOf(brand){ return Array.from(new Set(clean("cpu").filter(p => cpuBrand(p) === brand).map(p => p.socket).filter(Boolean))); }
function addKit(p){
  const board = byId[s.board];
  const want = ramKindOf(board);
  if (want && ramKindOf(p) !== want) return;
  if (sticksOf(p) > dimmSlots(board)) return;
  s.kits = [{ id:p.id, qty:1 }];
  render();
}
function moreRam(p){
  if (ramSticks() + sticksOf(p) > dimmSlots(byId[s.board])) return;
  const have = s.kits.find(k => k.id === p.id);
  if (have) have.qty += 1;
  render();
}
function addDrive(p){
  if (s.drives.indexOf(p.id) >= 0) { s.drives = s.drives.filter(id => id !== p.id); render(); return; }
  const slot = slotsOf(byId[s.board]);
  const used = usedDrives();
  const kind = driveKind(p);
  if (kind === "NVME" && used.m2 >= slot.m2) return;
  if (kind !== "NVME" && used.sata >= slot.sata) return;
  s.drives.push(p.id);
  render();
}
function paintCart(){
  const cart = document.getElementById("cart");
  cart.replaceChildren();
  cart.appendChild(el("h3", { text:"Your order" }));
  const hints = [];
  const use = useNow();
  if (byId[s.gpu] && gpuClass(byId[s.gpu]) > use.gpuMax) hints.push("That card is more than this job needs.");
  const pow = powerMath();
  if (byId[s.psu] && wattOf(byId[s.psu]) && wattOf(byId[s.psu]) < pow.need) hints.push("Power supply is too small. " + pow.need + " W is the one to buy.");
  if (s.coolKind === "aio") hints.push("A fan cooler is enough unless the case is very small.");
  hints.slice(0, 2).forEach(t => cart.appendChild(el("p", { class:"warn", text:t })));
  const lines = [];
  if (s.cpu) lines.push({ id:s.cpu, label:"Processor" });
  if (s.board) lines.push({ id:s.board, label:"Board" });
  s.kits.forEach((k,i) => lines.push({ id:k.id, label:"Memory", qty:k.qty, plus:true, kit:i }));
  if (s.gpu) lines.push({ id:s.gpu, label:"Graphics" });
  s.drives.forEach((id,i) => lines.push({ id:id, label:"Drive", drive:i }));
  if (s.cooler) lines.push({ id:s.cooler, label:"Cooler" });
  if (s.box) lines.push({ id:s.box, label:"Case" });
  if (s.psu) lines.push({ id:s.psu, label:"Power" });
  if (!lines.length) cart.appendChild(el("p", { class:"note", text:"Nothing yet. Choose a part and it lands here." }));
  let total = 0;
  lines.forEach(line => {
    const p = byId[line.id];
    if (!p) return;
    const qty = line.qty || 1;
    total += p.price * qty;
    const row = el("div", { class:"line" });
    row.appendChild(el("b", { text:(qty > 1 ? qty + " × " : "") + p.name }));
    const tools = el("span");
    if (line.plus) {
      tools.appendChild(el("span", { class:"qty", text:String(qty) }));
      tools.appendChild(el("button", { type:"button", class:"plus", text:"+", onclick:() => moreRam(p) }));
    }
    const x = el("button", { type:"button", class:"x", text:"×" });
    x.onclick = () => removeLine(line);
    row.appendChild(tools);
    row.appendChild(x);
    cart.appendChild(row);
  });
  cart.appendChild(el("p", { class:"price", text: money.format(total) }));
  cart.appendChild(el("button", { type:"button", class:"go", text:"Print this list", onclick: printList }));
}
function removeLine(line){
  if (line.kit != null) s.kits.splice(line.kit, 1);
  else if (line.drive != null) s.drives.splice(line.drive, 1);
  else if (line.label === "Processor") s.cpu = "";
  else if (line.label === "Board") s.board = "";
  else if (line.label === "Graphics") s.gpu = "";
  else if (line.label === "Cooler") s.cooler = "";
  else if (line.label === "Case") s.box = "";
  else if (line.label === "Power") s.psu = "";
  render();
}
function printList(){
  const lines = ["DREW BUILD / NOT A SALE", useNow().name, ""];
  document.querySelectorAll("#cart .line b").forEach(n => lines.push(n.textContent));
  const w = window.open("", "print");
  w.document.write("<pre style='font:14px/1.5 ui-monospace,monospace'>" + lines.join("\n") + "</pre>");
  w.document.close(); w.focus(); w.print();
}
function writeCart(){
  const out = {};
  if (s.cpu) out.cpu = s.cpu;
  if (s.board) out.motherboard = s.board;
  if (s.kits[0]) out.memory = s.kits[0].id;
  if (s.gpu) out.gpu = s.gpu;
  if (s.drives[0]) out.storage = s.drives[0];
  if (s.drives.length > 1) out.storageExtra = s.drives.slice(1);
  if (s.box) out.case = s.box;
  if (s.cooler) out.cooler = s.cooler;
  if (s.psu) out.psu = s.psu;
  try { localStorage.setItem("drew-cart", JSON.stringify(out)); } catch (e) {}
}
function tell(){
  const need = ["cpu","board","kits","drives","box","cooler","psu"].filter(k => k === "kits" ? s.kits.length : k === "drives" ? s.drives.length : s[k]);
  const total = useNow().gpuMax === 0 ? 7 : 8;
  const n = need.length + (s.gpu ? 1 : 0);
  try { parent.postMessage({ type:"drew-progress", n: Math.min(n, total), total: total }, "*"); } catch (e) {}
}
function readCart(){ try { return JSON.parse(localStorage.getItem("drew-cart") || "{}"); } catch (e) { return {}; } }
function open(){
  document.getElementById("lock").hidden = true;
  const saved = readCart();
  ["cpu","motherboard","gpu","case","cooler","psu","storage"].forEach(id => {
    const key = id === "motherboard" ? "board" : id === "storage" ? "drives" : id === "case" ? "box" : id;
    if (id === "storage") { if (byId[saved.storage]) s.drives = [saved.storage].concat(saved.storageExtra || []).filter(x => byId[x]); }
    else if (byId[saved[id]]) s[key] = saved[id];
  });
  if (byId[saved.memory]) s.kits = [{ id: saved.memory, qty: 1 }];
  if (byId[s.cpu]) { s.cpuBrand = cpuBrand(byId[s.cpu]); s.socket = byId[s.cpu].socket; }
  if (byId[s.board]) { s.form = formOf(byId[s.board]) || s.form; s.ramKind = ramKindOf(byId[s.board]); }
  render();
}
document.getElementById("lockForm").onsubmit = (e) => {
  e.preventDefault();
  if (document.getElementById("lockPass").value !== "Password4") { document.getElementById("lockBad").textContent = "Wrong password"; return; }
  try { sessionStorage.setItem("drew-apple", "1"); } catch (err) {}
  open();
};
fetch("parts.json").then(r => r.json()).then(list => {
  PARTS = list;
  list.forEach(p => { byId[p.id] = p; });
  let ok = false;
  try { ok = sessionStorage.getItem("drew-apple") === "1"; } catch (e) {}
  if (ok) open(); else render();
}).catch(() => { document.getElementById("lockBad").textContent = "The parts list did not load."; });
</script>
</body>
</html>
