<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="big.css" />
<title>Build</title>
<style>
  :root { color-scheme: light; --bg:#f5f5f7; --ink:#1d1d1f; --muted:#6e6e73; --line:#d2d2d7; --card:#fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 18px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  #lock { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg); padding: 24px; }
  #lock[hidden] { display: none !important; }
  #lock form { width: min(420px, 100%); }
  #lock input { width: 100%; min-height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 8px 14px; }
  .go { min-height: 48px; border: 0; border-radius: 980px; background: #1d1d1f; color: #fff; padding: 0 18px; font-weight: 600; }
  #bar { position: fixed; z-index: 6; top: 0; left: 0; height: 4px; background: #1d1d1f; width: 0; }
  #langBtn, #back {
    position: fixed; z-index: 7; border: 0; border-radius: 980px; background: var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  #langBtn { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); width: 48px; height: 48px; font-size: 22px; }
  #back { left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); min-height: 48px; padding: 0 18px; font-weight: 600; }
  #app { width: min(720px, 100%); margin: 0 auto; padding: calc(36px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom)); }
  .pct { margin: 8px 0 0; font-size: clamp(44px, 12vw, 80px); letter-spacing: -.05em; font-weight: 600; line-height: .9; }
  h1 { margin: 4px 0 14px; font-size: clamp(32px, 7vw, 52px); letter-spacing: -.045em; font-weight: 600; line-height: 1; }
  .grid { display: flex; flex-direction: column; gap: 10px; }
  .card { width: 100%; text-align: left; background: var(--card); border: 0; border-radius: 20px; padding: 16px 16px; min-height: 68px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .card.on { outline: 3px solid #1d1d1f; }
  .card b { display: block; font-size: clamp(18px, 4vw, 22px); letter-spacing: -.02em; overflow-wrap: anywhere; }
  .card span, .muted { color: var(--muted); font-size: 15px; }
  .price { float: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .pills button { min-height: 44px; border: 0; border-radius: 980px; background: #e8e8ed; padding: 0 14px; }
  .pills button.on { background: #1d1d1f; color: #fff; }
  .warn { color: #b45309; }
  #sheet { position: fixed; inset: 0; z-index: 8; background: var(--bg); overflow: auto; padding: 72px 16px 32px; }
  #sheet[hidden] { display: none !important; }
  #sheet .card { margin-bottom: 8px; }
  canvas { display: block; width: min(260px, 70vw); height: auto; margin: 12px 0; background: #fff; }
  @media (orientation: landscape) and (max-height: 520px) {
    .pct { font-size: 32px; }
    h1 { font-size: 28px; }
    .card { min-height: 52px; padding: 10px 14px; }
    #app { padding-top: 16px; }
  }
  html[data-theme="dark"] .pills button { background: #2c2c2e; }
  html[data-theme="dark"] .card.on { outline-color: #f5f5f7; }
  body.desk #app { width: min(1100px, 100%); }
  html[data-theme="dark"] #bar { background: #f5f5f7; }
</style>
</head>

<button id="langBtn" type="button" aria-label="Language">🔤</button>
<div id="lock"><form id="lockForm"><p class="muted">Password4</p><h1>Build.</h1><input id="lockPass" type="password" autocomplete="current-password" aria-label="Password" /><p id="lockBad" class="warn"></p><button class="go" type="submit">Continue</button></form></div>
<div id="speccy"></div>
<main id="app"></main>
<button id="back" type="button" hidden>Back</button>
<div id="sheet" hidden></div>

  document.getElementById("bar").style.width = pct()+"%";
  const back = document.getElementById("back");
  back.hidden = step===0;
  back.textContent = t("back");
  const app = document.getElementById("app");
  app.replaceChildren();
  const which = STEPS[step];
  if (which!=="use") app.appendChild(el("p", { class:"pct", text: pct()+"%" }));
  const h = el("h1", { text: which==="use"?t("for"): which==="tier"? useLabel(s.use) : which==="done"? t("done") : t(which==="disk"?"disk":which==="case"?"case":which) });
  app.appendChild(h);
  const grid = el("div", { class:"grid" });
  if (which==="use") Object.keys(USES).forEach(name => grid.appendChild(card(useLabel(name), "", "", name===s.use, ()=>{ s.use=name; goto(1); })));
  if (which==="tier") TIERS.forEach(tier => { const snap=Object.assign({}, s, {tier}); const hold=s; s=Object.assign(blank(), {use:hold.use, tier}); applyPlan(tier); const price=total(); const line=[byId[s.cpu]&&byId[s.cpu].name, byId[s.gpu]?byId[s.gpu].name:t("none")].filter(Boolean).join(" · "); const id=s.cpu; s=hold; grid.appendChild(card(t(tier), line, money.format(price), false, ()=>{ applyPlan(tier); goto(2); })); });
  if (which==="cpu"){ const pills=el("div",{class:"pills"}); ["AMD","INTEL"].forEach(b=>pills.appendChild(el("button",{type:"button", class:s.cpuBrand===b?"on":"", text:t(b==="AMD"?"amd":"intel"), on:()=>{ s.cpuBrand=b; s.socket=""; render(); }}))); const socks=[...new Set(clean("cpu").filter(p=>cpuBrandOf(p)===s.cpuBrand).map(p=>p.socket).filter(Boolean))]; socks.forEach(sk=>pills.appendChild(el("button",{type:"button", class:s.socket===sk?"on":"", text:sk, on:()=>{ s.socket=sk; render(); }}))); app.appendChild(pills); clean("cpu").filter(p=>cpuBrandOf(p)===s.cpuBrand && (!s.socket||p.socket===s.socket)).sort((a,b)=>a.price-b.price).slice(0,8).forEach(p=>grid.appendChild(card(p.name, p.socket+" · "+cores(p)+" cores", money.format(p.price), p.id===s.cpu, ()=>{ s.cpu=p.id; s.socket=p.socket; if (byId[s.board]&&byId[s.board].socket!==p.socket) s.board=""; goto(3); }))); }
  if (which==="board"){ const pills=el("div",{class:"pills"}); [["itx","itx"],["matx","matx"],["atx","atx"],["eatx","eatx"]].forEach(pair=>pills.appendChild(el("button",{type:"button", class:s.form===pair[0]?"on":"", text:t(pair[1]), on:()=>{ s.form=pair[0]; render(); }}))); app.appendChild(pills); const cpu=byId[s.cpu]; clean("motherboard").filter(p=>(!cpu||p.socket===cpu.socket)&&formOf(p)===s.form).sort((a,b)=>a.price-b.price).slice(0,8).forEach(p=>grid.appendChild(card(p.name, [p.socket, ramKindOf(p)].filter(Boolean).join(" · "), money.format(p.price), p.id===s.board, ()=>{ s.board=p.id; s.ramKind=ramKindOf(p); if (byId[s.kit]&&ramKindOf(byId[s.kit])!==s.ramKind) s.kit=""; goto(4); }))); }
  if (which==="mem"){ const want=ramKindOf(byId[s.board])||s.ramKind; const pills=el("div",{class:"pills"}); ["DDR3","DDR4","DDR5"].forEach(k=>{ const b=el("button",{type:"button", class:s.ramKind===k?"on":"", text:k}); if (want && k!==want) b.disabled=true; else b.onclick=()=>{ s.ramKind=k; render(); }; pills.appendChild(b); }); app.appendChild(pills); const kind=s.ramKind||want||"DDR5"; clean("memory").filter(p=>ramKindOf(p)===kind).sort((a,b)=>a.price-b.price).slice(0,8).forEach(p=>grid.appendChild(card(p.name, ramKindOf(p)+" · "+gbOf(p)+" GB", money.format(p.price), p.id===s.kit, ()=>{ s.kit=p.id; goto(5); }))); }
  if (which==="gpu"){ const pills=el("div",{class:"pills"}); ["NVIDIA","AMD","INTEL"].forEach(b=>pills.appendChild(el("button",{type:"button", class:s.gpuBrand===b?"on":"", text:b==="NVIDIA"?t("nvidia"):b==="AMD"?t("amd"):"Intel", on:()=>{ s.gpuBrand=b; render(); }}))); app.appendChild(pills); grid.appendChild(card(t("none"), "", "", !s.gpu, ()=>{ s.gpu=""; goto(6); })); clean("gpu").filter(p=>gpuBrandOf(p)===s.gpuBrand).sort((a,b)=>a.price-b.price).slice(0,8).forEach(p=>{ const chip=chipOf(p); grid.appendChild(card(p.name, (gbOf(p)?gbOf(p)+" GB · ":"")+gpuWatt(p)+" W · "+(HASH[chip]||""), money.format(p.price), p.id===s.gpu, ()=>{ s.gpu=p.id; goto(6); })); }); }
  if (which==="disk"){ const pills=el("div",{class:"pills"}); [["NVME","nvme"],["SSD","ssd"],["HDD","hdd"]].forEach(pair=>pills.appendChild(el("button",{type:"button", class:s.driveKind===pair[0]?"on":"", text:t(pair[1]), on:()=>{ s.driveKind=pair[0]; render(); }}))); app.appendChild(pills); clean("storage").filter(p=>driveKind(p)===s.driveKind).sort((a,b)=>a.price-b.price).slice(0,8).forEach(p=>grid.appendChild(card(p.name, driveKind(p)+" · "+(diskGb(p)>=1000?(diskGb(p)/1000)+" TB":diskGb(p)+" GB"), money.format(p.price), p.id===s.drive, ()=>{ s.drive=p.id; goto(7); }))); }
  if (which==="case") clean("case").filter(p=>!byId[s.board]||fitsCase(p,byId[s.board])).sort((a,b)=>a.price-b.price).slice(0,8).forEach(p=>grid.appendChild(card(p.name, (formOf(p)||"").toUpperCase(), money.format(p.price), p.id===s.box, ()=>{ s.box=p.id; goto(8); })));
  if (which==="fan"){ app.appendChild(el("p",{class:"muted", text:t("fansay")})); EXTRA.filter(p=>p.cat==="fan").forEach(p=>grid.appendChild(card((s.fan===p.id?s.fanQty+" × ":"")+p.name, "", money.format(p.price), p.id===s.fan, ()=>{ s.fan=p.id; render(); }))); const more=el("button",{type:"button", class:"go", text:"+  "+(s.fanQty||1), on:()=>{ s.fanQty=Math.min(6,(s.fanQty||1)+1); render(); }}); grid.appendChild(more); grid.appendChild(el("button",{type:"button", class:"go", text:t("thisone"), on:()=>goto(9)})); }
  if (which==="cool"){ app.appendChild(el("p",{class:"muted", text:t("air")+" · "+t("aio")})); const pills=el("div",{class:"pills"}); [["air","air"],["aio","aio"]].forEach(pair=>pills.appendChild(el("button",{type:"button", class:s.coolKind===pair[0]?"on":"", text:t(pair[0]), on:()=>{ s.coolKind=pair[0]; render(); }}))); app.appendChild(pills); clean("cooler").filter(p=>s.coolKind==="aio"?isAio(p):!isAio(p)).sort((a,b)=>a.price-b.price).slice(0,8).forEach(p=>grid.appendChild(card(p.name, isAio(p)?t("aio"):t("air"), money.format(p.price), p.id===s.cooler, ()=>{ s.cooler=p.id; goto(10); }))); }
  if (which==="paste"){ app.appendChild(el("p",{class:"muted", text:t("pastesay")})); pastes().forEach(p=>grid.appendChild(card(p.name, "", money.format(p.price), p.id===s.paste, ()=>{ s.paste=p.id; goto(11); }))); }
  if (which==="psu"){ const pow=powerMath(); app.appendChild(el("p",{class:"muted", text:pow.need+" W"})); clean("psu").filter(p=>wattOf(p)>=400).sort((a,b)=>a.price-b.price).slice(0,8).forEach(p=>{ const low=wattOf(p)&&wattOf(p)<pow.need; grid.appendChild(card(p.name, low?t("warn"):(wattOf(p)+" W"), money.format(p.price), p.id===s.psu, ()=>{ if (low) return; s.psu=p.id; goto(12); })); }); if (byId[s.psu]&&wattOf(byId[s.psu])<pow.need) app.appendChild(el("p",{class:"warn", text:t("warn")+" "+pow.need+" W"})); }
  if (which==="done"){ lines().forEach(line=>grid.appendChild(card(line[0], line[1], "", false, ()=>goto(line[2])))); app.appendChild(grid); const sum=el("p",{class:"pct", text:money.format(total())}); app.appendChild(sum); app.appendChild(el("p",{class:"muted", text:t("notsale")+" "+t("scan")})); const canvas=el("canvas"); app.appendChild(canvas); const code=lines().map(l=>l[0]+" "+l[1]).join("\n").slice(0,640); if (window.drewQR) window.drewQR.draw(canvas, code, 3); app.appendChild(el("button",{type:"button", class:"go", text:t("print"), on:printList})); writeCart(); return; }
  app.appendChild(grid);
  writeCart();
}
function pastes(){ const cat=PARTS.filter(p=>/thermal paste|heat sink compound|mx-4|mx-6/i.test(p.name)&&!/cooler|freezer|heatsink fan/i.test(p.name)&&!junk(p)); return EXTRA.filter(p=>p.cat==="paste").concat(cat); }
function lines(){ const out=[]; const add=(id,i,qty)=>{ const p=byId[id]; if(!p) return; out.push([ (qty>1?qty+" × ":"")+p.name, money.format(p.price*(qty||1)), i ]); }; add(s.cpu,2); add(s.board,3); add(s.kit,4); if (s.gpu) add(s.gpu,5); add(s.drive,6); add(s.box,7); add(s.fan,8,s.fanQty); add(s.cooler,9); add(s.paste,10); add(s.psu,11); return out; }
function total(){ let n=0; const add=(id,q)=>{ if(byId[id]) n+=byId[id].price*(q||1); }; add(s.cpu); add(s.board); add(s.kit); add(s.gpu); add(s.drive); add(s.box); add(s.fan,s.fanQty); add(s.cooler); add(s.paste); add(s.psu); return n; }
function printList(){ const w=window.open("","print"); w.document.write("<pre style='font:14px/1.5 ui-monospace,monospace'>"+lines().map(l=>l[0]+"  "+l[1]).join("\n")+"\n\n"+t("notsale")+"</pre>"); w.document.close(); w.focus(); w.print(); }
function writeCart(){ const out={}; if(s.cpu) out.cpu=s.cpu; if(s.board) out.motherboard=s.board; if(s.kit) out.memory=s.kit; if(s.gpu) out.gpu=s.gpu; if(s.drive) out.storage=s.drive; if(s.box) out.case=s.box; if(s.fan) out.fan=s.fan; if(s.cooler) out.cooler=s.cooler; if(s.paste) out.paste=s.paste; if(s.psu) out.psu=s.psu; try{ localStorage.setItem("drew-cart", JSON.stringify(out)); parent.postMessage({type:"drew-progress", n:Math.round(pct()/100*8), total:8}, "*"); }catch(e){} }
function openSheet(){ const sheet=document.getElementById("sheet"); sheet.hidden=false; sheet.replaceChildren(); Object.keys(LANG).forEach(id=>{ sheet.appendChild(card(LANG[id].name, "", "", id===lang, ()=>{ lang=id; try{localStorage.setItem("bench-lang", id);}catch(e){} sheet.hidden=true; render(); })); }); }
document.getElementById("langBtn").onclick=openSheet;
document.getElementById("back").onclick=()=>{ if(step>0) goto(step-1); };
document.getElementById("lockForm").onsubmit=(e)=>{ e.preventDefault(); if(document.getElementById("lockPass").value!=="Password4"){ document.getElementById("lockBad").textContent="Wrong password"; return; } try{sessionStorage.setItem("drew-apple","1");}catch(err){} document.getElementById("lock").hidden=true; render(); };
fetch("parts.json").then(r=>r.json()).then(list=>{ PARTS=list; list.forEach(p=>{ byId[p.id]=p; }); EXTRA.forEach(p=>{ byId[p.id]=p; }); let ok=false; try{ ok=sessionStorage.getItem("drew-apple")==="1"; }catch(e){} if(ok) document.getElementById("lock").hidden=true; render(); }).catch(()=>{ document.getElementById("lockBad").textContent="The parts list did not load."; });
</script>
