<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Let's Build Your Perfect PC</title>
<style>
  :root { color-scheme: light; --bg:#f4f1ea; --ink:#1b1b1b; --card:#fff; --line:#1b1b1b; --blue:#0b3a8a; --orange:#c45c00; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:20px/1.45 Georgia, "Iowan Old Style", serif; }
  button, input, select { font:18px/1.3 system-ui, sans-serif; color:inherit; }
  button, select, input { min-height:52px; border-radius:12px; border:2px solid var(--ink); background:#fff; padding:8px 12px; }
  button { cursor:pointer; }
  button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:3px solid var(--orange); outline-offset:3px; }
  .top { position:sticky; top:0; z-index:2; background:#fff; border-bottom:2px solid var(--ink); display:flex; gap:8px; overflow:auto; padding:8px; }
  .top button { min-height:48px; white-space:nowrap; }
  .wrap { width:min(1100px,100%); margin:0 auto; padding:16px 14px 80px; }
  h1 { font-size:clamp(32px,5vw,52px); line-height:1.05; margin:8px 0; }
  .note { background:#fff; border:2px dashed var(--ink); border-radius:12px; padding:10px 12px; font:16px/1.4 system-ui, sans-serif; }
  .layout { display:grid; gap:14px; }
  body.desk .layout { grid-template-columns: 1fr 320px; align-items:start; }
  .card { background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:12px; margin:0 0 10px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .muted { font:16px/1.35 system-ui, sans-serif; }
  .price { font-weight:800; font-variant-numeric: tabular-nums; }
  .fit { border-color:var(--blue); }
  .nope { border-color:var(--orange); background:#fff7ef; }
  .mark { font-weight:800; }
  .mark.yes { color:var(--blue); }
  .mark.no { color:var(--orange); }
  select, input[type="number"], input[type="search"] { width:100%; max-width:520px; display:block; margin:6px 0; }
  .cart { position:sticky; top:72px; }
  body.phone .eat { display:flex; gap:10px; align-items:center; background:#fff; border:1px solid #e4e4e4; border-radius:16px; padding:12px; margin:8px 0; }
  body.phone .eat-ico { width:52px; height:52px; border-radius:14px; background:#f3f0ea; display:grid; place-items:center; font-size:26px; flex:none; }
  body.phone .eat-mid { flex:1; min-width:0; }
  body.phone .eat-mid .muted { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  body.phone .x { min-width:44px; min-height:44px; border-radius:999px; }
  body.phone .eat-bar, body.phone .order-bar { position:sticky; bottom:0; display:flex; gap:12px; align-items:center; background:#fff; border-top:1px solid #ddd; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); margin:12px -14px -80px; z-index:3; }
  body.phone .order-bar button, body.phone .eat-bar button.primary { flex:1; background:#111; color:#fff; border-color:#111; border-radius:999px; min-height:56px; }
  .order-head { background:#111; color:#fff; border-radius:18px; padding:16px; }
  .order-head p { margin:6px 0 0; color:#ddd; font:16px/1.35 system-ui, sans-serif; }
  #lock { position:fixed; inset:0; background:var(--bg); display:grid; place-items:center; z-index:6; }
  #lock[hidden] { display:none !important; }
  #printFrame { position:absolute; width:0; height:0; border:0; }
  @media (max-width:800px) { body.desk .layout { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body class="desk">
<div id="lock"><form id="lockForm"><h1>Easy builder</h1><p>Password</p><input id="lockPass" type="password" autocomplete="current-password" /><p id="lockBad"></p><button class="primary" type="submit">Open</button></form></div>
<iframe id="printFrame" title="Print"></iframe>
<nav class="top" aria-label="Builder">
  <button type="button" data-go="home">Home</button>
  <button type="button" data-go="dash">Paper list</button>
  <button type="button" data-go="explore">Parts</button>
  <button type="button" data-go="compare">Compare</button>
  <button type="button" data-go="build">Put it together</button>
  <button type="button" id="phoneBtn" type="button" aria-label="Mobile layout">📱</button>
  <button type="button" id="deskBtn" type="button" aria-label="Desktop layout">🖥️</button>
</nav>
<main class="wrap" id="app"></main>
<script>
const CATS = ["cpu","motherboard","memory","gpu","storage","case","cooler","psu"];
const LABEL = { cpu:"Processor", motherboard:"Motherboard", memory:"Memory", gpu:"Graphics card", storage:"Storage", case:"Case", cooler:"Cooler", psu:"Power supply" };
const GAMES = {
  Fortnite:{ low:[1,16], med:[2,16], high:[3,16], ult:[4,32] },
  "Counter-Strike 2":{ low:[1,16], med:[2,16], high:[3,16], ult:[4,16] },
  Roblox:{ low:[0,8], med:[1,16], high:[2,16], ult:[2,16] },
  "Rainbow Six Siege":{ low:[1,16], med:[2,16], high:[3,16], ult:[4,32] },
  "Apex Legends":{ low:[2,16], med:[2,16], high:[3,16], ult:[4,32] },
  "League of Legends":{ low:[0,8], med:[1,16], high:[2,16], ult:[2,16] },
  Minecraft:{ low:[0,8], med:[1,16], high:[2,16], ult:[3,16] },
  "Escape from Tarkov":{ low:[2,16], med:[3,32], high:[3,32], ult:[4,32] },
  Warzone:{ low:[2,16], med:[3,16], high:[3,32], ult:[4,32] },
  Valorant:{ low:[1,16], med:[2,16], high:[2,16], ult:[3,16] }
};
const JOBS = {
  School:{ gpu:0, ram:16, disk:"1TB", note:"School work does not need a separate graphics card." },
  Work:{ gpu:0, ram:16, disk:"1TB", note:"Office work runs on the processor's own graphics." },
  Photoshop:{ gpu:2, ram:32, disk:"1TB", note:"Photo work likes a lot of memory and a modest graphics card." },
  Premiere:{ gpu:3, ram:32, disk:"2TB", note:"Video editing likes a graphics card and a big SSD." },
  "After Effects":{ gpu:3, ram:32, disk:"1TB", note:"Motion work likes memory first, then a graphics card." },
  Streaming:{ gpu:3, ram:16, disk:"1TB", note:"Streaming likes a graphics card so the game and the broadcast can share the work." },
  "Netflix, YouTube, Twitch":{ gpu:0, ram:16, disk:"1TB", note:"Watching video does not need a separate graphics card." }
};
const FACTS = {
  cpu:["Processor","This part thinks. Programs run here.","It must match the motherboard."],
  motherboard:["Motherboard","The other parts plug into this board.","It must match the processor and the memory."],
  memory:["Memory","The desk the computer works on right now.","It must be the kind the board accepts, such as DDR4 or DDR5."],
  gpu:["Graphics card","This draws game pictures.","Not every computer needs one. Length is often missing from the list, so I will say when I cannot check the fit."],
  storage:["Storage","The filing cabinet. Files stay here when the power is off.","Start with an SSD."],
  case:["Case","The box.","The motherboard has to fit inside it."],
  cooler:["Cooler","Keeps the processor from getting too hot.","Some processors already include one."],
  psu:["Power supply","Feeds power to the parts.","Too small and the computer can shut off. Do not open this box."]
};
const money = new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD"});
let PARTS=[], byId={};
const state = load();
function load(){
  let s={};
  try { s=JSON.parse(localStorage.getItem("drew-easy-build")||"{}"); } catch(e){}
  return Object.assign({ view:"home", layout:"desk", five:false, job:"School", game:"", level:"med", budget:800, accessories:false, power:"works", uses:["school"], priorities:["value"], owned:{}, ownedId:{}, unknown:{}, build:{}, why:{}, note:"", past:[], future:[], fans:null, asm:0, focus:"cpu" }, s);
}
function save(){ const c=JSON.parse(JSON.stringify(state)); delete c.past; delete c.future; try{ localStorage.setItem("drew-easy-build", JSON.stringify(c)); } catch(e){} }
function junk(p){ return /open box|renewed|recertified|sodimm|surveillance|purple|laptop|\becc\b/i.test(p.name)||p.price<12; }
function gbOf(p){ const m=p.name.toUpperCase().match(/\b(4|8|16|32|64)GB\b/); return m?+m[1]:0; }
function wattOf(p){ if(!p) return 0; if(p.watt) return p.watt; const m=p.name.toUpperCase().match(/(\d{3,4})\s?W/); return m?+m[1]:0; }
function gpuTier(p){ const n=p.name.toUpperCase(); if(/5090|4090/.test(n)) return 6; if(/5080|4080|5070\s?TI|9070\s?XT/.test(n)) return 5; if(/\b5070\b|\b9070\b|4070/.test(n)) return 4; if(/5060|7600|4060/.test(n)) return 3; if(/3050|1650|6500/.test(n)) return 2; if(/1030/.test(n)) return 1; return 0; }
function formOf(p){ if(!p) return ""; if(p.form) return p.form; const n=p.name.toUpperCase(); if(/MICRO|MATX|M-ATX/.test(n)) return "matx"; if(/ITX/.test(n)) return "itx"; if(/E-?ATX|FULL/.test(n)) return "full"; if(/ATX/.test(n)) return "atx"; return ""; }
function fitsCase(box, board){ const r={itx:1,matx:2,atx:3,full:4,eatx:4}; return (r[formOf(box)]||3)>=(r[formOf(board)]||2); }
function pool(cat, pred){ return PARTS.filter(p=>p.cat===cat && !junk(p) && (!pred||pred(p))).sort((a,b)=>a.price-b.price); }
function gpuTarget(){
  if (state.game && GAMES[state.game]) return GAMES[state.game][state.level||"med"][0];
  if (state.job && JOBS[state.job]) return JOBS[state.job].gpu;
  return 0;
}
function ramTarget(){
  if (state.game && GAMES[state.game]) return GAMES[state.game][state.level||"med"][1];
  if (state.job && JOBS[state.job]) return JOBS[state.job].ram;
  return 16;
}
function diskTarget(){ return (state.job && JOBS[state.job] && JOBS[state.job].disk) || "1TB"; }
function boxBudget(variant){ let n=+state.budget||0; if(state.accessories) n=Math.max(0,n-250); if(variant<0) n*=0.8; return n; }
function fanInfo(part){
  if(!part) return null;
  const n=part.name;
  const m=n.match(/(\d+)\s*x\s*(?:pre-installed|ARGB|PWM|120mm)?[^.]{0,24}fan/i)||n.match(/(\d+)\s*fans?\s*included/i)||n.match(/with\s+(\d+)\s*fans?/i)||n.match(/(\d+)\s*fans?\b/i)||n.match(/(\d+)F\b/);
  const form=formOf(part)||"atx";
  const slots=form==="itx"?3:form==="matx"?4:form==="full"?7:6;
  return { included:m?+m[1]:0, known:!!m, slots, form };
}
function plan(variant){
  const cap=boxBudget(variant), want=gpuTarget(), out={}, why={};
  const owned=state.ownedId||{};
  function take(cat, part, reason){ if(part){ out[cat]=part; why[cat]=reason; } }
  if(owned.cpu&&byId[owned.cpu]) take("cpu", byId[owned.cpu], "You already have this processor.");
  else {
    const apu=pool("cpu",p=>/5500GT|5600GT|8500G|8600G|Graphics/i.test(p.name))[0];
    const plain=pool("cpu",p=>/Ryzen 5 5500 /.test(p.name))[0];
    const strong=pool("cpu",p=>/Ryzen 5 7600/.test(p.name))[0];
    const pick=want===0||cap<850?apu:(cap>=2400&&want>=3?strong:plain)||apu;
    take("cpu", pick, want===0?"The pictures can come from the processor, so you do not pay for a separate graphics card.":"This processor leaves money for the graphics card.");
  }
  if(!out.cpu) return {parts:{}, why:{}, note:"No processor in the parts list."};
  const socket=out.cpu.socket, ramKind=socket==="AM5"?"DDR5":"DDR4";
  if(owned.motherboard&&byId[owned.motherboard]) take("motherboard", byId[owned.motherboard], "You already have this motherboard.");
  else take("motherboard", pool("motherboard",p=>p.socket===socket&&(!p.ram||p.ram===ramKind))[0], "This board matches that processor.");
  const kind=(out.motherboard&&out.motherboard.ram)||ramKind;
  let gb=ramTarget(); if(cap<700) gb=Math.min(gb,8); if(variant<0) gb=Math.min(gb,16);
  if(owned.memory&&byId[owned.memory]) take("memory", byId[owned.memory], "You already have this memory.");
  else take("memory", pool("memory",p=>p.ram===kind&&gbOf(p)===gb)[0]||pool("memory",p=>p.ram===kind&&gbOf(p)>=8)[0], gb+" GB is the amount this job usually needs. More memory does not automatically mean smoother games.");
  const disk=cap<700?"512GB":diskTarget();
  if(owned.storage&&byId[owned.storage]) take("storage", byId[owned.storage], "You already have this drive.");
  else take("storage", pool("storage",p=>/SSD|NVME|M\.2/i.test(p.name)&&!/HDD|HARD DRIVE/i.test(p.name)&&p.name.toUpperCase().includes(disk))[0]||pool("storage",p=>/SSD|NVME/i.test(p.name))[0], "An SSD is the fast filing cabinet. Start here.");
  if(owned.case&&byId[owned.case]) take("case", byId[owned.case], "You already have this case.");
  else take("case", pool("case",p=>fitsCase(p,out.motherboard))[0], "This box fits the motherboard.");
  if(want>0){
    const maxTier=Math.max(1, want+(variant>0?1:0));
    const cards=pool("gpu",p=>{const t=gpuTier(p); return t>=1&&t<=maxTier;}).sort((a,b)=>gpuTier(b)-gpuTier(a)||a.price-b.price);
    const room=Math.max(80, cap-Object.values(out).reduce((s,p)=>s+p.price,0)-80);
    const card=owned.gpu&&byId[owned.gpu]?byId[owned.gpu]:(cards.find(p=>p.price<=room)||(cap>=900?cards[cards.length-1]:null));
    take("gpu", card, "This graphics card matches the game or program you picked, using the parts list, not a lab test.");
  } else if(owned.gpu&&byId[owned.gpu]) take("gpu", byId[owned.gpu], "You already have this graphics card. This job may not need it.");
  const tier=out.gpu?gpuTier(out.gpu):0;
  const needW=tier>=4?750:tier>=3?650:tier>=2?550:tier?450:400;
  if(owned.psu&&byId[owned.psu]) take("psu", byId[owned.psu], "You already have this power supply.");
  else take("psu", pool("psu",p=>wattOf(p)>=needW&&wattOf(p)<=needW+250)[0]||pool("psu",p=>wattOf(p)>=needW)[0], "This power supply is larger than the estimate. The estimate is not a measurement.");
  if(owned.cooler&&byId[owned.cooler]) take("cooler", byId[owned.cooler], "You already have this cooler.");
  else if(!/cooler/i.test(out.cpu.name)) take("cooler", pool("cooler")[0], "This processor does not say it includes a cooler.");
  else why.cooler="The processor includes a cooler, so I did not add another.";
  const total=Object.values(out).reduce((s,p)=>s+p.price,0);
  let note=(state.game&&GAMES[state.game])?state.game+" at "+state.level+" settings. These are typical parts people shop for. This list has no official frame-rate test.":(JOBS[state.job]?JOBS[state.job].note:"A paper list for the job you picked.");
  if(cap>0&&total>cap+1) note+=" The closest honest computer is "+money.format(total)+", over the "+money.format(cap)+" set aside.";
  else if(want>=3&&(!out.gpu||gpuTier(out.gpu)<want)) note+=" This budget cannot buy the stronger graphics card that setting usually wants.";
  if(state.accessories) note+=" $250 is only a placeholder for a screen and keyboard. Those are not in the parts list.";
  return {parts:out, why, note};
}
function applyPlan(p){ pushHist(); state.build={}; state.why=p.why; state.note=p.note; Object.keys(p.parts).forEach(k=>{ state.build[k]=p.parts[k].id; }); state.fans=null; save(); }
function selected(){ const m={}; CATS.forEach(id=>{ if(byId[state.build[id]]) m[id]=byId[state.build[id]]; }); return m; }
function totalOf(parts){ return Object.values(parts).reduce((s,p)=>s+(p?p.price:0),0); }
function checks(parts){
  const list=[];
  function add(level, cat, text){ list.push({level, cat, text}); }
  CATS.forEach(id=>{
    if(id==="gpu"&&gpuTarget()===0) return;
    if(id==="cooler"&&parts.cpu&&/cooler/i.test(parts.cpu.name)) return;
    if(!parts[id]){
      if(state.unknown&&state.unknown[id]) add("warn", id, "You own a "+LABEL[id].toLowerCase()+", but the model is unknown, so it is not checked.");
      else add("bad", id, LABEL[id]+" is still needed.");
    }
  });
  if(parts.cpu&&parts.motherboard){
    if(parts.cpu.socket&&parts.motherboard.socket&&parts.cpu.socket!==parts.motherboard.socket) add("bad","cpu","This processor does not fit this motherboard.");
    else if(!parts.cpu.socket||!parts.motherboard.socket) add("warn","cpu","A socket is missing, so processor fit is not verified.");
    else add("ok","cpu","Processor socket matches the motherboard ("+parts.cpu.socket+").");
    add("warn","motherboard","BIOS version is not in the parts list, so a BIOS update is not verified.");
  }
  if(parts.memory&&parts.motherboard){
    if(parts.memory.ram&&parts.motherboard.ram&&parts.memory.ram!==parts.motherboard.ram) add("bad","memory","This memory is "+parts.memory.ram+" and the motherboard wants "+parts.motherboard.ram+".");
    else if(!parts.memory.ram||!parts.motherboard.ram) add("warn","memory","Memory type is missing, so the match is not verified.");
    else add("ok","memory","Memory type matches ("+parts.memory.ram+").");
  }
  if(parts.case&&parts.motherboard){
    if(formOf(parts.case)&&formOf(parts.motherboard)&&!fitsCase(parts.case, parts.motherboard)) add("bad","case","This case is smaller than the motherboard.");
    else if(!formOf(parts.case)||!formOf(parts.motherboard)) add("warn","case","A size is missing, so case fit is not verified.");
    else add("ok","case","Motherboard size fits this case.");
  }
  if(parts.gpu) add("warn","gpu","Graphics-card length and power plugs are not in the parts list, so case fit is not verified.");
  if(parts.storage&&/NVME|M\.2/i.test(parts.storage.name)) add("warn","storage","M.2 slot count is not in the parts list, so the drive fit is not verified.");
  if(parts.psu){
    const tier=parts.gpu?gpuTier(parts.gpu):0;
    const need=(parts.cpu&&(parts.cpu.watt||95)||65)+(tier>=4?260:tier>=3?180:tier>=2?130:tier?40:0)+70;
    const w=wattOf(parts.psu);
    if(!w) add("warn","psu","No watt number is stored for this power supply.");
    else if(w<need) add("bad","psu","This power supply looks too small ("+w+"W listed, about "+need+"W estimated).");
    else add("ok","psu","Listed watts ("+w+"W) are above the estimate (about "+need+"W).");
  }
  if(parts.cooler) add("warn","cooler","Cooler height is not in the parts list, so case fit is not verified.");
  return list;
}
function statusFor(id, flags){
  const mine=flags.filter(f=>f.cat===id);
  if(mine.some(f=>f.level==="bad")) return "bad";
  if(mine.some(f=>f.level==="warn")) return "warn";
  if(mine.some(f=>f.level==="ok")) return "ok";
  return "ok";
}
function el(tag, attrs, kids){
  const node=document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if(k==="class") node.className=v;
    else if(k==="text") node.textContent=v;
    else if(k.startsWith("on")&&typeof v==="function") node.addEventListener(k.slice(2).toLowerCase(), v);
    else if(v!=null&&v!==false) node.setAttribute(k, v===true?"":v);
  });
  (kids||[]).forEach(k=>{ if(k!=null) node.appendChild(typeof k==="string"?document.createTextNode(k):k); });
  return node;
}
function pushHist(){ state.past.push(JSON.stringify({build:state.build,fans:state.fans})); state.future=[]; if(state.past.length>30) state.past.shift(); }
function banner(parent){
  parent.appendChild(el("p",{class:"note", text:"This is a paper list, not a store. Nothing here is for sale. Prices are Canadian dollars from the saved parts list, not live prices, and they do not include tax or shipping. Take the list shopping."}));
}
function selects(parent){
  const job=el("select",{"aria-label":"What the computer is for"});
  job.appendChild(el("option",{value:"", text:"A specific game"}));
  Object.keys(JOBS).forEach(name=> job.appendChild(el("option",{value:name, text:name, selected:state.job===name&&!state.game?true:false})));
  job.value=state.game?"":state.job;
  job.onchange=()=>{ state.job=job.value||state.job; if(job.value) state.game=""; render(); };
  const game=el("select",{"aria-label":"Game"});
  game.appendChild(el("option",{value:"", text:"No single game"}));
  Object.keys(GAMES).forEach(name=> game.appendChild(el("option",{value:name, text:name})));
  game.value=state.game||"";
  game.onchange=()=>{ state.game=game.value; render(); };
  const level=el("select",{"aria-label":"Game settings"});
  [["low","Low settings"],["med","Medium settings"],["high","High settings"],["ult","Ultimate settings"]].forEach(([id,name])=> level.appendChild(el("option",{value:id, text:name})));
  level.value=state.level||"med";
  level.onchange=()=>{ state.level=level.value; render(); };
  const budget=el("select",{"aria-label":"Budget"});
  [["450","Under $500"],["700","$500–$800"],["1000","$800–$1,200"],["1500","$1,200–$1,800"],["2000","$1,800–$2,500"],["3000","$2,500–$3,500"],["4000","$3,500+"]].forEach(([v,name])=> budget.appendChild(el("option",{value:v, text:name})));
  budget.value=["450","700","1000","1500","2000","3000","4000"].includes(String(state.budget))?String(state.budget):"1000";
  budget.onchange=()=>{ state.budget=+budget.value; render(); };
  parent.append(el("label",{text:"What is it for?"}), job, el("label",{text:"A game, if you have one"}), game, el("label",{text:"Settings for that game"}), level, el("label",{text:"Budget"}), budget);
}
function cart(parts){
  const flags=checks(parts);
  const box=el("aside",{class:"card cart", "aria-label":"Paper shopping list"});
  box.append(el("h2",{text:"Paper list"}), el("p",{class:"muted", text:"Not a checkout. Clear any line. Then print it and go shopping."}));
  CATS.forEach(id=>{
    const part=parts[id];
    if(!part && !(state.unknown&&state.unknown[id])) return;
    const st=part?statusFor(id, flags):"warn";
    const row=el("div",{class:"card "+(st==="bad"?"nope":"fit")});
    const mark=st==="bad"?"✕ Does not fit":st==="warn"?"▲ Check":"✓ Fits";
    row.append(el("b",{text:LABEL[id]}), el("div",{class:"mark "+(st==="bad"?"no":"yes"), text:mark}), el("p",{text:part?part.name:"Model unknown"}));
    if(part) row.append(el("p",{class:"price", text:money.format(part.price)}));
    const why=(flags.filter(f=>f.cat===id).map(f=>f.text).join(" "))||state.why[id]||"";
    if(why) row.append(el("p",{class:"muted", text:why}));
    row.appendChild(el("button",{type:"button", text:"Clear", onclick:()=>{ pushHist(); delete state.build[id]; delete state.unknown[id]; render(); }}));
    box.appendChild(row);
  });
  const fans=fanBlock(parts.case);
  if(fans) box.appendChild(fans);
  box.append(el("p",{class:"price", text:"List total "+money.format(totalOf(parts))}), el("p",{class:"muted", text:"Budget set aside "+money.format(boxBudget(0))}));
  const tools=el("div",{class:"row"});
  tools.append(
    el("button",{class:"primary", type:"button", text:"Print paper list", onclick:printReceipt}),
    el("button",{type:"button", text:"Undo", onclick:undo}),
    el("button",{type:"button", text:"Clear all", onclick:()=>{ pushHist(); state.build={}; state.fans=null; render(); }})
  );
  box.appendChild(tools);
  return box;
}
function fanBlock(casePart){
  if(!casePart) return null;
  const info=fanInfo(casePart);
  const have=state.fans==null?info.included:state.fans;
  const wrap=el("div",{class:"card "+(have>info.slots?"nope":"fit")});
  wrap.append(el("b",{text:"Case fans "+have+"/"+info.slots}));
  wrap.append(el("p",{class:"muted", text:info.known?"The case name lists "+info.included+" fan"+(info.included===1?"":"s")+" in the box. Spot count is a typical number for a "+info.form.toUpperCase()+" case, not a measured factory diagram.":"The case name does not say how many fans are in the box, so the count starts at 0. The "+info.slots+" spots are typical for this size, not a factory number."}));
  if(have>info.slots) wrap.append(el("p",{text:"You have "+have+" fans and this case has about "+info.slots+" spots. "+(have-info.slots)+" "+(have-info.slots===1?"is":"are")+" extra."}));
  else if(have<info.slots) wrap.append(el("p",{text:"You can still add "+(info.slots-have)+" fan"+(info.slots-have===1?"":"s")+"."}));
  else wrap.append(el("p",{text:"Fan count matches the spots."}));
  const input=el("input",{type:"number", min:"0", max:"12", value:String(have), "aria-label":"How many fans you will install"});
  input.onchange=()=>{ state.fans=Math.max(0, Math.min(12, +input.value||0)); render(); };
  wrap.append(el("label",{text:"Fans you will install"}), input);
  return wrap;
}
function preferredLayout(){
  try { const saved=sessionStorage.getItem("drew-layout"); if(saved==="phone"||saved==="desk") return saved; } catch(e) {}
  return window.matchMedia("(max-width: 820px)").matches ? "phone" : "desk";
}
function setLayout(next){ state.layout=next; try{ sessionStorage.setItem("drew-layout", next); }catch(e){} render(); }
function undo(){
  if(!state.past.length) return;
  state.future.push(JSON.stringify({build:state.build,fans:state.fans}));
  const prev=JSON.parse(state.past.pop());
  state.build=prev.build||prev; state.fans=prev.fans==null?state.fans:prev.fans;
  render();
}
function printReceipt(){
  const parts=selected();
  const flags=checks(parts);
  const info=parts.case?fanInfo(parts.case):null;
  const have=info?(state.fans==null?info.included:state.fans):0;
  const rows=CATS.filter(id=>parts[id]).map(id=>{
    const st=statusFor(id, flags);
    const word=st==="bad"?"DOES NOT FIT":st==="warn"?"CHECK":"FITS";
    return LABEL[id].padEnd(16)+" "+word+"\n  "+parts[id].name+"\n  "+money.format(parts[id].price);
  }).join("\n\n");
  const fanLine=info?("\nFANS "+have+"/"+info.slots+(have>info.slots?"\n"+ (have-info.slots)+" extra fan(s). This case does not have a spot for all of them.":"")+(info.known?"":"\nIncluded fans were not written on the case name.")):"";
  const problems=flags.map(f=>(f.level==="bad"?"X ":"? ")+f.text).join("\n");
  const text=[
    "PAPER BUILD",
    "NOT A SALE. NOT A RECEIPT.",
    "Nothing was purchased.",
    "Take this list to a store.",
    "",
    state.game?("Game: "+state.game+" / "+state.level):("Job: "+state.job),
    state.note||"",
    "",
    rows||"No parts yet.",
    fanLine,
    "",
    "TOTAL "+money.format(totalOf(parts)),
    "Catalog prices. Not live. No tax. No shipping.",
    "",
    "CHECKS",
    problems||"None stored."
  ].join("\n");
  const doc=document.getElementById("printFrame").contentDocument;
  doc.open();
  doc.write("<!DOCTYPE html><html><head><title>Paper build</title><style>body{font:14px/1.35 ui-monospace,Menlo,monospace;margin:18px;color:#000;background:#fff} h1{font-size:18px} pre{white-space:pre-wrap}</style></head><body><h1>Paper build</h1><pre>"+text.replace(/[&<>]/g, c=>({"&":"&","<":"<",">":">"}[c]))+"</pre></body></html>");
  doc.close();
  document.getElementById("printFrame").contentWindow.focus();
  document.getElementById("printFrame").contentWindow.print();
}
function render(){
  document.body.classList.toggle("desk", state.layout!=="phone");
  document.body.classList.toggle("phone", state.layout==="phone");
  const app=document.getElementById("app");
  app.replaceChildren();
  ({home:viewHome, dash:viewDash, explore:viewExplore, compare:viewCompare, build:viewAsm, checkout:viewCheckout}[state.view]||viewHome)(app);
  save();
}
function viewHome(app){
  app.append(el("h1",{text:"Let's build your PC on paper."}), el("p",{text:"You do not need to know the parts. Pick a job or a game. I will fill a list you can take shopping."}));
  banner(app);
  const box=el("div",{class:"card"});
  selects(box);
  box.appendChild(el("button",{class:"primary", type:"button", text:"Fill my paper list", onclick:()=>{ applyPlan(plan(0)); state.view="dash"; render(); }}));
  app.appendChild(box);
}
function viewDash(app){
  const parts=selected();
  if(!Object.keys(parts).length){ applyPlan(plan(0)); return viewDash(app); }
  if(state.layout==="phone") return viewPhone(app, parts);
  app.append(el("h1",{text:"Your paper list"}));
  banner(app);
  const layout=el("div",{class:"layout"});
  const main=el("div");
  main.append(el("p",{text:state.note||""}));
  const chooser=el("div",{class:"card"});
  selects(chooser);
  chooser.appendChild(el("button",{class:"primary", type:"button", text:"Rebuild the list for this", onclick:()=>{ applyPlan(plan(0)); render(); }}));
  main.appendChild(chooser);
  CATS.forEach(id=>{
    const part=parts[id];
    const card=el("article",{class:"card"});
    card.append(el("h2",{text:LABEL[id]}), el("p",{text:part?part.name:"Not chosen"}), el("p",{class:"muted", text:state.why[id]||FACTS[id][1]}));
    const sel=el("select",{"aria-label":"Choose a "+LABEL[id]});
    sel.appendChild(el("option",{value:"", text:"Choose a different one"}));
    pool(id).slice(0,40).forEach(p=> sel.appendChild(el("option",{value:p.id, text:p.name+" — "+money.format(p.price)})));
    if(part) sel.value=part.id;
    sel.onchange=()=>{ if(!sel.value) return; pushHist(); state.build[id]=sel.value; state.why[id]="You picked this one."; render(); };
    card.append(sel, el("button",{type:"button", text:"Clear this part", onclick:()=>{ pushHist(); delete state.build[id]; render(); }}));
    main.appendChild(card);
  });
  layout.append(main, cart(parts));
  app.appendChild(layout);
}
function viewPhone(app, parts){
  const flags=checks(parts);
  app.append(el("h1",{text:"Your list"}), el("p",{class:"muted", text:"Tap a part to change it. This is not an order."}));
  CATS.forEach(id=>{
    const part=parts[id];
    if(!part) return;
    const st=statusFor(id, flags);
    const word=st==="bad"?"✕ Does not fit":st==="warn"?"▲ Check":"✓ Fits";
    const row=el("div",{class:"eat"});
    row.append(
      el("div",{class:"eat-ico", text:({cpu:"Cpu",motherboard:"Board",memory:"Ram",gpu:"Gpu",storage:"Ssd",case:"Case",cooler:"Fan",psu:"Psu"})[id]}),
      el("div",{class:"eat-mid"}, [el("b",{text:LABEL[id]}), el("span",{class:"muted", text:part.name}), el("span",{class:"muted", text:word})]),
      el("div",{}, [el("div",{class:"price", text:money.format(part.price)}), el("button",{class:"x", type:"button", text:"✕", "aria-label":"Remove "+LABEL[id], onclick:(e)=>{ e.stopPropagation(); pushHist(); delete state.build[id]; render(); }})])
    );
    row.addEventListener("click", (e)=>{ if(e.target.closest("button")) return; state.focus=id; state.view="explore"; render(); });
    app.appendChild(row);
  });
  const fans=fanBlock(parts.case);
  if(fans) app.appendChild(fans);
  const bar=el("div",{class:"eat-bar"});
  bar.append(el("div",{}, [el("div",{class:"muted", text:"Paper total"}), el("b",{class:"price", text:money.format(totalOf(parts))})]), el("button",{class:"primary", type:"button", text:"Review", onclick:()=>{ state.view="checkout"; render(); }}));
  app.appendChild(bar);
}
function viewCheckout(app){
  const parts=selected();
  const flags=checks(parts);
  app.append(el("div",{class:"order-head"}, [el("h1",{text:"Review"}), el("p",{text:"Not a delivery. Nothing is charged. Print this and take it to a store."})]));
  CATS.forEach(id=>{
    if(!parts[id]) return;
    const st=statusFor(id, flags);
    app.append(el("div",{class:"eat"}, [
      el("div",{class:"eat-mid"}, [el("b",{text:LABEL[id]}), el("span",{class:"muted", text:parts[id].name+" · "+(st==="bad"?"Does not fit":st==="warn"?"Check":"Fits")})]),
      el("div",{class:"price", text:money.format(parts[id].price)})
    ]));
  });
  const info=parts.case?fanInfo(parts.case):null;
  if(info){
    const have=state.fans==null?info.included:state.fans;
    app.append(el("p",{text:"Fans "+have+"/"+info.slots+(have>info.slots?" · "+(have-info.slots)+" extra":"")}));
  }
  app.append(el("p",{class:"muted", text:"Subtotal "+money.format(totalOf(parts))+". Tax and shipping are added by the store, not here."}));
  const bar=el("div",{class:"order-bar"});
  bar.append(el("button",{type:"button", text:"Back", onclick:()=>{ state.view="dash"; render(); }}), el("button",{class:"primary", type:"button", text:"Print list", onclick:printReceipt}));
  app.appendChild(bar);
}
function viewExplore(app){
  const id=state.focus||"cpu";
  app.append(el("h1",{text:FACTS[id][0]}), el("p",{text:FACTS[id][1]+" "+FACTS[id][2]}));
  banner(app);
  const jump=el("div",{class:"row"});
  CATS.forEach(k=> jump.appendChild(el("button",{type:"button", class:k===id?"primary":"", text:LABEL[k], onclick:()=>{ state.focus=k; render(); }})));
  app.appendChild(jump);
  const sel=el("select",{"aria-label":"Parts"});
  pool(id).slice(0,80).forEach(p=> sel.appendChild(el("option",{value:p.id, text:p.name+" — "+money.format(p.price)})));
  sel.onchange=()=>{ pushHist(); state.build[id]=sel.value; state.why[id]="You picked this from the parts list."; state.view="dash"; render(); };
  app.appendChild(sel);
}
function viewCompare(app){
  app.append(el("h1",{text:"Three ways to spend the money"}));
  banner(app);
  const grid=el("div",{class:"layout"});
  [["Cheaper",plan(-1)],["The one I would write down",plan(0)],["Stronger",plan(1)]].forEach(([name,p])=>{
    const card=el("article",{class:"card"});
    const total=Object.values(p.parts).reduce((s,part)=>s+part.price,0);
    card.append(el("h2",{text:name}), el("p",{class:"price", text:money.format(total)}), el("p",{text:p.note||""}));
    CATS.forEach(id=>{ if(p.parts[id]) card.appendChild(el("p",{class:"muted", text:LABEL[id]+": "+p.parts[id].name})); });
    card.appendChild(el("button",{class:"primary", type:"button", text:"Use this list", onclick:()=>{ applyPlan(p); state.view="dash"; render(); }}));
    grid.appendChild(card);
  });
  app.appendChild(grid);
}
function viewAsm(app){
  const parts=selected();
  const steps=[
    "Clear a table. Do not open the power supply.",
    "Touch the metal of the case before you pick up a part.",
    "Set the processor in its socket. If it does not drop in flat, stop. Do not force it.",
    parts.memory?"Click the memory in until both ends latch.":"Add memory before the first start.",
    parts.storage&&/NVME|M\.2/i.test(parts.storage.name)?"Lay the NVMe drive flat in its slot and screw it down. Do not bend it.":"Screw the SSD into its bay.",
    "Screw the motherboard onto the standoffs. Do not let it sit on loose screws.",
    "Mount the power supply. Leave it closed.",
    parts.gpu?"Seat the graphics card until the latch clicks, then screw the bracket. If it does not slide in, stop.":"This list has no separate graphics card.",
    "Plug in the power cables the manuals show. If a plug does not fit, do not bend the pins.",
    parts.cooler?"Mount the cooler the way its sheet shows.":"Use the cooler that came with the processor.",
    fanLine(parts.case),
    "Look once more, then turn it on. If it stays dark, turn it off and recheck the cables.",
    "Install the system from a source you trust."
  ].filter(Boolean);
  app.append(el("h1",{text:"Put it together"}), el("p",{class:"muted", text:"Step "+(state.asm+1)+" of "+steps.length+". Stop any time."}), el("p",{text:steps[Math.min(state.asm, steps.length-1)]}));
  const row=el("div",{class:"row"});
  if(state.asm>0) row.appendChild(el("button",{type:"button", text:"Back", onclick:()=>{ state.asm--; render(); }}));
  if(state.asm<steps.length-1) row.appendChild(el("button",{class:"primary", type:"button", text:"Next", onclick:()=>{ state.asm++; render(); }}));
  app.appendChild(row);
}
function fanLine(casePart){
  if(!casePart) return "Pick a case before counting fans.";
  const info=fanInfo(casePart);
  const have=state.fans==null?info.included:state.fans;
  if(have>info.slots) return "You listed "+have+" fans and this case has about "+info.slots+" spots. Leave the extra fans out.";
  return "Fan spots: "+have+" of about "+info.slots+". Mount only the fans that have a real spot.";
}
document.querySelectorAll("[data-go]").forEach(btn=> btn.onclick=()=>{ state.view=btn.getAttribute("data-go"); render(); });
document.getElementById("phoneBtn").onclick=()=> setLayout("phone");
document.getElementById("deskBtn").onclick=()=> setLayout("desk");
document.getElementById("lockForm").onsubmit=(event)=>{
  event.preventDefault();
  if(document.getElementById("lockPass").value==="Password3"){ sessionStorage.setItem("drew-easy","1"); boot(); }
  else document.getElementById("lockBad").textContent="Wrong password";
};
function boot(){
  document.getElementById("lock").hidden=true;
  state.layout=preferredLayout();
  fetch("parts.json").then(r=>r.json()).then(data=>{
    PARTS=data; data.forEach(p=>{ byId[p.id]=p; });
    const hash=location.hash.replace("#","");
    if(hash) hash.split(",").forEach(id=>{ if(byId[id]) state.build[byId[id].cat]=id; });
    render();
  }).catch(()=>{ document.getElementById("app").textContent="The parts list did not load."; });
}
if(sessionStorage.getItem("drew-easy")==="1") boot();
</script>
</body>
</html>
