<style>
  :root { color-scheme: light; --bg:#f3f1ec; --ink:#161616; --card:#fffcf8; --line:#e3dfd6; --blue:#161616; --orange:#8a4b12; }
  * { box-sizing: border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font:18px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select { font:17px/1.3 system-ui, sans-serif; color:inherit; }
  button, select, input { min-height:52px; border-radius:12px; border:1px solid var(--line); background:#fff; padding:8px 12px; }
  button { cursor:pointer; }
  button.primary { background:var(--ink); color:#fff; border-color:var(--ink); border-radius:999px; font-weight:680; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  .top { position:sticky; top:0; z-index:2; background:rgba(243,241,236,.92); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); display:flex; gap:6px; overflow:auto; padding:8px 10px; }

  select, input[type="number"], input[type="search"] { width:100%; max-width:520px; display:block; margin:6px 0; }
  .cart { position:sticky; top:72px; }
  .purpose { display:flex; align-items:center; min-height:72px; margin:8px 0 18px; padding:0 18px; border-radius:999px; background:#161616; color:#fff; text-decoration:none; font-weight:680; font-size:18px; }

  body.phone .eat-mid .muted { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  body.phone .x { min-width:44px; min-height:44px; border-radius:999px; }
  body.phone .eat-bar, body.phone .order-bar { position:fixed; left:0; right:0; bottom:0; display:flex; gap:12px; align-items:center; background:rgba(243,241,236,.94); backdrop-filter:blur(16px); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); z-index:3; }
  body.phone .order-bar button, body.phone .eat-bar button.primary { flex:1; background:#161616; color:#fff; border-color:#161616; border-radius:999px; min-height:56px; }
  .order-head { background:#161616; color:#fff; border-radius:20px; padding:18px; }
  .order-head p { margin:6px 0 0; color:#ddd; font:16px/1.35 system-ui, sans-serif; }
  #lock { position:fixed; inset:0; background:var(--bg); display:grid; place-items:center; z-index:6; padding:18px; }
  #lock form { width:min(420px,100%); }
  #lock[hidden] { display:none !important; }
  #printFrame { position:absolute; width:0; height:0; border:0; }
  @media (max-width:800px) { body.desk .layout { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>

<script>
const CATS = ["cpu","motherboard","memory","gpu","storage","case","cooler","psu"];
const LABEL = { cpu:"Processor", motherboard:"Motherboard", memory:"Memory", gpu:"Graphics card", storage:"Storage", case:"Case", cooler:"Cooler", psu:"Power supply" };
const GAMES = {
  Fortnite:{ low:[1,16], med:[2,16], high:[3,16], ult:[4,32] },
  "Counter-Strike 2":{ low:[1,16], med:[2,16], high:[3,16], ult:[4,16] },
  Roblox:{ low:[0,8], med:[1,16], high:[2,16], ult:[2,16] },
  "Rainbow Six Siege":{ low:[1,16], med:[2,16], high:[3,16], ult:[4,32] },
  "Apex Legends":{ low:[2,16], med:[2,16], high:[3,16], ult:[4,32] },
  "League of Legends":{ low:[0,8], med:[1,16], high:[2,16], ult:[2,16] },
  Minecraft:{ low:[0,8], med:[1,16], high:[2,16], ult:[3,16] },
  "Escape from Tarkov":{ low:[2,16], med:[3,32], high:[3,32], ult:[4,32] },
  Warzone:{ low:[2,16], med:[3,16], high:[3,32], ult:[4,32] },
  Valorant:{ low:[1,16], med:[2,16], high:[2,16], ult:[3,16] },
  "Call of Duty":{ low:[2,16], med:[3,16], high:[4,32], ult:[5,32] },
  "Diablo IV":{ low:[2,16], med:[3,16], high:[3,16], ult:[4,32] },
  "Halo Infinite":{ low:[2,16], med:[3,16], high:[4,16], ult:[5,32] },
  "World of Warcraft":{ low:[0,16], med:[2,16], high:[3,32], ult:[4,32] },
  "Age of Empires IV":{ low:[0,16], med:[2,16], high:[3,16], ult:[3,32] }
};
const JOBS = {
  School:{ gpu:0, ram:16, disk:"1TB", note:"School work does not need a separate graphics card." },
  Work:{ gpu:0, ram:16, disk:"1TB", note:"Office work runs on the processor's own graphics." },
  Photoshop:{ gpu:2, ram:32, disk:"1TB", note:"Photo work likes a lot of memory and a modest graphics card." },
  Premiere:{ gpu:3, ram:32, disk:"2TB", note:"Video editing likes a graphics card and a big SSD." },
  "After Effects":{ gpu:3, ram:32, disk:"1TB", note:"Motion work likes memory first, then a graphics card." },
  Streaming:{ gpu:3, ram:16, disk:"1TB", note:"Streaming likes a graphics card so the game and the broadcast can share the work." },
  "Netflix, YouTube, Twitch":{ gpu:0, ram:16, disk:"1TB", note:"Watching video does not need a separate graphics card." },
  "AutoCAD and Revit":{ gpu:3, ram:32, disk:"1TB", note:"Drawings want a graphics card. Large 3D models commonly want 32 GB. This is not an Autodesk certification." }
};
const FACTS = {
  cpu:["Processor","This part thinks. Programs run here.","It must match the motherboard."],
  motherboard:["Motherboard","The other parts plug into this board.","It must match the processor and the memory."],
  memory:["Memory","The desk the computer works on right now.","It must be the kind the board accepts, such as DDR4 or DDR5."],
  gpu:["Graphics card","This draws game pictures.","Not every computer needs one. Length is often missing from the list, so I will say when I cannot check the fit."],
  storage:["Storage","The filing cabinet. Files stay here when the power is off.","Start with an SSD."],
  case:["Case","The box.","The motherboard has to fit inside it."],
  cooler:["Cooler","Keeps the processor from getting too hot.","Some processors already include one."],
  psu:["Power supply","Feeds power to the parts.","Too small and the computer can shut off. Do not open this box."]
};
const money = new Intl.NumberFormat("en-CA",{style:"currency",currency:"CAD"});
let PARTS=[], byId={};
const state = load();
function load(){
  let s={};
  try { s=JSON.parse(localStorage.getItem("drew-easy-build")||"{}"); } catch(e){}
  s = Object.assign({ view:"home", layout:"desk", five:false, job:"School", game:"", level:"med", budget:800, accessories:false, power:"works", uses:["school"], priorities:["value"], owned:{}, ownedId:{}, unknown:{}, build:{}, why:{}, note:"", past:[], future:[], fans:null, asm:0, focus:"cpu" }, s);
  try {
    const cart = JSON.parse(localStorage.getItem("drew-cart") || "{}");
    if (cart && Object.keys(cart).length) s.build = cart;
  } catch (e) {}
  return s;
}
function save(){
  const c=JSON.parse(JSON.stringify(state)); delete c.past; delete c.future;
  try{ localStorage.setItem("drew-easy-build", JSON.stringify(c)); } catch(e){}
  try {
    const cart = {};
    CATS.forEach(function (id) { if (c.build && c.build[id]) cart[id] = c.build[id]; });
    localStorage.setItem("drew-cart", JSON.stringify(cart));
  } catch (e) {}
}
function junk(p){ return /open box|renewed|recertified|sodimm|surveillance|purple|laptop|\becc\b/i.test(p.name)||p.price<12; }

function sticksOf(p) {
  const n = (p && p.name) || "";
  const m = n.match(/\((\d+)\s*[x×]\s*\d+/i) || n.match(/\b(\d+)\s*[x×]\s*\d+\s*GB/i);
  return m ? +m[1] : 1;
}
function ramKindOf(p) {
  if (!p) return "";
  if (p.ram) return p.ram;
  const m = (p.name || "").toUpperCase().match(/DDR[2-5]/);
  if (m) return m[0];
  if (p.socket === "AM5" || p.socket === "LGA1851") return "DDR5";
  if (p.socket === "AM4") return "DDR4";
  return "";
}
function dimmSlots(board) {
  if (!board) return 4;
  const n = (board.name || "").toUpperCase();
  if (/2\s*DIMM/.test(n)) return 2;
  if (/4\s*DIMM/.test(n)) return 4;
  if (formOf(board) === "itx") return 2;
  return 4;
}
function needWatts(parts) {
  const tier = parts.gpu ? gpuTier(parts.gpu) : 0;
  return tier >= 4 ? 750 : tier >= 3 ? 650 : tier >= 2 ? 550 : tier ? 450 : 400;
}
function fitWhy(part, parts) {
  if (!part) return "That part is not on the list.";
  if (junk(part)) return "Laptop, open-box, and server parts are not offered.";
  const others = Object.assign({}, parts || {});
  delete others[part.cat];
  if (part.cat === "cpu" && others.motherboard && part.socket && others.motherboard.socket && part.socket !== others.motherboard.socket) {
    return "That processor is " + part.socket + " and this motherboard is " + others.motherboard.socket + ".";
  }
  if (part.cat === "motherboard" && others.cpu && part.socket && others.cpu.socket && part.socket !== others.cpu.socket) {
    return "That motherboard is " + part.socket + " and this processor is " + others.cpu.socket + ".";
  }
  if ((part.cat === "cpu" && others.motherboard) || (part.cat === "motherboard" && others.cpu)) {
    const cpu = part.cat === "cpu" ? part : others.cpu;
    const board = part.cat === "motherboard" ? part : others.motherboard;
    const a = ramKindOf(cpu), b = ramKindOf(board);
    if (a && b && a !== b) return "That processor wants " + a + " and the motherboard is " + b + ".";
  }
  if (part.cat === "memory") {
    if (/SODIMM|SO-DIMM|LAPTOP/i.test(part.name)) return "Laptop memory does not fit a desktop motherboard.";
    const kind = ramKindOf(part);
    const want = ramKindOf(others.motherboard) || ramKindOf(others.cpu);
    if (kind && want && kind !== want) return kind + " memory does not fit a " + want + " board.";
    const sticks = sticksOf(part);
    if (sticks !== 1 && sticks !== 2 && sticks !== 4) return "That kit is " + sticks + " sticks. These boards take 1, 2, or 4. Not " + sticks + ".";
    const slots = dimmSlots(others.motherboard);
    if (sticks > slots) return "That kit is " + sticks + " sticks and this board has " + slots + " memory slots.";
  }
  if (part.cat === "motherboard" && others.memory) {
    const kind = ramKindOf(others.memory), want = ramKindOf(part);
    if (kind && want && kind !== want) return "The memory already chosen is " + kind + " and that board is " + want + ".";
    const sticks = sticksOf(others.memory), slots = dimmSlots(part);
    if (sticks > slots) return "The memory kit is " + sticks + " sticks and that board has " + slots + " slots.";
  }
  if (part.cat === "case" && others.motherboard && formOf(part) && formOf(others.motherboard) && !fitsCase(part, others.motherboard)) {
    return "That case is too small for this motherboard.";
  }
  if (part.cat === "motherboard" && others.case && formOf(part) && formOf(others.case) && !fitsCase(others.case, part)) {
    return "This case is too small for that motherboard.";
  }
  if (part.cat === "psu" && others.gpu) {
    const w = wattOf(part), need = needWatts(others);
    if (w && w < need) return "That power supply is " + w + "W. This graphics card needs about " + need + "W.";
  }
  if (part.cat === "gpu" && others.psu) {
    const w = wattOf(others.psu), need = needWatts(Object.assign({}, others, { gpu: part }));
    if (w && w < need) return "This power supply is " + w + "W. That card needs about " + need + "W. Pick a bigger power supply first.";
  }
  return "";
}
function keepFitting(map) {
  const order = ["cpu", "motherboard", "memory", "case", "storage", "cooler", "gpu", "psu"];
  const kept = {};
  order.forEach((id) => {
    const part = map[id];
    if (part && !fitWhy(part, kept)) kept[id] = part;
  });
  return kept;
}

function gbOf(p){ const m=p.name.toUpperCase().match(/\b(4|8|16|32|64)GB\b/); return m?+m[1]:0; }
function wattOf(p){ if(!p) return 0; if(p.watt) return p.watt; const m=p.name.toUpperCase().match(/(\d{3,4})\s?W/); return m?+m[1]:0; }
function gpuTier(p){ const n=p.name.toUpperCase(); if(/5090|4090/.test(n)) return 6; if(/5080|4080|5070\s?TI|9070\s?XT/.test(n)) return 5; if(/\b5070\b|\b9070\b|4070/.test(n)) return 4; if(/5060|7600|4060/.test(n)) return 3; if(/3050|1650|6500/.test(n)) return 2; if(/1030/.test(n)) return 1; return 0; }
function formOf(p){ if(!p) return ""; if(p.form) return p.form; const n=p.name.toUpperCase(); if(/MICRO|MATX|M-ATX/.test(n)) return "matx"; if(/ITX/.test(n)) return "itx"; if(/E-?ATX|FULL/.test(n)) return "full"; if(/ATX/.test(n)) return "atx"; return ""; }
function fitsCase(box, board){ const r={itx:1,matx:2,atx:3,full:4,eatx:4}; return (r[formOf(box)]||3)>=(r[formOf(board)]||2); }
function pool(cat, pred){ return PARTS.filter(p=>p.cat===cat && !junk(p) && (!pred||pred(p))).sort((a,b)=>a.price-b.price); }
function gpuTarget(){
  if (state.game && GAMES[state.game]) return GAMES[state.game][state.level||"med"][0];
  if (state.job && JOBS[state.job]) return JOBS[state.job].gpu;
  return 0;
}
function ramTarget(){
  if (state.game && GAMES[state.game]) return GAMES[state.game][state.level||"med"][1];
  if (state.job && JOBS[state.job]) return JOBS[state.job].ram;
  return 16;
}
function diskTarget(){ return (state.job && JOBS[state.job] && JOBS[state.job].disk) || "1TB"; }
function boxBudget(variant){ let n=+state.budget||0; if(state.accessories) n=Math.max(0,n-250); if(variant<0) n*=0.8; return n; }
function fanInfo(part){
  if(!part) return null;
  const n=part.name;
  const manual=[
    { test:/pop xl air rgb/i, included:4, slots:6, source:"Fractal's Pop XL Air RGB page: 3 front fans and 1 rear fan in the box. Mounts are 3 front, 2 top, and 1 rear." },
    { test:/pop 2 air/i, included:3, slots:7, source:"Fractal's Pop 2 Air page: 3 front fans in the box. Mounts are 3 front, 3 top, and 1 rear." },
    { test:/pop air/i, included:3, slots:5, source:"Fractal's Pop Air page: 2 front fans and 1 rear fan in the box. Mounts are 2 front, 2 top, and 1 rear." },
    { test:/north momentum/i, included:3, slots:6, source:"Fractal's North Momentum page: 3 front fans in the box. Mounts are 3 front, 2 top, and 1 rear. North XL is a different case." },
    { test:/north(?! xl)/i, included:2, slots:8, source:"Fractal's North page: 2 front fans in the box. Mounts are 3 front, 2 top, 2 side, and 1 rear." },
    { test:/icue 4000d rgb/i, included:3, slots:8, source:"Corsair's iCUE 4000D RGB Airflow page: 3 fans in the box, and up to 8 spots for 120 mm fans. This is not the FRAME 4000D." },
    { test:/4000d airflow/i, included:2, slots:6, source:"Corsair's 4000D Airflow page: 2 fans in the box. Mounts are 3 front, 2 top, and 1 rear. This is not the FRAME 4000D." },
    { test:/lancool 216(?!\s*x)/i, included:3, slots:10, source:"Lian Li's Lancool 216 page: 2 front fans and 1 rear fan in the box, and a maximum of 10 fan spots." },
    { test:/cc-h51f[wb]-01/i, included:2, slots:6, source:"NZXT's H5 (2023) FAQ for model CC-H51F: 2 fans in the box. Mounts are 2 front, 2 top, 1 bottom, and 1 rear. A different H5 year is not counted." }
  ].find(row=>row.test.test(n));
  if(manual) return { included:manual.included, slots:manual.slots, known:true, source:manual.source };
  let included=null;
  const rules=[
    /(\d+)\s*x\s*[^,]{0,30}fans?\s*included/i,
    /(\d+)\s*fans?\s*included/i,
    /(\d+)\s*x\s*pre-installed/i,
    /(\d+)\s*pre-installed/i,
    /with\s+(\d+)\s*fans?/i,
    /(\d+)\s*[*x×]\s*.{0,40}?fans?\b/i,
    /(\d+)\s*fans?\b/i,
    /(\d+)F\b/
  ];
  for(const rule of rules){
    const m=n.match(rule);
    if(m){ included=+m[1]; break; }
  }
  return { included, slots:null, known:included!=null, source: included!=null ? "The product name states this fan count. It does not state how many spots the case has, so that number is not guessed." : "This listing does not include the fan page from the manual. No fan total is shown." };
}
function plan(variant){
  const cap=boxBudget(variant), want=gpuTarget(), out={}, why={};
  const owned=state.ownedId||{};
  function take(cat, part, reason){
    if(part && fitWhy(part, out)) part = pool(cat).find(p=>!fitWhy(p, out)) || null;
    if(part && !fitWhy(part, out)){ out[cat]=part; why[cat]=reason; }
  }
  if(owned.cpu&&byId[owned.cpu]) take("cpu", byId[owned.cpu], "You already have this processor.");
  else {
    const apu=pool("cpu",p=>/5500GT|5600GT|8500G|8600G|Graphics/i.test(p.name))[0];
    const plain=pool("cpu",p=>/Ryzen 5 5500 /.test(p.name))[0];
    const strong=pool("cpu",p=>/Ryzen 5 7600/.test(p.name))[0];
    const pick=want===0||cap<850?apu:(cap>=2400&&want>=3?strong:plain)||apu;
    take("cpu", pick, want===0?"The pictures can come from the processor, so you do not pay for a separate graphics card.":"This processor leaves money for the graphics card.");
  }
  if(!out.cpu) return {parts:{}, why:{}, note:"No processor in the parts list."};
  const socket=out.cpu.socket, ramKind=socket==="AM5"?"DDR5":"DDR4";
  if(owned.motherboard&&byId[owned.motherboard]) take("motherboard", byId[owned.motherboard], "You already have this motherboard.");
  else take("motherboard", pool("motherboard",p=>p.socket===socket&&(!p.ram||p.ram===ramKind))[0], "This board matches that processor.");
  const kind=(out.motherboard&&out.motherboard.ram)||ramKind;
  let gb=ramTarget(); if(cap<700) gb=Math.min(gb,8); if(variant<0) gb=Math.min(gb,16);
  const slots=dimmSlots(out.motherboard);
  const memPick=pool("memory",p=>p.ram===kind&&gbOf(p)===gb&&sticksOf(p)===2&&sticksOf(p)<=slots)[0]
    ||pool("memory",p=>p.ram===kind&&gbOf(p)>=8&&sticksOf(p)===2&&sticksOf(p)<=slots)[0]
    ||pool("memory",p=>p.ram===kind&&(sticksOf(p)===1||sticksOf(p)===2||sticksOf(p)===4)&&sticksOf(p)<=slots)[0];
  if(owned.memory&&byId[owned.memory]&&!fitWhy(byId[owned.memory], out)) take("memory", byId[owned.memory], "You already have this memory.");
  else take("memory", memPick, gb+" GB is the amount this job usually needs. The kit is 2 sticks when one exists, never 3 or 5.");
  const disk=cap<700?"512GB":diskTarget();
  if(owned.storage&&byId[owned.storage]) take("storage", byId[owned.storage], "You already have this drive.");
  else take("storage", pool("storage",p=>/SSD|NVME|M\.2/i.test(p.name)&&!/HDD|HARD DRIVE/i.test(p.name)&&p.name.toUpperCase().includes(disk))[0]||pool("storage",p=>/SSD|NVME/i.test(p.name))[0], "An SSD is the fast filing cabinet. Start here.");
  if(owned.case&&byId[owned.case]) take("case", byId[owned.case], "You already have this case.");
  else take("case", pool("case",p=>fitsCase(p,out.motherboard))[0], "This box fits the motherboard.");
  if(want>0){
    const maxTier=Math.max(1, want+(variant>0?1:0));
    const cards=pool("gpu",p=>{const t=gpuTier(p); return t>=1&&t<=maxTier;}).sort((a,b)=>gpuTier(b)-gpuTier(a)||a.price-b.price);
    const room=Math.max(80, cap-Object.values(out).reduce((s,p)=>s+p.price,0)-80);
    const card=owned.gpu&&byId[owned.gpu]?byId[owned.gpu]:(cards.find(p=>p.price<=room)||(cap>=900?cards[cards.length-1]:null));
    take("gpu", card, "This graphics card matches the game or program you picked, using the parts list, not a lab test.");
  } else if(owned.gpu&&byId[owned.gpu]) take("gpu", byId[owned.gpu], "You already have this graphics card. This job may not need it.");
  const tier=out.gpu?gpuTier(out.gpu):0;
  const needW=tier>=4?750:tier>=3?650:tier>=2?550:tier?450:400;
  if(owned.psu&&byId[owned.psu]) take("psu", byId[owned.psu], "You already have this power supply.");

function checks(parts){

  }
  if(parts.memory&&parts.motherboard){
    if(parts.memory.ram&&parts.motherboard.ram&&parts.memory.ram!==parts.motherboard.ram) add("bad","memory","This memory is "+parts.memory.ram+" and the motherboard wants "+parts.motherboard.ram+".");
    else if(!parts.memory.ram||!parts.motherboard.ram) add("warn","memory","Memory type is missing, so the match is not verified.");
    else add("ok","memory","Memory type matches ("+parts.memory.ram+").");
  }
  if(parts.case&&parts.motherboard){
    if(formOf(parts.case)&&formOf(parts.motherboard)&&!fitsCase(parts.case, parts.motherboard)) add("bad","case","This case is smaller than the motherboard.");
    else if(!formOf(parts.case)||!formOf(parts.motherboard)) add("warn","case","A size is missing, so case fit is not verified.");
    else add("ok","case","Motherboard size fits this case.");
  }

  if(parts.storage&&/NVME|M\.2/i.test(parts.storage.name)) add("warn","storage","M.2 slot count is not in the parts list, so the drive fit is not verified.");

    "| SSD  "+bit("storage",0.52,"==>","   ")+"       |",

  if(info&&info.slots!=null){
    const have=state.fans==null?info.included:state.fans;
    app.append(el("p",{text:"Fans "+have+"/"+info.slots+(have>info.slots?" · "+(have-info.slots)+" extra":"")}));
  } else if(info&&info.included!=null) app.append(el("p",{text:"Fans in the box: "+info.included+". Spot count is not in the listing."}));
  else if(info) app.append(el("p",{text:"Fan count is not in this listing. Nothing was guessed."}));
  app.append(el("p",{class:"muted", text:"Subtotal "+money.format(totalOf(parts))+". Tax and shipping are added by the store, not here."}));
  const bar=el("div",{class:"order-bar"});
  bar.append(el("button",{type:"button", text:"Back", onclick:()=>{ state.view="dash"; render(); }}), el("button",{class:"primary", type:"button", text:"Print scanner code", onclick:printReceipt}));
  app.appendChild(bar);
}
function viewExplore(app){
  const id=state.focus||"cpu";
  app.append(el("h1",{text:FACTS[id][0]}), el("p",{text:FACTS[id][1]+" "+FACTS[id][2]}));
  banner(app);
  const jump=el("div",{class:"row"});
  CATS.forEach(k=> jump.appendChild(el("button",{type:"button", class:k===id?"primary":"", text:LABEL[k], onclick:()=>{ state.focus=k; render(); }})));
  app.appendChild(jump);
  const sel=el("select",{"aria-label":"Parts"});
  const choices=fitting(id);
  if(!choices.length) sel.appendChild(el("option",{value:"", text:"Nothing else fits this computer"}));
  choices.slice(0,80).forEach(p=> sel.appendChild(el("option",{value:p.id, text:p.name+(id==="memory"?" · "+sticksOf(p)+" sticks":"")+" — "+money.format(p.price)})));
  sel.onchange=()=>{ if(!sel.value||!byId[sel.value]) return; const why=fitWhy(byId[sel.value], selected()); if(why){ state.note=why; return; } pushHist(); state.build[id]=sel.value; state.why[id]="You picked this from the parts list."; state.note=""; state.view="dash"; render(); };
  app.appendChild(sel);
}
function viewCompare(app){
  app.append(el("h1",{text:"Three ways to spend the money"}));
  banner(app);
  const grid=el("div",{class:"layout"});
  [["Cheaper",plan(-1)],["The one I would write down",plan(0)],["Stronger",plan(1)]].forEach(([name,p])=>{
    const card=el("article",{class:"card"});
    const total=Object.values(p.parts).reduce((s,part)=>s+part.price,0);
    card.append(el("h2",{text:name}), el("p",{class:"price", text:money.format(total)}), el("p",{text:p.note||""}));
    CATS.forEach(id=>{ if(p.parts[id]) card.appendChild(el("p",{class:"muted", text:LABEL[id]+": "+p.parts[id].name})); });
    card.appendChild(el("button",{class:"primary", type:"button", text:"Use this list", onclick:()=>{ applyPlan(p); state.view="dash"; render(); }}));
    grid.appendChild(card);
  });
  app.appendChild(grid);
}
function viewAsm(app){
  const parts=selected();
  const steps=[
    "Clear a table. Do not open the power supply.",
    "Touch the metal of the case before you pick up a part.",
    "Set the processor in its socket. If it does not drop in flat, stop. Do not force it.",
    parts.memory?"Click the memory in until both ends latch.":"Add memory before the first start.",
    parts.storage&&/NVME|M\.2/i.test(parts.storage.name)?"Lay the NVMe drive flat in its slot and screw it down. Do not bend it.":"Screw the SSD into its bay.",
    "Screw the motherboard onto the standoffs. Do not let it sit on loose screws.",
    "Mount the power supply. Leave it closed.",
    parts.gpu?"Seat the graphics card until the latch clicks, then screw the bracket. If it does not slide in, stop.":"This list has no separate graphics card.",
    "Plug in the power cables the manuals show. If a plug does not fit, do not bend the pins.",
    parts.cooler?"Mount the cooler the way its sheet shows.":"Use the cooler that came with the processor.",
    fanLine(parts.case),
    "Look once more, then turn it on. If it stays dark, turn it off and recheck the cables.",
    "Install the system from a source you trust."
  ].filter(Boolean);
  app.append(el("h1",{text:"Put it together"}), el("p",{class:"muted", text:"Step "+(state.asm+1)+" of "+steps.length+". Stop any time."}), el("p",{text:steps[Math.min(state.asm, steps.length-1)]}));
  const row=el("div",{class:"row"});
  if(state.asm>0) row.appendChild(el("button",{type:"button", text:"Back", onclick:()=>{ state.asm--; render(); }}));
  if(state.asm<steps.length-1) row.appendChild(el("button",{class:"primary", type:"button", text:"Next", onclick:()=>{ state.asm++; render(); }}));
  app.appendChild(row);
}
function fanLine(casePart){
  if(!casePart) return "Pick a case before counting fans.";
  const info=fanInfo(casePart);
  const have=state.fans==null?(info.included||0):state.fans;
  if(info.slots!=null){
    if(have>info.slots) return "You listed "+have+" fans and the manual has "+info.slots+" spots. Leave the extra fans out.";
    return "Fan spots from the manual: "+have+" of "+info.slots+".";
  }
  if(info.included!=null) return "The listing says "+info.included+" fan"+(info.included===1?"":"s")+" come in the box. It does not say how many spots, so that is not guessed.";
  return "This case listing does not include the fan page. No number is guessed.";
}
document.querySelectorAll("[data-go]").forEach(btn=> btn.onclick=()=>{ state.view=btn.getAttribute("data-go"); render(); });
document.getElementById("phoneBtn").onclick=()=> setLayout("phone");
document.getElementById("deskBtn").onclick=()=> setLayout("desk");
document.getElementById("lockForm").onsubmit=(event)=>{
  event.preventDefault();
  if(document.getElementById("lockPass").value==="Password3"){ sessionStorage.setItem("drew-easy","1"); boot(); }
  else document.getElementById("lockBad").textContent="Wrong password";
};
function boot(){
  document.getElementById("lock").hidden=true;
  state.layout=preferredLayout();
  fetch("parts.json").then(r=>r.json()).then(data=>{
    PARTS=data; data.forEach(p=>{ byId[p.id]=p; });
    const hash=location.hash.replace("#","");
    if(hash) hash.split(",").forEach(id=>{ if(byId[id]) state.build[byId[id].cat]=id; });
    sanitize();
    render();
  }).catch(()=>{ document.getElementById("app").textContent="The parts list did not load."; });
}
if(sessionStorage.getItem("drew-easy")==="1") boot();
</script>
</body>
</html>
