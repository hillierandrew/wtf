<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DREW.WTF</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Comic+Neue:wght@700&family=Courier+Prime:wght@700&family=Fira+Code:wght@700&family=Noto+Sans+SC:wght@900&family=Noto+Sans+Devanagari:wght@900&family=Orbitron:wght@900&family=Permanent+Marker&family=Press+Start+2P&family=Russo+One&family=VT323&display=swap" rel="stylesheet">

  <!-- SVG Distortion Filter for Swirl & Trip Phases -->
  <svg style="position: absolute; width: 0; height: 0;">
    <filter id="swirl-filter">
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="35" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <style>
    :root {
      --crt-red: #ff1111;
      --crt-dim: #660000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      background-color: #000;
      color: var(--crt-red);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Main Multi-Mode Background Canvas */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      height: 100dvh;
      z-index: 1;
      display: block;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    #bg-canvas.active { opacity: 1; }

    /* Vignette & Scanlines */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.92) 100%);
      pointer-events: none !important;
      z-index: 10;
    }

    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(20, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 4px;
      pointer-events: none !important;
      z-index: 11;
    }

    .container {
      text-align: center;
      z-index: 50;
      padding: 10px;
      max-width: 92vw;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      pointer-events: none;
    }

    .title {
      font-size: clamp(1.2rem, 6vw, 4.5rem);
      font-weight: bold;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px var(--crt-red), 0 0 25px var(--crt-dim), 0 0 40px #ff0000;
      animation: flicker 0.12s infinite;
      min-height: 1.2em;
      display: inline-block;
      white-space: nowrap;
      transition: filter 0.3s ease, color 0.3s ease, text-shadow 0.3s ease, font-family 0.2s ease;
    }

    .clickable-word {
      cursor: pointer;
      display: inline-block;
      pointer-events: auto;
      padding: 0 4px;
    }

    .clickable-word:active {
      transform: scale(0.92);
      filter: brightness(1.8);
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    /* POSSESSED VISITOR COUNTER (Top Right) */
    .visitor-counter {
      position: fixed;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(16px, env(safe-area-inset-right, 16px));
      z-index: 999999;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #ff3333;
      background: rgba(10, 0, 0, 0.9);
      border: 2px solid #ff1111;
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      user-select: none;
      pointer-events: none;
      letter-spacing: 0.1em;
    }

    /* UNIFIED BOTTOM UI CONTAINER */
    .bottom-ui-container {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      width: clamp(280px, 85vw, 420px);
    }

    .ui-box {
      width: 100%;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 20px;
      font-weight: 900;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      letter-spacing: 0.08em;
      user-select: none;
      -webkit-user-select: none;
      padding: 16px 24px;
      border-radius: 40px;
      background-color: rgba(15, 15, 15, 0.95);
      border: 3px solid rgba(255, 255, 255, 0.85);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.95), 0 0 15px rgba(255, 255, 255, 0.3);
      text-align: center;
      white-space: nowrap;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .audio-btn {
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .audio-btn:active {
      transform: scale(0.95);
      background-color: rgba(255, 255, 255, 0.3);
    }

    .phase-watermark {
      pointer-events: none;
    }

    /* TRIP & OS ANIMATION ENGINE STYLES */
    .swirl-trip { filter: url(#swirl-filter) !important; }
    .spin { animation: spin-hue 3s linear infinite !important; }
    @keyframes spin-hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    .liquid-wave { animation: flicker 0.12s infinite, liquid 1.8s ease-in-out infinite alternate !important; }
    @keyframes liquid {
      0% { letter-spacing: 0.1em; }
      100% { letter-spacing: 0.3em; filter: blur(2px) contrast(200%); }
    }

    .pulse-glow { animation: flicker 0.12s infinite, glow 0.8s ease-in-out infinite alternate !important; }
    @keyframes glow { 0% { filter: brightness(1); } 100% { filter: brightness(2) drop-shadow(0 0 30px #ffffff); } }

    .slice-glitch { animation: slice 0.2s steps(2) infinite !important; }
    @keyframes slice {
      0% { clip-path: inset(0 0 0 0); }
      50% { clip-path: inset(20% 0 30% 0); }
      100% { clip-path: inset(60% 0 10% 0); }
    }

    .salvia-split {
      text-shadow: -15px 0 0 #ff00ff, 15px 0 0 #00ffff, 0 15px 0 #00ff00 !important;
      animation: salvia 0.1s infinite alternate;
    }
    @keyframes salvia {
      0% { transform: skewX(-10deg) scale(0.9); }
      100% { transform: skewX(10deg) scale(1.1); }
    }
  </style>
</head>
<body>

  <!-- Visitor Counter -->
  <div id="visitor-box" class="visitor-counter">VISITS: 00666</div>

  <!-- Main Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Main Title Container -->
  <div id="main-container" class="container">
    <div id="scramble-text" class="title">
      <span id="word-drew" class="clickable-word" onclick="handleDrewClick(event)">DREW</span><span id="word-dot" class="clickable-word" onclick="handleDotClick(event)">.</span><span id="word-wtf" class="clickable-word" onclick="handleWtfClick(event)">WTF</span>
    </div>
  </div>

  <!-- Bottom UI Controls -->
  <div class="bottom-ui-container">
    <button id="audio-toggle" class="ui-box audio-btn" onclick="toggleAudio(event)">🔇 UNMUTE MUSIC</button>
    <div id="phase-badge" class="ui-box phase-watermark">
      PHASE NO. 0
    </div>
  </div>

  <script>
    /* --- FULL SHEET MUSIC TRANSCRIBED WEB AUDIO ENGINE --- */
    let audioCtx = null;
    let isPlaying = false;
    let nextNoteTime = 0;
    let timerID = null;
    let currentStep = 0;

    const freqs = {
      'C2': 65.41, 'E2': 82.41, 'G2': 98.00, 'G#2': 103.83, 'A2': 110.00, 'B2': 123.47,
      'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'B5': 987.77,
      'C6': 1046.50, 'C#6': 1108.73, 'D6': 1174.66, 'D#6': 1244.51, 'E6': 1318.51, 'F6': 1396.91, 'F#6': 1479.98, 'G6': 1567.98, 'G#6': 1661.22, 'A6': 1760.00, 'B6': 1975.53
    };

    // Right-Hand Ostinato: C6 -> G5 -> B5 -> F#5[cite: 1]
    const track1Ostinato = ['C6', 'G5', 'B5', 'F#5'];

    // Left-Hand Score Transcription[cite: 1]
    const track2Harmony = [
      null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,
      'C4', 'G3', 'F#3', 'B3', 'C4', 'G3', 'F#3', 'B3', 'C4', 'G3', 'B3', 'F#3', 'C4', 'B3', 'G3', 'C4',
      'C4', 'G3', 'F#3', 'B3', 'C4', 'G3', 'F#3', 'B3', 'C4', 'G3', 'B3', 'F#3', 'C4', 'B3', 'G3', 'C4',
      'G3', 'F#3', 'B3', 'C4', 'G3', 'F#3', 'B3', 'C4', 'G3', 'B3', 'F#3', 'C4', 'G3', 'B3', 'F#3', 'C4'
    ];

    function playNote(freq, startTime, duration, waveType = 'square', gainLevel = 0.06) {
      if (!freq || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(gainLevel, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration - 0.01);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      } catch(e) {}
    }

    function scheduleMultiTrackLoop() {
      if (!isPlaying || !audioCtx) return;
      const lookAhead = 0.1;
      const scheduleAheadTime = 0.2;
      const eighthNoteTime = (60.0 / 120) / 2; // 120 BPM tempo[cite: 1]

      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        const t1Note = track1Ostinato[currentStep % track1Ostinato.length];
        if (freqs[t1Note]) playNote(freqs[t1Note], nextNoteTime, eighthNoteTime * 0.85, 'square', 0.05);

        if (currentStep % 2 === 0) {
          const t2Index = Math.floor(currentStep / 2) % track2Harmony.length;
          const t2Note = track2Harmony[t2Index];
          if (t2Note && freqs[t2Note]) playNote(freqs[t2Note], nextNoteTime, eighthNoteTime * 1.8, 'square', 0.08);
        }

        nextNoteTime += eighthNoteTime;
        currentStep++;
      }
      timerID = setTimeout(scheduleMultiTrackLoop, lookAhead * 1000);
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      const btn = document.getElementById("audio-toggle");
      if (!isPlaying) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        nextNoteTime = audioCtx.currentTime + 0.05;
        currentStep = 0;
        isPlaying = true;
        btn.textContent = '🔊 MUTE MUSIC';
        scheduleMultiTrackLoop();
      } else {
        isPlaying = false;
        if (timerID) clearTimeout(timerID);
        btn.textContent = '🔇 UNMUTE MUSIC';
      }
    }

    /* --- BRAND WEBFONTS --- */
    const companyFonts = [
      { font: "'Press Start 2P', monospace" },
      { font: "'Orbitron', sans-serif" },
      { font: "'Russo One', sans-serif" },
      { font: "'Permanent Marker', cursive" },
      { font: "'Cinzel', serif" },
      { font: "'Comic Neue', cursive" },
      { font: "'VT323', monospace" },
      { font: "'Fira Code', monospace" },
      { font: "'Courier Prime', monospace" },
      { font: "'Noto Sans SC', sans-serif" },
      { font: "'Noto Sans Devanagari', sans-serif" },
      { font: "'Courier New', Courier, monospace" }
    ];

    /* --- CANVAS BACKGROUND MULTI-MODE ENGINE --- */
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    let particles = [];
    const numParticles = 550;
    let width, height, cx, cy;
    let warpSpeed = 4;
    let renderMode = "stars";
    let reverseWarp = false;
    let globalAngle = 0;

    const mEmojis = ["🍄", "🍆", "✨", "💫"];
    const dEmojis = ["😈", "👿", "🔥", "⚡", "666"];
    const sEmojis = ["💀", "☠️", "☣️", "🟢"];
    const flowerEmojis = ["🌸", "🌺", "🌼", "🌻", "☁️", "✨"];
    const catEmojis = ["🐱", "🙀", "😸", "🐾"];
    const dogEmojis = ["🐕", "🦮", "🐩", "🦴"];

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }

    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = initial ? Math.random() * width : width;
        this.pz = this.z;
        this.mE = mEmojis[Math.floor(Math.random() * mEmojis.length)];
        this.dE = dEmojis[Math.floor(Math.random() * dEmojis.length)];
        this.sE = sEmojis[Math.floor(Math.random() * sEmojis.length)];
        this.flE = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
        this.cE = catEmojis[Math.floor(Math.random() * catEmojis.length)];
        this.dogE = dogEmojis[Math.floor(Math.random() * dogEmojis.length)];
      }

      update() {
        this.pz = this.z;
        if (reverseWarp) {
          this.z += warpSpeed;
          if (this.z >= width) this.reset(false);
        } else {
          this.z -= warpSpeed;
          if (this.z <= 0) this.reset(false);
        }
      }

      draw() {
        const sx = (this.x / this.z) * cx + cx;
        const sy = (this.y / this.z) * cy + cy;

        if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) {
          if (renderMode === "flowers") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 42)}px serif`;
            ctx.fillText(this.flE, sx, sy);
          } else if (renderMode === "cats") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.cE, sx, sy);
          } else if (renderMode === "dogs") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.dogE, sx, sy);
          } else if (renderMode === "mushrooms") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.mE, sx, sy);
          } else if (renderMode === "devils") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 40)}px serif`;
            ctx.fillText(this.dE, sx, sy);
          } else {
            const alpha = Math.min(1, (1 - this.z / width) * 1.8);
            const size = (1 - this.z / width) * 3;
            ctx.strokeStyle = renderMode === "tron" ? `rgba(0, 240, 255, ${alpha})` : `rgba(255, 17, 17, ${alpha})`;
            ctx.lineWidth = Math.max(0.5, size);
            ctx.beginPath();
            ctx.moveTo((this.x / this.pz) * cx + cx, (this.y / this.pz) * cy + cy);
            ctx.lineTo(sx, sy);
            ctx.stroke();
          }
        }
      }
    }

    function initParticles() {
      resizeCanvas();
      particles = [];
      for (let i = 0; i < numParticles; i++) particles.push(new Particle());
    }

    function drawCustomBackgrounds() {
      globalAngle += 0.02;

      if (renderMode === "tron") {
        // TRON Cyber Grid Mode
        ctx.fillStyle = "rgba(0, 5, 20, 0.3)";
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = "rgba(0, 240, 255, 0.4)";
        ctx.lineWidth = 1.5;
        const horizon = height * 0.55;

        // Perspective Floor Grid
        for (let x = -width; x < width * 2; x += 80) {
          ctx.beginPath();
          ctx.moveTo(x, height);
          ctx.lineTo(cx + (x - cx) * 0.1, horizon);
          ctx.stroke();
        }
        for (let y = horizon; y < height; y += 20) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      } else if (renderMode === "spiral") {
        // Hypnotic Trippy Spiral Mode
        ctx.fillStyle = "rgba(10, 0, 15, 0.2)";
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(globalAngle);
        for (let i = 0; i < 360; i += 15) {
          const rad = i * Math.PI / 180;
          ctx.strokeStyle = `hsl(${(i + globalAngle * 50) % 360}, 100%, 50%)`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, i * 1.5, rad, rad + 0.5);
          ctx.stroke();
        }
        ctx.restore();
      } else {
        // Default Starfield Particles
        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.fillRect(0, 0, width, height);

        for (let p of particles) {
          p.update();
          p.draw();
        }
      }
    }

    function animateCanvas() {
      drawCustomBackgrounds();
      requestAnimationFrame(animateCanvas);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    initParticles();

    /* --- POSSESSED ROLLING VISITOR COUNTER ENGINE --- */
    const visitorBox = document.getElementById("visitor-box");
    function runPossessedCounter() {
      setInterval(() => {
        if (Math.random() < 0.2) {
          visitorBox.textContent = "VISITS: 00666";
          visitorBox.style.color = "#ff0000";
          visitorBox.style.borderColor = "#ff0000";
        } else {
          const randVal = Math.floor(Math.random() * 99999).toString().padStart(5, '0');
          visitorBox.textContent = `VISITS: ${randVal}`;
          visitorBox.style.color = "#ff3333";
          visitorBox.style.borderColor = "#ff1111";
        }
      }, 150);
    }
    runPossessedCounter();

    const darkColors = [
      "#000000", "#120000", "#00051a", "#10001a", 
      "#001a0a", "#1a1200", "#12001a", "#051015", "#1c0d02", "#150022"
    ];

    /* --- 300 PROCEDURAL WACKY & POSSESSED PHASE ENGINE --- */
    let currentPhase = 0;
    let phaseTimer = null;
    let activeWordLeft = "DREW";
    let activeWordRight = "WTF";

    const customTextVariants = [
      ["DREW", "WTF"], ["MUTHUR", "6000"], ["MEOW", "PURR"], ["DOGE", "WOW"],
      ["TRON", "GRID"], ["HEAVEN", "ANGEL"], ["DEMON", "POSSESSED"], ["666", "EVIL"],
      ["ACID", "TRIP"], ["SALVIA", "SPLIT"], ["APPLE", "MAC"], ["MSDOS", "PROMPT"],
      ["SHROOM", "LSD"], ["DR3W", "W7F"], ["VOID", "NULL"], ["HELL", "MODE"]
    ];

    function setPhase(p) {
      currentPhase = p;
      if (currentPhase > 300) currentPhase = 0;
      if (currentPhase < 0) currentPhase = 300;

      const el = document.getElementById("scramble-text");
      const badge = document.getElementById("phase-badge");
      
      badge.textContent = `PHASE NO. ${currentPhase}`;

      const randomFont = companyFonts[Math.floor(Math.random() * companyFonts.length)];
      el.style.fontFamily = randomFont.font;

      const themeBg = darkColors[currentPhase % darkColors.length];
      document.body.style.backgroundColor = themeBg;
      document.body.style.filter = "none";
      el.className = "title";
      el.style.color = "";
      el.style.filter = "";
      el.style.textShadow = "";
      renderMode = "stars";
      reverseWarp = false;
      canvas.classList.add("active");

      if (currentPhase === 0) {
        activeWordLeft = "DREW";
        activeWordRight = "WTF";
        canvas.classList.remove("active");
        return;
      }

      const variant = customTextVariants[currentPhase % customTextVariants.length];
      activeWordLeft = variant[0];
      activeWordRight = variant[1];
      warpSpeed = (currentPhase % 30) + 2;

      // 300-Phase Multi-Mode Engine
      if (currentPhase % 18 === 0) {
        // TRON Cyber Grid Mode
        renderMode = "tron";
        el.style.color = "#00f0ff";
        el.style.fontFamily = "'Orbitron', sans-serif";
        el.style.textShadow = "0 0 20px #00f0ff";
      } else if (currentPhase % 16 === 0) {
        // Heavenly Flowers Mode
        renderMode = "flowers";
        document.body.style.backgroundColor = "#0d1a0d";
        el.style.color = "#ffb6c1";
        el.style.textShadow = "0 0 15px #ffb6c1";
      } else if (currentPhase % 14 === 0) {
        // Possessed Demonic Evil Mode
        renderMode = "devils";
        document.body.style.backgroundColor = "#1a0000";
        el.style.color = "#ff0000";
        el.style.textShadow = "0 0 30px #ff0000, 0 0 60px #880000";
        el.classList.add("slice-glitch");
      } else if (currentPhase % 12 === 0) {
        // Hypnotic Spiral Trip
        renderMode = "spiral";
      } else if (currentPhase % 10 === 0) {
        // Salvia Split
        el.classList.add("salvia-split");
      } else if (currentPhase % 8 === 0) {
        // Cat Chaos
        renderMode = "cats";
        el.style.color = "#ff69b4";
      } else if (currentPhase % 7 === 0) {
        // Doge Overdrive
        renderMode = "dogs";
        el.style.color = "#ffdd55";
      } else if (currentPhase % 5 === 0) {
        // Liquid LSD Wave
        el.classList.add("liquid-wave");
        el.style.color = "#ff00ff";
      } else if (currentPhase % 3 === 0) {
        el.classList.add("pulse-glow");
      } else {
        reverseWarp = currentPhase % 2 === 0;
      }
    }

    function prevPhase() {
      currentPhase--;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function nextPhase() {
      currentPhase++;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function randomPhase() {
      let rand = Math.floor(Math.random() * 300) + 1;
      setPhase(rand);
      resetPhaseTimer();
    }

    function resetPhaseTimer() {
      if (phaseTimer) clearInterval(phaseTimer);
      phaseTimer = setInterval(() => {
        currentPhase++;
        setPhase(currentPhase);
      }, 5000);
    }

    /* --- WORD NAVIGATION HANDLERS --- */
    function handleDrewClick(e) {
      if (e) e.stopPropagation();
      prevPhase();
    }

    function handleWtfClick(e) {
      if (e) e.stopPropagation();
      nextPhase();
    }

    function handleDotClick(e) {
      if (e) e.stopPropagation();
      randomPhase();
    }

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".clickable-word") || e.target.closest(".audio-btn")) return;
      const centerY = window.innerHeight / 2;
      if (e.clientY < centerY) {
        prevPhase();
      } else {
        nextPhase();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") {
        nextPhase();
      } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
        prevPhase();
      }
    });

    const wordDrewEl = document.getElementById("word-drew");
    const wordWtfEl = document.getElementById("word-wtf");

    const intlGlitchChars = [
      "0","1","3","7","_","/#","\\|","@","$","%","*","!",
      "中","文","鬼","魔","神","龍","悟",
      "अ","आ","इ","उ","ऋ","क","ख",
      "Д","Р","Е","В","У","Ш","К",
      "🔥","💀","😈","☣️","🟢","🛸","👽","🌸","🐱","🐕","666"
    ];

    function runScrambleCycle() {
      wordDrewEl.textContent = activeWordLeft;
      wordWtfEl.textContent = activeWordRight;
      setTimeout(() => {
        let frame = 0;
        const interval = setInterval(() => {
          wordDrewEl.textContent = activeWordLeft.split('').map(c => 
            Math.random() < 0.4 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c
          ).join('');
          wordWtfEl.textContent = activeWordRight.split('').map(c => 
            Math.random() < 0.4 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c
          ).join('');
          frame++;
          if (frame >= 15) {
            clearInterval(interval);
            wordDrewEl.textContent = activeWordLeft;
            wordWtfEl.textContent = activeWordRight;
            runScrambleCycle();
          }
        }, 40);
      }, 1800);
    }

    setPhase(0);
    resetPhaseTimer();
    animateCanvas();
    runScrambleCycle();
  </script>
</body>
</html>
