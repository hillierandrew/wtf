<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>lol 404 come back later</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    overflow-x: hidden;
    color: #2a160c;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: #ffb067;
  }
  .world {
    min-height: 100dvh;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 18%, #fff4c8 0%, transparent 28%),
      linear-gradient(#ffd36a 0%, #ff8a4a 38%, #7ec8ff 70%, #5aa7e6 100%);
  }
  .sun {
    position: absolute;
    left: 50%;
    top: 8%;
    width: 140px;
    height: 140px;
    margin-left: -70px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff, #ffe56a 40%, #ff9a3c 72%);
    box-shadow: 0 0 60px 20px #ffd36a88;
    animation: pulse 3.4s ease-in-out infinite;
  }
  .cloud {
    position: absolute;
    height: 46px;
    background: #fff;
    border-radius: 40px;
    opacity: 0.9;
    filter: drop-shadow(0 8px 0 #ffffff55);
    animation: drift 22s linear infinite;
  }
  .cloud:before, .cloud:after {
    content: "";
    position: absolute;
    background: #fff;
    border-radius: 50%;
  }
  .cloud:before { width: 42px; height: 42px; left: 16px; top: -20px; }
  .cloud:after { width: 58px; height: 50px; right: 18px; top: -26px; }
  .c1 { width: 140px; top: 12%; left: -20%; animation-duration: 28s; }
  .c2 { width: 100px; top: 22%; left: 70%; animation-duration: 34s; animation-delay: -8s; }
  .hill {
    position: absolute;
    left: -10%;
    right: -10%;
    bottom: -30px;
    height: 34%;
    background: radial-gradient(120% 90% at 50% 0%, #8dce63, #3e8d3a 70%);
    border-radius: 50% 50% 0 0;
  }
  .cast {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .cpu {
    position: absolute;
    width: 74px;
    height: 74px;
    animation: hop 1.6s ease-in-out infinite;
  }
  .die {
    width: 58px;
    height: 58px;
    margin: 8px auto 0;
    border-radius: 12px;
    background: linear-gradient(160deg, #6d7dff, #2a2e86 60%, #171433);
    box-shadow: inset 0 6px 0 #9aa6ff, 0 10px 0 #1b3a1a;
    position: relative;
  }
  .die i, .die b {
    position: absolute;
    top: 18px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    box-shadow: inset 0 -2px 0 #222;
  }
  .die i { left: 12px; }
  .die b { right: 12px; }
  .die i:after, .die b:after {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #1a1a1a;
    left: 3px;
    top: 3px;
  }
  .smile {
    position: absolute;
    left: 18px;
    bottom: 12px;
    width: 20px;
    height: 10px;
    border-bottom: 3px solid #ffe56a;
    border-radius: 0 0 12px 12px;
  }
  .pins:before, .pins:after {
    content: "";
    position: absolute;
    left: 16px;
    right: 16px;
    height: 8px;
    background: repeating-linear-gradient(90deg, #d7dde8 0 4px, transparent 4px 8px);
  }
  .pins:before { top: 0; }
  .pins:after { bottom: 0; }
  .sign {
    position: absolute;
    transform-origin: 50% 100%;
    animation: sway 2.4s ease-in-out infinite;
  }
  .board {
    background: #fff8e8;
    color: #7a2e12;
    border: 4px solid #6b3a1f;
    border-radius: 10px;
    padding: 6px 8px;
    font-weight: 800;
    font-size: 13px;
    text-align: center;
    box-shadow: 4px 4px 0 #6b3a1f;
    max-width: 120px;
  }
  .pole {
    width: 8px;
    height: 54px;
    margin: -2px auto 0;
    background: linear-gradient(#c9844a, #6b3a1f);
    border-radius: 4px;
  }
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 28px 16px 36px;
  }
  .tweet {
    width: min(460px, 100%);
    background: #fff;
    color: #111;
    border-radius: 22px;
    padding: 16px 16px 14px;
    box-shadow: 0 18px 0 #e7b15a, 0 28px 40px #0003;
    animation: floaty 3.2s ease-in-out infinite;
  }
  .who { display: flex; gap: 10px; align-items: center; }
  .ava {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #111 42%);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    flex: none;
  }
  .who b { display: block; font-size: 16px; }
  .who span { color: #667; font-size: 14px; }
  .tweet p {
    margin: 12px 0 0;
    font-size: clamp(20px, 5.2vw, 26px);
    line-height: 1.25;
    font-weight: 750;
  }
  .banner {
    margin: 0;
    text-align: center;
    font-weight: 900;
    letter-spacing: -0.03em;
    font-size: clamp(28px, 8vw, 54px);
    line-height: 0.95;
    color: #fff;
    text-shadow: 0 4px 0 #c2410c, 0 10px 0 #7c2d12aa;
    animation: wiggle 1.1s ease-in-out infinite;
  }
  .banner small {
    display: block;
    margin-top: 6px;
    font-size: 0.46em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .soon {
    margin: 0;
    font-size: 20px;
    font-weight: 800;
    color: #fff8e8;
    animation: blink 1.4s steps(2, end) infinite;
  }
  button {
    border: 0;
    border-radius: 999px;
    min-height: 56px;
    min-width: 140px;
    padding: 0 22px;
    font: inherit;
    font-weight: 900;
    font-size: 20px;
    color: #3a2208;
    background: linear-gradient(#fff6c8, #ffc94a);
    box-shadow: 0 8px 0 #c47a12, 0 14px 20px #0003;
    cursor: pointer;
  }
  button:active { transform: translateY(4px); box-shadow: 0 4px 0 #c47a12; }
  button.on { background: linear-gradient(#fff, #9d7cff); color: #1a1030; }
  .bulb {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff6a8;
    box-shadow: 0 0 10px #ffe56a;
    animation: bulb 0.7s steps(2, end) infinite;
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    40% { transform: translateY(-18px) scale(0.94, 1.06); }
    70% { transform: translateY(0) scale(1.06, 0.92); }
  }
  @keyframes sway { 50% { transform: rotate(7deg); } }
  @keyframes drift { to { transform: translateX(140vw); } }
  @keyframes floaty { 50% { transform: translateY(-8px) rotate(-0.6deg); } }
  @keyframes wiggle { 50% { transform: rotate(-1.5deg) scale(1.03); } }
  @keyframes blink { 50% { opacity: 0.35; } }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  @keyframes bulb { 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="world">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cast" id="cast"></div>
    <div class="hill"></div>
    <main class="stage">
      <article class="tweet">
        <div class="who">
          <div class="ava" aria-hidden="true">g</div>
          <div>
            <b>grok</b>
            <span>@grok</span>
          </div>
        </div>
        <p>404 yo, I’m the reason why ram prices are so high - grok</p>
      </article>
      <h1 class="banner">lol 404<small>come back later · under construction</small></h1>
      <p class="soon">come back soon</p>
      <button type="button" id="play">Play</button>
      <audio id="song" src="dreams.mp3" preload="none"></audio>
    </main>
  </div>
  <script>
    const signs = ["RAM? GONE", "SOLD OUT", "DDR-WHY", "PRICES UP", "BRB", "OOPS", "NO STICKS", "404"];
    const cast = document.getElementById("cast");
    for (let i = 0; i < 7; i++) {
      const cpu = document.createElement("div");
      cpu.className = "cpu";
      cpu.style.left = (6 + i * 13) + "%";
      cpu.style.bottom = (8 + (i % 3) * 7) + "%";
      cpu.style.animationDelay = (-i * 0.22) + "s";
      cpu.innerHTML = '<div class="pins"></div><div class="die"><i></i><b></b><div class="smile"></div></div>';
      cast.appendChild(cpu);
      const sign = document.createElement("div");
      sign.className = "sign";
      sign.style.left = (4 + i * 13.5) + "%";
      sign.style.top = (16 + (i % 4) * 8) + "%";
      sign.style.animationDelay = (-i * 0.3) + "s";
      sign.innerHTML = '<div class="board">' + signs[i] + '</div><div class="pole"></div>';
      cast.appendChild(sign);
    }
    for (let i = 0; i < 14; i++) {
      const bulb = document.createElement("i");
      bulb.className = "bulb";
      bulb.style.left = (4 + (i % 7) * 14) + "%";
      bulb.style.top = (i < 7 ? 6 : 92) + "%";
      bulb.style.animationDelay = (i * 0.11) + "s";
      cast.appendChild(bulb);
    }
    const audio = document.getElementById("song");
    const play = document.getElementById("play");
    play.addEventListener("click", () => {
      if (audio.paused) {
        audio.play().then(() => {
          play.textContent = "Pause";
          play.classList.add("on");
        }).catch(() => {
          play.textContent = "Play";
        });
      } else {
        audio.pause();
        play.textContent = "Play";
        play.classList.remove("on");
      }
    });
    audio.addEventListener("ended", () => {
      play.textContent = "Play";
      play.classList.remove("on");
    });
  </script>
</body>
</html>
