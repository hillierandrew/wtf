<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;height:100dvh;min-height:-webkit-fill-available;background:#000;color:#ff1111;font-family:'Courier New',monospace;overflow:hidden;position:relative;touch-action:manipulation;transition:background-color .5s ease;}
body{display:flex;justify-content:center;align-items:center;flex-direction:column;}
#bg-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;height:100dvh;z-index:1;display:block;opacity:0;pointer-events:none;transition:opacity 1s ease,filter .3s ease;}
#bg-canvas.active{opacity:1;}
body::before{content:" ";display:block;position:fixed;inset:0;background:radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.85) 100%);pointer-events:none!important;z-index:10;transition:opacity .5s ease;}
body::after{content:" ";display:block;position:fixed;inset:0;background:linear-gradient(rgba(20,0,0,0) 50%,rgba(0,0,0,.45) 50%);background-size:100% 4px;pointer-events:none!important;z-index:11;transition:opacity .5s ease;}
body.light-mode::before{opacity:.2;}
body.light-mode::after{opacity:.15;}
.container{text-align:center;z-index:50;padding:10px;max-width:92vw;user-select:none;-webkit-user-select:none;position:relative;pointer-events:none;}
.title{font-size:clamp(1.2rem,6vw,4.5rem);font-weight:bold;letter-spacing:.1em;animation:flicker .12s infinite;min-height:1.2em;display:inline-block;white-space:nowrap;transition:filter .3s ease,color .3s ease,text-shadow .3s ease,font-family .2s ease;}
#dvd-logo{position:fixed;z-index:45;font-size:clamp(1rem,3.5vw,2rem);font-weight:bold;letter-spacing:.1em;color:#00ffcc;text-shadow:0 0 12px #00ffcc,0 0 25px #008888;user-select:none;pointer-events:none;white-space:nowrap;font-family:'Press Start 2P',monospace;display:none;}
.clickable-word{cursor:pointer;display:inline-block;pointer-events:auto;padding:0 4px;position:relative;}
.clickable-word:active{transform:scale(.92);filter:brightness(1.8);}
@keyframes flicker{0%{opacity:.95}50%{opacity:1}100%{opacity:.97}}
.top-right-stack{position:fixed;top:max(16px,env(safe-area-inset-top,16px));right:max(16px,env(safe-area-inset-right,16px));z-index:999999;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;}
.visitor-counter{font-family:'Press Start 2P',monospace;font-size:11px;color:#ff3333;background:rgba(10,0,0,.9);border:2px solid #ff1111;padding:7px 14px;border-radius:8px;box-shadow:0 0 15px rgba(255,0,0,.6);user-select:none;letter-spacing:.1em;white-space:nowrap;}
.phase-info-box{font-family:'Press Start 2P',monospace;font-size:10px;color:#fff;background:rgba(10,0,0,.9);border:2px solid rgba(255,255,255,.5);padding:7px 14px;border-radius:8px;box-shadow:0 0 12px rgba(255,255,255,.3);user-select:none;letter-spacing:.05em;text-align:right;white-space:nowrap;display:flex;flex-direction:column;gap:3px;}
.phase-info-box .num{font-size:12px;}
.phase-info-box .nm{font-size:8px;opacity:.75;font-family:'Courier New',monospace;letter-spacing:.08em;}
.bottom-ui-container{position:fixed;bottom:max(20px,env(safe-area-inset-bottom,20px));left:50%;transform:translateX(-50%);z-index:999999;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:auto;width:clamp(320px,90vw,600px);}
.ui-row{display:flex;flex-direction:row;justify-content:center;align-items:center;gap:16px;width:100%;}
.ui-box{flex:1;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;font-size:14px;font-weight:900;color:#fff!important;-webkit-text-fill-color:#fff!important;letter-spacing:.05em;user-select:none;-webkit-user-select:none;padding:13px 14px;border-radius:40px;background-color:rgba(15,15,15,.95);border:3px solid rgba(255,255,255,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 25px rgba(0,0,0,.95),0 0 15px rgba(255,255,255,.3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:center;align-items:center;cursor:pointer;transition:background-color .2s ease,transform .2s ease;border:none;outline:none;}
.ui-box:active{transform:scale(.95);background-color:rgba(255,255,255,.3);}
.wide-box{width:100%;flex:none;}
.swirl-trip{filter:url(#swirl-filter)!important;}
.spin{animation:spin-hue 3s linear infinite!important;}
@keyframes spin-hue{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
.liquid-wave{animation:flicker .12s infinite,liquid 1.8s ease-in-out infinite alternate!important;}
@keyframes liquid{0%{letter-spacing:.1em}100%{letter-spacing:.3em;filter:blur(2px) contrast(200%)}}
.pulse-glow{animation:flicker .12s infinite,glow .8s ease-in-out infinite alternate!important;}
@keyframes glow{0%{filter:brightness(1)}100%{filter:brightness(2) drop-shadow(0 0 30px #fff)}}
.slice-glitch{animation:slice .2s steps(2) infinite!important;}
@keyframes slice{0%{clip-path:inset(0 0 0 0)}50%{clip-path:inset(20% 0 30% 0)}100%{clip-path:inset(60% 0 10% 0)}}
.salvia-split{text-shadow:-15px 0 0 #ff00ff,15px 0 0 #00ffff,0 15px 0 #00ff00!important;animation:salvia .1s infinite alternate;}
@keyframes salvia{0%{transform:skewX(-10deg) scale(.9)}100%{transform:skewX(10deg) scale(1.1)}}
</style>

<script>
/* =====================================================================
   LOFI 8-BIT STUDY-BEAT ENGINE
===================================================================== */
let audioCtx=null, masterGain=null, lofiFilter=null, hatBuffer=null;
let isPlaying=false, nextChordTime=0, barCount=0, schedulerID=null;

const NOTE_FREQS={
  C2:65.41,D2:73.42,E2:82.41,F2:87.31,G2:98.00,A2:110.00,B2:123.47,
  C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77
};
const CHORD_PROGRESSION=[
  {tones:['A3','C4','E4','G4'],bass:'A2'},
  {tones:['D3','F3','A3','C4'],bass:'D2'},
  {tones:['G3','B3','D4','F4'],bass:'G2'},
  {tones:['C3','E3','G3','B3'],bass:'C2'}
];
const BPM=74, beatDur=60/BPM, eighth=beatDur/2;

function makeNoiseBuffer(duration){
  const size=audioCtx.sampleRate*duration;
  const buf=audioCtx.createBuffer(1,size,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<size;i++) d[i]=Math.random()*2-1;
  return buf;
}
function playTone(freq,t,dur,vol){
  if(!freq) return;
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type='triangle'; osc.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(lofiFilter);
  osc.start(t); osc.stop(t+dur+0.05);
}
function playKick(t){
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(140,t);
  osc.frequency.exponentialRampToValueAtTime(42,t+0.15);
  g.gain.setValueAtTime(0.22,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t+0.2);
}
function playHat(t){
  const src=audioCtx.createBufferSource(); src.buffer=hatBuffer;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=7500; bp.Q.value=0.8;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.035,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+0.06);
}
function scheduleLofi(){
  if(!isPlaying||!audioCtx||audioCtx.state!=='running') return;
  while(nextChordTime<audioCtx.currentTime+0.3){
    const chord=CHORD_PROGRESSION[barCount%CHORD_PROGRESSION.length];
    const barStart=nextChordTime;
    playKick(barStart);
    playKick(barStart+beatDur*2);
    playTone(NOTE_FREQS[chord.bass],barStart,beatDur*4*0.9,0.13);
    const pattern=[0,1,2,3,2,1,0,1];
    for(let i=0;i<8;i++){
      const t=barStart+i*eighth;
      playTone(NOTE_FREQS[chord.tones[pattern[i]]],t,eighth*0.9,0.05);
      if(i%2===1) playHat(t);
    }
    nextChordTime+=beatDur*4;
    barCount++;
  }
  schedulerID=setTimeout(scheduleLofi,100);
}
function toggleAudio(e){
  if(e) e.stopPropagation();
  const btn=document.getElementById('audio-toggle');
  if(!isPlaying){
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain(); masterGain.gain.value=0.9;
      lofiFilter=audioCtx.createBiquadFilter(); lofiFilter.type='lowpass'; lofiFilter.frequency.value=1600; lofiFilter.Q.value=0.5;
      lofiFilter.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      hatBuffer=makeNoiseBuffer(0.1);
      const crackleSrc=audioCtx.createBufferSource();
      crackleSrc.buffer=makeNoiseBuffer(2); crackleSrc.loop=true;
      const crackleFilter=audioCtx.createBiquadFilter();
      crackleFilter.type='bandpass'; crackleFilter.frequency.value=3000; crackleFilter.Q.value=0.4;
      const crackleGain=audioCtx.createGain(); crackleGain.gain.value=0.012;
      crackleSrc.connect(crackleFilter); crackleFilter.connect(crackleGain); crackleGain.connect(masterGain);
      crackleSrc.start();
    }
    const start=()=>{
      if(audioCtx.state!=='running') return;
      nextChordTime=audioCtx.currentTime+0.1;
      barCount=0; isPlaying=true;
      btn.textContent='🔊 MUTE LOFI';
      scheduleLofi();
    };
    if(audioCtx.state==='suspended') audioCtx.resume().then(start).catch(start);
    else start();
  } else {
    isPlaying=false;
    if(schedulerID) clearTimeout(schedulerID);
    btn.textContent='🔇 UNMUTE LOFI';
  }
}

/* =====================================================================
   CANVAS + GLOBAL STATE
===================================================================== */
const canvas=document.getElementById('bg-canvas');
const ctx=canvas.getContext('2d');
const dvdLogo=document.getElementById('dvd-logo');
const scrambleTextEl=document.getElementById('scramble-text');
const wordDrewEl=document.getElementById('word-drew');
const wordWtfEl=document.getElementById('word-wtf');
const phaseNumEl=document.querySelector('#phase-info-box .num');
const phaseNameSmEl=document.getElementById('phase-name-sm');
const contactBtn=document.getElementById('contact-btn');

let width,height,cx,cy,globalAngle=0;
function resizeCanvas(){
  width=window.innerWidth; height=window.innerHeight;
  canvas.width=width; canvas.height=height;
  cx=width/2; cy=height/2;
  reinitCurrentMode();
}

/* =====================================================================
   31 RENDERER ARCHETYPES. 300 phases are generated below by cycling
   these through rotating palettes + names + contact labels, so every
   phase looks different even when two share the same renderer.
===================================================================== */
const ARCHETYPES=[
  {mode:'stars',      name:'BOOT SEQUENCE',    font:"'Courier New', monospace"},
  {mode:'dos',         name:'DOS PROMPT',       font:"'VT323', monospace"},
  {mode:'cyber',       name:'NEON DISTRICT',    font:"'Orbitron', sans-serif", wild:'slice-glitch'},
  {mode:'clean',       name:'CLEAN PROFILE',    font:"-apple-system, 'Segoe UI', Roboto, sans-serif", light:true},
  {mode:'matrix',      name:'THE MATRIX',       font:"'Fira Code', monospace"},
  {mode:'mushroom',    name:'SPORE TRIP',       font:"'Permanent Marker', cursive", wild:'liquid-wave'},
  {mode:'lsd',         name:'MELTDOWN',         font:"'Comic Neue', cursive", wild:'salvia-split'},
  {mode:'geocities',   name:'UNDER CONSTRUCTION', font:"'Comic Neue', cursive"},
  {mode:'dino',        name:'OFFLINE.EXE',      font:"'Press Start 2P', monospace", light:true},
  {mode:'dvd',         name:'SCREENSAVER',      font:"'Press Start 2P', monospace"},
  {mode:'fireworks',   name:'CELEBRATION',      font:"'Russo One', sans-serif"},
  {mode:'fire',        name:'SLOW BURN',        font:"'Courier Prime', monospace"},
  {mode:'rain',        name:'MIDNIGHT RAIN',    font:"'Fira Code', monospace"},
  {mode:'invaders',    name:'INVASION',         font:"'Press Start 2P', monospace"},
  {mode:'pong',        name:'REC ROOM',         font:"'VT323', monospace"},
  {mode:'none',        name:'PORTFOLIO',        font:"'Cinzel', serif"},
  {mode:'snake',       name:'SNAKE.EXE',        font:"'VT323', monospace"},
  {mode:'hockey',      name:'BREAKAWAY',        font:"'Russo One', sans-serif", light:true},
  {mode:'casino',      name:'HIGH ROLLER',      font:"'Russo One', sans-serif"},
  {mode:'angelic',     name:'ASCENSION',        font:"'Cinzel', serif", light:true},
  {mode:'demonic',     name:'INFERNAL PACT',    font:"'Permanent Marker', cursive"},
  {mode:'aurora',      name:'POLAR LIGHTS',     font:"'Cinzel', serif"},
  {mode:'disco',       name:'MIRROR BALL',      font:"'Comic Neue', cursive"},
  {mode:'blackhole',   name:'EVENT HORIZON',    font:"'Orbitron', sans-serif"},
  {mode:'circuit',     name:'MOTHERBOARD',      font:"'Fira Code', monospace"},
  {mode:'volcano',     name:'MAGMA CHAMBER',    font:"'Courier Prime', monospace"},
  {mode:'aquarium',    name:'DEEP BLUE',        font:"'Comic Neue', cursive"},
  {mode:'snowglobe',   name:'FIRST FROST',      font:"'Cinzel', serif"},
  {mode:'vaporwave',   name:'SUNSET DRIVE',     font:"'Orbitron', sans-serif"},
  {mode:'radioactive', name:'HAZARD ZONE',      font:"'Fira Code', monospace"},
  {mode:'zodiac',      name:'CELESTIAL',        font:"'Cinzel', serif"}
];

const DARK_PALETTES=[
  {color:'#ff1111',shadow:'0 0 10px #ff1111, 0 0 25px #660000'},
  {color:'#00ffcc',shadow:'0 0 12px #00ffcc, 0 0 22px #008888'},
  {color:'#ff00ff',shadow:'0 0 12px #ff00ff, 0 0 22px #660066'},
  {color:'#33ff33',shadow:'0 0 10px #33ff33'},
  {color:'#ffcc00',shadow:'0 0 14px #ffcc00, 0 0 24px #664400'},
  {color:'#00ccff',shadow:'0 0 12px #00ccff'},
  {color:'#ff6600',shadow:'0 0 14px #ff6600'},
  {color:'#ffffff',shadow:'0 0 16px #ffffff, 0 0 30px #888888'},
  {color:'#cc00ff',shadow:'0 0 14px #cc00ff'},
  {color:'#ff3388',shadow:'0 0 14px #ff3388'},
  {color:'#88ff00',shadow:'0 0 12px #88ff00'},
  {color:'#00ffff',shadow:'0 0 14px #00ffff, 0 0 24px #006666'}
];
const LIGHT_PALETTES=[
  {color:'#1877f2',shadow:'0 0 8px rgba(24,119,242,.35)'},
  {color:'#cc0000',shadow:'0 0 8px rgba(204,0,0,.3)'},
  {color:'#006644',shadow:'0 0 8px rgba(0,102,68,.3)'},
  {color:'#333333',shadow:'0 0 6px rgba(0,0,0,.25)'},
  {color:'#8800cc',shadow:'0 0 8px rgba(136,0,204,.3)'},
  {color:'#cc7700',shadow:'0 0 8px rgba(204,119,0,.3)'}
];

const CONTACT_LABELS=[
  '[ CONTACT ]','[ CALL ]','[ PING HOST ]','[ TRANSMIT DATA ]','[ INITIALIZE HANDSHAKE ]','[ DIAL-UP (56K) ]','[ SEND EMAIL ]','[ EXECUTE TALK.EXE ]',
  '[ SEND TELEPATHICALLY ]','[ TELEPORT MESSAGE ]','[ PROJECT ASTRAL BODY ]','[ COMMUNICATE VIA DREAMS ]','[ CONSULT THE OUIJA BOARD ]','[ TRANSMIT VIBES ]','[ BEAM UP ]',
  '[ SEND SMOKE SIGNAL ]','[ KNOCK ON DOOR ]','[ DISPATCH CARRIER PIGEON ]','[ WRITE PARCHMENT LETTER ]','[ SHOUT VERY LOUDLY ]','[ RING DOORBELL ]','[ SEND MORSE CODE ]','[ THROW BOTTLE IN OCEAN ]',
  '[ PET THE CAT ]','[ BARK AT DOOR ]','[ PRESS F TO PAY RESPECTS ]','[ SUMMON DREW ]','[ BLINK TWICE ]','[ SEND POKE ]'
];

const MORPH_VARIANTS=[
  {left:'ドリュー',   right:'ワット',              font:"'Noto Sans JP', sans-serif"},
  {left:'ڈریو',      right:'ڈبلیوٹی\u200cایف',   font:"'Noto Sans Arabic', sans-serif"},
  {left:'ड्रू',       right:'डब्ल्यूटीएफ़',        font:"'Noto Sans Devanagari', sans-serif"},
  {left:'德鲁',       right:'网站',               font:"'Noto Sans SC', sans-serif"},
  {left:'드류',       right:'더블유티에프',         font:"'Noto Sans KR', sans-serif"},
  {left:'ДРЕВ',       right:'ВТФ',               font:"'Courier New', monospace"},
  {left:'דרו',        right:'וטף',               font:"'Noto Sans Hebrew', sans-serif"},
  {left:'✞☠✟♰',       right:'☣☢☠♱',              font:"'Courier New', monospace"},
  {left:'666',        right:'EVIL',              font:"'Permanent Marker', cursive"},
  {left:'C:\\DREW',   right:'WTF.EXE',           font:"'VT323', monospace"},
  {left:'PUCK',       right:'DROP',              font:"'Russo One', sans-serif"},
  {left:'ALL',        right:'IN',                font:"'Russo One', sans-serif"},
  {left:'AMEN',       right:'WTF',               font:"'Cinzel', serif"},
  {left:'DREW',       right:'WTF',               font:"'Press Start 2P', monospace"}
];
const SCRAMBLE_FONT_STACK="'Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Devanagari','Noto Sans Arabic','Noto Sans Hebrew', sans-serif";
const GLITCH_CHARS=['0','1','3','7','_','/#','\\|','@','$','%','*','!','中','文','鬼','魔','神','龍','悟','अ','आ','इ','उ','क','ख','Д','Р','Е','В','У','Ш','К','ا','ب','ت','ث','ج','א','ב','ג','ד','ה','ก','ข','ค','ง','จ','가','나','다','라','마','あ','い','う','え','お','☠','☣','☢','✞','♰','웃','🔥','💀','😈','☣️','🟢','🛸','👽','🌸','🐱','🐕','🚗','🎆','666'];
const WILD_CLASSES=['swirl-trip','spin','liquid-wave','pulse-glow','slice-glitch','salvia-split'];

/* Generate the 300 phases */
const TOTAL_PHASES=300;
const PHASES=[];
for(let i=0;i<TOTAL_PHASES;i++){
  const arche=ARCHETYPES[i%ARCHETYPES.length];
  const pool=arche.light?LIGHT_PALETTES:DARK_PALETTES;
  const pal=pool[(i+Math.floor(i/ARCHETYPES.length)*3)%pool.length];
  const cycle=Math.floor(i/ARCHETYPES.length)+1;
  PHASES.push({
    name:cycle>1?`${arche.name} MK${cycle}`:arche.name,
    mode:arche.mode,
    font:arche.font,
    color:pal.color,
    shadow:pal.shadow,
    bg:arche.light?'#f5f5f5':'#000000',
    light:!!arche.light,
    wild:arche.wild,
    contact:CONTACT_LABELS[i%CONTACT_LABELS.length]
  });
}

let phase=PHASES[0];
let currentPhaseIndex=0;
let restingFont=phase.font;
let phaseTimer=null;
let paused=false;

/* =====================================================================
   RENDER FUNCTIONS
===================================================================== */
let starParticles=[];
function newStar(){ return {x:(Math.random()-0.5)*width*2,y:(Math.random()-0.5)*height*2,z:Math.random()*width}; }
function initStars(){ starParticles=[]; for(let i=0;i<400;i++) starParticles.push(newStar()); }
function drawStars(){
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,width,height);
  ctx.strokeStyle=phase.color;
  for(const s of starParticles){
    const pz=s.z; s.z-=4;
    if(s.z<=0){ Object.assign(s,newStar()); s.z=width; }
    const sx=(s.x/s.z)*cx+cx, sy=(s.y/s.z)*cy+cy;
    const psx=(s.x/pz)*cx+cx, psy=(s.y/pz)*cy+cy;
    if(sx>=0&&sx<=width&&sy>=0&&sy<=height){
      ctx.globalAlpha=Math.min(1,(1-s.z/width)*1.8);
      ctx.lineWidth=Math.max(0.5,(1-s.z/width)*3);
      ctx.beginPath(); ctx.moveTo(psx,psy); ctx.lineTo(sx,sy); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

let snakeState=null;
function initSnake(){
  const cell=20, cols=Math.floor(width/cell), rows=Math.floor(height/cell);
  snakeState={cell,cols,rows,body:[{x:Math.floor(cols/2),y:Math.floor(rows/2)}],dir:{x:1,y:0},food:{x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)},frame:0,score:0};
}
function stepSnake(){
  const s=snakeState, head=s.body[0];
  const dx=s.food.x-head.x, dy=s.food.y-head.y;
  const candidates=Math.abs(dx)>Math.abs(dy)
    ? [{x:Math.sign(dx)||1,y:0},{x:0,y:Math.sign(dy)||1},{x:0,y:-(Math.sign(dy)||1)}]
    : [{x:0,y:Math.sign(dy)||1},{x:Math.sign(dx)||1,y:0},{x:-(Math.sign(dx)||1),y:0}];
  let newDir=s.dir;
  for(const c of candidates){
    if(c.x===-s.dir.x&&c.y===-s.dir.y) continue;
    const nx=head.x+c.x, ny=head.y+c.y;
    if(nx<0||ny<0||nx>=s.cols||ny>=s.rows) continue;
    newDir=c; break;
  }
  s.dir=newDir;
  const newHead={x:(head.x+s.dir.x+s.cols)%s.cols,y:(head.y+s.dir.y+s.rows)%s.rows};
  s.body.unshift(newHead);
  if(newHead.x===s.food.x&&newHead.y===s.food.y){ s.score++; s.food={x:Math.floor(Math.random()*s.cols),y:Math.floor(Math.random()*s.rows)}; }
  else s.body.pop();
  for(let i=1;i<s.body.length;i++) if(s.body[i].x===newHead.x&&s.body[i].y===newHead.y){ initSnake(); return; }
}
function drawSnake(){
  if(!snakeState) initSnake();
  ctx.fillStyle='#001a00'; ctx.fillRect(0,0,width,height);
  const s=snakeState;
  s.frame++;
  if(s.frame%6===0) stepSnake();
  ctx.fillStyle='#ff3333';
  ctx.fillRect(s.food.x*s.cell,s.food.y*s.cell,s.cell-2,s.cell-2);
  ctx.fillStyle='#33ff33';
  s.body.forEach((seg,i)=>{ ctx.globalAlpha=i===0?1:0.8; ctx.fillRect(seg.x*s.cell,seg.y*s.cell,s.cell-2,s.cell-2); });
  ctx.globalAlpha=1;
  ctx.font='16px "VT323", monospace'; ctx.fillStyle='#33ff33';
  ctx.fillText('SCORE: '+s.score,10,20);
}

  snowFlakes.forEach(f=>{ f.y+=f.s; f.x+=f.d*0.5; if(f.y>height){ f.y=-5; f.x=Math.random()*width; } ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); });
}

function drawVaporwave(){
  const grad=ctx.createLinearGradient(0,0,0,height);
  grad.addColorStop(0,'#2b0f54'); grad.addColorStop(0.5,'#ff6ec7'); grad.addColorStop(1,'#120024');
  ctx.fillStyle=grad; ctx.fillRect(0,0,width,height);
  const sunY=height*0.42, sunR=height*0.22;
  ctx.fillStyle='#ffcc33';
  ctx.beginPath(); ctx.arc(cx,sunY,sunR,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=grad;
  for(let i=0;i<6;i++) ctx.fillRect(cx-sunR,sunY+i*8-sunR*0.2,sunR*2,4);
  const horizon=height*0.62;
  ctx.strokeStyle='rgba(0,255,255,0.5)'; ctx.lineWidth=1.5;
  for(let x=-width;x<width*2;x+=60){ ctx.beginPath(); ctx.moveTo(x,height); ctx.lineTo(cx+(x-cx)*0.05,horizon); ctx.stroke(); }
  for(let y=horizon;y<height;y+=16){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke(); }
}

function drawRadioactive(){
  ctx.fillStyle='rgba(10,15,0,0.2)'; ctx.fillRect(0,0,width,height);
  ctx.font=`${40+Math.sin(globalAngle*3)*10}px serif`; ctx.textAlign='center';
  ctx.fillStyle=`rgba(180,255,0,${0.6+Math.sin(globalAngle*4)*0.3})`;
  ctx.fillText('☢️',cx,cy); ctx.textAlign='left';
  ctx.font='20px serif';
  for(let i=0;i<12;i++){
    const angle=globalAngle+i*(Math.PI*2/12);
    const r=150+Math.sin(globalAngle*2+i)*20;
    ctx.fillText('☣️',cx+Math.cos(angle)*r,cy+Math.sin(angle)*r);
  }
}

function drawZodiac(){
  ctx.fillStyle='rgba(0,0,20,0.2)'; ctx.fillRect(0,0,width,height);
  ctx.strokeStyle='rgba(255,255,255,0.15)';
  const pts=[];
  for(let i=0;i<8;i++){
    const angle=globalAngle*0.5+i*(Math.PI*2/8);
    const r=100+i*20;
    pts.push({x:cx+Math.cos(angle)*r,y:cy+Math.sin(angle)*r*0.6});
  }
  ctx.beginPath();
  pts.forEach((p,i)=>{ if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.stroke();
  ctx.fillStyle='#ffffff';
  pts.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); });
}

function reinitCurrentMode(){
  switch(phase.mode){
    case 'stars': initStars(); break;
    case 'clean': initClean(); break;
    case 'matrix': initMatrix(); break;
    case 'fire': initFire(); break;
    case 'rain': initRain(); break;
    case 'invaders': initInvaders(); break;
    case 'dino': initDino(); break;
    case 'dos': dosLines=[]; dosFrame=0; break;
    case 'snake': initSnake(); break;
    case 'hockey': initHockey(); break;
    case 'casino': initCasino(); break;
    case 'blackhole': initBlackhole(); break;
    case 'volcano': initVolcano(); break;
    case 'aquarium': initAquarium(); break;
    case 'snowglobe': initSnow(); break;
  }
}

function drawFrame(){
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  switch(phase.mode){
    case 'stars': drawStars(); break;
    case 'dos': drawDos(); break;
    case 'cyber': drawCyber(); break;
    case 'clean': drawClean(); break;
    case 'matrix': drawMatrix(); break;
    case 'mushroom': drawMushroom(); break;
    case 'lsd': drawLsd(); break;
    case 'geocities': drawGeocities(); break;
    case 'dino': drawDino(); break;
    case 'dvd': ctx.fillStyle='#000'; ctx.fillRect(0,0,width,height); break;
    case 'fireworks': drawFireworks(); break;
    case 'fire': drawFire(); break;
    case 'rain': drawRain(); break;
    case 'invaders': drawInvaders(); break;
    case 'pong': drawPong(); break;
    case 'snake': drawSnake(); break;
    case 'hockey': drawHockey(); break;
    case 'casino': drawCasino(); break;
    case 'angelic': drawAngelic(); break;
    case 'demonic': drawDemonic(); break;
    case 'aurora': drawAurora(); break;
    case 'disco': drawDisco(); break;
    case 'blackhole': drawBlackhole(); break;
    case 'circuit': drawCircuit(); break;
    case 'volcano': drawVolcano(); break;
    case 'aquarium': drawAquarium(); break;
    case 'snowglobe': drawSnowglobe(); break;
    case 'vaporwave': drawVaporwave(); break;
    case 'radioactive': drawRadioactive(); break;
    case 'zodiac': drawZodiac(); break;
  }
}

/* =====================================================================
   DVD BUMPER — only active during the SCREENSAVER phase
===================================================================== */
let dvdX=50, dvdY=50, dvdSpeedX=2.5, dvdSpeedY=2.0;
const DVD_COLORS=['#00ffcc','#ff00ff','#ffff00','#ff3300','#00ff00','#00f0ff'];
function animateDVDLogo(){
  if(phase.mode==='dvd' && !paused){
    const w=window.innerWidth-dvdLogo.offsetWidth-20, h=window.innerHeight-dvdLogo.offsetHeight-80;
    dvdX+=dvdSpeedX; dvdY+=dvdSpeedY;
    if(dvdX>=w||dvdX<=10){ dvdSpeedX=-dvdSpeedX; dvdLogo.style.color=DVD_COLORS[Math.floor(Math.random()*DVD_COLORS.length)]; }
    if(dvdY>=h||dvdY<=10){ dvdSpeedY=-dvdSpeedY; dvdLogo.style.color=DVD_COLORS[Math.floor(Math.random()*DVD_COLORS.length)]; }
    dvdLogo.style.left=`${dvdX}px`; dvdLogo.style.top=`${dvdY}px`;
  }
  requestAnimationFrame(animateDVDLogo);
}
animateDVDLogo();

/* =====================================================================
   MAIN LOOP + PLAY/PAUSE
===================================================================== */
function animate(){
  if(paused) return;
  globalAngle+=0.02;
  if(phase.mode!=='none') drawFrame();
  requestAnimationFrame(animate);
}
function togglePause(e){
  if(e) e.stopPropagation();
  paused=!paused;
  const btn=document.getElementById('playpause-toggle');
  if(paused){
    btn.textContent='▶ PLAY';
    if(phaseTimer) clearInterval(phaseTimer);
    if(scrambleInterval) clearInterval(scrambleInterval);
    if(scrambleTimeout) clearTimeout(scrambleTimeout);
  } else {
    btn.textContent='⏸ PAUSE';
    resetPhaseTimer();
    runScrambleCycle();
    animate();
  }
}

/* =====================================================================
   VISITOR COUNTER (possessed)
===================================================================== */
const visitorBox=document.getElementById('visitor-box');
setInterval(()=>{
  if(Math.random()<0.2){ visitorBox.textContent='VISITS: 00666'; visitorBox.style.color='#ff0000'; visitorBox.style.borderColor='#ff0000'; }
  else{ const v=Math.floor(Math.random()*99999).toString().padStart(5,'0'); visitorBox.textContent=`VISITS: ${v}`; visitorBox.style.color='#ff3333'; visitorBox.style.borderColor='#ff1111'; }
},150);

/* =====================================================================
   TOAST + CONTACT BUTTON
===================================================================== */
let toastEl=null, toastHideTimer=null;
function showToast(msg){
  if(!toastEl){
    toastEl=document.createElement('div');
    toastEl.style.cssText='position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:999999;font-family:"Press Start 2P",monospace;font-size:11px;background:rgba(0,0,0,.88);border:2px solid currentColor;padding:10px 18px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .3s ease;white-space:nowrap;';
    document.body.appendChild(toastEl);
  }
  toastEl.style.color=phase.color;
  toastEl.textContent=msg;
  toastEl.style.opacity='1';
  clearTimeout(toastHideTimer);
  toastHideTimer=setTimeout(()=>{ toastEl.style.opacity='0'; },1800);
}
function hitContact(e){
  if(e) e.stopPropagation();
  showToast('>> '+phase.contact.replace(/[\[\]]/g,'').trim()+'...');
}

/* =====================================================================
   PHASE NAVIGATION
===================================================================== */
function pad(n,len){ return String(n).padStart(len,'0'); }
function setPhase(index){
  currentPhaseIndex=((index%PHASES.length)+PHASES.length)%PHASES.length;
  phase=PHASES[currentPhaseIndex];

  phaseNumEl.textContent=`No. ${pad(currentPhaseIndex+1,3)} / ${PHASES.length}`;
  phaseNameSmEl.textContent=phase.name;
  contactBtn.textContent=phase.contact;

  document.body.style.backgroundColor=phase.bg;
  document.body.classList.toggle('light-mode',!!phase.light);
  canvas.style.filter='';
  canvas.classList.toggle('active',phase.mode!=='none');

  scrambleTextEl.className='title';
  scrambleTextEl.style.color=phase.color;
  scrambleTextEl.style.textShadow=phase.shadow;
  restingFont=phase.font;
  scrambleTextEl.style.fontFamily=restingFont;

  dvdLogo.style.display=phase.mode==='dvd'?'block':'none';

  reinitCurrentMode();
  runScrambleCycle();
}
function prevPhase(){ setPhase(currentPhaseIndex-1); resetPhaseTimer(); }
function nextPhase(){ setPhase(currentPhaseIndex+1); resetPhaseTimer(); }
function randomPhase(){ setPhase(Math.floor(Math.random()*PHASES.length)); resetPhaseTimer(); }
function resetPhaseTimer(){
  if(phaseTimer) clearInterval(phaseTimer);
  if(paused) return;
  phaseTimer=setInterval(()=>setPhase(currentPhaseIndex+1),30000);
}

let isScrolling=false;
window.addEventListener('wheel',(e)=>{
  if(isScrolling) return; isScrolling=true;
  if(e.deltaY>0) nextPhase(); else if(e.deltaY<0) prevPhase();
  setTimeout(()=>{ isScrolling=false; },200);
});
function handleDrewClick(e){ if(e) e.stopPropagation(); prevPhase(); }
function handleWtfClick(e){ if(e) e.stopPropagation(); nextPhase(); }
function handleDotClick(e){ if(e) e.stopPropagation(); randomPhase(); }
window.addEventListener('pointerdown',(e)=>{
  if(e.target.closest('.clickable-word')||e.target.closest('.ui-box')) return;
  if(e.clientY<window.innerHeight/2) prevPhase(); else nextPhase();
});
window.addEventListener('keydown',(e)=>{
  if(e.key==='ArrowUp'||e.key==='ArrowRight') nextPhase();
  else if(e.key==='ArrowDown'||e.key==='ArrowLeft') prevPhase();
  else if(e.key===' '){ e.preventDefault(); togglePause(); }
});
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',resizeCanvas);

/* =====================================================================
   TEXT MORPH ENGINE
===================================================================== */
function randomizeString(str){
  return str.split('').map(c=>Math.random()<0.35?GLITCH_CHARS[Math.floor(Math.random()*GLITCH_CHARS.length)]:c).join('');
}
let scrambleInterval=null, scrambleTimeout=null;
function runScrambleCycle(){
  if(scrambleInterval) clearInterval(scrambleInterval);
  if(scrambleTimeout) clearTimeout(scrambleTimeout);

  scrambleTextEl.classList.remove(...WILD_CLASSES);
  scrambleTextEl.style.fontFamily=restingFont;
  wordDrewEl.textContent='DREW';
  wordWtfEl.textContent='WTF';

  scrambleTimeout=setTimeout(()=>{
    const variant=MORPH_VARIANTS[Math.floor(Math.random()*MORPH_VARIANTS.length)];
    scrambleTextEl.style.fontFamily=SCRAMBLE_FONT_STACK;
    let frame=0;
    scrambleInterval=setInterval(()=>{
      wordDrewEl.textContent=randomizeString(variant.left);
      wordWtfEl.textContent=randomizeString(variant.right);
      frame++;
      if(frame>=18){
        clearInterval(scrambleInterval);
        scrambleTextEl.style.fontFamily=variant.font;
        wordDrewEl.textContent=variant.left;
        wordWtfEl.textContent=variant.right;

        const wild=phase.wild||(Math.random()<0.4?WILD_CLASSES[Math.floor(Math.random()*WILD_CLASSES.length)]:null);
        if(wild) scrambleTextEl.classList.add(wild);

        scrambleTimeout=setTimeout(()=>{
          scrambleTextEl.classList.remove(...WILD_CLASSES);
          scrambleTextEl.style.fontFamily=restingFont;
          wordDrewEl.textContent='DREW';
          wordWtfEl.textContent='WTF';
          runScrambleCycle();
        },1200);
      }
    },45);
  },2000);
}

/* =====================================================================
   BOOT
===================================================================== */
resizeCanvas();
setPhase(0);
resetPhaseTimer();
animate();
</script>
