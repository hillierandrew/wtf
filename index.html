const LAB={cpu:'CPU',mb:'Motherboard',ram:'RAM',gpu:'GPU',psu:'PSU',cooler:'Cooler',case:'Case',ssd:'SSD',hdd:'HDD'};
const FN={1:'Mini-ITX',2:'mATX',3:'ATX',4:'E-ATX'};
const CAT={};let id=0;
for(const k in RAW){const r=RAW[k],ks=r.k.split(' ');CAT[k]=r.t.split('\n').map(l=>{const v=l.split('|'),o={id:k+(id++),cat:k};ks.forEach((q,i)=>{o[q]=v[i]===undefined?'':v[i]});
o.price=+o.price;o.f=o.f||'';o.sold=o.f.includes('x');o.used=o.f.includes('u');o.pick=o.f.includes('p');
['w','rec','ddr','form','board','rad','igpu','sfx','sfxo'].forEach(q=>{if(o[q]!==undefined&&o[q]!=='')o[q]=+o[q]});return o})}
if(window.PARTS)for(const k in PARTS)CAT[k]=PARTS[k].map(o=>{o=Object.assign({},o,{id:k+(id++),cat:k});o.price=+o.price;o.f=o.f||'';o.sold=o.f.includes('x');o.used=o.f.includes('u');o.pick=o.f.includes('p');o.inf=o.f.includes('i');return o});
CAT.cpu.forEach(p=>{if(p.sock==='AM5'&&!/\dF\b/.test(p.name))p.igpu=1});
const clean=s=>s.replace(/\(?open box\)?/ig,m=>m.startsWith('(')?'(Used)':'Used').replace(/ican/ig,'XXXX').replace(/armoury/ig,'XXXXXXX');
/* ===== COMPATIBILITY ===== */
const S={};let tab='cpu';
function pair(a,b){ // returns reason if incompatible
const [x,y]=a.cat<b.cat?[a,b]:[b,a];const t=x.cat+'-'+y.cat;
const M={cpu:a.cat==='cpu'?a:b,mb:a.cat==='mb'?a:b,ram:a.cat==='ram'?a:b,psu:a.cat==='psu'?a:b,gpu:a.cat==='gpu'?a:b,case:a.cat==='case'?a:b,cooler:a.cat==='cooler'?a:b};
const k=[a.cat,b.cat].sort().join('-');
if(k==='cpu-mb'&&M.cpu.sock!==M.mb.sock)return M.cpu.sock+' CPU needs a '+M.cpu.sock+' board (this is '+M.mb.sock+')';
if(k==='mb-ram'&&M.ram.ddr!==M.mb.ddr)return 'Board uses DDR'+M.mb.ddr+', RAM is DDR'+M.ram.ddr;
if(k==='case-mb'&&M.mb.form>M.case.board)return FN[M.mb.form]+' board does not fit a '+FN[M.case.board]+'-max case';
if(k==='case-cooler'&&M.cooler.rad>M.case.rad)return M.cooler.rad+'mm radiator exceeds case limit ('+M.case.rad+'mm)';
if(k==='case-psu'&&M.case.sfxo&&!M.psu.sfx)return 'Case only takes SFX power supplies';
if(k==='gpu-psu'&&M.psu.w<M.gpu.rec)return 'Needs '+M.gpu.rec+'W+ PSU (this is '+M.psu.w+'W)';
return null}
function why(p){const r=[];for(const c in S){if(c===p.cat)continue;const m=pair(p,S[c]);if(m)r.push(m)}return r}
/* ===== BUILDER UI ===== */
const $=i=>document.getElementById(i),usd=n=>'$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
function draw(){
$('tabs').innerHTML=Object.keys(LAB).map(k=>`<button class="tab ${k===tab?'on':''} ${S[k]?'has':''}" onclick="tab='${k}';LIM=300;tick();draw()">${LAB[k]}</button>`).join('');
const q=$('q').value.toLowerCase(),so=$('so').value,cd=$('cond').value,others=Object.keys(S).filter(k=>k!==tab).length;
let L=CAT[tab].filter(p=>(!q||clean(p.name).toLowerCase().includes(q))&&(cd===''||(cd==='used')===p.used)&&(!$('hu').checked||!p.sold));
L.sort((a,b)=>so==='a'?a.price-b.price:so==='d'?b.price-a.price:a.name.localeCompare(b.name));
$('grid').innerHTML=L.slice(0,LIM).map(p=>{const w=why(p),bad=w.length>0,sel=S[tab]&&S[tab].id===p.id,em=bad?'❌':(others?'🟢':'');
return `<div class="p ${sel?'sel':''} ${bad&&!sel?'dis':''} ${p.sold?'na':''}" ${bad&&!sel?'onclick="buzz()"':`onclick="pick('${p.id}')"`} title="${w.join('; ')}">
<span class="em">${em}</span><div class="n">${fmt(p.name)}</div><span class="pr">${usd(p.price)}</span>
${p.used?'<span class="b u">Used</span>':''}${p.sold?'<span class="b y">Unavailable</span>':p.pick?'<span class="b">Store exclusive</span>':''}${p.tag?`<span class="b">${p.tag}</span>`:''}${p.inf?'<span class="b i">inferred</span>':''}
${bad?`<div class="why">${w[0]}</div>`:''}</div>`}).join('')+(L.length>LIM?`<button class="btn" onclick="LIM+=300;draw()">Show more (${L.length-LIM})</button>`:'')||'<p class="sub">No matches.</p>';
summary()}
function pick(i){const p=CAT[tab].find(x=>x.id===i);beep(1200,.05,'square',.04);if(S[tab]&&S[tab].id===i)delete S[tab];else{S[tab]=p;for(const c in S)if(c!==tab&&pair(p,S[c]))delete S[c]}draw()}
function summary(){
const it=Object.values(S),tot=it.reduce((a,b)=>a+b.price,0),need=(S.cpu?S.cpu.w:0)+(S.gpu?S.gpu.w:0)+100,psu=S.psu?S.psu.w:0;
const pct=psu?Math.min(100,need/psu*100):0,W=[];
if(S.psu&&need>psu)W.push('⚠️ Estimated draw exceeds PSU rating');else if(S.psu&&need>psu*.8)W.push('🟡 Tight PSU headroom (<20%)');
if(S.cpu&&!S.cpu.igpu&&!S.gpu)W.push('⚠️ This CPU has no integrated graphics: add a GPU');
if(S.cpu&&S.cpu.sock==='LGA1700'&&S.mb&&S.mb.ddr===4&&S.ram&&0)W.push('');
if(S.gpu&&S.gpu.rec>=750&&S.psu&&S.psu.w<1000)W.push('ℹ️ High-end GPU: check for 12V-2x6 cable');
$('sum').innerHTML=`<h3>SYSTEM TOTAL</h3>${Object.keys(LAB).map(k=>`<div class="r"><span>${LAB[k]}</span><span>${S[k]?usd(S[k].price):'-'}</span></div>`).join('')}
<div class="tot">${usd(tot)}</div><div class="r"><span>Est. draw (CPU+GPU+100W)</span><span>${need}W</span></div>
<div class="bar"><i style="width:${pct}%;background:${pct>100?'#f05':pct>80?'#fa0':'#0fc'}"></i></div>
<div class="r"><span>PSU</span><span>${psu?psu+'W':'-'}</span></div>${W.filter(Boolean).map(w=>`<div class="warn">${w}</div>`).join('')}
<button class="btn" onclick="cp()">Copy build</button><button class="btn" onclick="for(const k in S)delete S[k];tick();draw()">Reset</button><button class="btn" onclick="dl()">Download .txt</button>
<div class="warn">Power figures are estimates.</div>`}
function cp(){cpy(bt(),document.querySelector('.sum .btn'))}

const BR='ASUS|GIGABYTE|AORUS|MSI|CORSAIR|AMD|Intel|Kingston|KLEVV|G\.SKILL|TEAMGROUP|Team Group|Samsung|Western Digital|WD|Seagate|Toshiba|Lexar|Crucial|SAPPHIRE|XFX|ZOTAC|PowerColor|PNY|NVIDIA|ASRock|be quiet!|DeepCool|Cooler Master|NZXT|LIAN LI|Lian-Li|FRACTAL DESIGN|Fractal Design|Arctic|THERMALTAKE|Super Flower|SUPERFLOWER|FSP|Seasonic|HYTE|Phanteks|SilverStone|AZZA|DarkFlash|JONSBO|PCCOOLER|Montech|Synology|ADATA|XPG|Antec|InWin|Acer|EKWB|Bykski|HAVN|Sudokoo|TRYX|Enermax|COUGAR|BitFenix|Gigabyte|Thermal Grizzly|Silverstone|Aegis|LaCie';
const BRX=new RegExp('^('+BR+')(?![A-Za-z])','i'),esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fmt(n){n=clean(n);const m=n.match(BRX);if(!m)return esc(n);const b=m[1],T=n.slice(b.length).trim().split(/\s+/);let k=T.slice(0,4).findIndex(w=>/\d/.test(w));if(k<0)k=Math.min(2,T.length)-1;if(k<0)return '<b class="br">'+esc(b)+'</b>';
return '<b class="br">'+esc(b)+'</b> <span class="md">'+esc(T.slice(0,k+1).join(' '))+'</span> '+esc(T.slice(k+1).join(' '))}
function bt(){return Object.keys(LAB).filter(k=>S[k]).map(k=>LAB[k]+': '+clean(S[k].name)+' - '+usd(S[k].price)).join('\n')+'\nTotal: '+usd(Object.values(S).reduce((a,b)=>a+b.price,0))}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bt()],{type:'text/plain'}));a.download='drew-wtf-build.txt';a.click()}

function cpy(t,b){const ok=()=>{if(b){const o=b.dataset.o||b.textContent;b.dataset.o=o;b.textContent='Copied ✓';setTimeout(()=>b.textContent=o,1300)}beep(1100,.05,'triangle',.04)};
const fb=()=>{const a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px';document.body.appendChild(a);a.focus();a.select();a.setSelectionRange(0,99999);try{document.execCommand('copy')}catch(e){}a.remove();ok()};
if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
const ld=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},sv=t=>{try{localStorage.setItem('pad_'+t,$('pad').value)}catch(e){}};
let tabF='lx';
const CM={lx:[
["Update everything (CachyOS)","sudo pacman -Syu"],["Update with AUR helper","paru -Syu"],["System summary","fastfetch"],["CPU info","lscpu"],
["GPU info","lspci -k | grep -EA3 'VGA|3D'"],["RAM sticks (speed, size, part no.)","sudo dmidecode -t memory | grep -E 'Size|Speed|Type:|Part'"],
["Disks and mounts","lsblk -o NAME,SIZE,TYPE,MODEL,MOUNTPOINT"],["NVMe health","sudo smartctl -a /dev/nvme0"],["Temperatures","sensors"],["NVIDIA stats","nvidia-smi"],
["Disk space","df -h"],["Biggest folders in home","du -h --max-depth=1 ~ | sort -hr | head"],["Errors from this boot","journalctl -p 3 -xb"],["Open ports","ss -tulpn"],["Network addresses","ip -br a"],
["CPU stress test (60s)","stress-ng --cpu 0 --timeout 60s"],["Write ISO to USB (CHECK /dev/sdX FIRST - erases the drive)","sudo dd if=cachyos.iso of=/dev/sdX bs=4M status=progress oflag=sync"],
["Serve this site locally","python -m http.server 8000"],["Build the full parts catalog","python build_parts.py ."]],
ps:[
["Update all apps","winget upgrade --all"],["List installed apps","winget list"],["System summary","Get-ComputerInfo | Select CsName,OsName,OsVersion,CsProcessors,CsTotalPhysicalMemory"],
["CPU","Get-CimInstance Win32_Processor | Select Name,NumberOfCores,NumberOfLogicalProcessors"],["GPU","Get-CimInstance Win32_VideoController | Select Name,DriverVersion,AdapterRAM"],
["RAM sticks","Get-CimInstance Win32_PhysicalMemory | Select Manufacturer,PartNumber,Speed,Capacity"],["Disks and health","Get-PhysicalDisk | Select FriendlyName,MediaType,Size,HealthStatus"],["Free space","Get-Volume"],
["Repair system files (admin)","sfc /scannow"],["Repair Windows image (admin)","DISM /Online /Cleanup-Image /RestoreHealth"],["Top 10 CPU hogs","Get-Process | Sort CPU -Descending | Select -First 10 Name,CPU,WS"],
["Network config","Get-NetIPConfiguration"],["Flush DNS","ipconfig /flushdns"],["Check activation status","slmgr /xpr"],["Restore point before changes (admin)","Checkpoint-Computer -Description 'before-build' -RestorePointType MODIFY_SETTINGS"],
["Power / battery report (admin)","powercfg /energy"]]};
const SW='<ul><li><b>Office:</b> <a href="https://www.libreoffice.org" target="_blank">LibreOffice</a></li><li><b>3D / video:</b> <a href="https://www.blender.org" target="_blank">Blender</a>, <a href="https://kdenlive.org" target="_blank">Kdenlive</a>, <a href="https://obsproject.com" target="_blank">OBS Studio</a></li><li><b>Images:</b> <a href="https://www.gimp.org" target="_blank">GIMP</a>, <a href="https://krita.org" target="_blank">Krita</a>, <a href="https://inkscape.org" target="_blank">Inkscape</a></li><li><b>Media:</b> <a href="https://www.videolan.org" target="_blank">VLC</a>, <a href="https://jellyfin.org" target="_blank">Jellyfin</a></li><li><b>Linux:</b> <a href="https://cachyos.org" target="_blank">CachyOS</a>, <a href="https://linuxmint.com" target="_blank">Linux Mint</a>, <a href="https://fedoraproject.org" target="_blank">Fedora</a></li><li><b>Self-hosting:</b> <a href="https://immich.app" target="_blank">Immich</a>, <a href="https://nextcloud.com" target="_blank">Nextcloud</a>, <a href="https://www.home-assistant.io" target="_blank">Home Assistant</a></li><li><b>PC testing:</b> <a href="https://www.memtest.org" target="_blank">MemTest86</a>, <a href="https://www.hwinfo.com" target="_blank">HWiNFO</a>, <a href="https://crystalmark.info" target="_blank">CrystalDiskInfo</a></li></ul>';
function fshow(){ftab(tabF)}
function ftab(t){tabF=t;tick();$('ft').innerHTML=[['lx','Konsole / Linux'],['ps','PowerShell / Windows'],['sw','Free software']].map(a=>`<button class="tab ${a[0]===t?'on':''}" onclick="ftab('${a[0]}')">${a[1]}</button>`).join('');
if(t==='sw'){$('fb').innerHTML=SW;return}
$('fb').innerHTML=`<div class="padbox"><b>${t==='lx'?'Your Konsole commands':'Your PowerShell commands'}</b><textarea id="pad" rows="4" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Type or paste commands here...">${esc(ld('pad_'+t))}</textarea><button class="btn" onclick="cpy($('pad').value,this)">Copy</button><button class="btn" onclick="sv('${t}');cpy('',null)">Save</button><button class="btn" onclick="$('pad').value='';sv('${t}')">Clear</button></div>`+CM[t].map((c,i)=>`<div class="cmd"><div class="ct">${esc(c[0])}</div><pre>${esc(c[1])}</pre><button class="btn" onclick="cpy(CM['${t}'][${i}][1],this)">Copy</button></div>`).join('')}
anim();bounce();
</script></body></html>
