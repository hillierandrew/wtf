<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>drew.wtf</title>
<style>
:root{--bg:#050508;--fg:#e0e0e0;--a1:#ff0055;--a2:#00ffcc;--a3:#ffaa00;--f:'Courier New',Courier,monospace}
body.demonic{--bg:#0a0000;--fg:#ff3333;--a1:#aa0000;--a2:#ff0000;--a3:#ff0000}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f);transition:background 1s,color 1s}
.ns{user-select:none;-webkit-user-select:none}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#splash{position:fixed;inset:0;background:radial-gradient(circle,#111118,#000);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity .6s,transform .6s}
.card{text-align:center;padding:40px;border-radius:10px;position:relative;z-index:2}
.img-comp{position:relative;width:250px;height:250px;margin:0 auto 30px;border-radius:20px;overflow:hidden;box-shadow:0 0 50px #0fc5,0 0 100px #f055}
.img-comp img.hand{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:screen;filter:contrast(1.2)}
.img-comp img.globe{position:absolute;top:10%;left:15%;width:70%;height:70%;object-fit:cover;border-radius:50%;animation:spin 6s linear infinite;mix-blend-mode:lighten;box-shadow:inset 0 0 20px #000}
@keyframes spin{to{transform:rotate(360deg)}}
.flash{color:#0fc;letter-spacing:4px;font-weight:bold;font-size:1.1rem;animation:bl 0.4s infinite alternate;text-shadow:0 0 10px #0fc}
@keyframes bl{from{opacity:0.2}to{opacity:1}}

#main{position:relative;z-index:10;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.wg{font-size:6rem;font-weight:bold;display:flex;align-items:baseline;gap:2px}
@media(min-width:768px){.wg{font-size:10rem}}
.node{cursor:pointer;display:inline-block;transition:transform .1s,color .2s,text-shadow .2s}
.n_lt:hover{color:var(--a1);text-shadow:0 0 20px var(--a1)}
#n_dot{color:var(--a2);font-size:0.2em;vertical-align:baseline;line-height:0;display:inline-block;position:relative;top:-0.1em}
#n_dot:hover{text-shadow:0 0 20px var(--a2)}
#n_wtf:hover{color:var(--a3);text-shadow:0 0 20px var(--a3)}
.shake{animation:shake .15s infinite}
@keyframes shake{0%{transform:translate(0)}20%{transform:translate(-4px,4px) skewX(2deg)}40%{transform:translate(4px,-4px) skewY(-2deg)}60%{transform:translate(-4px,-4px) skewX(-2deg);filter:hue-rotate(45deg)}80%{transform:translate(4px,4px) skewY(2deg)}100%{transform:translate(0)}}

#mute{position:fixed;right:14px;bottom:14px;z-index:10000;background:#000a;color:#fff;border:1px solid #555;border-radius:6px;padding:8px 12px;font-family:var(--f);cursor:pointer}
.modal{position:fixed;inset:0;background:#000e;backdrop-filter:blur(10px);z-index:1000;display:none;align-items:center;justify-content:center}
.modal.show{display:flex}
.mc{background:#0d0d12;border:1px solid #333;border-radius:8px;width:96%;max-width:1200px;max-height:92vh;padding:24px;overflow-y:auto;position:relative;color:#e0e0e0}
.x{position:absolute;top:10px;right:16px;background:none;border:0;color:#888;font-size:2rem;cursor:pointer}.x:hover{color:#fff}
h2{color:#ff0055;margin-bottom:4px}.sub{color:#888;font-size:.85rem;margin-bottom:14px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{background:#15151a;border:1px solid #333;color:#aaa;padding:6px 10px;border-radius:4px;cursor:pointer;font-family:var(--f);font-size:.8rem}
.tab.on{border-color:#00ffcc;color:#00ffcc}.tab.has::after{content:" ✓";color:#00ffcc}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input,.tools select{background:#000;color:#fff;border:1px solid #333;border-radius:4px;padding:8px;font-family:var(--f);flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.p{background:#15151a;border:1px solid #2a2a33;border-left:4px solid #444;border-radius:6px;padding:10px;cursor:pointer;font-size:.82rem;position:relative}
.p:hover{border-left-color:#00ffcc;transform:translateY(-2px);box-shadow:0 8px 24px #0008,0 0 0 1px #00ffcc55}
.p.sel{border-color:#00ffcc;background:#00ffcc12}
.p.dis{opacity:.4;filter:grayscale(1);cursor:not-allowed}.p.dis:hover{border-left-color:#444}
.p .n{margin-bottom:6px;line-height:1.3;word-break:break-word}.p .pr{color:#00ffcc;font-weight:bold}
.b{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:3px;margin-left:4px;background:#333;color:#ddd}
.b.u{background:#ffaa0033;color:#ffaa00}.b.s{background:#ff005533;color:#ff5588}
.em{position:absolute;top:8px;right:8px}
.why{color:#ff7799;font-size:.72rem;margin-top:5px}
.sum{background:#00ffcc0a;border:1px solid #00ffcc;border-radius:6px;padding:14px;font-size:.82rem;align-self:start;position:sticky;top:0;backdrop-filter:blur(8px)}
.sum h3{color:#fff;margin-bottom:8px}.sum div.r{display:flex;justify-content:space-between;gap:8px;margin:3px 0;color:#aaa}
.tot{font-size:1.8rem;color:#00ffcc;font-weight:bold;margin:8px 0}
.btn{background:#222;color:#fff;border:1px solid #555;padding:8px 12px;border-radius:4px;cursor:pointer;font-family:var(--f);margin:8px 6px 0 0}.btn:hover{background:#444}
.vs-btn{background:#ff005533;border-color:#ff0055;color:#fff}.vs-btn.on{background:#ff0055;color:#000;font-weight:bold}
.vs-view{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.vs-card{flex:1;min-width:260px;background:#15151a;border:1px solid #333;border-radius:8px;padding:16px}
.vs-card h3{color:#0fc;font-size:1.1rem;margin-bottom:10px}
.vs-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:0.9rem}
.vs-win{color:#0fc;font-weight:bold}.vs-lose{color:#f05;text-decoration:line-through opacity 0.5}

#meter{position:fixed;left:0;right:0;bottom:0;width:100%;height:64px;z-index:5;pointer-events:none}
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mc{background:linear-gradient(160deg,#10101c,#08080f);border:1px solid #ffffff14;box-shadow:0 30px 100px #000,0 0 0 1px #00ffcc22,0 0 80px #ff005512}
h2{background:linear-gradient(90deg,#ff0055,#ff9a00,#00ffcc);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.6rem;letter-spacing:2px}
h2 .tg{display:block;font-size:.7rem;letter-spacing:3px;color:#8a8aa0;-webkit-text-fill-color:#8a8aa0;margin-top:2px;text-transform:uppercase}
.wg{--beat:0;transform:scale(calc(1 + var(--beat)*.07));text-shadow:0 0 calc(10px + var(--beat)*40px) var(--a2)}
.hint{position:fixed;bottom:74px;left:0;right:0;text-align:center;color:#ffffff66;font-size:.72rem;letter-spacing:3px;z-index:6;pointer-events:none;text-transform:uppercase}

#prank{display:none;position:fixed;inset:0;background:#000;color:#0f0;font-family:'Courier New',monospace;z-index:100000;padding:5vw;font-size:3vh;text-shadow:0 0 10px #0f0}
#p_head{color:#f00;font-size:8vh;text-align:center;animation:pr 0.1s infinite;text-shadow:0 0 20px #f00}
@keyframes pr{0%,100%{transform:translate(0)}50%{transform:translate(5px,-5px)}}
#p_log{margin-top:40px;line-height:2}
#p_cd{font-size:20vh;text-align:center;color:#f00;margin-top:50px;font-weight:bold;text-shadow:0 0 40px #f00}
.bar{display:inline-block;background:#0f0;height:1em;width:0%;transition:width 1.5s linear;vertical-align:middle;margin-left:10px}
</style></head><body>
<audio id="bgm" src="dream.mp3" loop preload="auto"></audio>

<div id="prank" class="ns">
  <div id="p_head">HELLO RIZWAN</div>
  <div id="p_log"></div>
  <div id="p_cd"></div>
</div>

<div id="splash" class="ns">
  <div class="card">
    <div class="img-comp">
      <img class="hand" src="https://images.genius.com/06def14d746a07360d0052f958abea88.1000x1000x1.jpg" alt="Terminator Hand">
      <img class="globe" src="https://cms-imgp.jw-cdn.org/img/p/1102013400/univ/art/1102013400_univ_lsr_lg.jpg" alt="Globe">
    </div>
    <p class="flash">[ PRESS SPACE, CLICK, OR SCROLL UP TO ENTER ]</p>
  </div>
</div>

<button id="mute" class="ns" aria-label="Toggle music">♪ on</button>
<canvas id="bg"></canvas>
<canvas id="meter"></canvas>

<div id="main" class="ns">
  <div class="wg">
    <div id="n_d" class="node n_lt">d</div>
    <div id="n_r" class="node n_lt" style="color:var(--a3)">r</div>
    <div id="n_e" class="node n_lt">e</div>
    <div id="n_w" class="node n_lt">w</div>
    <div id="n_dot" class="node">🎃</div>
    <div id="n_wtf" class="node">wtf</div>
  </div>
</div>

<div class="hint ns">tap arrows to change the vibe</div>

<div id="mb" class="modal"><div class="mc"><button class="x" onclick="cm('mb');vsMode=false;vsItems=[];draw()">&times;</button>
<h2>PC BUILDER<span class="tg">smart compatibility &middot; vs mode &middot; live pricing</span></h2>
<p class="sub">Pick parts to build, or click VS Mode to compare 2 items head-to-head.</p>
<div class="layout"><div>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input id="q" placeholder="Search..." oninput="draw()">
    <select id="so" onchange="draw()">
      <option value="n">Sort: name</option>
      <option value="a">Price low-high</option>
      <option value="d">Price high-low</option>
    </select>
    <label><input type="checkbox" id="hu" onchange="draw()">Hide unavailable</label>
    <button id="btn_vs" class="btn vs-btn" onclick="toggleVS()">⚔️ VS MODE</button>
  </div>
  <div id="grid_wrap"><div class="grid" id="grid"></div></div>
</div>
<div class="sum" id="sum"></div></div></div></div>

<div id="mf" class="modal"><div class="mc fo"><button class="x" onclick="cm('mf')">&times;</button>
<h2>WTF TOOLBOX<span class="tg">copy-paste commands &middot; scratchpads &middot; free software</span></h2>
<div class="tabs" id="ft"></div><div id="fb"></div></div></div>

<script src="parts.js"></script>
<script>
/* ===== AUDIO ===== */
const bgm=document.getElementById('bgm'),mute=document.getElementById('mute');
let fell=false;
bgm.addEventListener('error',()=>{if(!fell){fell=true;bgm.crossOrigin="anonymous";bgm.src='https://raw.githubusercontent.com/hillierandrew/wtf/main/dream.mp3';bgm.load();if(open1)bgm.play().catch(()=>{})}});
let AC,muted=false,LIM=300,an,fd;
function beep(f,d=.08,t='square',v=.05){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const chime=()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*90)),sting=()=>{beep(55,.6,'sawtooth',.12);beep(58,.6,'square',.08)},buzz=()=>beep(90,.12,'sawtooth',.06),tick=()=>beep(900,.03,'square',.03);
function setupAn(){if(!/^https?:/.test(location.protocol)||fell)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const sr=AC.createMediaElementSource(bgm);an=AC.createAnalyser();an.fftSize=256;sr.connect(an);an.connect(AC.destination);fd=new Uint8Array(an.frequencyBinCount)}catch(e){an=null}}
mute.onclick=e=>{e.stopPropagation();muted=!muted;bgm.muted=muted;mute.textContent=muted?'♪ off':'♪ on'};

/* ===== ENTRY ===== */
let open1=false;const sp=document.getElementById('splash');
function unlock(e){
  if(open1) return;
  if(e.type==='keydown' && e.code!=='Space' && e.code!=='Enter') return;
  if(e.type==='wheel' && e.deltaY > 0) return; // scroll UP to enter
  open1=true;bgm.volume=.5;bgm.play().catch(()=>{});chime();setupAn();
  sp.style.opacity=0;sp.style.transform='scale(1.5)';sp.style.pointerEvents='none';
  setTimeout(()=>sp.remove(),650);
  ['click','keydown','wheel','touchend','pointerup'].forEach(t=>removeEventListener(t,unlock));anim();
}
['click','keydown','wheel','touchend','pointerup'].forEach(t=>addEventListener(t,unlock));
addEventListener('pointerup',()=>{if(open1&&bgm.paused&&!muted)bgm.play().catch(()=>{})});

/* ===== INTERACTION LOGIC ===== */
function pulse(el,col){el.style.color=col;el.style.transform='scale(1.2)';setTimeout(()=>{el.style.color='';el.style.transform=''},150)}
function om(id){document.getElementById(id).classList.add('show')}
function cm(id){document.getElementById(id).classList.remove('show')}

// Navigation mapping
const mapBuilder = e => { e.stopPropagation(); pulse(e.target,'#ff0055'); chime(); om('mb'); draw(); };
document.getElementById('n_d').onclick = mapBuilder;
document.getElementById('n_e').onclick = mapBuilder;
document.getElementById('n_w').onclick = mapBuilder;

document.getElementById('n_wtf').onclick = e => { e.stopPropagation(); pulse(e.target, '#ffaa00'); chime(); om('mf'); fshow(); };

let demon=false;const c={t:0};
document.getElementById('n_dot').onclick = e => {
  e.stopPropagation(); pulse(e.target,'');
  if(demon){demon=false;c.t=0;document.body.classList.remove('demonic');document.getElementById('main').classList.remove('shake');bgm.playbackRate=1;chime();return}
  c.t++;beep(110+c.t*45,.12,'sawtooth',.07);
  if(c.t>=6){c.t=0;demon=true;sting();document.body.classList.add('demonic');document.getElementById('main').classList.add('shake');bgm.playbackRate=.7}
};

// PRANK SEQUENCE (R)
let pranking = false;
document.getElementById('n_r').onclick = e => {
  e.stopPropagation(); pulse(e.target,'#f00');
  if(pranking) return;
  pranking = true;
  const p = document.getElementById('prank'), log = document.getElementById('p_log'), cd = document.getElementById('p_cd');
  p.style.display = 'block'; log.innerHTML = ''; cd.innerHTML = '';
  bgm.pause();
  
  const steps = [
    {t: "INITIALIZING PROTOCOL...", d: 1000},
    {t: "COPYING PHONE CONTENTS <span class='bar'></span>", d: 2500},
    {t: "UPLOADING TO RUSSIA <span class='bar'></span>", d: 2500},
    {t: "DELETING LOCAL DATA <span class='bar'></span>", d: 2000},
    {t: "CRITICAL FAILURE IMMINENT", d: 1000}
  ];
  
  let s = 0;
  function nextStep() {
    if(s < steps.length) {
      log.innerHTML += `<div>> ${steps[s].t}</div>`;
      beep(200,.1,'sawtooth',.2);
      let bars = p.querySelectorAll('.bar');
      if(bars.length) {
        setTimeout(()=>{ bars[bars.length-1].style.width = '200px'; }, 50);
      }
      setTimeout(nextStep, steps[s].d);
      s++;
    } else {
      let count = 15;
      let cdi = setInterval(() => {
        cd.innerHTML = count;
        beep(1000 + (15-count)*100, .15, 'square', .3);
        count--;
        if(count < 0) {
          clearInterval(cdi);
          cd.innerHTML = "LOL";
          cd.style.fontSize = "30vh";
          beep(150, 1, 'sawtooth', .4);
          setTimeout(() => { p.style.display='none'; pranking=false; cd.style.fontSize="20vh"; if(!muted) bgm.play(); }, 2500);
        }
      }, 1000);
    }
  }
  nextStep();
};

/* ===== CANVAS ENGINE & BILLION DOLLAR ANIMATIONS ===== */
const cv=document.getElementById('bg'),cx=cv.getContext('2d'),mc2=document.getElementById('meter'),mx=mc2.getContext('2d'),wg=document.querySelector('.wg');
function rs(){cv.width=innerWidth;cv.height=innerHeight;mc2.width=innerWidth;mc2.height=64}addEventListener('resize',rs);rs();
let bass=0,ms={x:0,y:0},rip=[];
addEventListener('pointermove',e=>{ms.x=e.clientX/innerWidth-.5;ms.y=e.clientY/innerHeight-.5});
addEventListener('pointerdown',e=>{if(open1)rip.push({x:e.clientX,y:e.clientY,r:0})});

const stars=Array.from({length:300},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random(),t:Math.random()*6}));
const nodes_web=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.001,vy:(Math.random()-.5)*.001}));
const EM=['🎃','🦇','👻','🕸','🕯'],fl=Array.from({length:34},()=>({x:Math.random(),y:Math.random(),s:14+Math.random()*26,e:EM[Math.random()*5|0],p:Math.random()*6}));
let dr=[];

let mode=0;const C=()=>demon?'255,40,40':'0,255,204';
const MODES=[
  // 0: Deep Starfield (Warp speed)
  (W,H,t)=>{
    let speed = 0.0015 * (1 + bass * 5) * (demon?2:1);
    stars.forEach(s=>{
      s.z -= speed;
      if(s.z<=0){s.z=1;s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;}
      const k=1/s.z, x=W/2+s.x*W*.3*k-ms.x*200*(1-s.z), y=H/2+s.y*H*.3*k-ms.y*200*(1-s.z);
      const a=Math.min(1,(1-s.z)*1.5);
      cx.fillStyle = demon ? `rgba(255,${50+Math.random()*50|0},50,${a})` : `rgba(150,220,255,${a})`;
      cx.beginPath(); cx.arc(x,y,(1-s.z)*3.5+.5,0,7); cx.fill();
      // Warp trails
      if(bass > 0.3) {
        cx.strokeStyle = cx.fillStyle; cx.lineWidth=(1-s.z)*2;
        cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+(x-W/2)*.05, y+(y-H/2)*.05); cx.stroke();
      }
    });
  },
  // 1: Interconnected Web (Billion dollar tech feel)
  (W,H)=>{
    nodes_web.forEach(n=>{n.x=(n.x+n.vx*(1+bass*4)+1)%1;n.y=(n.y+n.vy*(1+bass*4)+1)%1});
    nodes_web.forEach((a,i)=>{
      cx.fillStyle=demon?'#f33':'#0fc'; cx.beginPath(); cx.arc(a.x*W,a.y*H,2+bass*4,0,7); cx.fill();
      for(let j=i+1;j<nodes_web.length;j++){
        const b=nodes_web[j],d=Math.hypot((a.x-b.x)*W,(a.y-b.y)*H);
        if(d<160){
          cx.strokeStyle=`rgba(${C()},${(1-d/160)*.8})`; cx.lineWidth=1+bass*2;
          cx.beginPath(); cx.moveTo(a.x*W,a.y*H); cx.lineTo(b.x*W,b.y*H); cx.stroke();
        }
      }
    });
  },
  // 2: Matrix Rain
  (W,H)=>{
    const n=Math.ceil(W/18);while(dr.length<n)dr.push(Math.random()*H/18);
    cx.font='16px monospace'; cx.fillStyle=demon?'#ff3030':'#00ffcc';
    dr.forEach((y,i)=>{
      cx.fillText(String.fromCharCode(12448+Math.random()*96|0),i*18,y*18);
      dr[i]=y*18>H&&Math.random()>.97?0:y+1+bass*2;
    });
  },
  // 3: Abstract Sine Waves
  (W,H,t)=>{
    cx.lineWidth=3+bass*20;
    for(let k=0;k<5;k++){
      cx.strokeStyle=`hsla(${demon?k*12:150+k*30},100%,60%,${0.1+bass*.1})`;
      cx.beginPath();
      for(let x=0;x<=W;x+=15){
        const y=H/2 + Math.sin(x*.003 + t + k)*H*(.15+bass*.2) + Math.cos(x*.005-t*2)*50;
        x?cx.lineTo(x,y):cx.moveTo(x,y);
      }
      cx.stroke();
    }
  }
];

function changeMode() {
  cx.globalAlpha=.18;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.globalAlpha=1;
  beep(480+mode*110,.07,'triangle',.05);
}

addEventListener('keydown', e => {
  if(!open1 || document.querySelector('.modal.show')) return;
  if(e.code === 'ArrowRight' || e.code === 'ArrowDown') {
    mode = (mode + 1) % MODES.length; changeMode();
  } else if(e.code === 'ArrowLeft' || e.code === 'ArrowUp') {
    mode = (mode - 1 + MODES.length) % MODES.length; changeMode();
  }
});

function anim(){
  const W=cv.width,H=cv.height,t=performance.now()/1000,N=64,lv=[],idle=bgm.paused||bgm.muted;
  if(an&&!idle){an.getByteFrequencyData(fd);for(let i=0;i<N;i++)lv.push(fd[i]/255);bass=(fd[1]+fd[2]+fd[3]+fd[4])/1020}
  else{const b=idle?0:Math.pow(Math.max(0,Math.sin(t*Math.PI*2*1.9)),6);bass=bass*.8+b*.2;for(let i=0;i<N;i++)lv.push(idle?0:(.25+.5*Math.abs(Math.sin(t*3+i*.5)))*(.4+bass))}
  wg.style.setProperty('--beat',bass.toFixed(3));
  
  cx.fillStyle=demon?'rgba(10,0,0,.3)':'rgba(5,5,8,.3)';cx.fillRect(0,0,W,H);
  MODES[mode](W,H,t);
  
  rip=rip.filter(r=>(r.r+=6)<300);
  rip.forEach(r=>{cx.strokeStyle=`rgba(${C()},${1-r.r/300})`;cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.stroke()});
  
  const mw=mc2.width,mh=64;mx.clearRect(0,0,mw,mh);mx.strokeStyle=demon?'#f00':'#0fc';mx.lineWidth=2;mx.shadowBlur=10;mx.shadowColor=mx.strokeStyle;mx.beginPath();
  for(let i=0;i<N;i++){const x=i/(N-1)*mw,y=mh/2-(i%2?1:-1)*lv[i]*mh*.45;i?mx.lineTo(x,y):mx.moveTo(x,y)}mx.stroke();
  requestAnimationFrame(anim);
}

for(const k in RAW){const r=RAW[k],ks=r.k.split(' ');CAT[k]=r.t.split('\n').map(l=>{const v=l.split('|'),o={id:k+(id++),cat:k};ks.forEach((q,i)=>{o[q]=v[i]===undefined?'':v[i]});
o.price=+o.price;o.f=o.f||'';o.sold=o.f.includes('x');o.used=o.f.includes('u');o.pick=o.f.includes('p');
['w','rec','ddr','form','board','rad','igpu','sfx','sfxo'].forEach(q=>{if(o[q]!==undefined&&o[q]!=='')o[q]=+o[q]});return o})}

/* ===== VS MODE & BUILDER ===== */
const S={};let tab='cpu', vsMode=false, vsItems=[];
function toggleVS() {
  vsMode = !vsMode; vsItems=[]; 
  document.getElementById('btn_vs').classList.toggle('on', vsMode);
  draw();
}

function pair(a,b){
  const [x,y]=a.cat<b.cat?[a,b]:[b,a];const k=x.cat+'-'+y.cat;
  const M={cpu:a.cat==='cpu'?a:b,mb:a.cat==='mb'?a:b,ram:a.cat==='ram'?a:b,psu:a.cat==='psu'?a:b,gpu:a.cat==='gpu'?a:b,case:a.cat==='case'?a:b,cpucooler:a.cat==='cpucooler'?a:b};
  if(k==='cpu-mb'&&M.cpu.sock!==M.mb.sock)return M.cpu.sock+' CPU needs '+M.cpu.sock+' board';
  if(k==='mb-ram'&&M.ram.ddr!==M.mb.ddr)return 'DDR'+M.mb.ddr+' board with DDR'+M.ram.ddr+' RAM';
  if(k==='case-mb'&&M.mb.form>M.case.board)return 'Board too large for case';
  if(k==='case-cpucooler'&&M.cpucooler.rad>M.case.rad)return 'Radiator exceeds case limit';
  if(k==='case-psu'&&M.case.sfxo&&!M.psu.sfx)return 'Case requires SFX PSU';
  return null;
}
function why(p){const r=[];for(const c in S){if(c===p.cat)continue;const m=pair(p,S[c]);if(m)r.push(m)}return r}

const $=i=>document.getElementById(i),usd=n=>'$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});

function draw(){
  $('tabs').innerHTML=Object.keys(LAB).map(k=>`<button class="tab ${k===tab?'on':''} ${S[k]?'has':''}" onclick="tab='${k}';LIM=300;draw()">${LAB[k]}</button>`).join('');
  const q=$('q').value.toLowerCase(),so=$('so').value,cd=$('cond').value,others=Object.keys(S).filter(k=>k!==tab).length;
  let L=CAT[tab].filter(p=>(!q||p.name.toLowerCase().includes(q))&&(cd===''||(cd==='used')===p.used)&&(!$('hu').checked||!p.sold));
  L.sort((a,b)=>so==='a'?a.price-b.price:so==='d'?b.price-a.price:a.name.localeCompare(b.name));
  
  if(vsMode && vsItems.length === 2) {
    $('grid_wrap').innerHTML = renderVS(vsItems[0], vsItems[1]);   } else {$('grid_wrap').innerHTML = `<div class="grid" id="grid">` + L.slice(0,LIM).map(p=>{
      const w=why(p),bad=w.length>0,sel=S[tab]&&S[tab].id===p.id, vsSel = vsItems.includes(p), em=bad?'❌':(others?'🟢':'');
      return `<div class="p ${sel||vsSel?'sel':''} ${bad&&!sel&&!vsMode?'dis':''} ${p.sold?'na':''}" onclick="pick('${p.id}')">
      ${!vsMode?`<span class="em">${em}</span>`:''}
      <div class="n"><b>${p.name}</b></div><span class="pr">${usd(p.price)}</span>
      ${vsSel?`<span class="b y">VS Selected</span>`:''}
      ${bad&&!vsMode?`<div class="why">${w[0]}</div>`:''}</div>`
    }).join('') + `</div>` + (L.length>LIM?`<button class="btn" onclick="LIM+=300;draw()">Show more</button>`:'');
  }
  summary();
}

function pick(i){
  const p=CAT[tab].find(x=>x.id===i);beep(1200,.05,'square',.04);
  if(vsMode) {
    if(vsItems.includes(p)) vsItems = vsItems.filter(x=>x!==p);
    else if(vsItems.length < 2) vsItems.push(p);
  } else {
    if(S[tab]&&S[tab].id===i) delete S[tab];
    else { S[tab]=p; for(const c in S) if(c!==tab&&pair(p,S[c])) delete S[c]; }
  }
  draw();
}

function renderVS(a, b) {
  const cRow = (label, vA, vB, better) => {
    let aCls = '', bCls = '';
    if(better === 1) { aCls='vs-win'; bCls='vs-lose'; }
    if(better === 2) { bCls='vs-win'; aCls='vs-lose'; }
    return `<div class="vs-row"><span>${label}</span><span class="${aCls}">${vA}</span><span class="${bCls}">${vB}</span></div>`;
  };
  
  let rows = cRow('Price', usd(a.price), usd(b.price), a.price < b.price ? 1 : (b.price < a.price ? 2 : 0));
  
  if(a.w !== undefined) rows += cRow('Wattage', a.w+'W', b.w+'W', a.w > b.w ? 1 : (b.w > a.w ? 2 : 0));
  if(a.rad !== undefined) rows += cRow('Radiator', a.rad+'mm', b.rad+'mm', 0);
  if(a.sock !== undefined) rows += cRow('Socket', a.sock, b.sock, 0);
  
  return `<div class="vs-view">
    <div class="vs-card"><h3>A: ${a.name}</h3></div>
    <div class="vs-card" style="flex:2">
      ${rows}
      <button class="btn" onclick="vsItems=[];draw()" style="width:100%;margin-top:15px">Clear VS</button>
    </div>
    <div class="vs-card"><h3>B: ${b.name}</h3></div>
  </div>`;
}

function summary(){
  if(vsMode) { $('sum').innerHTML = `<h3>VS MODE ACTIVE</h3><p style="color:#aaa">Select 2 items in the same category to compare.</p>`; return; }
  const it=Object.values(S),tot=it.reduce((a,b)=>a+b.price,0),need=(S.cpu?S.cpu.w:0)+(S.gpu?S.gpu.w:0)+100,psu=S.psu?S.psu.w:0;
  const pct=psu?Math.min(100,need/psu*100):0;
  $('sum').innerHTML=`<h3>SYSTEM TOTAL</h3>${Object.keys(LAB).map(k=>`<div class="r"><span>${LAB[k]}</span><span>${S[k]?usd(S[k].price):'-'}</span></div>`).join('')}
  <div class="tot">${usd(tot)}</div><div class="r"><span>Est. draw</span><span>${need}W</span></div>
  <div class="bar"><i style="width:${pct}%;background:${pct>100?'#f05':pct>80?'#fa0':'#0fc'}"></i></div>
  <div class="r"><span>PSU limit</span><span>${psu?psu+'W':'-'}</span></div>
  <button class="btn" onclick="for(const k in S)delete S[k];draw()">Reset</button>`;
}
