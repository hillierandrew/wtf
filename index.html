<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>drew.wtf</title>
<style>
:root{--bg:#050508;--fg:#e0e0e0;--a1:#ff0055;--a2:#00ffcc;--a3:#ffaa00;--f:'Courier New',Courier,monospace}
body.demonic{--bg:#050000;--fg:#ff3333;--a1:#aa0000;--a2:#ff0000;--a3:#ff0000}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f);transition:background 1s,color 1s, transform 1s}
.ns{user-select:none;-webkit-user-select:none}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:1}

/* ===== ARTSY CODE-DRIVEN SPLASH SCREEN ===== */
#splash {
  position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(circle at center, #0a0a0f 0%, #000 100%); cursor:pointer;
  transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 1.2s;
  perspective: 1000px;
}
.splash-content { display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; }
.gyro {
  position: relative; width: 180px; height: 180px; transform-style: preserve-3d;
  animation: floatOrb 6s ease-in-out infinite, spinMaster 20s linear infinite; margin-bottom: 60px;
}
.ring {
  position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 15px rgba(0,255,204,0.1), inset 0 0 15px rgba(0,255,204,0.1);
  border: 1px solid rgba(0, 255, 204, 0.4);
}
.ring:nth-child(1) { transform: rotateX(60deg) rotateY(0deg); animation: spinX 8s linear infinite; border-color: rgba(255, 0, 85, 0.5); box-shadow: 0 0 20px rgba(255,0,85,0.2), inset 0 0 20px rgba(255,0,85,0.2); }
.ring:nth-child(2) { transform: rotateX(0deg) rotateY(60deg); animation: spinY 12s linear infinite reverse; }
.ring:nth-child(3) { transform: rotateX(45deg) rotateY(45deg); animation: spinZ 10s linear infinite; border: 2px solid rgba(0, 255, 204, 0.1); }
.gyro-core {
  position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%);
  background: #0fc; border-radius: 50%; box-shadow: 0 0 40px #0fc, 0 0 80px #0fc, 0 0 120px #0fc;
  animation: corePulse 3s infinite alternate;
}
.splash-title {
  font-size: 2.5rem; font-weight: 300; letter-spacing: 1.5rem; margin-right: -1.5rem; margin-bottom: 20px;
  color: #fff; text-transform: uppercase; text-shadow: 0 0 20px rgba(255,255,255,0.3);
  animation: titleGlow 4s infinite alternate;
}
.splash-prompt {
  color: #888; font-size: 0.75rem; letter-spacing: 0.4rem; margin-right: -0.4rem; text-transform: uppercase;
  animation: promptBlink 2s infinite; border-top: 1px solid #222; padding-top: 20px; width: 100%; text-align: center;
  white-space: nowrap; /* Fixes off-center bracket wrapping */
}
.splash-overlay { position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.3) 2px, rgba(0,0,0,0.3) 4px); pointer-events: none; z-index: 10; opacity: 0.5; }
@keyframes spinMaster { 100% { transform: rotateZ(360deg) rotateX(360deg); } }
@keyframes spinX { 100% { transform: rotateX(420deg) rotateY(0deg); } }
@keyframes spinY { 100% { transform: rotateX(0deg) rotateY(420deg); } }
@keyframes spinZ { 100% { transform: rotateX(405deg) rotateY(405deg); } }
@keyframes floatOrb { 0%, 100% { top: 0; } 50% { top: -20px; } }
@keyframes corePulse { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
@keyframes titleGlow { 0% { text-shadow: 0 0 10px rgba(255,255,255,0.1); } 100% { text-shadow: 0 0 30px rgba(0,255,204,0.6); } }
@keyframes promptBlink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; color: #0fc; } }

/* ===== MAIN UI & BOTTOM CONTROLS ===== */
#main { position:relative; z-index:10; width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.wg { font-size:6rem; font-weight:bold; display:flex; align-items:baseline; gap:2px; transition: transform 1s cubic-bezier(0.16,1,0.3,1); }
@media(min-width:768px){.wg{font-size:10rem}}
.node { cursor:pointer; display:inline-block; transition:transform .1s,color .2s,text-shadow .2s; }
.n_lt:hover { color:var(--a1); text-shadow:0 0 20px var(--a1); }
#n_dot { color:var(--a2); font-size:0.2em; vertical-align:baseline; line-height:0; display:inline-block; position:relative; top:-0.1em; }
#n_dot:hover { text-shadow:0 0 20px var(--a2); }
#n_wtf:hover { color:var(--a3); text-shadow:0 0 20px var(--a3); }
.wg { --beat:0; transform:scale(calc(1 + var(--beat)*.07)); text-shadow:0 0 calc(10px + var(--beat)*40px) var(--a2); }
.shake { animation:shake .15s infinite; }
@keyframes shake{0%{transform:translate(0)}20%{transform:translate(-4px,4px) skewX(2deg)}40%{transform:translate(4px,-4px) skewY(-2deg)}60%{transform:translate(-4px,-4px) skewX(-2deg);filter:hue-rotate(45deg)}80%{transform:translate(4px,4px) skewY(2deg)}100%{transform:translate(0)}}

#btm_ctrl {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 15px; align-items: center; z-index: 10000;
  background: rgba(15,15,20,0.6); backdrop-filter: blur(10px);
  padding: 8px 20px; border-radius: 40px; border: 1px solid rgba(0,255,204,0.15);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
#btm_ctrl button { background: none; border: none; color: #aaa; font-family: var(--f); font-size: 1rem; cursor: pointer; padding: 4px 10px; transition: 0.2s; }
#btm_ctrl button:hover { color: #0fc; text-shadow: 0 0 10px #0fc; }
#anim_lbl { color: #fff; font-size: 0.8rem; letter-spacing: 2px; min-width: 80px; text-align: center; }
#mute_btn { border-left: 1px solid #333 !important; margin-left: 5px; }

/* ===== OUIJA BOARD ===== */
#ouija {
  position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); width: 90vw; max-width: 800px;
  display: none; flex-direction: column; opacity: 0; transition: opacity 1.5s;
  text-align: center; color: #b18862; font-family: 'Times New Roman', serif; z-index: 15;
}
.demonic #main .wg { transform: translateY(-35vh) scale(0.5); }
.demonic #ouija { display: flex; opacity: 1; pointer-events: auto; }
.ouija-row { display: flex; justify-content: center; align-items: flex-end; }
.ouija-btn { cursor: pointer; transition: 0.2s; font-size: clamp(1.2rem, 3vw, 2.5rem); font-weight: bold; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
.ouija-btn:hover { color: #f00; text-shadow: 0 0 20px #f00, 0 0 40px #f00; transform: scale(1.4) !important; background: rgba(255,0,0,0.1); border-radius: 10px; }
#ouija_out { font-family: var(--f); color: #fff; text-shadow: 0 0 10px #f00; font-size: 1.2rem; min-height: 2rem; margin-top: 30px; letter-spacing: 5px; }

/* ===== PRANK SCREEN ===== */
#prank { display:none; position:fixed; inset:0; background:#000; color:#0f0; font-family:var(--f); z-index:100000; padding:5vw; font-size:3vh; text-shadow:0 0 10px #0f0; }
#p_head { color:#f00; font-size:8vh; text-align:center; animation:pr 0.1s infinite; text-shadow:0 0 20px #f00; }
@keyframes pr{0%,100%{transform:translate(0)}50%{transform:translate(5px,-5px)}}
#p_log { margin-top:40px; line-height:2; }
#p_cd { font-size:20vh; text-align:center; color:#f00; margin-top:50px; font-weight:bold; text-shadow:0 0 40px #f00; }
.pbar { display:inline-block; background:#0f0; height:1em; width:0%; transition:width 1.5s linear; vertical-align:middle; margin-left:10px; }

/* ===== MODAL & PC BUILDER UI ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,5,0.9);backdrop-filter:blur(15px);z-index:1000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s;}
.modal.show{display:flex;opacity:1;animation:popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);}
@keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.mc{background:linear-gradient(160deg,#10101c,#08080f);border:1px solid rgba(255,255,255,0.08);border-radius:12px;width:96%;max-width:1200px;max-height:92vh;padding:24px;overflow-y:auto;position:relative;color:#e0e0e0;box-shadow:0 30px 100px #000,0 0 0 1px rgba(0,255,204,0.1),0 0 80px rgba(255,0,85,0.05);}
.x{position:absolute;top:10px;right:16px;background:none;border:0;color:#888;font-size:2rem;cursor:pointer;transition:color 0.2s;}.x:hover{color:#fff}
h2{background:linear-gradient(90deg,#ff0055,#ff9a00,#00ffcc);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.6rem;letter-spacing:2px;margin-bottom:4px;}
h2 .tg{display:block;font-size:.7rem;letter-spacing:3px;color:#8a8aa0;-webkit-text-fill-color:#8a8aa0;margin-top:2px;text-transform:uppercase}
.sub{color:#888;font-size:.85rem;margin-bottom:14px}
.layout{display:grid;grid-template-columns:1fr 340px;gap:20px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{background:#15151a;border:1px solid #333;color:#aaa;padding:8px 14px;border-radius:999px;cursor:pointer;font-family:var(--f);font-size:.8rem;transition:all 0.2s;}

.tools input,.tools select{background:#000;color:#fff;border:1px solid #333;border-radius:6px;padding:8px;font-family:var(--f);flex:1;min-width:120px;transition:border-color 0.2s;}

.p{background:linear-gradient(160deg,#171724,#101018);border:1px solid #2a2a33;border-left:4px solid #444;border-radius:10px;padding:12px;cursor:pointer;font-size:.82rem;position:relative;transition:transform .2s,box-shadow .2s;}
.p:hover{border-left-color:#00ffcc;transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,0.6),0 0 0 1px rgba(0,255,204,0.3)}
.p.sel{border-color:#00ffcc;background:rgba(0,255,204,0.05);border-left-color:#00ffcc;}
.p.dis{opacity:.4;filter:grayscale(1);cursor:not-allowed}.p.dis:hover{border-left-color:#444;transform:none;box-shadow:none;}
.p .n{margin-bottom:6px;line-height:1.3;word-break:break-word}.p .pr{color:#00ffcc;font-weight:bold;font-size:1.1em;}
.b{display:inline-block;font-size:.7rem;padding:2px 6px;border-radius:4px;margin-left:4px;background:#333;color:#ddd;letter-spacing:1px;}
.b.u{background:#ffaa0033;color:#ffaa00}.b.s{background:#ff005533;color:#ff5588}
.em{position:absolute;top:8px;right:8px}
.why{color:#ff7799;font-size:.72rem;margin-top:5px}

/* Enhanced Summary UI */
.sum{background:linear-gradient(160deg,rgba(0,255,204,0.05),rgba(255,0,85,0.05));border:1px solid rgba(0,255,204,0.2);border-radius:12px;padding:20px;font-size:.85rem;align-self:start;position:sticky;top:0;backdrop-filter:blur(8px)}
.sum h3{color:#fff;margin-bottom:15px;font-size:1.1rem;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:10px;}
.sum-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0; }
.sum-row { display:flex; justify-content:space-between; margin-bottom: 4px; }
.sum-cat { color: #888; font-weight: bold; }
.sum-price { color: #aaa; }
.sum-name { color: #0fc; font-size: 0.8rem; display: block; line-height: 1.3; }

.tot{font-size:2.2rem;color:#00ffcc;font-weight:bold;margin:15px 0 5px;text-shadow:0 0 15px rgba(0,255,204,0.4);}
.bar{height:6px;background:#222;border-radius:3px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#00ffcc}
.btn{background:#222;color:#fff;border:1px solid #555;padding:8px 16px;border-radius:6px;cursor:pointer;font-family:var(--f);margin:8px 6px 0 0;transition:all 0.2s;}.btn:hover{background:#333;border-color:#00ffcc;color:#00ffcc;}
.vs-btn{background:rgba(255,0,85,0.1);border-color:#ff0055;color:#ff0055}.vs-btn.on{background:#ff0055;color:#000;font-weight:bold;box-shadow:0 0 15px rgba(255,0,85,0.5);}
.pb-btn{background:rgba(170,0,255,0.1);border-color:#aa00ff;color:#e088ff}.pb-btn.on{background:#aa00ff;color:#fff;font-weight:bold;box-shadow:0 0 15px rgba(170,0,255,0.5);}
.vs-view{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.vs-card{flex:1;min-width:260px;background:#15151a;border:1px solid #333;border-radius:12px;padding:20px;box-shadow:inset 0 0 30px rgba(0,0,0,0.5);}
.vs-card h3{color:#0fc;font-size:1.2rem;margin-bottom:15px;line-height:1.4;}
.vs-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #222;font-size:0.95rem}
.vs-win{color:#0fc;font-weight:bold;text-shadow:0 0 10px rgba(0,255,204,0.3);}.vs-lose{color:#f05;text-decoration:line-through;opacity:0.6}
.pb-card{background:linear-gradient(135deg,#151520,#0a0a10);border:1px solid #aa00ff;border-radius:12px;padding:20px;text-align:center;transition:0.2s;}
.pb-card:hover{transform:scale(1.02);box-shadow:0 0 20px rgba(170,0,255,0.3);}
.pb-card h3{color:#e088ff;margin-bottom:10px;font-size:1.3rem;}

#meter{position:fixed;left:0;right:0;bottom:0;width:100%;height:64px;z-index:5;pointer-events:none}
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style></head><body>

<script>
/* ===== AUDIO ===== */
const bgm=document.getElementById('bgm'),muteBtn=document.getElementById('mute_btn');
let fell=false;
bgm.addEventListener('error',()=>{if(!fell){fell=true;bgm.crossOrigin="anonymous";bgm.src='https://raw.githubusercontent.com/hillierandrew/wtf/main/dream.mp3';bgm.load();if(open1)bgm.play().catch(()=>{})}});
let AC,muted=false,LIM=300,an,fd;
function beep(f,d=.08,t='square',v=.05){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const chime=()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*90)),sting=()=>{beep(55,.6,'sawtooth',.12);beep(58,.6,'square',.08)},buzz=()=>beep(90,.12,'sawtooth',.06),tick=()=>beep(900,.03,'square',.03);
function setupAn(){if(!/^https?:/.test(location.protocol)||fell)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const sr=AC.createMediaElementSource(bgm);an=AC.createAnalyser();an.fftSize=256;sr.connect(an);an.connect(AC.destination);fd=new Uint8Array(an.frequencyBinCount)}catch(e){an=null}}

function toggleMute() {
  muted = !muted; bgm.muted = muted;
  muteBtn.textContent = muted ? '♪ OFF' : '♪ ON';
  muteBtn.style.color = muted ? '#f05' : '#aaa';
}

/* ===== ENTRY ===== */
let open1=false;const sp=document.getElementById('splash');
function unlock(e){
  if(open1) return;
  if(e.type==='keydown' && e.code!=='Space' && e.code!=='Enter') return;
  if(e.type==='wheel' && e.deltaY > 0) return; // scroll UP to enter
  open1=true;bgm.volume=.5;bgm.play().catch(()=>{});chime();setupAn();
  sp.style.opacity=0;sp.style.transform='scale(1.2)';sp.style.filter='blur(10px)';sp.style.pointerEvents='none';
  setTimeout(()=>sp.remove(),1200);
  ['click','keydown','wheel','touchend','pointerup'].forEach(t=>removeEventListener(t,unlock));anim();
}
['click','keydown','wheel','touchend','pointerup'].forEach(t=>addEventListener(t,unlock));

/* ===== CLICK COUNTERS & EASTER EGGS ===== */
function pulse(el,col){el.style.color=col;el.style.transform='scale(1.2)';setTimeout(()=>{el.style.color='';el.style.transform=''},150)}
function om(id){document.getElementById(id).classList.add('show')}
function cm(id){document.getElementById(id).classList.remove('show')}

let clk_dew = 0, clk_r = 0, clk_wtf = 0;

// PC Maker (10 clicks on D E W combined)
const checkDew = (e) => {
  e.stopPropagation(); pulse(e.target,'#ff0055'); chime();
  clk_dew++; if(clk_dew >= 10) { clk_dew=0; om('mb'); draw(); }
};
document.getElementById('n_d').onclick = checkDew;
document.getElementById('n_e').onclick = checkDew;
document.getElementById('n_w').onclick = checkDew;

// Linux/Powershell Toolbox (10 clicks on WTF)
document.getElementById('n_wtf').onclick = e => {
  e.stopPropagation(); pulse(e.target, '#ffaa00'); chime();
  clk_wtf++; if(clk_wtf >= 10) { clk_wtf=0; om('mf'); fshow(); }
};

// Rizwan Protocol (6 clicks on R)
let pranking = false;
document.getElementById('n_r').onclick = e => {

function startRizwan() {
  if(pranking) return; pranking = true;
  const p = document.getElementById('prank'), log = document.getElementById('p_log'), cd = document.getElementById('p_cd');
  p.style.display = 'block'; log.innerHTML = ''; cd.innerHTML = ''; bgm.pause();
  const steps = [
    {t: "INITIALIZING PROTOCOL...", d: 1000}, {t: "COPYING PHONE CONTENTS <span class='pbar'></span>", d: 2000},
    {t: "UPLOADING TO RUSSIA <span class='pbar'></span>", d: 2000}, {t: "DELETING LOCAL DATA <span class='pbar'></span>", d: 1500},
    {t: "CRITICAL FAILURE IMMINENT", d: 1000}
  ];
  let s = 0;
  function nextStep() {
    if(s < steps.length) {
      log.innerHTML += `<div>> ${steps[s].t}</div>`; beep(200,.1,'sawtooth',.2);
      let bars = p.querySelectorAll('.pbar');
      if(bars.length) setTimeout(()=>{ bars[bars.length-1].style.width = '200px'; }, 50);
      setTimeout(nextStep, steps[s].d); s++;
    } else {
      let count = 15;
      let cdi = setInterval(() => {
        cd.innerHTML = count; beep(1000 + (15-count)*100, .15, 'square', .3); count--;
        if(count < 0) {
          clearInterval(cdi); cd.innerHTML = "LOL"; cd.style.fontSize = "30vh"; beep(150, 1, 'sawtooth', .4);
          setTimeout(() => { p.style.display='none'; pranking=false; cd.style.fontSize="20vh"; if(!muted) bgm.play(); }, 2500);
        }
      }, 1000);
    }
  }
  nextStep();
}

};

const cv=document.getElementById('bg'),cx=cv.getContext('2d'),mc2=document.getElementById('meter'),mx=mc2.getContext('2d');

let bass=0,ms={x:0,y:0},rip=[];
addEventListener('pointermove',e=>{ms.x=e.clientX/innerWidth-.5;ms.y=e.clientY/innerHeight-.5});

const stars=Array.from({length:300},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random(),t:Math.random()*6}));
const nodes_web=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.001,vy:(Math.random()-.5)*.001}));
let dr=[], vortex=Array.from({length:200},()=>({ a:Math.random()*Math.PI*2, r:Math.random(), v:0.01+Math.random()*0.02 }));

let mode=0;const C=()=>demon?'255,40,40':'0,255,204';
const MODES=[
  // 1: Interconnected Web
  (W,H)=>{
    nodes_web.forEach(n=>{n.x=(n.x+n.vx*(1+bass*4)+1)%1;n.y=(n.y+n.vy*(1+bass*4)+1)%1});
    nodes_web.forEach((a,i)=>{
      cx.fillStyle=demon?'#f33':'#0fc'; cx.beginPath(); cx.arc(a.x*W,a.y*H,2+bass*4,0,7); cx.fill();
      for(let j=i+1;j<nodes_web.length;j++){
        const b=nodes_web[j],d=Math.hypot((a.x-b.x)*W,(a.y-b.y)*H);
        if(d<160){
          cx.strokeStyle=`rgba(${C()},${(1-d/160)*.8})`; cx.lineWidth=1+bass*2;
          cx.beginPath(); cx.moveTo(a.x*W,a.y*H); cx.lineTo(b.x*W,b.y*H); cx.stroke();
        }
      }
    });
  },
  // 2: Deep Starfield Warp
  (W,H,t)=>{
    let speed = 0.0015 * (1 + bass * 5) * (demon?2:1);
    stars.forEach(s=>{
      s.z -= speed;
      if(s.z<=0){s.z=1;s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;}
      const k=1/s.z, x=W/2+s.x*W*.3*k-ms.x*200*(1-s.z), y=H/2+s.y*H*.3*k-ms.y*200*(1-s.z);
      const a=Math.min(1,(1-s.z)*1.5);
      cx.fillStyle = demon ? `rgba(255,${50+Math.random()*50|0},50,${a})` : `rgba(150,220,255,${a})`;
      cx.beginPath(); cx.arc(x,y,(1-s.z)*3.5+.5,0,7); cx.fill();
      if(bass > 0.3) { cx.strokeStyle = cx.fillStyle; cx.lineWidth=(1-s.z)*2; cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+(x-W/2)*.05, y+(y-H/2)*.05); cx.stroke(); }
    });
  },
  // 3: Matrix Rain
  (W,H)=>{
    const n=Math.ceil(W/18);while(dr.length<n)dr.push(Math.random()*H/18);
    cx.font='16px monospace'; cx.fillStyle=demon?'#ff3030':'#00ffcc';
    dr.forEach((y,i)=>{
      cx.fillText(String.fromCharCode(12448+Math.random()*96|0),i*18,y*18);
      dr[i]=y*18>H&&Math.random()>.97?0:y+1+bass*2;
    });
  },
  // 4: Geometric Audio visualizer
  (W,H,t)=>{
    cx.lineWidth = 2 + bass * 10;
    const cx_c = W/2 + ms.x*100, cy_c = H/2 + ms.y*100;
    for(let i=1; i<=6; i++) {
      cx.strokeStyle = `hsla(${demon?0:160}, 100%, ${50-i*5}%, ${0.2 + bass*0.3})`;
      let r = i*50 + bass*150 + Math.sin(t*2 + i)*20;
      cx.beginPath();
      for(let j=0; j<=6; j++) {
        let a = j*(Math.PI*2/6) + t*(i%2?1:-1)*0.5;
        let px = cx_c + Math.cos(a)*r, py = cy_c + Math.sin(a)*r;
        j===0?cx.moveTo(px,py):cx.lineTo(px,py);
      }
      cx.stroke();
    }
  },
  // 5: Particle Vortex
  (W,H,t)=>{
    const cx_c = W/2, cy_c = H/2;
    vortex.forEach(p => {
      p.a += p.v * (1+bass*2) * (demon?-1:1);
      p.r -= 0.002;
      if(p.r <= 0) { p.r = 1; p.a = Math.random()*Math.PI*2; }
      let rad = p.r * Math.max(W,H);
      let x = cx_c + Math.cos(p.a + t)*rad - ms.x*150*p.r;
      let y = cy_c + Math.sin(p.a + t)*rad - ms.y*150*p.r;
      cx.fillStyle = `rgba(${C()}, ${1-p.r})`;
      cx.beginPath(); cx.arc(x,y, 2+bass*4, 0, 7); cx.fill();
    });
  },
  // 6: RGB Oscilloscope Wave
  (W,H,t)=>{
    cx.lineWidth = 4 + bass*5;
    cx.beginPath();
    for(let x=0; x<=W; x+=10) {
      let y = H/2 + Math.sin(x*0.01 + t*3)*100*(1+bass) + Math.cos(x*0.02 - t*2)*50;
      let hue = demon ? 0 : (t*100 + x*0.1)%360; // Vibrant color cycle
      cx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.8)`;
      x===0 ? cx.moveTo(x,y) : cx.lineTo(x,y);
    }
    cx.stroke();
  },
  // 7: Neon Dancefloor Grid
  (W,H,t)=>{
    const s = 50;
    for(let x=0; x<W; x+=s) {
      for(let y=0; y<H; y+=s) {
        let wave = Math.sin(x*0.01 + t*2) + Math.cos(y*0.01 + t*2);
        let hue = demon ? (wave>0?0:20) : (t*50 + x*0.1 + y*0.1)%360;
        let alpha = Math.max(0, wave * (0.2 + bass*0.6));
        cx.fillStyle = `hsla(${hue}, 100%, 60%, ${alpha})`;
        cx.fillRect(x+1, y+1, s-2, s-2);
      }
    }
  }
];

}

function anim(){
  const W=cv.width,H=cv.height,t=performance.now()/1000,N=64,lv=[],idle=bgm.paused||bgm.muted;
  if(an&&!idle){an.getByteFrequencyData(fd);for(let i=0;i<N;i++)lv.push(fd[i]/255);bass=(fd[1]+fd[2]+fd[3]+fd[4])/1020}
  else{const b=idle?0:Math.pow(Math.max(0,Math.sin(t*Math.PI*2*1.9)),6);bass=bass*.8+b*.2;for(let i=0;i<N;i++)lv.push(idle?0:(.25+.5*Math.abs(Math.sin(t*3+i*.5)))*(.4+bass))}
  document.querySelector('.wg').style.setProperty('--beat',bass.toFixed(3));
  
  cx.fillStyle=demon?'rgba(10,0,0,.3)':'rgba(5,5,8,.3)';cx.fillRect(0,0,W,H);
  MODES[mode](W,H,t);
  
  rip=rip.filter(r=>(r.r+=6)<300);
  rip.forEach(r=>{cx.strokeStyle=`rgba(${C()},${1-r.r/300})`;cx.lineWidth=2;cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.stroke()});
  
  const mw=mc2.width,mh=64;mx.clearRect(0,0,mw,mh);mx.strokeStyle=demon?'#f00':'#0fc';mx.lineWidth=2;mx.shadowBlur=10;mx.shadowColor=mx.strokeStyle;mx.beginPath();
  for(let i=0;i<N;i++){const x=i/(N-1)*mw,y=mh/2-(i%2?1:-1)*lv[i]*mh*.45;i?mx.lineTo(x,y):mx.moveTo(x,y)}mx.stroke();
  requestAnimationFrame(anim);
}

  document.getElementById('btn_pb').classList.toggle('on', pbMode);
  document.getElementById('btn_vs').classList.remove('on');

function loadPB(idx) {
  for(let k in S) delete S[k];
  let bp = P_BUILDS[idx].p;
  for(let cat in bp) {
    let f = CAT[cat].find(x => x.name === bp[cat]);
    if(f) S[cat] = f;
  }
  pbMode = false; document.getElementById('btn_pb').classList.remove('on');
  draw();
}

function pair(a,b){
  const [x,y]=a.cat<b.cat?[a,b]:[b,a];const k=x.cat+'-'+y.cat;
  const M={cpu:a.cat==='cpu'?a:b,mb:a.cat==='mb'?a:b,ram:a.cat==='ram'?a:b,psu:a.cat==='psu'?a:b,gpu:a.cat==='gpu'?a:b,case:a.cat==='case'?a:b,cpucooler:a.cat==='cpucooler'?a:b};
  if(k==='cpu-mb'&&M.cpu.sock!==M.mb.sock)return 'Incompatible socket';
  if(k==='mb-ram'&&M.ram.ddr!==M.mb.ddr)return 'RAM/Board DDR mismatch';
  if(k==='case-mb'&&M.mb.form>M.case.board)return 'Board too large for case';
  if(k==='case-cpucooler'&&M.cpucooler.rad>M.case.rad)return 'Radiator exceeds case limit';
  return null;
}
function why(p){const r=[];for(const c in S){if(c===p.cat)continue;const m=pair(p,S[c]);if(m)r.push(m)}return r}

const $=i=>document.getElementById(i),usd=n=>'$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});

function draw(){
  $('tabs').innerHTML=Object.keys(LAB).map(k=>`<button class="tab ${k===tab?'on':''} ${S[k]?'has':''}" onclick="tab='${k}';LIM=300;draw()">${LAB[k]}</button>`).join('');
  const q=$('q').value.toLowerCase(),so=$('so').value,cd=$('hu').checked,others=Object.keys(S).filter(k=>k!==tab).length;
  let L=CAT[tab].filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!cd||!p.sold));
  L.sort((a,b)=>so==='a'?a.price-b.price:so==='d'?b.price-a.price:a.name.localeCompare(b.name));
  
  if(pbMode) {
    $('grid_wrap').innerHTML = `<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; padding:20px 0;">` + P_BUILDS.map((b,i) => `
      <div class="pb-card">
        <h3>${b.n}</h3><p style="color:#888;margin-bottom:15px;">${b.desc}</p>
        <button class="btn" onclick="loadPB(${i})" style="width:100%;background:#aa00ff;border-color:#aa00ff;">LOAD THIS BUILD</button>
      </div>`).join('') + `</div>`;
  }
  else if(vsMode && vsItems.length === 2) {
    $('grid_wrap').innerHTML = renderVS(vsItems[0], vsItems[1]);   } else {$('grid_wrap').innerHTML = `<div class="grid" id="grid">` + L.slice(0,LIM).map(p=>{
      const w=why(p),bad=w.length>0,sel=S[tab]&&S[tab].id===p.id, vsSel = vsItems.includes(p), em=bad?'❌':(others?'🟢':'');
      return `<div class="p ${sel||vsSel?'sel':''} ${bad&&!sel&&!vsMode?'dis':''} ${p.sold?'na':''}" onclick="pick('${p.id}')">
      ${!vsMode?`<span class="em">${em}</span>`:''}
      <div class="n"><b>${p.name}</b></div><span class="pr">${usd(p.price)}</span>
      ${vsSel?`<span class="b y">VS Selected</span>`:''}
      ${bad&&!vsMode?`<div class="why">${w[0]}</div>`:''}</div>`
    }).join('') + `</div>` + (L.length>LIM?`<button class="btn" style="width:100%; margin-top:15px;" onclick="LIM+=300;draw()">LOAD MORE</button>`:'');
  }
  summary();
}

function pick(i){
  const p=CAT[tab].find(x=>x.id===i);beep(1200,.05,'square',.04);
  if(vsMode) {
    if(vsItems.includes(p)) vsItems = vsItems.filter(x=>x!==p);
    else if(vsItems.length < 2) vsItems.push(p);
  } else {
    if(S[tab]&&S[tab].id===i) delete S[tab]; else { S[tab]=p; for(const c in S) if(c!==tab&&pair(p,S[c])) delete S[c]; }
  }
  draw();
}

function renderVS(a, b) {
  const cRow = (lbl, vA, vB, bet) => {
    let aC = '', bC = ''; if(bet === 1) { aC='vs-win'; bC='vs-lose'; } if(bet === 2) { bC='vs-win'; aC='vs-lose'; }
    return `<div class="vs-row"><span>${lbl}</span><span class="${aC}">${vA}</span><span class="${bC}">${vB}</span></div>`;
  };
  let r = cRow('Price', usd(a.price), usd(b.price), a.price < b.price ? 1 : (b.price < a.price ? 2 : 0));
  if(a.w !== undefined) r += cRow('Wattage', a.w+'W', b.w+'W', a.w > b.w ? 1 : (b.w > a.w ? 2 : 0));
  if(a.rad !== undefined) r += cRow('Radiator', a.rad+'mm', b.rad+'mm', 0);
  return `<div class="vs-view"><div class="vs-card"><h3>A: ${a.name}</h3></div><div class="vs-card" style="flex:2">${r}<button class="btn" onclick="vsItems=[];draw()" style="width:100%;margin-top:15px;background:rgba(255,0,85,0.1);border-color:#ff0055;color:#ff0055;">Clear VS</button></div><div class="vs-card"><h3>B: ${b.name}</h3></div></div>`;
}

function summary(){
  if(pbMode) { $('sum').innerHTML = `<h3>PREBUILTS</h3><p style="color:#aaa;">Select a pre-configured template.</p>`; return; }
  if(vsMode) { $('sum').innerHTML = `<h3>VS MODE</h3><p style="color:#aaa;">Select 2 items to compare.</p>`; return; }
  
  const it=Object.values(S),tot=it.reduce((a,b)=>a+b.price,0),need=(S.cpu?S.cpu.w:0)+(S.gpu?S.gpu.w:0)+100,psu=S.psu?S.psu.w:0;
  
  let sumHTML = `<h3>SYSTEM TOTAL</h3>`;
  Object.keys(LAB).forEach(k => {
    if(!S[k]) {
      sumHTML += `<div class="sum-item"><div class="sum-row"><span class="sum-cat">${LAB[k]}</span><span class="sum-price">-</span></div></div>`;
    } else {
      sumHTML += `<div class="sum-item">
        <div class="sum-row"><span class="sum-cat">${LAB[k]}</span><span class="sum-price">${usd(S[k].price)}</span></div>
        <span class="sum-name">${S[k].name}</span>
      </div>`;
    }
  });

  sumHTML += `
  <div class="tot">${usd(tot)}</div><div class="r"><span>Est. draw</span><span>${need}W</span></div>
  <div class="bar"><i style="width:${psu?Math.min(100,need/psu*100):0}%;background:#0fc"></i></div>
  <button class="btn" style="width:100%; margin-top:15px;" onclick="for(const k in S)delete S[k];draw()">RESET BUILD</button>`;
  
  $('sum').innerHTML = sumHTML;
}

/* Toolbox */
const CM={lx:[["Update system","sudo pacman -Syu"]],ps:[["Update all apps","winget upgrade --all"]]};
function fshow(){ftab('lx')}
function ftab(t){
  $('ft').innerHTML=[['lx','Linux'],['ps','Windows']].map(a=>`<button class="tab ${a[0]===t?'on':''}" onclick="ftab('${a[0]}')">${a[1]}</button>`).join('');
  $('fb').innerHTML=CM[t].map(c=>`<div style="background:#000; border:1px solid #333; border-radius:8px; padding:12px; margin-bottom:10px;"><div style="color:#0fc; font-size:0.85rem; margin-bottom:8px;">${c[0]}</div><pre style="color:#e0e0e0;">${c[1]}</pre></div>`).join('');
}
</script></body></html>
