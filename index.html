<body>

  <canvas id="starfield"></canvas>

  <div id="main-container" class="container">
    <div id="scramble-text" class="title">
      <span id="word-drew" class="clickable-word" onclick="handleDrewClick(event)">DREW</span><span id="word-dot" class="clickable-word" onclick="handleDotClick(event)">.</span><span id="word-wtf" class="clickable-word" onclick="handleWtfClick(event)">WTF</span>
    </div>
  </div>

  <div class="bottom-ui-container">
    <button id="audio-toggle" class="audio-btn" onclick="toggleAudio(event)">🔇 UNMUTE MUSIC</button>
    <div id="phase-badge" class="phase-watermark">
      PHASE NO. 0
    </div>
  </div>

  <script>
    /* --- EXACT SHEET MUSIC 8-BIT LAVENDER TOWN AUDIO ENGINE --- */
    let audioCtx = null;
    let isPlaying = false;
    let nextNoteTime = 0;
    let timerID = null;
    let currentStep = 0;

    const freqs = {
      'C3': 130.81, 'C#3': 138.59, 'D3': 146.83, 'D#3': 155.56, 'E3': 164.81, 'F3': 174.61, 'F#3': 185.00, 'G3': 196.00, 'G#3': 207.65, 'A3': 220.00, 'A#3': 233.08, 'B3': 246.94,
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'B5': 987.77,
      'C6': 1046.50, 'C#6': 1108.73, 'D6': 1174.66, 'D#6': 1244.51, 'E6': 1318.51, 'F6': 1396.91, 'F#6': 1479.98, 'G6': 1567.98, 'G#6': 1661.22, 'A6': 1760.00, 'B6': 1975.53
    };

    // Right-Hand Ostinato (8va: C6, G5, B5, F#5 repeating loop)
    const rhOstinato = ['C6', 'G5', 'B5', 'F#5'];

    // Left-Hand Bassline directly transcribed from Maestro Aamir sheet
    // Measure 1-4: Rest
    // Measure 5-12: Melody (C4, G3, F#3, B3 / C4, G3, F#3, B3 / C4, G3, B3, F#3 / C4, B3, G3, C4...)
    const lhMelody = [
      // M1 - M4 (Silence / Rests)
      null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null,
      // M5 - M8
      'C4', 'G3', 'F#3', 'B3',  'C4', 'G3', 'F#3', 'B3',  'C4', 'G3', 'B3', 'F#3',  'C4', 'B3', 'G3', 'C4',
      // M9 - M12
      'C4', 'G3', 'F#3', 'B3',  'C4', 'G3', 'F#3', 'B3',  'C4', 'G3', 'B3', 'F#3',  'C4', 'B3', 'G3', 'C4',
      // M13 - M16
      'G3', 'F#3', 'B3', 'C4',  'G3', 'F#3', 'B3', 'C4',  'G3', 'B3', 'F#3', 'C4',  'G3', 'B3', 'F#3', 'C4',
      // M17 - M20
      'C4', 'G3', 'F#3', 'B3',  'C4', 'G3', 'F#3', 'B3',  'C4', 'G3', 'B3', 'F#3',  'C4', 'B3', 'G3', 'C4'
    ];

    function playPulseNote(freq, startTime, duration, gainValue = 0.06) {
      if (!freq || !audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, startTime);

      gain.gain.setValueAtTime(gainValue, startTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(startTime);
      osc.stop(startTime + duration);
    }

    function scheduleNotes() {
      if (!isPlaying) return;

      const lookAhead = 0.1;
      const scheduleAheadTime = 0.2;
      const stepDuration = 0.25; // Quarter note beat at 120 BPM = 0.25s per eighth note

      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        // RH Ostinato Note
        const rhNote = rhOstinato[currentStep % rhOstinato.length];
        if (freqs[rhNote]) {
          playPulseNote(freqs[rhNote], nextNoteTime, stepDuration * 0.85, 0.05);
        }

        // LH Melody Note (Plays every 2 steps = quarter note length)
        if (currentStep % 2 === 0) {
          const lhIndex = Math.floor(currentStep / 2) % lhMelody.length;
          const lhNote = lhMelody[lhIndex];
          if (lhNote && freqs[lhNote]) {
            playPulseNote(freqs[lhNote], nextNoteTime, stepDuration * 1.8, 0.08);
          }
        }

        nextNoteTime += stepDuration;
        currentStep++;
      }

      timerID = setTimeout(scheduleNotes, lookAhead * 1000);
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      const btn = document.getElementById("audio-toggle");

      if (!isPlaying) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        nextNoteTime = audioCtx.currentTime + 0.05;
        currentStep = 0;
        isPlaying = true;
        btn.textContent = '🔊 MUTE MUSIC';
        scheduleNotes();
      } else {
        isPlaying = false;
        clearTimeout(timerID);
        btn.textContent = '🔇 UNMUTE MUSIC';
      }
    }

    /* --- BRAND WEBFONTS --- */
    const companyFonts = [
      { font: "'Press Start 2P', monospace" },
      { font: "'Orbitron', sans-serif" },
      { font: "'Russo One', sans-serif" },
      { font: "'Permanent Marker', cursive" },
      { font: "'Cinzel', serif" },
      { font: "'Comic Neue', cursive" },
      { font: "'VT323', monospace" },
      { font: "'Fira Code', monospace" },
      { font: "'Courier Prime', monospace" },
      { font: "'Noto Sans SC', sans-serif" },
      { font: "'Noto Sans Devanagari', sans-serif" },
      { font: "'Courier New', Courier, monospace" }
    ];

    /* --- CANVAS ENGINE --- */
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");

    let particles = [];
    const numParticles = 650;
    let width, height, cx, cy;
    let warpSpeed = 4;
    let renderMode = "stars";
    let reverseWarp = false;

    const mEmojis = ["🍄", "🍆", "✨", "💫"];
    const dEmojis = ["😈", "👿", "🔥", "⚡"];
    const sEmojis = ["💀", "☠️", "☣️", "🟢"];
    const $Emojis = ["💸", "💰", "💵", "✨"];
    const alienEmojis = ["👽", "🛸", "👾", "🌌"];

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }

    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = initial ? Math.random() * width : width;
        this.pz = this.z;
        this.mE = mEmojis[Math.floor(Math.random() * mEmojis.length)];
        this.dE = dEmojis[Math.floor(Math.random() * dEmojis.length)];
        this.sE = sEmojis[Math.floor(Math.random() * sEmojis.length)];
        this.$E = $Emojis[Math.floor(Math.random() * $Emojis.length)];
        this.aE = alienEmojis[Math.floor(Math.random() * alienEmojis.length)];
      }

      update() {
        this.pz = this.z;
        if (reverseWarp) {
          this.z += warpSpeed;
          if (this.z >= width) this.reset(false);
        } else {
          this.z -= warpSpeed;
          if (this.z <= 0) this.reset(false);
        }
      }

      draw() {
        const sx = (this.x / this.z) * cx + cx;
        const sy = (this.y / this.z) * cy + cy;

        if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) {
          if (renderMode === "mushrooms") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.mE, sx, sy);
          } else if (renderMode === "devils") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.dE, sx, sy);
          } else if (renderMode === "skulls") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.sE, sx, sy);
          } else if (renderMode === "money") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.$E, sx, sy);
          } else if (renderMode === "aliens") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.aE, sx, sy);
          } else if (renderMode === "all") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 40)}px serif`;
            ctx.fillText(this.dE, sx, sy);
          } else {
            const alpha = Math.min(1, (1 - this.z / width) * 1.8);
            const size = (1 - this.z / width) * 3;
            ctx.strokeStyle = `rgba(255, 17, 17, ${alpha})`;
            ctx.lineWidth = Math.max(0.5, size);
            ctx.beginPath();
            ctx.moveTo((this.x / this.pz) * cx + cx, (this.y / this.pz) * cy + cy);
            ctx.lineTo(sx, sy);
            ctx.stroke();
          }
        }
      }
    }

    function initParticles() {
      resizeCanvas();
      particles = [];
      for (let i = 0; i < numParticles; i++) particles.push(new Particle());
    }

    function animateParticles() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillRect(0, 0, width, height);

      for (let p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    initParticles();

    const darkColors = [
      "#000000", "#120000", "#00051a", "#10001a", 
      "#001a0a", "#1a1200", "#12001a", "#051015"
    ];

    let currentPhase = 0;
    let phaseTimer = null;
    let activeWordLeft = "DREW";
    let activeWordRight = "WTF";

    const customTextVariants = [
      ["DREW", "WTF"], ["DREW", "666"], ["DR3W", "W7F"], ["666", "666"], ["DREW", "NULL"], 
      ["HELL", "WTF"], ["TRIP", "WTF"], ["UFO", "DREW"], ["RICH", "WTF"], ["CYBER", "DREW"], 
      ["VOID", "WTF"], ["ACID", "DREW"], ["4NNDR3W", "WTF"], ["DEAD", "WTF"], ["DEMON", "MODE"]
    ];

    function setPhase(p) {
      currentPhase = p;
      if (currentPhase > 200) currentPhase = 0;
      if (currentPhase < 0) currentPhase = 200;

      const el = document.getElementById("scramble-text");
      const badge = document.getElementById("phase-badge");
      
      badge.textContent = `PHASE NO. ${currentPhase}`;

      const randomFont = companyFonts[Math.floor(Math.random() * companyFonts.length)];
      el.style.fontFamily = randomFont.font;

      const themeBg = darkColors[currentPhase % darkColors.length];
      document.body.style.backgroundColor = themeBg;
      document.body.style.filter = "none";
      el.className = "title";
      el.style.color = "";
      el.style.filter = "";
      el.style.textShadow = "";
      renderMode = "stars";
      reverseWarp = false;
      canvas.classList.add("active");

      if (currentPhase === 0) {
        activeWordLeft = "DREW";
        activeWordRight = "WTF";
        canvas.classList.remove("active");
        return;
      }

      const variant = customTextVariants[currentPhase % customTextVariants.length];
      activeWordLeft = variant[0];
      activeWordRight = variant[1];
      warpSpeed = (currentPhase % 25) + 2;

      if (currentPhase % 10 === 0) {
        renderMode = "devils";
        el.style.color = "#ff0000";
      } else if (currentPhase % 8 === 0) {
        renderMode = "mushrooms";
        el.style.color = "#00ffff";
        el.classList.add("liquid-wave");
      } else if (currentPhase % 6 === 0) {
        renderMode = "skulls";
        el.style.color = "#00ff66";
      } else if (currentPhase % 5 === 0) {
        document.body.style.backgroundColor = "#150022";
        el.style.color = "#ff00ff";
      } else if (currentPhase % 4 === 0) {
        renderMode = "aliens";
        el.classList.add("spin");
      } else if (currentPhase % 3 === 0) {
        el.classList.add("slice-glitch");
        el.style.textShadow = "-10px 0 20px #ff00ff, 10px 0 20px #00ffff";
      } else if (currentPhase % 2 === 0) {
        reverseWarp = true;
        el.classList.add("pulse-glow");
      }
    }

    function prevPhase() {
      currentPhase--;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function nextPhase() {
      currentPhase++;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function randomPhase() {
      let rand = Math.floor(Math.random() * 200) + 1;
      setPhase(rand);
      resetPhaseTimer();
    }

    function resetPhaseTimer() {
      if (phaseTimer) clearInterval(phaseTimer);
      phaseTimer = setInterval(() => {
        currentPhase++;
        setPhase(currentPhase);
      }, 5000);
    }

    function handleDrewClick(e) {
      if (e) e.stopPropagation();
      prevPhase();
    }

    function handleWtfClick(e) {
      if (e) e.stopPropagation();
      nextPhase();
    }

    function handleDotClick(e) {
      if (e) e.stopPropagation();
      randomPhase();
    }

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".clickable-word") || e.target.closest(".audio-btn")) return;

      const centerY = window.innerHeight / 2;
      if (e.clientY < centerY) {
        prevPhase();
      } else {
        nextPhase();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") {
        nextPhase();
      } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
        prevPhase();
      }
    });

    const wordDrewEl = document.getElementById("word-drew");
    const wordWtfEl = document.getElementById("word-wtf");

    const intlGlitchChars = [
      "0","1","3","7","_","/#","\\|","@","$","%","*","!",
      "中","文","鬼","魔","神","龍","悟",
      "अ","आ","इ","उ","ऋ","क","ख",
      "Д","Р","Е","В","У","Ш","К",
      "🔥","💀","😈","☣️","🟢","🛸","👽"
    ];

    function runScrambleCycle() {
      wordDrewEl.textContent = activeWordLeft;
      wordWtfEl.textContent = activeWordRight;
      setTimeout(() => {
        let frame = 0;
        const interval = setInterval(() => {
          wordDrewEl.textContent = activeWordLeft.split('').map(c => 
            Math.random() < 0.4 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c
          ).join('');
          wordWtfEl.textContent = activeWordRight.split('').map(c => 
            Math.random() < 0.4 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c
          ).join('');
          frame++;
          if (frame >= 15) {
            clearInterval(interval);
            wordDrewEl.textContent = activeWordLeft;
            wordWtfEl.textContent = activeWordRight;
            runScrambleCycle();
          }
        }, 40);
      }, 1800);
    }

    setPhase(0);
    resetPhaseTimer();
    animateParticles();
    runScrambleCycle();
  </script>
