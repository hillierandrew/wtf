<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREW.WTF</title>
  <style>
    :root {
      --crt-red: #ff1111;
      --crt-dim: #660000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: var(--crt-red);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Starfield Canvas */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
      opacity: 0;
      transition: opacity 4s ease-in-out;
    }

    #starfield.active {
      opacity: 1;
    }

    /* Screen Curvature & Vignette */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.92) 100%);
      pointer-events: none;
      z-index: 10;
    }

    /* Scanlines */
    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(20, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 11;
    }

    .container {
      text-align: center;
      z-index: 15;
      padding: 10px;
      user-select: none;
      white-space: nowrap;
    }

    /* Base CRT Phosphor Title */
    .title {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: bold;
      letter-spacing: 0.18em;
      text-shadow: 0 0 10px var(--crt-red), 0 0 25px var(--crt-dim), 0 0 40px #ff0000;
      animation: flicker 0.12s infinite;
      min-height: 1.2em;
      display: inline-block;
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    /* --- STAGE 1 (15s): Mild Trip --- */
    body.psy-1 .title {
      animation: flicker 0.12s infinite, melt-1 6s ease-in-out infinite alternate, spectrum-1 10s linear infinite;
    }

    @keyframes spectrum-1 {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }

    @keyframes melt-1 {
      0% { transform: scale(1) rotate(0deg); letter-spacing: 0.18em; }
      100% { transform: scale(1.1, 0.9) rotate(-2deg); letter-spacing: 0.3em; }
    }

    /* --- STAGE 2 (20s): Faster & Harder Wave --- */
    body.psy-2 .title {
      animation: flicker 0.08s infinite, melt-2 3.5s ease-in-out infinite alternate, spectrum-2 4s linear infinite;
    }

    @keyframes spectrum-2 {
      0% { filter: hue-rotate(0deg) drop-shadow(0 0 20px #ff0000); }
      50% { filter: hue-rotate(180deg) drop-shadow(0 0 40px #00ffff); }
      100% { filter: hue-rotate(360deg) drop-shadow(0 0 20px #ff0000); }
    }

    @keyframes melt-2 {
      0% { transform: scale(1) skewX(0deg) rotate(0deg); letter-spacing: 0.18em; }
      50% { transform: scale(1.25, 0.8) skewX(8deg) rotate(-4deg); letter-spacing: 0.4em; }
      100% { transform: scale(0.85, 1.2) skewX(-8deg) rotate(4deg); letter-spacing: 0.1em; }
    }

    /* --- STAGE 3 (25s): Deep Liquid Distortion --- */
    body.psy-3 .title {
      animation: flicker 0.05s infinite, melt-3 2s ease-in-out infinite alternate, spectrum-3 2s linear infinite;
    }

    @keyframes spectrum-3 {
      0% { filter: hue-rotate(0deg) contrast(200%) blur(0px); }
      50% { filter: hue-rotate(180deg) contrast(300%) blur(1px); }
      100% { filter: hue-rotate(360deg) contrast(200%) blur(0px); }
    }

    @keyframes melt-3 {
      0% { transform: scale(1) skew(0deg, 0deg) rotate(0deg); text-shadow: -10px -5px 20px #ff0000, 10px 5px 20px #00ffff; }
      50% { transform: scale(1.4, 0.7) skew(15deg, -5deg) rotate(-6deg); text-shadow: 15px -10px 30px #00ff00, -15px 10px 30px #ff00ff; }
      100% { transform: scale(0.7, 1.4) skew(-15deg, 5deg) rotate(6deg); text-shadow: -15px 15px 40px #ffff00, 15px -15px 40px #0000ff; }
    }

    /* --- STAGE 4 (30s): FULL ACID MODE --- */
    body.psy-4 .title {
      animation: flicker 0.03s infinite, acid-melt 0.8s ease-in-out infinite alternate, acid-spectrum 0.8s linear infinite;
    }

    @keyframes acid-spectrum {
      0% { filter: hue-rotate(0deg) saturate(500%) contrast(300%) invert(0%); }
      50% { filter: hue-rotate(180deg) saturate(1000%) contrast(500%) invert(15%); }
      100% { filter: hue-rotate(360deg) saturate(500%) contrast(300%) invert(0%); }
    }

    @keyframes acid-melt {
      0% { transform: scale(1.5, 0.6) skew(25deg, -10deg) rotate(-10deg); letter-spacing: 0.6em; }
      50% { transform: scale(0.6, 1.6) skew(-25deg, 10deg) rotate(10deg); letter-spacing: -0.1em; }
      100% { transform: scale(1.3, 1.1) skew(10deg, 20deg) rotate(-15deg); letter-spacing: 0.8em; }
    }

    /* --- DVD Screensaver Positioning (35s+) --- */
    .container.dvd-mode {
      position: fixed !important;
      left: 0;
      top: 0;
      margin: 0;
      transform: none;
    }
  </style>
</head>
<body>

  <!-- Starfield Canvas -->
  <canvas id="starfield"></canvas>

  <div id="main-container" class="container">
    <div id="scramble-text" class="title">DREW.WTF</div>
  </div>

  <script>
    /* --- STARFIELD ANIMATION ENGINE --- */
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");

    let stars = [];
    const numStars = 1000;
    let width, height, cx, cy;
    let warpSpeed = 5;
    let starHueShift = false;
    let globalHue = 0;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }

    class Star {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = initial ? Math.random() * width : width;
        this.pz = this.z;
      }

      update() {
        this.pz = this.z;
        this.z -= warpSpeed;

        if (this.z <= 0) {
          this.reset(false);
        }
      }

      draw() {
        const sx = (this.x / this.z) * cx + cx;
        const sy = (this.y / this.z) * cy + cy;

        const px = (this.x / this.pz) * cx + cx;
        const py = (this.y / this.pz) * cy + cy;

        if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) {
          const alpha = Math.min(1, (1 - this.z / width) * 1.8);
          const size = (1 - this.z / width) * 3;

          if (starHueShift) {
            ctx.strokeStyle = `hsla(${(globalHue + this.z * 0.2) % 360}, 100%, 50%, ${alpha})`;
          } else {
            ctx.strokeStyle = `rgba(255, 17, 17, ${alpha})`;
          }

          ctx.lineWidth = Math.max(0.5, size);
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(sx, sy);
          ctx.stroke();
        }
      }
    }

    function initStars() {
      resizeCanvas();
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push(new Star());
      }
    }

    function animateStars() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillRect(0, 0, width, height);

      if (starHueShift) globalHue = (globalHue + 2) % 360;

      for (let i = 0; i < stars.length; i++) {
        stars[i].update();
        stars[i].draw();
      }

      requestAnimationFrame(animateStars);
    }

    window.addEventListener("resize", resizeCanvas);
    initStars();

    /* --- TIMED PROGRESSION ENGINE --- */

    // 10s: Starfield appears
    setTimeout(() => {
      canvas.classList.add("active");
      animateStars();
    }, 10000);

    // 15s: Stage 1 Trip Begins
    setTimeout(() => {
      document.body.classList.add("psy-1");
      warpSpeed = 7;
    }, 15000);

    // 20s: Stage 2 Escalation
    setTimeout(() => {
      document.body.classList.remove("psy-1");
      document.body.classList.add("psy-2");
      warpSpeed = 11;
    }, 20000);

    // 25s: Stage 3 Deep Trip (Stars go colorful)
    setTimeout(() => {
      document.body.classList.remove("psy-2");
      document.body.classList.add("psy-3");
      warpSpeed = 16;
      starHueShift = true;
    }, 25000);

    // 30s: Stage 4 FULL ACID MODE
    setTimeout(() => {
      document.body.classList.remove("psy-3");
      document.body.classList.add("psy-4");
      warpSpeed = 26;
    }, 30000);

    // 35s: DVD SCREENSAVER MODE
    setTimeout(() => {
      startDvdBounce();
    }, 35000);

    /* --- DVD BOUNCE ENGINE (35s+) --- */
    let dvdX = 0;
    let dvdY = 0;
    let dvdVX = 4.5;
    let dvdVY = 3.5;
    let isDvdActive = false;
    const container = document.getElementById("main-container");

    function startDvdBounce() {
      isDvdActive = true;
      container.classList.add("dvd-mode");
      
      // Center start position before initial vector push
      const rect = container.getBoundingClientRect();
      dvdX = (window.innerWidth - rect.width) / 2;
      dvdY = (window.innerHeight - rect.height) / 2;
      
      updateDvdBounce();
    }

    function updateDvdBounce() {
      if (!isDvdActive) return;

      const rect = container.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width;
      const maxY = window.innerHeight - rect.height;

      dvdX += dvdVX;
      dvdY += dvdVY;

      // Bounce horizontal walls
      if (dvdX <= 0 || dvdX >= maxX) {
        dvdVX = -dvdVX;
        dvdX = Math.max(0, Math.min(dvdX, maxX));
        triggerImpactEffect();
      }

      // Bounce vertical walls
      if (dvdY <= 0 || dvdY >= maxY) {
        dvdVY = -dvdVY;
        dvdY = Math.max(0, Math.min(dvdY, maxY));
        triggerImpactEffect();
      }

      container.style.left = `${dvdX}px`;
      container.style.top = `${dvdY}px`;

      requestAnimationFrame(updateDvdBounce);
    }

    function triggerImpactEffect() {
      // Flash dynamic color burst on wall bounce
      globalHue = (globalHue + 90) % 360;
      container.style.filter = `hue-rotate(${Math.floor(Math.random() * 360)}deg) saturate(1000%)`;
    }

    /* --- TEXT SCRAMBLE ENGINE --- */
    const targetText = "DREW.WTF";
    const el = document.getElementById("scramble-text");

    const leetMap = { 
      'D': ['D', 'd', '|)'], 
      'R': ['R', 'r', '12'], 
      'E': ['3', '&', '€'], 
      'W': ['W', 'w', '\\/\\/'], 
      'T': ['7', '+'], 
      'F': ['F', 'f', '|='] 
    };
    const glitchChars = "0137_/#\\|@$%&*!?";

    const presets = [
      "DREW.WTF", "DR3W.WTF", "dr3w.wtf", "4REW.WTF",
      "DR3W.W7F", "@REW.WTF", "DREW.W7F", "DR3W.W7F_",
      "DRE_W.WTF", "DR3W.W7F!", "dr3w.w7f", "DR3W.WTF",
      "DREW.W7F", "DR3W.WTF", "dr3w.WTF", "DR3W.W7F",
      "DREW_WTF", "DR3W.WTF", "dr3w.w7f", "DR3W.WTF"
    ];

    function generateAlgorithmicGlitch() {
      return targetText.split('').map(char => {
        if (char === '.') return '.';
        const rand = Math.random();
        if (rand < 0.35 && leetMap[char]) {
          const options = leetMap[char];
          return options[Math.floor(Math.random() * options.length)];
        } else if (rand < 0.55) {
          return glitchChars[Math.floor(Math.random() * glitchChars.length)];
        }
        return Math.random() < 0.5 ? char.toLowerCase() : char;
      }).join('');
    }

    function runScrambleCycle() {
      el.textContent = targetText;
      
      setTimeout(() => {
        let frame = 0;
        const totalFrames = 25 + Math.floor(Math.random() * 20);
        
        const interval = setInterval(() => {
          if (Math.random() < 0.5) {
            el.textContent = presets[Math.floor(Math.random() * presets.length)];
          } else {
            el.textContent = generateAlgorithmicGlitch();
          }
          
          frame++;
          if (frame >= totalFrames) {
            clearInterval(interval);
            el.textContent = targetText;
            runScrambleCycle();
          }
        }, 50);
      }, 2200);
    }

    runScrambleCycle();
  </script>
</body>
</html>
