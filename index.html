<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DREW.WTF</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Comic+Neue:wght@700&family=Courier+Prime:wght@700&family=Fira+Code:wght@700&family=Noto+Sans+SC:wght@900&family=Noto+Sans+Devanagari:wght@900&family=Noto+Sans+Arabic:wght@900&family=Noto+Sans+Hebrew:wght@900&family=Noto+Sans+Thai:wght@900&family=Noto+Sans+JP:wght@900&family=Noto+Sans+KR:wght@900&family=Orbitron:wght@900&family=Permanent+Marker&family=Press+Start+2P&family=Russo+One&family=VT323&display=swap" rel="stylesheet">

  <!-- SVG Distortion Filter -->
  <svg style="position: absolute; width: 0; height: 0;">
    <filter id="swirl-filter">
      <feTurbulence id="turbulence" type="fractalNoise" baseFrequency="0.03" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="45" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <style>
    :root {
      --crt-red: #ff1111;
      --crt-dim: #660000;
      --fb-blue: #1877f2;
      --fb-bg: #f0f2f5;
      --geo-yellow: #ffff00;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      background-color: #000;
      color: var(--crt-red);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Main Multi-Mode Background Canvas */
    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      height: 100dvh;
      z-index: 1;
      display: block;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    #bg-canvas.active { opacity: 1; }

    /* CRT Vignette Overlay */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none !important;
      z-index: 10;
    }

    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(20, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 4px;
      pointer-events: none !important;
      z-index: 11;
    }

    .container {
      text-align: center;
      z-index: 50;
      padding: 10px;
      max-width: 92vw;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      pointer-events: none;
    }

    .title {
      font-size: clamp(1.2rem, 6vw, 4.5rem);
      font-weight: bold;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px var(--crt-red), 0 0 25px var(--crt-dim), 0 0 40px #ff0000;
      animation: flicker 0.12s infinite;
      min-height: 1.2em;
      display: inline-block;
      white-space: nowrap;
      transition: filter 0.3s ease, color 0.3s ease, text-shadow 0.3s ease, font-family 0.2s ease;
    }

    /* Bouncing DVD Bumper Text */
    #dvd-logo {
      position: fixed;
      z-index: 45;
      font-size: clamp(1rem, 3.5vw, 2rem);
      font-weight: bold;
      letter-spacing: 0.1em;
      color: #00ffcc;
      text-shadow: 0 0 12px #00ffcc, 0 0 25px #008888;
      user-select: none;
      pointer-events: none;
      white-space: nowrap;
      font-family: 'Press Start 2P', monospace;
    }

    .clickable-word {
      cursor: pointer;
      display: inline-block;
      pointer-events: auto;
      padding: 0 4px;
      position: relative;
    }

    .clickable-word:active {
      transform: scale(0.92);
      filter: brightness(1.8);
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    /* POSSESSED VISITOR COUNTER */
    .visitor-counter {
      position: fixed;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(16px, env(safe-area-inset-right, 16px));
      z-index: 999999;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #ff3333;
      background: rgba(10, 0, 0, 0.9);
      border: 2px solid #ff1111;
      padding: 8px 16px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
      user-select: none;
      pointer-events: none;
      letter-spacing: 0.1em;
    }

    /* SIDE-BY-SIDE BOTTOM UI CONTAINER */
    .bottom-ui-container {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
      width: clamp(320px, 90vw, 600px);
    }

    .ui-box {
      flex: 1;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      font-weight: 900;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      letter-spacing: 0.08em;
      user-select: none;
      -webkit-user-select: none;
      padding: 14px 20px;
      border-radius: 40px;
      background-color: rgba(15, 15, 15, 0.95);
      border: 3px solid rgba(255, 255, 255, 0.85);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.95), 0 0 15px rgba(255, 255, 255, 0.3);
      text-align: center;
      white-space: nowrap;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .audio-btn {
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .audio-btn:active {
      transform: scale(0.95);
      background-color: rgba(255, 255, 255, 0.3);
    }

    .phase-watermark {
      pointer-events: none;
    }

    /* ANIMATION STYLES */
    .swirl-trip { filter: url(#swirl-filter) !important; }
    .spin { animation: spin-hue 3s linear infinite !important; }
    @keyframes spin-hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    .liquid-wave { animation: flicker 0.12s infinite, liquid 1.8s ease-in-out infinite alternate !important; }
    @keyframes liquid {
      0% { letter-spacing: 0.1em; }
      100% { letter-spacing: 0.3em; filter: blur(2px) contrast(200%); }
    }

    .pulse-glow { animation: flicker 0.12s infinite, glow 0.8s ease-in-out infinite alternate !important; }
    @keyframes glow { 0% { filter: brightness(1); } 100% { filter: brightness(2) drop-shadow(0 0 30px #ffffff); } }

    .slice-glitch { animation: slice 0.2s steps(2) infinite !important; }
    @keyframes slice {
      0% { clip-path: inset(0 0 0 0); }
      50% { clip-path: inset(20% 0 30% 0); }
      100% { clip-path: inset(60% 0 10% 0); }
    }

    .salvia-split {
      text-shadow: -15px 0 0 #ff00ff, 15px 0 0 #00ffff, 0 15px 0 #00ff00 !important;
      animation: salvia 0.1s infinite alternate;
    }
    @keyframes salvia {
      0% { transform: skewX(-10deg) scale(0.9); }
      100% { transform: skewX(10deg) scale(1.1); }
    }
  </style>
</head>
<body>

  <!-- Visitor Counter -->
  <div id="visitor-box" class="visitor-counter">VISITS: 00666</div>

  <!-- DVD Bouncing Screensaver Bumper -->
  <div id="dvd-logo">DREW.WTF</div>

  <!-- Main Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Main Title Container -->
  <div id="main-container" class="container">
    <div id="scramble-text" class="title">
      <span id="word-drew" class="clickable-word" onclick="handleDrewClick(event)">DREW</span><span id="word-dot" class="clickable-word" onclick="handleDotClick(event)">.</span><span id="word-wtf" class="clickable-word" onclick="handleWtfClick(event)">WTF</span>
    </div>
  </div>

  <!-- Bottom UI Controls -->
  <div class="bottom-ui-container">
    <button id="audio-toggle" class="ui-box audio-btn" onclick="toggleAudio(event)">🔇 UNMUTE MUSIC</button>
    <div id="phase-badge" class="ui-box phase-watermark">PHASE NO. 0</div>
  </div>

  <script>
    /* --- NOTE-PERFECT LAVENDER TOWN GAME BOY SOUND ENGINE --- */
    let audioCtx = null;
    let masterGain = null;
    let isPlaying = false;
    let nextNoteTime = 0;
    let timerID = null;
    let currentStep = 0;

    const freqs = {
      'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13, 'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00, 'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
      'C5': 523.25, 'C#5': 554.37, 'D5': 587.33, 'D#5': 622.25, 'E5': 659.25, 'F5': 698.46, 'F#5': 739.99, 'G5': 783.99, 'G#5': 830.61, 'A5': 880.00, 'A#5': 932.33, 'B5': 987.77,
      'C6': 1046.50, 'C#6': 1108.73, 'D6': 1174.66, 'D#6': 1244.51, 'E6': 1318.51, 'F6': 1396.91, 'F#6': 1479.98, 'G6': 1567.98, 'G#6': 1661.22, 'A6': 1760.00, 'B6': 1975.53
    };

    // Authentic Game Boy Channel 1 High-Register 4-Note Ostinato
    const lavenderCh1 = ['C6', 'G5', 'B5', 'F#5'];

    // Authentic Channel 2 Melodic Counter-Melody
    const lavenderCh2Melody = [
      'C5', 'C5', 'G4', 'G4', 'C5', 'B4', 'G4', 'C5', 'E4', 'E4',
      'C5', 'C5', 'B4', 'B4', 'C5', 'C5', 'B4', 'C5', 'C#5', 'C#5'
    ];

    function playNote(freq, startTime, duration, waveType = 'square', gainLevel = 0.08) {
      if (!freq || !audioCtx || !masterGain) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(gainLevel, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      } catch (e) { /* note skipped */ }
    }

    function scheduleLavenderTownTheme() {
      if (!isPlaying || !audioCtx || audioCtx.state !== 'running') return;
      const lookAhead = 0.1;
      const scheduleAheadTime = 0.2;
      const noteTime = (60.0 / 120) / 2; // 120 BPM, eighth notes

      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        const ostNote = lavenderCh1[currentStep % lavenderCh1.length];
        if (freqs[ostNote]) playNote(freqs[ostNote], nextNoteTime, noteTime * 0.85, 'square', 0.06);

        if (currentStep % 2 === 0) {
          const melIdx = Math.floor(currentStep / 2) % lavenderCh2Melody.length;
          const melNote = lavenderCh2Melody[melIdx];
          if (melNote && freqs[melNote]) playNote(freqs[melNote], nextNoteTime, noteTime * 1.8, 'square', 0.09);
        }

        nextNoteTime += noteTime;
        currentStep++;
      }
      timerID = setTimeout(scheduleLavenderTownTheme, lookAhead * 1000);
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      const btn = document.getElementById("audio-toggle");

      if (!isPlaying) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 1;
          masterGain.connect(audioCtx.destination);
        }

        const start = () => {
          if (audioCtx.state !== 'running') return; // still blocked, bail quietly
          nextNoteTime = audioCtx.currentTime + 0.05;
          currentStep = 0;
          isPlaying = true;
          btn.textContent = '🔊 MUTE MUSIC';
          scheduleLavenderTownTheme();
        };

        // THE FIX: wait for resume() to actually resolve before scheduling notes,
        // otherwise browsers silently drop everything scheduled while still 'suspended'.
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().then(start).catch(start);
        } else {
          start();
        }
      } else {
        isPlaying = false;
        if (timerID) clearTimeout(timerID);
        btn.textContent = '🔇 UNMUTE MUSIC';
      }
    }

    /* --- BRAND WEBFONTS (for the resting "DREW.WTF" look) --- */
    const companyFonts = [
      { font: "'Press Start 2P', monospace" },
      { font: "'Orbitron', sans-serif" },
      { font: "'Russo One', sans-serif" },
      { font: "'Permanent Marker', cursive" },
      { font: "'Cinzel', serif" },
      { font: "'Comic Neue', cursive" },
      { font: "'VT323', monospace" },
      { font: "'Fira Code', monospace" },
      { font: "'Courier Prime', monospace" },
      { font: "'Courier New', Courier, monospace" }
    ];

    // Broad multi-script fallback stack used only while chars are actively scrambling
    const scrambleFontStack = "'Noto Sans Devanagari','Noto Sans Arabic','Noto Sans Hebrew','Noto Sans Thai','Noto Sans SC','Noto Sans JP','Noto Sans KR', sans-serif";

    /* --- DVD SCREENSAVER BUMPER ENGINE --- */
    const dvdLogo = document.getElementById("dvd-logo");
    let dvdX = 50, dvdY = 50;
    let dvdSpeedX = 2.5, dvdSpeedY = 2.0;
    const dvdColors = ["#00ffcc", "#ff00ff", "#ffff00", "#ff3300", "#00ff00", "#00f0ff"];

    function animateDVDLogo() {
      const w = window.innerWidth - dvdLogo.offsetWidth - 20;
      const h = window.innerHeight - dvdLogo.offsetHeight - 80;

      dvdX += dvdSpeedX;
      dvdY += dvdSpeedY;

      if (dvdX >= w || dvdX <= 10) {
        dvdSpeedX = -dvdSpeedX;
        dvdLogo.style.color = dvdColors[Math.floor(Math.random() * dvdColors.length)];
      }
      if (dvdY >= h || dvdY <= 10) {
        dvdSpeedY = -dvdSpeedY;
        dvdLogo.style.color = dvdColors[Math.floor(Math.random() * dvdColors.length)];
      }

      dvdLogo.style.left = `${dvdX}px`;
      dvdLogo.style.top = `${dvdY}px`;
      requestAnimationFrame(animateDVDLogo);
    }
    animateDVDLogo();

    /* --- CANVAS BACKGROUND VISUAL ENGINE --- */
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    let particles = [];
    let fireworks = [];
    const numParticles = 650;
    let width, height, cx, cy;
    let warpSpeed = 4;
    let renderMode = "stars";
    let reverseWarp = false;
    let globalAngle = 0;

    const mEmojis = ["🍄", "🍆", "✨", "💫"];
    const dEmojis = ["😈", "👿", "🔥", "⚡", "666"];
    const flowerEmojis = ["🌸", "🌺", "🌼", "🌻", "☁️", "✨"];
    const catEmojis = ["🐱", "🙀", "😸", "🐾"];
    const dogEmojis = ["🐕", "🦮", "🐩", "🦴"];
    const rainEmojis = ["💧", "🌧️", "⚡", "🌊"];
    const boatEmojis = ["⛵", "🛳️", "🚤", "🌊"];
    const carEmojis = ["🏎️", "🚗", "🏎️", "💨"];
    const asciiExplosions = ["*BOOM*", "#$%!", "@@@@", "%%%%", "0101"];

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }

    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = initial ? Math.random() * width : width;
        this.pz = this.z;
        this.mE = mEmojis[Math.floor(Math.random() * mEmojis.length)];
        this.dE = dEmojis[Math.floor(Math.random() * dEmojis.length)];
        this.flE = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
        this.cE = catEmojis[Math.floor(Math.random() * catEmojis.length)];
        this.dogE = dogEmojis[Math.floor(Math.random() * dogEmojis.length)];
        this.rE = rainEmojis[Math.floor(Math.random() * rainEmojis.length)];
        this.boatE = boatEmojis[Math.floor(Math.random() * boatEmojis.length)];
        this.carE = carEmojis[Math.floor(Math.random() * carEmojis.length)];
        this.asciiExp = asciiExplosions[Math.floor(Math.random() * asciiExplosions.length)];
      }

      update() {
        this.pz = this.z;
        if (renderMode === "rain" || renderMode === "wind") {
          this.y += warpSpeed * 3;
          if (renderMode === "wind") this.x += warpSpeed * 4;
          if (this.y > height) { this.y = -20; this.x = (Math.random() - 0.5) * width * 2; }
        } else if (renderMode === "ocean" || renderMode === "boats") {
          this.x += Math.sin(globalAngle + this.y) * 2;
          this.y -= warpSpeed * 0.5;
          if (this.y < 0) this.y = height;
        } else if (renderMode === "driving") {
          this.y += warpSpeed * 4;
          if (this.y > height) this.y = -20;
        } else if (reverseWarp) {
          this.z += warpSpeed;
          if (this.z >= width) this.reset(false);
        } else {
          this.z -= warpSpeed;
          if (this.z <= 0) this.reset(false);
        }
      }

      draw() {
        const sx = (this.x / this.z) * cx + cx;
        const sy = (this.y / this.z) * cy + cy;

        if (renderMode === "rain" || renderMode === "wind") {
          ctx.font = `20px monospace`;
          ctx.fillText(this.rE, this.x, this.y);
          return;
        } else if (renderMode === "boats") {
          ctx.font = `22px monospace`;
          ctx.fillText(this.boatE, this.x, this.y);
          return;
        } else if (renderMode === "driving") {
          ctx.font = `24px monospace`;
          ctx.fillText(this.carE, this.x, this.y);
          return;
        } else if (renderMode === "ascii_exp") {
          ctx.font = `16px monospace`;
          ctx.fillStyle = "#ff0055";
          ctx.fillText(this.asciiExp, sx, sy);
          return;
        }

        if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) {
          if (renderMode === "flowers") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 42)}px serif`;
            ctx.fillText(this.flE, sx, sy);
          } else if (renderMode === "cats") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.cE, sx, sy);
          } else if (renderMode === "dogs") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.dogE, sx, sy);
          } else if (renderMode === "mushrooms") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.mE, sx, sy);
          } else if (renderMode === "devils") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 40)}px serif`;
            ctx.fillText(this.dE, sx, sy);
          } else {
            const alpha = Math.min(1, (1 - this.z / width) * 1.8);
            const size = (1 - this.z / width) * 3;
            ctx.strokeStyle = renderMode === "tron" ? `rgba(0, 240, 255, ${alpha})` : `rgba(255, 17, 17, ${alpha})`;
            ctx.lineWidth = Math.max(0.5, size);
            ctx.beginPath();
            ctx.moveTo((this.x / this.pz) * cx + cx, (this.y / this.pz) * cy + cy);
            ctx.lineTo(sx, sy);
            ctx.stroke();
          }
        }
      }
    }

    function initParticles() {
      resizeCanvas();
      particles = [];
      for (let i = 0; i < numParticles; i++) particles.push(new Particle());
    }

    function drawCustomBackgrounds() {
      globalAngle += 0.02;

      if (renderMode === "fireworks") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
        ctx.fillRect(0, 0, width, height);

        if (Math.random() < 0.1) {
          fireworks.push({
            x: Math.random() * width,
            y: Math.random() * (height / 2),
            color: `hsl(${Math.random() * 360}, 100%, 50%)`,
            radius: 2
          });
        }

        for (let f of fireworks) {
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
          ctx.fillStyle = f.color;
          ctx.fill();
          f.radius += 2;
        }
        fireworks = fireworks.filter(f => f.radius < 40);
      } else if (renderMode === "pong") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(30, (Math.sin(globalAngle * 2) + 1) * (height / 2 - 50), 15, 80);
        ctx.fillRect(width - 45, (Math.cos(globalAngle * 2) + 1) * (height / 2 - 50), 15, 80);
        ctx.fillRect((Math.sin(globalAngle * 3) + 1) * (width / 2 - 20) + 20, (Math.cos(globalAngle * 4) + 1) * (height / 2 - 20) + 20, 15, 15);
      } else if (renderMode === "geocities") {
        ctx.fillStyle = "#000080";
        ctx.fillRect(0, 0, width, height);
        ctx.font = "20px 'Comic Sans MS', cursive";
        ctx.fillStyle = "#ffff00";
        ctx.fillText("UNDER CONSTRUCTION!", (Math.sin(globalAngle * 3) + 1) * (width / 4), (Math.cos(globalAngle * 2) + 1) * (height / 4) + 100);
      } else if (renderMode === "tron") {
        ctx.fillStyle = "rgba(0, 5, 20, 0.3)";
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = "rgba(0, 240, 255, 0.4)";
        ctx.lineWidth = 1.5;
        const horizon = height * 0.55;

        for (let x = -width; x < width * 2; x += 80) {
          ctx.beginPath();
          ctx.moveTo(x, height);
          ctx.lineTo(cx + (x - cx) * 0.1, horizon);
          ctx.stroke();
        }
        for (let y = horizon; y < height; y += 20) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      } else {
        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.fillRect(0, 0, width, height);

        for (let p of particles) {
          p.update();
          p.draw();
        }
      }
    }

    function animateCanvas() {
      drawCustomBackgrounds();
      requestAnimationFrame(animateCanvas);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    initParticles();

    /* --- POSSESSED ROLLING VISITOR COUNTER --- */
    const visitorBox = document.getElementById("visitor-box");
    function runPossessedCounter() {
      setInterval(() => {
        if (Math.random() < 0.2) {
          visitorBox.textContent = "VISITS: 00666";
          visitorBox.style.color = "#ff0000";
          visitorBox.style.borderColor = "#ff0000";
        } else {
          const randVal = Math.floor(Math.random() * 99999).toString().padStart(5, '0');
          visitorBox.textContent = `VISITS: ${randVal}`;
          visitorBox.style.color = "#ff3333";
          visitorBox.style.borderColor = "#ff1111";
        }
      }, 150);
    }
    runPossessedCounter();

    /* --- BACKGROUND SPECTRUM & STYLES --- */
    const phaseColors = [
      "#000000", "#120000", "#00051a", "#10001a", "#001a0a",
      "#f0f2f5", "#1877f2", "#ffff00", "#00ffcc", "#ff007f", "#150022"
    ];

    /* --- WEIGHTED RANDOM BACKGROUND MODE SELECTION (kills the starfield-overload problem) --- */
    const bgModes = [
      { mode: "fireworks", weight: 3 },
      { mode: "boats", weight: 3 },
      { mode: "driving", weight: 3 },
      { mode: "ascii_exp", weight: 2 },
      { mode: "pong", weight: 2 },
      { mode: "geocities", weight: 2 },
      { mode: "rain", weight: 3 },
      { mode: "wind", weight: 2 },
      { mode: "tron", weight: 3 },
      { mode: "flowers", weight: 3 },
      { mode: "devils", weight: 3 },
      { mode: "cats", weight: 3 },
      { mode: "dogs", weight: 3 },
      { mode: "mushrooms", weight: 3 },
      { mode: "ocean", weight: 2 },
      { mode: "stars", weight: 2 }
    ];
    let lastMode = null;
    function pickRenderMode() {
      const pool = bgModes.filter(m => m.mode !== lastMode);
      const total = pool.reduce((s, m) => s + m.weight, 0);
      let r = Math.random() * total;
      for (const m of pool) {
        if (r < m.weight) { lastMode = m.mode; return m.mode; }
        r -= m.weight;
      }
      lastMode = pool[0].mode;
      return pool[0].mode;
    }

    /* --- 300 PHASES --- */
    let currentPhase = 0;
    let phaseTimer = null;
    let restingFont = "'Courier New', monospace";

    const scrambleTextEl = document.getElementById("scramble-text");
    const wordDrewEl = document.getElementById("word-drew");
    const wordWtfEl = document.getElementById("word-wtf");

    function setPhase(p) {
      currentPhase = p;
      if (currentPhase > 300) currentPhase = 0;
      if (currentPhase < 0) currentPhase = 300;

      const badge = document.getElementById("phase-badge");
      badge.textContent = `PHASE NO. ${currentPhase}`;

      const randomFont = companyFonts[Math.floor(Math.random() * companyFonts.length)];
      scrambleTextEl.style.fontFamily = randomFont.font;

      const themeBg = phaseColors[currentPhase % phaseColors.length];
      document.body.style.backgroundColor = themeBg;
      document.body.style.filter = "none";
      scrambleTextEl.className = "title";

      if (themeBg === "#f0f2f5" || themeBg === "#1877f2") {
        scrambleTextEl.style.color = themeBg === "#f0f2f5" ? "#1877f2" : "#ffffff";
        scrambleTextEl.style.textShadow = "0 0 10px rgba(24, 119, 242, 0.4)";
        scrambleTextEl.style.fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      } else if (themeBg === "#ffff00") {
        scrambleTextEl.style.color = "#ff00ff";
        scrambleTextEl.style.textShadow = "0 0 15px #00ffff";
        scrambleTextEl.style.fontFamily = "'Comic Neue', cursive";
      } else {
        scrambleTextEl.style.color = "";
        scrambleTextEl.style.textShadow = "";
      }

      restingFont = scrambleTextEl.style.fontFamily;

      renderMode = pickRenderMode();
      reverseWarp = Math.random() < 0.5;
      warpSpeed = Math.floor(Math.random() * 8) + 2;
      canvas.classList.add("active");

      runScrambleCycle();
    }

    function prevPhase() {
      currentPhase--;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function nextPhase() {
      currentPhase++;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function randomPhase() {
      let rand = Math.floor(Math.random() * 300) + 1;
      setPhase(rand);
      resetPhaseTimer();
    }

    function resetPhaseTimer() {
      if (phaseTimer) clearInterval(phaseTimer);
      phaseTimer = setInterval(() => {
        currentPhase++;
        setPhase(currentPhase);
      }, 5000);
    }

    /* --- SCROLL WHEEL NAVIGATION ENGINE --- */
    let isScrolling = false;
    window.addEventListener("wheel", (e) => {
      if (isScrolling) return;
      isScrolling = true;
      if (e.deltaY > 0) nextPhase(); else if (e.deltaY < 0) prevPhase();
      setTimeout(() => { isScrolling = false; }, 200);
    });

    /* --- WORD NAVIGATION HANDLERS --- */
    function handleDrewClick(e) { if (e) e.stopPropagation(); prevPhase(); }
    function handleWtfClick(e) { if (e) e.stopPropagation(); nextPhase(); }
    function handleDotClick(e) { if (e) e.stopPropagation(); randomPhase(); }

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".clickable-word") || e.target.closest(".audio-btn")) return;
      const centerY = window.innerHeight / 2;
      if (e.clientY < centerY) prevPhase(); else nextPhase();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") nextPhase();
      else if (e.key === "ArrowDown" || e.key === "ArrowLeft") prevPhase();
    });

    /* --- MULTI-SCRIPT / MULTI-VIBE MORPH TARGETS --- */
    // "left" morphs from DREW, "right" morphs from WTF. font is applied only while that
    // variant is held so each script renders with proper glyphs.
    const langVariants = [
      { left: "ड्रू",     right: "डब्ल्यूटीएफ़",     font: "'Noto Sans Devanagari', sans-serif" }, // Hindi
      { left: "ڈریو",     right: "ڈبلیوٹی\u200cایف", font: "'Noto Sans Arabic', sans-serif" },      // Urdu
      { left: "ДРЕВ",     right: "ВТФ",              font: "'Courier New', monospace" },            // Russian/Cyrillic
      { left: "德鲁",      right: "网站",              font: "'Noto Sans SC', sans-serif" },          // Chinese
      { left: "ドリュー",   right: "ワット",            font: "'Noto Sans JP', sans-serif" },          // Japanese
      { left: "드류",      right: "더블유티에프",       font: "'Noto Sans KR', sans-serif" },          // Korean
      { left: "ΔΡΕΩ",     right: "ΩΤΦ",              font: "'Cinzel', serif" },                     // Greek-styled
      { left: "דרו",      right: "וטף",              font: "'Noto Sans Hebrew', sans-serif" },      // Hebrew
      { left: "ดรูว์",     right: "ดับเบิลยูทีเอฟ",    font: "'Noto Sans Thai', sans-serif" },        // Thai
      { left: "✞☠✟♰",     right: "☣☢☠♱",             font: "'Courier New', monospace" },            // dingbat / wingding-style
      { left: "666",      right: "EVIL",             font: "'Permanent Marker', cursive" },
      { left: "FACE",     right: "BOOK",             font: "-apple-system, sans-serif" },
      { left: "GEO",      right: "CITIES",           font: "'Comic Neue', cursive" },
      { left: "TRON",     right: "GRID",             font: "'Orbitron', sans-serif" },
      { left: "ACID",     right: "TRIP",             font: "'Fira Code', monospace" },
      { left: "SUPER",    right: "MARIO",            font: "'Press Start 2P', monospace" },
      { left: "SPACE",    right: "INVADER",          font: "'VT323', monospace" },
      { left: "MEOW",     right: "PURR",             font: "'Comic Neue', cursive" },
      { left: "DOGE",     right: "WOW",              font: "'Comic Neue', cursive" },
      { left: "HEAVEN",   right: "ANGEL",            font: "'Cinzel', serif" },
      { left: "DEMON",    right: "POSSESSED",        font: "'Russo One', sans-serif" }
    ];

    const wildClasses = ["swirl-trip", "spin", "liquid-wave", "pulse-glow", "slice-glitch", "salvia-split"];

    const intlGlitchChars = [
      "0", "1", "3", "7", "_", "/#", "\\|", "@", "$", "%", "*", "!",
      "中", "文", "鬼", "魔", "神", "龍", "悟",
      "अ", "आ", "इ", "उ", "ऋ", "क", "ख",
      "Д", "Р", "Е", "В", "У", "Ш", "К",
      "ا", "ب", "ت", "ث", "ج", "ح",
      "א", "ב", "ג", "ד", "ה",
      "ก", "ข", "ค", "ง", "จ",
      "가", "나", "다", "라", "마",
      "あ", "い", "う", "え", "お",
      "☠", "☣", "☢", "✞", "♰", "웃",
      "🔥", "💀", "😈", "☣️", "🟢", "🛸", "👽", "🌸", "🐱", "🐕", "🚗", "🎆", "666"
    ];

    function randomizeString(str) {
      return str.split('').map(c =>
        Math.random() < 0.35 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c
      ).join('');
    }

    let currentScrambleInterval = null;
    let currentScrambleTimeout = null;

    /* ALWAYS OPEN WITH DREW.WTF -> GLITCH TO RANDOM VARIANT -> HOLD (+ optional wild fx) -> RETURN TO DREW.WTF */
    function runScrambleCycle() {
      if (currentScrambleInterval) clearInterval(currentScrambleInterval);
      if (currentScrambleTimeout) clearTimeout(currentScrambleTimeout);

      scrambleTextEl.classList.remove(...wildClasses);
      scrambleTextEl.style.fontFamily = restingFont;
      wordDrewEl.textContent = "DREW";
      wordWtfEl.textContent = "WTF";

      currentScrambleTimeout = setTimeout(() => {
        const variant = langVariants[Math.floor(Math.random() * langVariants.length)];
        scrambleTextEl.style.fontFamily = scrambleFontStack;

        let frame = 0;
        currentScrambleInterval = setInterval(() => {
          wordDrewEl.textContent = randomizeString(variant.left);
          wordWtfEl.textContent = randomizeString(variant.right);

          frame++;
          if (frame >= 18) {
            clearInterval(currentScrambleInterval);
            scrambleTextEl.style.fontFamily = variant.font;
            wordDrewEl.textContent = variant.left;
            wordWtfEl.textContent = variant.right;

            if (Math.random() < 0.6) {
              const wild = wildClasses[Math.floor(Math.random() * wildClasses.length)];
              scrambleTextEl.classList.add(wild);
            }

            currentScrambleTimeout = setTimeout(() => {
              scrambleTextEl.classList.remove(...wildClasses);
              scrambleTextEl.style.fontFamily = restingFont;
              wordDrewEl.textContent = "DREW";
              wordWtfEl.textContent = "WTF";
              runScrambleCycle();
            }, 1200);
          }
        }, 45);
      }, 2000);
    }

    setPhase(0);
    resetPhaseTimer();
    animateCanvas();
  </script>
</body>
