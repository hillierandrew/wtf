<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DREW.WTF</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Comic+Neue:wght@700&family=Courier+Prime:wght@700&family=Fira+Code:wght@700&family=Noto+Sans+Arabic:wght@900&family=Noto+Sans+Devanagari:wght@900&family=Noto+Sans+Hebrew:wght@900&family=Noto+Sans+JP:wght@900&family=Noto+Sans+KR:wght@900&family=Noto+Sans+SC:wght@900&family=Noto+Sans+Thai:wght@900&family=Orbitron:wght@900&family=Permanent+Marker&family=Press+Start+2P&family=Russo+One&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --crt-red: #ff3333;
      --crt-dim: #660000;
      --ui-accent: #ff1111;
      --ui-bg: rgba(10, 0, 0, 0.85);
      --ui-border: #ff1111;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%; height: 100dvh; min-height: -webkit-fill-available;
      background-color: #000000; color: var(--crt-red);
      font-family: 'Courier New', Courier, monospace; overflow: hidden;
      position: relative; touch-action: manipulation;
    }

    body { display: flex; justify-content: center; align-items: center; flex-direction: column; }

    #bg-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh;
      z-index: 1; display: block; opacity: 1; pointer-events: none;
    }

    body::before {
      content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 20%, rgba(0, 0, 0, 0.95) 100%);
      pointer-events: none !important; z-index: 10;
    }

    body::after {
      content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(20, 0, 0, 0) 50%, rgba(0, 0, 0, 0.5) 50%);
      background-size: 100% 4px; pointer-events: none !important; z-index: 11;
    }

    .container {
      text-align: center; z-index: 50; padding: 10px; max-width: 96vw;
      user-select: none; -webkit-user-select: none; position: relative; pointer-events: none;
    }

    .title {
      font-size: clamp(1.8rem, 8vw, 5.5rem); font-weight: bold; letter-spacing: 0.1em;
      color: #ffaaaa; mix-blend-mode: exclusion;
      text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000;
      animation: flicker 0.15s infinite; min-height: 1.2em; display: inline-block;
      white-space: nowrap; transition: filter 0.3s ease, color 0.3s ease, font-family 0.2s ease;
    }

    .clickable-word { cursor: pointer; display: inline-block; pointer-events: auto; padding: 0 6px; position: relative; }
    .clickable-word:active { transform: scale(0.85); filter: brightness(2); }

    @keyframes flicker { 0% { opacity: 0.92; } 50% { opacity: 1; } 100% { opacity: 0.96; } }

    .top-left-ui {
      position: fixed; top: max(16px, env(safe-area-inset-top, 16px)); left: max(16px, env(safe-area-inset-left, 16px));
      z-index: 999999; display: flex; gap: 8px; user-select: none; pointer-events: auto;
    }

    .top-right-ui {
      position: fixed; top: max(16px, env(safe-area-inset-top, 16px)); right: max(16px, env(safe-area-inset-right, 16px));
      z-index: 999999; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      user-select: none; pointer-events: auto;
    }

    .top-row-controls { display: flex; gap: 8px; align-items: center; }

    .phase-badge-top {
      font-family: 'Press Start 2P', monospace; font-size: 11px; color: var(--ui-accent);
      background: var(--ui-bg); border: 2px solid var(--ui-border); padding: 8px 12px;
      border-radius: 8px; box-shadow: 0 0 12px var(--ui-accent); letter-spacing: 0.05em;
      text-align: right; cursor: pointer;
    }

    .top-btn {
      font-family: 'Press Start 2P', monospace; font-size: 10px; color: #fff;
      background: var(--ui-bg); border: 2px solid var(--ui-border); padding: 8px 12px;
      border-radius: 8px; cursor: pointer; box-shadow: 0 0 10px var(--ui-accent);
    }

    .top-btn:active, .phase-badge-top:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.25); }

    .visitor-counter {
      font-family: 'Press Start 2P', monospace; font-size: 9px; color: var(--ui-accent);
      background: var(--ui-bg); border: 1px solid var(--ui-border); padding: 5px 9px;
      border-radius: 6px; letter-spacing: 0.05em; pointer-events: none;
    }

    .bottom-ui-container {
      position: fixed; bottom: max(50px, env(safe-area-inset-bottom, 50px)); left: 50%; transform: translateX(-50%);
      z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 12px; pointer-events: auto; width: clamp(320px, 92vw, 600px);
    }

    .contact-btn {
      width: 100%; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 22px; font-weight: 900; color: #ffffff !important; -webkit-text-fill-color: #ffffff !important;
      letter-spacing: 0.1em; user-select: none; -webkit-user-select: none; padding: 24px 20px;
      border-radius: 50px; background-color: rgba(18, 18, 18, 0.95); border: 3px solid rgba(255, 255, 255, 0.9);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9), 0 0 25px var(--ui-accent);
      text-align: center; white-space: nowrap; display: flex; justify-content: center; align-items: center;
      cursor: pointer; text-transform: uppercase; transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .contact-btn:active { transform: scale(0.92); background-color: rgba(255, 255, 255, 0.35); }

    .phase-bottom-banner {
      position: fixed; bottom: max(140px, env(safe-area-inset-bottom, 140px)); left: 50%; transform: translateX(-50%);
      z-index: 99999; font-family: 'Press Start 2P', monospace; font-size: 10px; letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.95); background: rgba(0, 0, 0, 0.85); border: 2px solid rgba(255, 255, 255, 0.5);
      padding: 10px 20px; border-radius: 24px; cursor: pointer; user-select: none; text-transform: uppercase;
      pointer-events: auto; white-space: nowrap; text-align: center;
    }

    .phase-bottom-banner:active { transform: translateX(-50%) scale(0.94); background: rgba(255, 255, 255, 0.3); }

    .watermark-footer {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-size: 11px;
      color: rgba(255, 255, 255, 0.5); letter-spacing: 0.05em; pointer-events: none; user-select: none; white-space: nowrap;
    }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95);
      z-index: 9999999; justify-content: center; align-items: center;
    }

    .modal-content {
      border: 2px solid var(--ui-border); background: #050a05; padding: 40px; text-align: center;
      box-shadow: 0 0 40px var(--ui-accent); border-radius: 12px; max-width: 90vw;
    }

    .modal-content a {
      color: var(--ui-accent); text-decoration: none; font-size: 1.4rem; display: block; margin: 24px 0;
      text-shadow: 0 0 10px var(--ui-accent); word-break: break-all;
    }

    .close-btn {
      background: transparent; border: 2px solid var(--ui-border); color: var(--ui-accent); padding: 10px 24px;
      font-family: inherit; font-size: 1.1rem; cursor: pointer; border-radius: 6px;
    }

    .close-btn:active { background: var(--ui-accent); color: #000; }
  </style>
</head>
<body>

  <!-- Background Split Screen Area for Tapping -->
  <div id="tap-prev" style="position:fixed; top:0; left:0; width:100vw; height:50vh; z-index:40; cursor:pointer;"></div>
  <div id="tap-next" style="position:fixed; bottom:0; left:0; width:100vw; height:50vh; z-index:40; cursor:pointer;"></div>

  <!-- Top Left UI (Mute) -->
  <div class="top-left-ui">
    <button id="audio-toggle" class="top-btn" onclick="toggleAudio(event)">🔇 8-BIT PHONK</button>
  </div>

  <!-- Top Right UI Controls (Phase & Pause) -->
  <div class="top-right-ui">
    <div class="top-row-controls">
      <div id="phase-badge-top" class="phase-badge-top" onclick="nextPhase(event)">PHASE 001</div>
      <button id="pause-toggle" class="top-btn" onclick="toggleAutoAdvance(event)">⏸️ PAUSE</button>
    </div>
    <div id="visitor-box" class="visitor-counter">VISITS: 00666</div>
  </div>

  <canvas id="bg-canvas"></canvas>

  <div id="main-container" class="container">
    <div id="scramble-text" class="title">
      <span id="word-drew" class="clickable-word" onclick="handleDrewClick(event)">DREW</span><span id="word-dot" class="clickable-word" onclick="handleDotClick(event)">.</span><span id="word-wtf" class="clickable-word" onclick="handleWtfClick(event)">WTF</span>
    </div>
  </div>

  <div id="phase-bottom-banner" class="phase-bottom-banner" onclick="nextPhase(event)">RETRO SYSTEM</div>

  <div class="bottom-ui-container">
    <button id="contact-btn" class="contact-btn" onclick="toggleModal(true)">[ CONTACT ]</button>
  </div>

  <div class="watermark-footer">Copyright © 2026 DREW.WTF. All rights reserved.</div>

  <div id="contact-modal" class="modal">
    <div class="modal-content">
      <p style="letter-spacing: 0.1em; font-size: 0.8rem; opacity: 0.8;">DIRECTORY INITIALIZED</p>
      <a href="mailto:email@andrewhillier.ca">email@andrewhillier.ca</a>
      <button class="close-btn" onclick="toggleModal(false)">[ CLOSE ]</button>
    </div>
  </div>

  <script>
    /* --- TAP & KEYBOARD NAVIGATION LOGIC --- */
    document.getElementById('tap-prev').addEventListener('pointerdown', (e) => { e.preventDefault(); prevPhase(); });
    document.getElementById('tap-next').addEventListener('pointerdown', (e) => { e.preventDefault(); nextPhase(); });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") nextPhase();
      else if (e.key === "ArrowDown" || e.key === "ArrowLeft") prevPhase();
    });

    /* --- 8-BIT PHONK SYNTHESIZER --- */
    let audioCtx = null;
    let masterGain = null;
    let isPlaying = false;
    let nextNoteTime = 0;
    let timerID = null;
    let currentStep = 0;

    function playDrum(type, startTime) {
      if (!audioCtx || !masterGain) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(masterGain);
        
        if (type === 'kick') { // 808 Sub Bass
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, startTime);
          osc.frequency.exponentialRampToValueAtTime(40, startTime + 0.1);
          gain.gain.setValueAtTime(0.3, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.8);
          osc.start(startTime); osc.stop(startTime + 0.9);
        } else if (type === 'hat') { // Trap Hi-Hat
          osc.type = 'square';
          osc.frequency.setValueAtTime(4000, startTime);
          gain.gain.setValueAtTime(0.05, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.05);
          osc.start(startTime); osc.stop(startTime + 0.1);
        } else if (type === 'cowbell') { // Phonk Cowbell
          osc.type = 'square';
          osc.frequency.setValueAtTime(800, startTime);
          const osc2 = audioCtx.createOscillator();
          osc2.type = 'square'; osc2.frequency.setValueAtTime(840, startTime);
          osc2.connect(gain);
          gain.gain.setValueAtTime(0.08, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
          osc.start(startTime); osc2.start(startTime);
          osc.stop(startTime + 0.3); osc2.stop(startTime + 0.3);
        }
      } catch (e) {}
    }

    function schedulePhonkBeat() {
      if (!isPlaying || !audioCtx || audioCtx.state !== 'running') return;
      const scheduleAheadTime = 0.2;
      const noteTime = (60.0 / 130) / 4; // 130 BPM, 16th notes

      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        let step = currentStep % 16;
        
        // Fast Hats
        if (step % 2 === 0 || step === 13 || step === 14) playDrum('hat', nextNoteTime);
        
        // Phonk Cowbell Pattern
        if (step === 2 || step === 5 || step === 8 || step === 11 || step === 14) {
          playDrum('cowbell', nextNoteTime);
        }

        // Heavy Sub Kick Pattern
        if (step === 0 || step === 6 || step === 10) {
          playDrum('kick', nextNoteTime);
        }

        nextNoteTime += noteTime;
        currentStep++;
      }
      timerID = setTimeout(schedulePhonkBeat, 100);
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      const btn = document.getElementById("audio-toggle");
      if (!isPlaying) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 1;
          masterGain.connect(audioCtx.destination);
        }
        const start = () => {
          if (audioCtx.state !== 'running') return;
          nextNoteTime = audioCtx.currentTime + 0.05;
          currentStep = 0;
          isPlaying = true;
          btn.textContent = '🔊 MUTE PHONK';
          schedulePhonkBeat();
        };
        if (audioCtx.state === 'suspended') audioCtx.resume().then(start).catch(start);
        else start();
      } else {
        isPlaying = false;
        if (timerID) clearTimeout(timerID);
        btn.textContent = '🔇 8-BIT PHONK';
      }
    }

    /* --- EXPANDED CONTACT PHRASES (CYCLES EVERY 5 SECONDS EVERYWHERE) --- */
    const contactTexts = [
      "[ CONTACT ]", "[ CALL ]", "[ PING HOST ]", "[ TRANSMIT DATA ]",
      "[ INITIALIZE HANDSHAKE ]", "[ DIAL-UP (56K) ]", "[ SEND EMAIL ]", "[ EXECUTE TALK.EXE ]",
      "[ SEND TELEPATHICALLY ]", "[ TELEPORT MESSAGE ]", "[ PROJECT ASTRAL BODY ]", "[ COMMUNICATE VIA DREAMS ]",
      "[ CONSULT THE OUJA BOARD ]", "[ TRANSMIT VIBES ]", "[ BEAM UP ]", "[ SEND SMOKE SIGNAL ]",
      "[ KNOCK ON DOOR ]", "[ DISPATCH CARRIER PIGEON ]", "[ WRITE PARCHMENT LETTER ]", "[ SHOUT VERY LOUDLY ]",
      "[ RING DOORBELL ]", "[ SEND MORSE CODE ]", "[ THROW BOTTLE IN OCEAN ]", "[ PET THE CAT ]",
      "[ BARK AT DOOR ]", "[ PRESS F TO PAY RESPECTS ]", "[ SUMMON DREW ]", "[ BLINK TWICE ]",
      "[ SEND POKE ]", "[ SLIDE IN DMs ]", "[ HONK HORN ]", "[ WHISTLE LOUDLY ]"
    ];

    const intlGlitchChars = ["0", "1", "3", "7", "_", "@", "$", "%", "*", "!", "中", "鬼", "魔", "龙", "अ", "Д", "ا", "א", "ก", "가", "あ", "🔥", "💀", "😈", "666"];

    function glitchContactButtonText() {
      const btn = document.getElementById("contact-btn");
      const targetText = contactTexts[Math.floor(Math.random() * contactTexts.length)];
      let frame = 0;
      const interval = setInterval(() => {
        btn.textContent = targetText.split('').map(c => Math.random() < 0.4 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c).join('');
        frame++;
        if (frame >= 10) {
          clearInterval(interval);
          btn.textContent = targetText;
        }
      }, 40);
    }
    
    // Globally mutate contact button every 5 seconds
    setInterval(glitchContactButtonText, 5000);

    const companyFonts = [
      { font: "'Press Start 2P', monospace" }, { font: "'Orbitron', sans-serif" },
      { font: "'Russo One', sans-serif" }, { font: "'Permanent Marker', cursive" },
      { font: "'Cinzel', serif" }, { font: "'Comic Neue', cursive" },
      { font: "'VT323', monospace" }, { font: "'Fira Code', monospace" },
      { font: "'Courier Prime', monospace" }, { font: "'Courier New', Courier, monospace" }
    ];
    const scrambleFontStack = "'Noto Sans Devanagari','Noto Sans Arabic','Noto Sans Hebrew','Noto Sans Thai','Noto Sans SC','Noto Sans JP','Noto Sans KR', sans-serif";

    /* --- CANVAS ANIMATION ENGINE --- */
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    let width, height, cx, cy;
    let globalAngle = 0;
    let autoAdvancePaused = false;

    function resizeCanvas() {
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width; canvas.height = height;
      cx = width / 2; cy = height / 2;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    let snakeDir = {x: 1, y: 0}; let snakeFood = {x: 15, y: 15};
    let matrixCols = []; let particles = [];
    for (let i = 0; i < 200; i++) particles.push({ x: Math.random() * width, y: Math.random() * height, z: Math.random() * width });

    const renderers = {
      outrun: () => {
        ctx.fillStyle = "rgba(10,0,20,0.3)"; ctx.fillRect(0,0,width,height);
        ctx.fillStyle = "#ff00aa";
        ctx.beginPath(); ctx.arc(cx, cy, 150, 0, Math.PI, true); ctx.fill();
        ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 2;
        for(let i=0; i<20; i++) {
            let y = cy + Math.pow((globalAngle*2 + i)%20, 2);
            if(y < height) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke(); }
        }
      },
      skynet: () => {
        ctx.fillStyle = "rgba(20,0,0,0.3)"; ctx.fillRect(0,0,width,height);
        ctx.strokeStyle = "#ff0000"; ctx.lineWidth = 1;
        let scanY = (globalAngle*300) % height;
        ctx.beginPath(); ctx.moveTo(0, scanY); ctx.lineTo(width, scanY); ctx.stroke();
        ctx.fillStyle = "#ff0000"; ctx.font = "14px monospace";
        ctx.fillText("TARGET ACQUIRED // TERMINATION IMMINENT", cx-150, scanY - 10);
      },
      marijuana_420: () => {
        ctx.fillStyle = "rgba(0,15,0,0.2)"; ctx.fillRect(0,0,width,height);
        for(let i=0; i<15; i++) {
            let scale = Math.abs(Math.sin(globalAngle*0.5 + i)) * 100 + 20;
            let x = (cx + Math.sin(globalAngle + i)*200) % width;
            let y = (height - ((globalAngle*100 + i*50) % height));
            ctx.font = `${scale}px serif`;
            ctx.fillText("🌿", x, y);
        }
      },
      typewriter: () => {
        ctx.fillStyle = "rgba(240,240,240,0.2)"; ctx.fillRect(0,0,width,height);
        ctx.fillStyle = "#000"; ctx.font = "24px 'Courier New', monospace";
        let str = "All work and no play makes Drew a dull boy. ";
        let disp = str.repeat(10).substring(0, Math.floor(globalAngle*20) % 200);
        ctx.fillText(disp, 20, cy);
      },
      pokemon: () => {
        ctx.fillStyle = "rgba(10,50,10,0.3)"; ctx.fillRect(0,0,width,height);
        ctx.font = "60px serif";
        ctx.fillText("🔴", cx + Math.sin(globalAngle*4)*150, cy + Math.cos(globalAngle*4)*150);
        ctx.fillText("⚡", cx + Math.sin(globalAngle*3 + Math.PI)*150, cy + Math.cos(globalAngle*3 + Math.PI)*150);
      },
      digimon: () => {
        ctx.fillStyle = "rgba(0,10,20,0.3)"; ctx.fillRect(0,0,width,height);
        ctx.fillStyle = "#0088ff"; ctx.font = "20px monospace";
        for(let i=0; i<10; i++) {
            ctx.fillText(Math.random().toString(2).substr(2,8), Math.random()*width, Math.random()*height);
        }
      },
      sailor_moon: () => {
        ctx.fillStyle = "rgba(20,0,20,0.2)"; ctx.fillRect(0,0,width,height);
        ctx.font = "40px serif";
        for(let i=0; i<8; i++) {
            let x = cx + Math.sin(globalAngle*2 + i)*150;
            let y = cy + Math.cos(globalAngle*1.5 + i)*150;
            ctx.fillText(i%2==0 ? "🌙" : "✨", x, y);
        }
      },
      canada_toronto: () => {
        ctx.fillStyle = "rgba(20,0,0,0.2)"; ctx.fillRect(0,0,width,height);
        ctx.fillStyle = "#ff0000"; ctx.font = "30px serif";
        for(let i=0; i<10; i++) {
            let x = (globalAngle*50 + i*100) % width;
            let y = (globalAngle*100 + i*80) % height;
            ctx.fillText("🍁", x, y);
        }
        ctx.fillStyle = "#fff"; ctx.fillRect(cx-5, cy-100, 10, 200); // CN Tower abstract
        ctx.beginPath(); ctx.arc(cx, cy-100, 15, 0, Math.PI*2); ctx.fill();
      },
      star_of_david: () => {
        ctx.fillStyle = "rgba(0,5,20,0.3)"; ctx.fillRect(0,0,width,height);
        ctx.strokeStyle = "#00aaff"; ctx.lineWidth = 4;
        let s = Math.abs(Math.sin(globalAngle))*100 + 50;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(globalAngle);
        ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s*0.866, s*0.5); ctx.lineTo(-s*0.866, s*0.5); ctx.closePath(); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, s); ctx.lineTo(s*0.866, -s*0.5); ctx.lineTo(-s*0.866, -s*0.5); ctx.closePath(); ctx.stroke();
        ctx.restore();
      },
      rabbit_hole: () => {
        ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(0,0,width,height);
        for(let i=15; i>0; i--) {
           let radius = ((globalAngle * 60 + i * 40) % 600) * Math.max(0.1, Math.abs(Math.sin(globalAngle*0.5)+1.5));
           ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2);
           ctx.strokeStyle = `hsl(${(globalAngle*150 + i*15)%360}, 100%, 50%)`;
           ctx.lineWidth = 4 + (i%3); ctx.stroke();
        }
      },
      fractal_shrooms: () => {
        ctx.fillStyle = "rgba(0,10,0,0.3)"; ctx.fillRect(0,0,width,height);
        for(let i=0; i<12; i++) {
            let scale = Math.abs(Math.cos(globalAngle*1.2 + i*0.5)) * 300 + 10;
            let x = cx + Math.sin(globalAngle*3 + i)*Math.tan(globalAngle*0.5 + i)*150;
            let y = cy + Math.cos(globalAngle*2 + i)*Math.sin(globalAngle*1.5)*150;
            ctx.font = `${scale}px serif`;
            ctx.fillText("🍄", Math.abs(x % width), Math.abs((y + height) % height));
        }
      },
      cyberpunk_matrix: () => {
        ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(0,0,width,height);
        ctx.fillStyle = "#00ffff"; 
        let mSize = Math.abs(Math.sin(globalAngle))*30 + 10;
        ctx.font = `${mSize}px monospace`;
        if (matrixCols.length < Math.floor(width/20)) {
          for(let i=0;i<width/20;i++) matrixCols[i] = Math.random()*height;
        }
        matrixCols.forEach((y, i) => {
          ctx.fillText(String.fromCharCode(0x30A0 + Math.random()*96), i*20, y);
          matrixCols[i] = y > height || Math.random() > 0.975 ? 0 : y + mSize;
        });
      },
      snake: () => {
        ctx.fillStyle = "rgba(0, 20, 0, 0.3)"; ctx.fillRect(0, 0, width, height);
        const gs = 30;
        if (Math.random() < 0.15) {
          const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
          snakeDir = dirs[Math.floor(Math.random()*dirs.length)];
        }
        let head = {x: (snake[0].x + snakeDir.x + Math.floor(width/gs)) % Math.floor(width/gs), y: (snake[0].y + snakeDir.y + Math.floor(height/gs)) % Math.floor(height/gs)};
        snake.unshift(head);
        if (Math.abs(head.x - snakeFood.x) < 1 && Math.abs(head.y - snakeFood.y) < 1) {
          snakeFood = {x: Math.floor(Math.random()*(width/gs)), y: Math.floor(Math.random()*(height/gs))};
        } else if (snake.length > 25) { snake.pop(); }
        ctx.fillStyle = "#00ff00"; snake.forEach(p => ctx.fillRect(p.x*gs, p.y*gs, gs-2, gs-2));
        ctx.fillStyle = "#ff0000"; ctx.fillRect(snakeFood.x*gs, snakeFood.y*gs, gs-2, gs-2);
      },
      casino: () => {
        ctx.fillStyle = "#1a0005"; ctx.fillRect(0, 0, width, height);
        let scale = Math.abs(Math.cos(globalAngle*2))*100 + 40;
        ctx.font = `${scale}px serif`;
        const symbols = ["777", "🍒", "🍋", "🔔", "💎", "BAR"];
        for(let i=0; i<3; i++) {
          let sym = symbols[Math.floor((globalAngle*8 + i)%symbols.length)];
          ctx.fillStyle = "#ffcc00"; 
          ctx.fillText(sym, cx - (scale*1.5) + i*(scale*1.2), cy + scale/3);
        }
      },
      lsd_plasma: () => { ctx.fillStyle = `hsl(${(globalAngle*80)%360}, 100%, 50%)`; ctx.fillRect(0,0,width,height); },
      stars: () => {
        ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(0,0,width,height);
        particles.forEach(p => {
          p.z -= 6; if(p.z <= 0) p.z = width;
          let sx = (p.x - cx) * (width/p.z) + cx, sy = (p.y - cy) * (width/p.z) + cy;
          ctx.fillStyle = "#ffffff"; ctx.fillRect(sx, sy, 2, 2);
        });
      }
    };

    const rendererKeys = Object.keys(renderers);

    function animateCanvas() {
      globalAngle += 0.015;
      // Procedurally assign a renderer based on phase to spread the 16 renders across 150 phases
      let currentRendererKey = rendererKeys[(currentPhase * 7) % rendererKeys.length]; 
      if(renderers[currentRendererKey]) renderers[currentRendererKey]();
      requestAnimationFrame(animateCanvas);
    }

    /* --- 150 PHASES GENERATION --- */
    const phaseNamesRaw = "OUTRUN 198X,SKYNET NEURAL NET,420 BLAZE IT,TYPEWRITER TERMINAL,PALLET TOWN (PKMN),DIGI-WORLD (DIGIMON),MOON PRISM (SAILOR),MEDABOTS ROBO-BATTLE,TRUE NORTH CANADA,THE 6IX (TORONTO),STAR OF DAVID,PHONK DRIFT ZONE,CASINO JACKPOT,SNAKE AUTOMATA,HOCKEY RINK,RABBIT HOLE,FRACTAL SHROOMS,TIME DILATION,CHECKERBOARD WARP,ACID RAIN,LSD PLASMA,DEMONIC REALM,ANGELIC LIGHTS,HYPERSPACE WARP,GEOCITIES 2000,PONG PROTOCOL,FIREWORKS DISPLAY,OFFLINE DINO,TRON GRID,HACKER TERMINAL,MARTHA STEWART BAKE,WINDOWS 98,MAC OS 9,MS-DOS PROMPT,COMMODORE 64,AMIGA GURU MEDITATION,DIAL-UP MODEM,FLOPPY DISK DRIVE,VHS TRACKING,CRT SCANLINES,DVD SCREENSAVER,WINAMP VISUALIZER,LIMEWIRE DOWNLOAD,MYSPACE LAYOUT,MSN MESSENGER,ICQ CHAT,NETSCAPE NAVIGATOR,AOL YOU'VE GOT MAIL,BLOCKBUSTER VIDEO,MTV IDENTS,SEGA GENESIS,SUPER NINTENDO,ARCAGE CARPET,LASER TAG MAZE,ROLLER RINK,BOWLING ALLEY STRIKE,MALLSOFT MUZAK,FRUTIGER AERO,Y2K BUG,MATRIX CONSTRUCT,EVENT HORIZON,QUANTUM REALM,SCHRODINGER'S CAT,STRING THEORY,DARK MATTER,NEBULA CLOUD,SUPERNOVA BURST,PULSAR BEACON,QUASAR JET,INTERSTELLAR TESSERACT,SUNSPOT FLARE,LUNAR ROVER,MARS ROVER,VOYAGER GOLDEN RECORD,CERN COLLIDER,VAPORWAVE PLAZA,EGYPTIAN TOMB,DEEP WEB,ALICE'S TEA PARTY,CHESHIRE GRIN,ZION MAINFRAME,ATLANTIS RUINS,VALHALLA GATES,TARTARUS ABYSS,AREA 51,CROP CIRCLES,SILENT HILL FOG,RAPTURE UNDERWATER,BLOOD MOON,SOLAR ECLIPSE,NEON TOKYO,SHIBUYA CROSSING,GHOST IN THE SHELL,AKIRA BIKE GANG,COWBOY BEBOP,EVANGELION LCL,GUNDAM HANGAR,TAMAGOTCHI PET,GAMEBOY CAMERA,N64 POLYGONS,PS1 MEMORY CARD,DREAMCAST SPIRAL,RED RING OF DEATH,WII MENU,MINECRAFT CAVES,DOOM E1M1,HALO RING,FALLOUT VAULT,SKYRIM BLIZZARD,DARK SOULS BONFIRE,TETRIS BLOCKS,PAC-MAN MAZE,SPACE INVADERS,GALAGA STARS,ASTEROIDS,DONKEY KONG BARRELS,STREET FIGHTER,MORTAL KOMBAT,SONIC RINGS,MARIO STARS,ZELDA TRIFORCE,METROID LAVA,CASTLEVANIA GOTHIC,MEGAMAN PLASMA,CHRONO TRIGGER,FINAL FANTASY,KINGDOM HEARTS,PERSONA RED,SILENT HILL RUST,RESIDENT EVIL,METAL GEAR RADAR,TOMB RAIDER,CRASH BANDICOOT,SPYRO GEMS,TONY HAWK COMBO,GTA WASTED,MINESWEEPER,SOLITAIRE CASCADE,PINBALL BUMPER,TAMOTSU ROBO,SHINIGAMI EYES,DEATH NOTE,NARUTO KUNAI,DRAGON BALL RADAR,ONE PIECE BOUNTY,BLEACH HOLLOW,JOJO MENACING,BERSERK BRAND,JUJUTSU DOMAIN,DREW.WTF SINGULARITY";
    const phaseNames = phaseNamesRaw.split(',');

    const phaseColors = ["#000000", "#1a0f00", "#0a0015", "#000a10", "#001005", "#1877f2", "#ffff00", "#00ffcc", "#ff007f", "#150022", "#330000", "#003300", "#000033", "#222222", "#440022"];

    let currentPhase = 1;
    let phaseTimer = null;

    function setPhase(p) {
      currentPhase = p;
      if (currentPhase > 150) currentPhase = 1;
      if (currentPhase < 1) currentPhase = 150;

      const pName = phaseNames[currentPhase - 1] || "SYSTEM GLITCH";
      document.getElementById("phase-badge-top").textContent = `PHASE ${String(currentPhase).padStart(3, '0')}`;
      document.getElementById("phase-bottom-banner").textContent = pName;

      const themeBg = phaseColors[(currentPhase * 3) % phaseColors.length];
      document.body.style.backgroundColor = themeBg;

      const randomFont = companyFonts[Math.floor(Math.random() * companyFonts.length)];
      document.getElementById("scramble-text").style.fontFamily = randomFont.font;

      runScrambleCycle();
    }

    function prevPhase() { setPhase(currentPhase - 1); resetPhaseTimer(); }
    function nextPhase() { setPhase(currentPhase + 1); resetPhaseTimer(); }

    function resetPhaseTimer() {
      if (phaseTimer) clearInterval(phaseTimer);
      if (!autoAdvancePaused) {
        phaseTimer = setInterval(() => {
          nextPhase();
        }, 30000);
      }
    }

    function toggleAutoAdvance(e) {
      if(e) e.stopPropagation();
      autoAdvancePaused = !autoAdvancePaused;
      document.getElementById("pause-toggle").textContent = autoAdvancePaused ? "▶️ PLAY" : "⏸️ PAUSE";
      resetPhaseTimer();
    }

    let isScrolling = false;
    window.addEventListener("wheel", (e) => {
      if (isScrolling) return;
      isScrolling = true;
      if (e.deltaY > 0) nextPhase(); else if (e.deltaY < 0) prevPhase();
      setTimeout(() => { isScrolling = false; }, 200);
    });

    function handleDrewClick(e) { if(e) e.stopPropagation(); prevPhase(); }
    function handleWtfClick(e) { if(e) e.stopPropagation(); nextPhase(); }
    function handleDotClick(e) { if(e) e.stopPropagation(); setPhase(Math.floor(Math.random()*150) + 1); resetPhaseTimer(); }

    function toggleModal(show) { document.getElementById('contact-modal').style.display = show ? 'flex' : 'none'; }

    /* --- DREW.WTF MORPH ENGINE --- */
    const langVariants = [
      { left: "DREW",     right: "666",              font: "'Press Start 2P', monospace" },
      { left: "DREW",     right: "777",              font: "'Orbitron', sans-serif" },
      { left: "DREW",     right: "NULL",             font: "'Fira Code', monospace" },
      { left: "DREW",     right: "VOID",             font: "'VT323', monospace" },
      { left: "DREW",     right: "EXE",              font: "'Courier Prime', monospace" },
      { left: "ड्रू",     right: "डब्ल्यूटीएफ़",     font: "'Noto Sans Devanagari', sans-serif" },
      { left: "ڈریو",     right: "ڈبلیوٹی\u200cایف", font: "'Noto Sans Arabic', sans-serif" },
      { left: "ДРЕВ",     right: "ВТФ",              font: "'Courier New', monospace" },
      { left: "德鲁",      right: "网站",              font: "'Noto Sans SC', sans-serif" },
      { left: "ドリュー",   right: "ワット",            font: "'Noto Sans JP', sans-serif" },
      { left: "드류",      right: "더블유티에프",       font: "'Noto Sans KR', sans-serif" },
      { left: "ΔΡΕΩ",     right: "ΩΤΦ",              font: "'Cinzel', serif" },
      { left: "דרו",      right: "וטף",              font: "'Noto Sans Hebrew', sans-serif" },
      { left: "ดรูว์",     right: "ดับเบิลยูทีเอฟ",    font: "'Noto Sans Thai', sans-serif" }
    ];

    const scrambleTextEl = document.getElementById("scramble-text");
    const wordDrewEl = document.getElementById("word-drew");
    const wordWtfEl = document.getElementById("word-wtf");

    let scrambleInterval = null, scrambleTimeout = null;

    function runScrambleCycle() {
      if (scrambleInterval) clearInterval(scrambleInterval);
      if (scrambleTimeout) clearTimeout(scrambleTimeout);

      wordDrewEl.textContent = "DREW";
      wordWtfEl.textContent = "WTF";

      scrambleTimeout = setTimeout(() => {
        const variant = langVariants[Math.floor(Math.random() * langVariants.length)];
        scrambleTextEl.style.fontFamily = scrambleFontStack;

        let frame = 0;
        scrambleInterval = setInterval(() => {
          wordDrewEl.textContent = variant.left.split('').map(c => Math.random()<0.35 ? intlGlitchChars[Math.floor(Math.random()*intlGlitchChars.length)] : c).join('');
          wordWtfEl.textContent = variant.right.split('').map(c => Math.random()<0.35 ? intlGlitchChars[Math.floor(Math.random()*intlGlitchChars.length)] : c).join('');

          frame++;
          if (frame >= 18) {
            clearInterval(scrambleInterval);
            scrambleTextEl.style.fontFamily = variant.font;
            wordDrewEl.textContent = variant.left;
            wordWtfEl.textContent = variant.right;

            scrambleTimeout = setTimeout(() => {
              wordDrewEl.textContent = "DREW";
              wordWtfEl.textContent = "WTF";
              runScrambleCycle();
            }, 1200);
          }
        }, 45);
      }, 2000);
    }

    setInterval(() => {
      const vb = document.getElementById("visitor-box");
      if (Math.random() < 0.15) {
        vb.textContent = "VISITS: 00666";
      } else {
        vb.textContent = `VISITS: ${Math.floor(Math.random() * 99999).toString().padStart(5, '0')}`;
      }
    }, 150);

    setPhase(1);
    resetPhaseTimer();
    animateCanvas();
  </script>
