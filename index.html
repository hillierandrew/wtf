<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DREW.WTF</title>
  <style>
    :root {
      --crt-red: #ff1111;
      --crt-dim: #660000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: var(--crt-red);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Starfield Canvas */
    #starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      display: block;
      opacity: 0;
      transition: opacity 2s ease;
    }

    #starfield.active { opacity: 1; }

    /* Vignette & Scanlines */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.92) 100%);
      pointer-events: none;
      z-index: 10;
    }

    body::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(20, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 11;
    }

    .container {
      text-align: center;
      z-index: 15;
      padding: 10px;
      user-select: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .title {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: bold;
      letter-spacing: 0.18em;
      text-shadow: 0 0 10px var(--crt-red), 0 0 25px var(--crt-dim), 0 0 40px #ff0000;
      animation: flicker 0.12s infinite;
      min-height: 1.2em;
      display: inline-block;
      transition: all 0.5s ease;
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    /* ASCII Fire Overlay */
    #ascii-fire {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      text-align: center;
      color: #ff3300;
      font-family: monospace;
      font-weight: bold;
      font-size: 1.2rem;
      line-height: 1rem;
      z-index: 12;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 10px #ff0000, 0 0 20px #ff6600;
      white-space: pre;
    }

    /* Devil Emoji Overlay */
    #devil-overlay {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 15rem;
      z-index: 25;
      pointer-events: none;
      opacity: 0;
      transition: transform 3s ease-in, opacity 2s ease;
      filter: drop-shadow(0 0 50px #ff0000);
    }

    #devil-overlay.grow {
      opacity: 1;
      transform: translate(-50%, -50%) scale(4);
    }

    /* DVD Mode Positioning */
    .container.dvd-mode {
      position: fixed !important;
      left: 0; top: 0;
      margin: 0;
      transform: none;
    }

    /* Spinning and Glitter */
    .spin { animation: spin-anim 4s linear infinite !important; }
    @keyframes spin-anim {
      0% { transform: rotate(0deg) scale(1); filter: hue-rotate(0deg); }
      50% { transform: rotate(180deg) scale(1.3); filter: hue-rotate(180deg) drop-shadow(0 0 30px #ffff00); }
      100% { transform: rotate(360deg) scale(1); filter: hue-rotate(360deg); }
    }

    /* Invert Color Mode */
    body.invert-mode { filter: invert(100%); }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>
  <div id="ascii-fire"></div>
  <div id="devil-overlay">😈</div>

  <div id="main-container" class="container" onclick="nextPhase()">
    <div id="scramble-text" class="title">DREW.WTF</div>
  </div>

  <script>
    /* --- STARFIELD & EMOJI ENGINE --- */
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");

    let stars = [];
    const numStars = 600;
    let width, height, cx, cy;
    let warpSpeed = 4;
    let renderMode = "stars"; // "stars" or "emojis"
    const emojis = ["🍄", "🍆", "✨", "💫"];

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = initial ? Math.random() * width : width;
        this.pz = this.z;
        this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
      }
      update() {
        this.pz = this.z;
        this.z -= warpSpeed;
        if (this.z <= 0) this.reset(false);
      }
      draw() {
        const sx = (this.x / this.z) * cx + cx;
        const sy = (this.y / this.z) * cy + cy;
        const px = (this.x / this.pz) * cx + cx;
        const py = (this.y / this.pz) * cy + cy;

        if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) {
          if (renderMode === "emojis") {
            const size = Math.max(12, (1 - this.z / width) * 48);
            ctx.font = `${size}px serif`;
            ctx.fillText(this.emoji, sx, sy);
          } else {
            const alpha = Math.min(1, (1 - this.z / width) * 1.8);
            const size = (1 - this.z / width) * 3;
            ctx.strokeStyle = `rgba(255, 17, 17, ${alpha})`;
            ctx.lineWidth = Math.max(0.5, size);
            ctx.beginPath();
            ctx.moveTo(px, py);
            ctx.lineTo(sx, sy);
            ctx.stroke();
          }
        }
      }
    }

    function initStars() {
      resizeCanvas();
      stars = [];
      for (let i = 0; i < numStars; i++) stars.push(new Particle());
    }

    function animateParticles() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillRect(0, 0, width, height);
      for (let s of stars) { s.update(); s.draw(); }
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener("resize", resizeCanvas);
    initStars();

    /* --- ASCII FIRE ENGINE --- */
    const fireContainer = document.getElementById("ascii-fire");
    const fireChars = [" ", ".", ":", "^", "*", "s", "S", "#", "$", "█"];
    function generateFire() {
      let lines = [];
      for (let r = 0; r < 6; r++) {
        let line = "";
        for (let c = 0; c < 60; c++) {
          line += fireChars[Math.floor(Math.random() * fireChars.length)];
        }
        lines.push(line);
      }
      fireContainer.textContent = lines.join("\n");
    }
    setInterval(generateFire, 80);

    /* --- 30 PHASE SYSTEM (10s EACH) --- */
    let currentPhase = 1;
    let phaseTimer = null;
    let activeTargetText = "DREW.WTF";

    function setPhase(p) {
      currentPhase = p;
      const el = document.getElementById("scramble-text");
      const container = document.getElementById("main-container");
      const devil = document.getElementById("devil-overlay");

      // Reset state defaults
      document.body.className = "";
      el.className = "title";
      devil.className = "";
      fireContainer.style.opacity = "0";

      switch(p) {
        case 1: // 0-10s: Standard CRT
          activeTargetText = "DREW.WTF";
          canvas.classList.remove("active");
          stopDvdBounce();
          break;
        case 2: // 10-20s: Starfield
          canvas.classList.add("active");
          renderMode = "stars";
          warpSpeed = 5;
          break;
        case 3: // 20-30s: Spectrum Wave
          warpSpeed = 8;
          el.style.filter = "hue-rotate(180deg)";
          break;
        case 4: // 30-40s: DVD Bounce
          warpSpeed = 12;
          startDvdBounce();
          break;
        case 5: // 40-50s: Mushroom & Eggplant Emojis + Spinning FTW.WRED
          renderMode = "emojis";
          activeTargetText = "FTW.WRED";
          el.classList.add("spin");
          break;
        case 6: // 50-60s: Demonic / 666 / Fire / Growing Devil
          renderMode = "stars";
          fireContainer.style.opacity = "1";
          activeTargetText = "DREW.666";
          setTimeout(() => { activeTargetText = "666.666"; }, 3000);
          setTimeout(() => { activeTargetText = "666.666.666"; }, 6000);
          setTimeout(() => { devil.classList.add("grow"); }, 7000);
          break;
        case 7: // 60s: Reset Loop Back to Normal Clean State
        default:
          stopDvdBounce();
          currentPhase = 1;
          setPhase(1);
          return;
      }
    }

    function nextPhase() {
      currentPhase++;
      setPhase(currentPhase);
      resetPhaseInterval();
    }

    function resetPhaseInterval() {
      if (phaseTimer) clearInterval(phaseTimer);
      phaseTimer = setInterval(() => {
        currentPhase++;
        setPhase(currentPhase);
      }, 10000); // 10-second spacing per phase
    }

    /* --- DVD BOUNCE ENGINE --- */
    let dvdX = 0, dvdY = 0, dvdVX = 5, dvdVY = 4, isDvd = false;
    const container = document.getElementById("main-container");

    function startDvdBounce() {
      if (isDvd) return;
      isDvd = true;
      container.classList.add("dvd-mode");
      dvdX = (window.innerWidth - 300) / 2;
      dvdY = (window.innerHeight - 100) / 2;
      updateDvd();
    }

    function stopDvdBounce() {
      isDvd = false;
      container.classList.remove("dvd-mode");
      container.style.left = "";
      container.style.top = "";
    }

    function updateDvd() {
      if (!isDvd) return;
      const rect = container.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width;
      const maxY = window.innerHeight - rect.height;

      dvdX += dvdVX; dvdY += dvdVY;
      if (dvdX <= 0 || dvdX >= maxX) dvdVX = -dvdVX;
      if (dvdY <= 0 || dvdY >= maxY) dvdVY = -dvdVY;

      container.style.left = `${Math.max(0, Math.min(dvdX, maxX))}px`;
      container.style.top = `${Math.max(0, Math.min(dvdY, maxY))}px`;
      requestAnimationFrame(updateDvd);
    }

    /* --- TEXT SCRAMBLE ENGINE --- */
    const el = document.getElementById("scramble-text");
    const glitchChars = "0137_/#\\|@$%&*!?";

    function runScrambleCycle() {
      el.textContent = activeTargetText;
      setTimeout(() => {
        let frame = 0;
        const interval = setInterval(() => {
          el.textContent = activeTargetText.split('').map(c => 
            Math.random() < 0.4 ? glitchChars[Math.floor(Math.random() * glitchChars.length)] : c
          ).join('');
          frame++;
          if (frame >= 20) {
            clearInterval(interval);
            el.textContent = activeTargetText;
            runScrambleCycle();
          }
        }, 50);
      }, 2000);
    }

    // Init Execution
    setPhase(1);
    resetPhaseInterval();
    animateParticles();
    runScrambleCycle();
  </script>
</body>
</html>
