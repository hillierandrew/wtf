    for (var i = 0; i < list.length; i++) h += '<div class="issue"><b>' + list[i].t + '</b><span class="fine">' + list[i].w + ' ' + list[i].f + '</span></div>';
    if (!list.length && doneCount() === 6) h += '<p class="ok">Nothing is blocking this build.</p>';
    if (note) h += '<p class="bad">' + note + '</p>';
    h += '</div>';
    h += '<div class="block"><h2 class="display">Processor</h2>' + (cpu ? '<div class="chosen">' + sil("cpu") + '<div><b>' + cpu.name + '</b><small>' + cpu.cores + ' · ' + cpu.sock + '</small></div><em>' + money(cpu.price) + '</em></div>' : '<p class="fine">No processor yet.</p>') + '<button class="texty" type="button" data-act="goto" data-id="cpu">Change</button></div>';
    h += '<div class="block"><h2 class="display">Board</h2>' + (mb ? '<div class="chosen">' + sil("mb") + '<div><b>' + mb.name + '</b><small>' + mb.sock + ' · DDR' + mb.ddr + ' · ' + mb.dimm + ' slots</small></div><em>' + money(mb.price) + '</em></div>' + boardSlots() : '<p class="fine">No board yet.</p>') + '<button class="texty" type="button" data-act="goto" data-id="mb">Change</button></div>';
    h += '<div class="block"><h2 class="display">Memory</h2>';
    if (!state.ram.length) h += '<p class="fine">' + (mb ? "No memory yet. This board has " + mb.dimm + " slots for DDR" + mb.ddr + "." : "Choose a board first, so the memory matches.") + '</p>';
    var gb = 0;
    for (var r = 0; r < state.ram.length; r++) { var stick = find(RAM, state.ram[r].id); gb += stick.gb * state.ram[r].qty; h += chosen("ram", stick.name, state.ram[r].qty + " × " + stick.gb + "GB · " + stick.speed + " · " + stick.cl, stick.price * state.ram[r].qty, stick.id, "ram"); }
    if (gb) h += '<p class="fine">' + gb + "GB total. ECC: no.</p>";
    if (mb) h += dots(Math.min(qtySum(state.ram), mb.dimm), mb.dimm);
    h += '<div class="tools"><button class="texty" type="button" data-act="goto" data-id="ram">Add memory</button></div></div>';
    h += '<div class="block"><h2 class="display">Graphics</h2>' + (gpu ? '<div class="chosen">' + sil("gpu") + '<div><b>' + gpu.name + '</b><small>' + (gpu.w ? gpu.w + 'W' : 'No extra power') + '</small></div><em>' + money(gpu.price) + '</em></div>' : '<p class="fine">' + (cpu && cpu.ig ? "No card yet. This processor can draw the picture." : "No card yet.") + '</p>') + '<button class="texty" type="button" data-act="goto" data-id="gpu">Change</button></div>';
    h += '<div class="block"><h2 class="display">Storage</h2>';
    if (!state.drives.length) h += '<p class="fine">No storage yet.' + (mb ? " " + mb.m2.length + " M.2 slots and " + mb.sata + " SATA ports are open." : "") + '</p>';
    for (var d = 0; d < state.drives.length; d++) {
      var drive = find(DRIVE, state.drives[d].id);
      var sub = drive.kind === "nvme" ? "PCIe " + drive.gen + " · " + drive.read.toLocaleString() + " MB/s read" : (drive.rpm ? drive.rpm + " RPM · " + drive.iface : drive.iface);
      h += chosen(drive.kind === "nvme" ? "nvme" : "hdd", drive.name + " ×" + state.drives[d].qty, sub, drive.price * state.drives[d].qty, drive.id, "drives");
    }
    if (mb) h += boardSlots();
    h += '<div class="tools"><button class="texty" type="button" data-act="goto" data-id="store">Add a drive</button></div></div>';
    h += '<div class="block"><h2 class="display">Cooling</h2>' + (cool ? '<div class="chosen">' + sil("cool") + '<div><b>' + cool.name + '</b><small>' + cool.h + 'mm tall</small></div><em>' + money(cool.price) + '</em></div>' : '<p class="fine">No cooler selected. The processor needs one.</p>') + '<button class="texty" type="button" data-act="goto" data-id="cool">Change</button></div>';
    h += '<div class="block"><h2 class="display">Power</h2>' + (psu ? '<div class="chosen">' + sil("psu") + '<div><b>' + psu.name + '</b><small>' + watts() + 'W drawn · ' + recommend() + 'W suggested</small></div><em>' + money(psu.price) + '</em></div>' : '<p class="fine">No power supply. The parts want about ' + recommend() + 'W.</p>') + '<button class="texty" type="button" data-act="goto" data-id="psu">Change</button></div>';
    h += '<div class="block"><h2 class="display">Case</h2>' + (box ? '<div class="chosen">' + sil("box") + '<div><b>' + box.name + '</b><small>' + box.form + ' · graphics to ' + box.gpu + 'mm</small></div><em>' + money(box.price) + '</em></div>' + caseFans() : '<p class="fine">No case yet.</p>') + '<button class="texty" type="button" data-act="goto" data-id="box">Change</button></div>';
    h += '<div class="block"><h2 class="display">Fans</h2>';
    if (!state.fans.length) h += '<p class="fine">' + (box ? "No extra fans yet. " + fanSlots(box) + " positions are open." : "Choose a case to see fan positions.") + '</p>';
    for (var f = 0; f < state.fans.length; f++) { var fan = find(FAN, state.fans[f].id); h += chosen("fan", fan.name + " ×" + state.fans[f].qty, fan.size + "mm · " + fan.rpm + " RPM · " + fan.noise, fan.price * state.fans[f].qty, fan.id, "fans"); }
    h += caseFans() + '<div class="tools"><button class="texty" type="button" data-act="goto" data-id="fans">Add a fan</button></div></div>';
    return h;
  }
  function fitText(ok, yes, no) { return { ok: ok, text: ok ? yes : no }; }
  function viewPick() {
    var h = '<button type="button" class="back" data-act="goto" data-id="build">‹ Build</button>';
    if (note) h += '<p class="bad">' + note + '</p>';
    if (section === "cpu") {
      h += '<h2 class="display">Processor</h2>';
      for (var i = 0; i < CPU.length; i++) {
        var mb = find(MB, state.mb);
        var ok = !mb || mb.sock === CPU[i].sock;
        h += partBtn("cpu", CPU[i].name, CPU[i].cores + " · " + CPU[i].sock, fitText(ok, "Fits this board", "Needs a " + CPU[i].sock + " board"), CPU[i].price, "setcpu", CPU[i].id, CPU[i].plain + " " + CPU[i].tdp + ". " + CPU[i].pcie + ". Cache " + CPU[i].cache + ". " + (CPU[i].ig ? "Has graphics." : "No graphics."));
      }
    }
    if (section === "mb") {
      h += '<h2 class="display">Board</h2>';
      for (var b = 0; b < MB.length; b++) {
        var cpu = find(CPU, state.cpu);
        var okb = !cpu || cpu.sock === MB[b].sock;
        h += partBtn("mb", MB[b].name, MB[b].sock + " · " + MB[b].m2.length + " M.2 · " + MB[b].sata + " SATA · " + MB[b].dimm + " DIMM", fitText(okb, "Fits this processor", "This processor needs " + (cpu ? cpu.sock : "")), MB[b].price, "setmb", MB[b].id, MB[b].plain + " DDR" + MB[b].ddr + ". M.2 is PCIe " + MB[b].m2.join(" and ") + ", all 2280.");
      }
    }
    if (section === "ram") {
      var board = find(MB, state.mb);
      h += '<h2 class="display">Memory</h2>' + (board ? '<p class="fine">' + board.dimm + ' slots · DDR' + board.ddr + ' · ' + qtySum(state.ram) + ' used</p>' : '<p class="fine">Choose a board first.</p>');
      for (var r = 0; r < RAM.length; r++) {
        var okr = board && RAM[r].ddr === board.ddr && qtySum(state.ram) < board.dimm;
        var why = !board ? "Choose a board first." : (RAM[r].ddr !== board.ddr ? "This board wants DDR" + board.ddr + "." : "Your motherboard has " + board.dimm + " memory slots.");
        h += partBtn("ram", RAM[r].name, RAM[r].speed + " · " + RAM[r].cl, fitText(okr, "One more fits", why), RAM[r].price, "addram", RAM[r].id, RAM[r].plain + " " + RAM[r].gb + "GB per module. ECC: " + RAM[r].ecc + ".");
      }
    }
    if (section === "gpu") {
      h += '<h2 class="display">Graphics</h2>';
      var cpu2 = find(CPU, state.cpu), box = find(CASE, state.box), psu = find(PSU, state.psu);
      for (var g = 0; g < GPU.length; g++) {
        var okg = true, whyg = "Fits";
        if (GPU[g].id === "none" && cpu2 && !cpu2.ig) { okg = false; whyg = "This processor cannot draw a picture."; }
        else if (box && GPU[g].len > box.gpu) { okg = false; whyg = "Too long for this case (" + box.gpu + "mm)."; }
        else if (psu && GPU[g].sixteen > psu.sixteen) { okg = false; whyg = "Needs a 16-pin cable."; }
        h += partBtn("gpu", GPU[g].name, GPU[g].id === "none" ? "No card" : GPU[g].w + "W · " + GPU[g].len + "mm", fitText(okg, "Fits", whyg), GPU[g].price, "setgpu", GPU[g].id, GPU[g].plain);
      }
    }
    if (section === "store") {
      var mb2 = find(MB, state.mb);
      h += '<h2 class="display">Storage</h2>' + (mb2 ? boardSlots() : '<p class="fine">Choose a board to know how many drives fit.</p>');
      for (var s = 0; s < DRIVE.length; s++) {
        var d = DRIVE[s];
        var spec = d.kind === "nvme" ? "PCIe " + d.gen + " ×4 · " + d.read.toLocaleString() + " / " + d.write.toLocaleString() + " MB/s · M.2 " + d.form : (d.rpm ? d.rpm + " RPM · " + d.cache + " cache · " + d.iface : d.iface + " · " + d.form);
        var oks = true, whys = "Fits";
        if (!mb2) { oks = false; whys = "Choose a board first."; }
        else if (d.kind === "nvme" && nvmeCount() >= mb2.m2.length) { oks = false; whys = "All " + mb2.m2.length + " M.2 slots are full."; }
        else if (d.kind === "sata" && sataCount() >= mb2.sata) { oks = false; whys = "All " + mb2.sata + " SATA ports are full."; }
        else if (d.kind === "nvme" && d.gen === "5.0" && mb2.m2[0] !== "5.0") whys = "Fits, but this board tops out at PCIe 4.0, so the drive will be slower.";
        h += partBtn(d.kind === "nvme" ? "nvme" : "hdd", d.name, spec, fitText(oks, whys === "Fits" ? "Fits" : whys, whys), d.price, "adddrive", d.id, d.plain + (d.tbw ? " TBW " + d.tbw + "." : ""));
      }
    }
    if (section === "cool") {
      h += '<h2 class="display">Cooling</h2>';
      var box2 = find(CASE, state.box);
      for (var c = 0; c < COOL.length; c++) {
        var okc = !box2 || COOL[c].h <= box2.cool;
        h += partBtn("cool", COOL[c].name, COOL[c].h + "mm", fitText(okc, "Fits this case", "Too tall for this case"), COOL[c].price, "setcool", COOL[c].id, COOL[c].plain);
      }
    }
    if (section === "psu") {
      h += '<h2 class="display">Power</h2><p class="fine">About ' + watts() + 'W drawn. Suggest ' + recommend() + 'W so peaks have room.</p>';
      var gpu = find(GPU, state.gpu);
      for (var p = 0; p < PSU.length; p++) {
        var okp = PSU[p].watts >= recommend() && (!gpu || (gpu.sixteen <= PSU[p].sixteen && gpu.eight <= PSU[p].eight));
        var why = PSU[p].watts < recommend() ? "Under the " + recommend() + "W suggestion." : "Missing a cable this graphics card needs.";
        h += partBtn("psu", PSU[p].name, PSU[p].watts + "W", fitText(okp, "Enough", why), PSU[p].price, "setpsu", PSU[p].id, PSU[p].plain);
      }
    }
    if (section === "box") {
      h += '<h2 class="display">Case</h2>';
      var mb3 = find(MB, state.mb), gpu3 = find(GPU, state.gpu), cool3 = find(COOL, state.cool);
      for (var k = 0; k < CASE.length; k++) {
        var okk = true, whyk = "Fits";
        if (mb3 && RANK[mb3.form] > RANK[CASE[k].form]) { okk = false; whyk = "Board is too big."; }
        else if (gpu3 && gpu3.len > CASE[k].gpu) { okk = false; whyk = "Graphics card is too long."; }
        else if (cool3 && cool3.h > CASE[k].cool) { okk = false; whyk = "Cooler is too tall."; }
        h += partBtn("box", CASE[k].name, CASE[k].form + " · " + fanSlots(CASE[k]) + " fan positions", fitText(okk, "Fits", whyk), CASE[k].price, "setbox", CASE[k].id, CASE[k].plain);
      }
    }
    if (section === "fans") {
      var box4 = find(CASE, state.box);
      h += '<h2 class="display">Fans</h2>' + caseFans();
      for (var n = 0; n < FAN.length; n++) {
        var trial = state.fans.concat([{ id: FAN[n].id, qty: 1 }]);
        var merged = JSON.parse(JSON.stringify(state.fans));
        var hit = false;
        for (var z = 0; z < merged.length; z++) if (merged[z].id === FAN[n].id) { merged[z].qty++; hit = true; }
        if (!hit) merged.push({ id: FAN[n].id, qty: 1 });
        var msg = fansFit(box4, merged);
        h += partBtn("fan", FAN[n].name, FAN[n].size + "mm · " + FAN[n].rpm + " RPM · " + FAN[n].cfm + " CFM · " + FAN[n].noise, fitText(!msg, "Mounts", msg || ""), FAN[n].price, "addfan", FAN[n].id, FAN[n].plain + " Static pressure " + FAN[n].sp + ". " + FAN[n].rgb + ". " + FAN[n].conn + ".");
      }
    }
    return '<div class="block">' + h + '</div>';
  }

  function draw() {
    var y = 0;
    var mainEl = document.querySelector(".main");
    if (mainEl) y = mainEl.scrollTop || window.scrollY;
    var html = '<header class="topbar"><button type="button" data-act="home" aria-label="112 Mississauga"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3.2a6.2 6.2 0 0 0-6.2 6.2c0 4.6 6.2 11.4 6.2 11.4s6.2-6.8 6.2-11.4A6.2 6.2 0 0 0 12 3.2zm0 8.3a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2z" fill="#fff"/></svg>112 Mississauga<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button><button type="button" data-act="bag" aria-label="Andrew.H"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="8" r="3.2" fill="#fff"/><path d="M5.5 19.2c1.2-3 3.5-4.4 6.5-4.4s5.3 1.4 6.5 4.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>Andrew.H</button></header>';
    if (boot) {
      html += '<div class="boot"><p class="kicker">' + boot.name + '</p><h1 class="display">Building it.</h1><ul>';
      for (var i = 0; i < boot.steps.length; i++) html += '<li class="' + (i <= boot.at ? "on" : "") + '">' + (i < boot.at ? "✓ " : i === boot.at ? "● " : "○ ") + boot.steps[i] + '</li>';
      html += '</ul></div>';
    } else if (section === "home") html += viewHome();
    else if (section === "orders") html += '<div class="workspace"><button type="button" class="back" data-act="home">‹ Menu</button>' + viewOrders() + '</div>';
    else {
      html += '<div class="workspace"><button type="button" class="back" data-act="home">‹ Menu</button>' + meter() + '<div class="layout">' + cats() + '<div class="main">' + (section === "build" ? viewBuild() : viewPick()) + '</div>' + summary() + '</div>';
      var list = issues();
      html += '<div class="mobbar"><div><b>' + money(total()) + '</b><div class="fine">' + doneCount() + '/6 · ' + watts() + 'W' + (list.length ? ' · Check' : ' · OK') + '</div></div><button type="button" class="texty primary" data-act="save">Add to Bag</button></div></div>';
    }
    if (bag) {
      html += '<div class="drop"><h2 class="display">Bag</h2>';
      if (!cart.length) html += '<p class="fine">Your bag is empty. A finished build can sit here as a list.</p>';
      for (var c = 0; c < cart.length; c++) html += '<div class="chosen"><div><b>' + cart[c].name + '</b><small>' + cart[c].blurb + '</small></div><div><em>' + money(cart[c].price) + '</em><button type="button" class="texty" data-act="openbag" data-id="' + c + '">Open</button><button type="button" class="texty" data-act="delbag" data-id="' + c + '">Remove</button></div></div>';
      html += '<button type="button" class="texty" data-act="bag">Close</button></div>';
    }
    app.innerHTML = html;
    if (y) window.scrollTo(0, y);
  }

  function limitRam(next) {
    var mb = find(MB, state.mb);
    if (!mb) return "Choose a board first. Memory has to match its slots.";
    var n = 0;
    for (var i = 0; i < next.length; i++) {
      n += next[i].qty;
      if (find(RAM, next[i].id).ddr !== mb.ddr) return "This board takes DDR" + mb.ddr + ".";
    }
    if (n > mb.dimm) return "Your motherboard has " + mb.dimm + " memory slots.";
    return "";
  }
  function limitDrive(next) {
    var mb = find(MB, state.mb);
    if (!mb) return "Choose a board first.";
    var nv = 0, sa = 0;
    for (var i = 0; i < next.length; i++) {
      var d = find(DRIVE, next[i].id);
      if (d.kind === "nvme") nv += next[i].qty; else sa += next[i].qty;
    }
    if (nv > mb.m2.length) return "This board has " + mb.m2.length + " M.2 slots.";
    if (sa > mb.sata) return "This board has " + mb.sata + " SATA ports.";
    return "";
  }
  function limitFan(next) { return fansFit(find(CASE, state.box), next); }

  function blurb() {
    var bits = [];
    var cpu = find(CPU, state.cpu);
    if (cpu) bits.push(cpu.name);
    if (qtySum(state.ram)) bits.push(qtySum(state.ram) + " memory");
    var gpu = find(GPU, state.gpu);
    if (gpu) bits.push(gpu.name);
    if (qtySum(state.drives)) bits.push(qtySum(state.drives) + " drives");
    return bits.join(" · ") || "Empty";
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || !app.contains(t)) return;
    var act = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");
    if (act === "theme") { appearance = id; applyTheme(); draw(); return; }
    if (act === "home") { section = "home"; bag = false; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "pick") { section = state.cpu ? "build" : "orders"; bag = false; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "bag") { bag = !bag; draw(); return; }
    if (act === "goto") { section = id; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "recipe") { bag = false; startBoot(RECIPES[id]); return; }
    if (act === "empty") { state = blank(); section = "build"; note = ""; draw(); return; }
    if (act === "setcpu") { state.cpu = id; section = "build"; draw(); return; }
    if (act === "setmb") { state.mb = id; section = "build"; draw(); return; }
    if (act === "setgpu") { state.gpu = id; section = "build"; draw(); return; }
    if (act === "setcool") { state.cool = id; section = "build"; draw(); return; }
    if (act === "setpsu") { state.psu = id; section = "build"; draw(); return; }
    if (act === "setbox") { state.box = id; section = "build"; draw(); return; }
    if (act === "addram") { state.ram = bump(state.ram, id, 1, limitRam); draw(); return; }
    if (act === "adddrive") { state.drives = bump(state.drives, id, 1, limitDrive); draw(); return; }
    if (act === "addfan") { state.fans = bump(state.fans, id, 1, limitFan); draw(); return; }
    if (act === "inc" || act === "dec") {
      var group = t.getAttribute("data-group");
      var lim = group === "ram" ? limitRam : group === "drives" ? limitDrive : limitFan;
      state[group] = bump(state[group], id, act === "inc" ? 1 : -1, lim);
      draw();
      return;
    }
    if (act === "save") {
      cart.push({ name: state.name, price: total(), blurb: blurb(), build: copyBuild(state) });
      bag = true; draw(); return;
    }
    if (act === "openbag") { state = copyBuild(cart[Number(id)].build); section = "build"; bag = false; draw(); return; }
    if (act === "delbag") { cart.splice(Number(id), 1); draw(); }
  });

  var canvas = document.getElementById("dino");
  var ctx = canvas.getContext("2d");
  var cactusX = 250, dy = 0, vy = 0;
  function frame() {
    ctx.clearRect(0, 0, 420, 110);
    ctx.fillStyle = "#535353";
    if (vy || dy) { dy += vy; vy -= 0.8; if (dy < 0) { dy = 0; vy = 0; } }
    ctx.fillRect(24, 78 - dy, 18, 22);
    ctx.fillRect(36, 70 - dy, 10, 8);
    ctx.fillRect(24, 96 - dy, 6, 8);
    ctx.fillRect(34, 96 - dy, 6, 8);
    ctx.fillRect(cactusX, 62, 10, 42);
    ctx.fillRect(cactusX - 12, 74, 12, 7);
    ctx.fillRect(cactusX + 10, 70, 12, 7);
    ctx.fillRect(0, 104, 420, 2);
    requestAnimationFrame(frame);
  }
  frame();
  canvas.addEventListener("pointerdown", function (e) {
    var r = canvas.getBoundingClientRect();
    var x = ((e.clientX - r.left) / r.width) * 420;
    var y = ((e.clientY - r.top) / r.height) * 110;
    if (x > cactusX - 24 && x < cactusX + 36 && y > 50 && y < 108) { cactusHits += 1; if (cactusHits >= 3) showApp(); return; }
    if (x < 70 && y > 30) { dinoHits += 1; if (dinoHits >= 3) { askPassword(); return; } }
    if (!dy && !vy) vy = 10;
  });
  function hitN() { nHits += 1; if (nHits >= 3) askDevice(); }
  document.getElementById("n1").onclick = hitN;
  document.getElementById("n2").onclick = hitN;
  document.getElementById("n3").onclick = hitN;
  if (window.innerWidth > 980) mode = "desk";
})();
</script>
</body>
