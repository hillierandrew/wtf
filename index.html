/* =====================================================================
   LOFI 8-BIT STUDY-BEAT ENGINE
===================================================================== */
let audioCtx=null, masterGain=null, lofiFilter=null, hatBuffer=null;
let isPlaying=false, nextChordTime=0, barCount=0, schedulerID=null;

const NOTE_FREQS={
  C2:65.41,D2:73.42,E2:82.41,F2:87.31,G2:98.00,A2:110.00,B2:123.47,
  C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77
};
const CHORD_PROGRESSION=[
  {tones:['A3','C4','E4','G4'],bass:'A2'},
  {tones:['D3','F3','A3','C4'],bass:'D2'},
  {tones:['G3','B3','D4','F4'],bass:'G2'},
  {tones:['C3','E3','G3','B3'],bass:'C2'}
];
const BPM=74, beatDur=60/BPM, eighth=beatDur/2;

function makeNoiseBuffer(duration){
  const size=audioCtx.sampleRate*duration;
  const buf=audioCtx.createBuffer(1,size,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<size;i++) d[i]=Math.random()*2-1;
  return buf;
}
function playTone(freq,t,dur,vol){
  if(!freq) return;
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type='triangle'; osc.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(lofiFilter);
  osc.start(t); osc.stop(t+dur+0.05);
}
function playKick(t){
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(140,t);
  osc.frequency.exponentialRampToValueAtTime(42,t+0.15);
  g.gain.setValueAtTime(0.22,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t+0.2);
}
function playHat(t){
  const src=audioCtx.createBufferSource(); src.buffer=hatBuffer;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=7500; bp.Q.value=0.8;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.035,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+0.06);
}
function scheduleLofi(){
  if(!isPlaying||!audioCtx||audioCtx.state!=='running') return;
  while(nextChordTime<audioCtx.currentTime+0.3){
    const chord=CHORD_PROGRESSION[barCount%CHORD_PROGRESSION.length];
    const barStart=nextChordTime;
    playKick(barStart);
    playKick(barStart+beatDur*2);
    playTone(NOTE_FREQS[chord.bass],barStart,beatDur*4*0.9,0.13);
    const pattern=[0,1,2,3,2,1,0,1];
    for(let i=0;i<8;i++){
      const t=barStart+i*eighth;
      playTone(NOTE_FREQS[chord.tones[pattern[i]]],t,eighth*0.9,0.05);
      if(i%2===1) playHat(t);
    }
    nextChordTime+=beatDur*4;
    barCount++;
  }
  schedulerID=setTimeout(scheduleLofi,100);
}
function toggleAudio(e){
  if(e) e.stopPropagation();
  const btn=document.getElementById('audio-toggle');
  if(!isPlaying){
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain(); masterGain.gain.value=0.9;
      lofiFilter=audioCtx.createBiquadFilter(); lofiFilter.type='lowpass'; lofiFilter.frequency.value=1600; lofiFilter.Q.value=0.5;
      lofiFilter.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      hatBuffer=makeNoiseBuffer(0.1);
      const crackleSrc=audioCtx.createBufferSource();
      crackleSrc.buffer=makeNoiseBuffer(2); crackleSrc.loop=true;
      const crackleFilter=audioCtx.createBiquadFilter();
      crackleFilter.type='bandpass'; crackleFilter.frequency.value=3000; crackleFilter.Q.value=0.4;
      const crackleGain=audioCtx.createGain(); crackleGain.gain.value=0.012;
      crackleSrc.connect(crackleFilter); crackleFilter.connect(crackleGain); crackleGain.connect(masterGain);
      crackleSrc.start();
    }
    const start=()=>{
      if(audioCtx.state!=='running') return;
      nextChordTime=audioCtx.currentTime+0.1;
      barCount=0; isPlaying=true;
      btn.textContent='🔊 MUTE LOFI';
      scheduleLofi();
    };
    if(audioCtx.state==='suspended') audioCtx.resume().then(start).catch(start);
    else start();
  } else {
    isPlaying=false;
    if(schedulerID) clearTimeout(schedulerID);
    btn.textContent='🔇 UNMUTE LOFI';
  }
}

const TOTAL_PHASES=300;

  const pal=pool[(i+Math.floor(i/ARCHETYPES.length)*3)%pool.length];

  PHASES.push({

    font:arche.font,
    color:pal.color,

    bg:arche.light?'#f5f5f5':'#000000',

    wild:arche.wild,

    contact:CONTACT_LABELS[i%CONTACT_LABELS.length]

function setGameActive(isActive) {
  gameActive = isActive;

    if (phaseTimer) clearInterval(phaseTimer);
    quitBtn.style.display = 'flex';
  } else {
    quitBtn.style.display = 'none';
    resetPhaseTimer();
  }
}

function quitGame(e) {
  if (e) e.stopPropagation();

}

function drawGameOverlay(score) {
  if (gameActive) {
    ctx.font = '20px "Press Start 2P", monospace';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'left';
    ctx.fillText(`SCORE: ${score}`, 20, 50);
  } else if (phase.isGame && Math.floor(globalAngle * 8) % 2 === 0) {
    ctx.font = 'clamp(12px, 3vw, 20px) "Press Start 2P", monospace';
    ctx.fillStyle = '#ffcc00';
    ctx.textAlign = 'center';

}

let starParticles=[];
function newStar(){ return {x:(Math.random()-0.5)*width*2,y:(Math.random()-0.5)*height*2,z:Math.random()*width}; }
function initStars(){ starParticles=[]; for(let i=0;i<400;i++) starParticles.push(newStar()); }
function drawStars(){
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(0,0,width,height); ctx.strokeStyle=phase.color;
  let offsetX = (mouseX - cx) * 0.05; let offsetY = (mouseY - cy) * 0.05;
  for(const s of starParticles){
    const pz=s.z; s.z-=4; if(s.z<=0){ Object.assign(s,newStar()); s.z=width; }
    const sx=((s.x - offsetX)/s.z)*cx+cx, sy=((s.y - offsetY)/s.z)*cy+cy;
    const psx=((s.x - offsetX)/pz)*cx+cx, psy=((s.y - offsetY)/pz)*cy+cy;
    if(sx>=0&&sx<=width&&sy>=0&&sy<=height){
      ctx.globalAlpha=Math.min(1,(1-s.z/width)*1.8); ctx.lineWidth=Math.max(0.5,(1-s.z/width)*3);
      ctx.beginPath(); ctx.moveTo(psx,psy); ctx.lineTo(sx,sy); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
}

let invaders = [], playerBullets = [], invaderFrame = 0, invaderScore = 0;
function initInvaders() { invaders = []; playerBullets = []; invaderFrame = 0; invaderScore = 0; for(let r=0; r<4; r++) for(let c=0; c<8; c++) invaders.push({baseX: 60+c*50, y: 40+r*40}); }
function drawInvaders() {
  ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.fillRect(0,0,width,height); ctx.font='24px monospace'; ctx.fillStyle='#33ff33';
  if (gameActive) { invaderFrame++; if (invaderFrame % 15 === 0) playerBullets.push({x: mouseX, y: height - 80}); }
  playerBullets.forEach((b, bi) => { b.y -= 12; ctx.fillText('│', b.x - 6, b.y); if (b.y < 0) playerBullets.splice(bi, 1); });
  for (let i = invaders.length - 1; i >= 0; i--) {
    let inv = invaders[i]; const x = inv.baseX + Math.sin(globalAngle*2 + inv.y)*20;
    if (gameActive) inv.y += 0.5; if (inv.y > height) inv.y = -20;
    ctx.fillText('👾', x, inv.y);
    for (let j = playerBullets.length - 1; j >= 0; j--) {
      let pb = playerBullets[j];
      if (Math.abs(pb.x - x) < 25 && Math.abs(pb.y - inv.y) < 25) { invaders.splice(i, 1); playerBullets.splice(j, 1); invaderScore += 10; break; }
    }
  }
  if (invaders.length === 0 && gameActive) { invaderFrame = 0; for(let r=0; r<4; r++) for(let c=0; c<8; c++) invaders.push({baseX: 60+c*50, y: 40+r*40}); }
  ctx.fillText('🚀', mouseX - 12, height - 60);
  drawGameOverlay(invaderScore);
}

let pongState = { ballX: 0, ballY: 0, vX: 7, vY: 7, rightY: 0, score: [0,0] };
function initPong() { pongState = { ballX: cx, ballY: cy, vX: (Math.random()>0.5?7:-7), vY: (Math.random()>0.5?7:-7), rightY: cy, score: pongState.score || [0,0] }; }
function drawPong() {
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,width,height);
  if (gameActive) {
    pongState.ballX += pongState.vX; pongState.ballY += pongState.vY;
    if (pongState.ballY <= 0 || pongState.ballY >= height) pongState.vY *= -1;
    if (pongState.ballX <= 45 && Math.abs(pongState.ballY - mouseY) < 60) pongState.vX = Math.abs(pongState.vX);
    if (pongState.ballX >= width - 45 && Math.abs(pongState.ballY - pongState.rightY) < 60) pongState.vX = -Math.abs(pongState.vX);
    if (pongState.ballX < 0) { pongState.score[1]++; initPong(); }
    else if (pongState.ballX > width) { pongState.score[0]++; initPong(); }
    pongState.rightY += (pongState.ballY - pongState.rightY) * 0.12;
  }
  ctx.fillStyle='#ffffff';
  ctx.fillRect(30, (gameActive ? mouseY : (Math.sin(globalAngle*2)+1)*(height/2)) - 40, 15, 80);
  ctx.fillRect(width-45, (gameActive ? pongState.rightY : (Math.cos(globalAngle*2)+1)*(height/2)) - 40, 15, 80);
  ctx.fillRect(gameActive ? pongState.ballX : (Math.sin(globalAngle*3)+1)*(width/2-20)+20, gameActive ? pongState.ballY : (Math.cos(globalAngle*4)+1)*(height/2-20)+20, 15, 15);
  drawGameOverlay(`${pongState.score[0]} - ${pongState.score[1]}`);
}

let snakeState=null;
function initSnake(){
  const cell=20, cols=Math.floor(width/cell), rows=Math.floor(height/cell);
  snakeState={cell,cols,rows,body:[{x:Math.floor(cols/2),y:Math.floor(rows/2)}],dir:{x:1,y:0},food:{x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)},frame:0,score:0};
}
function drawSnake(){
  if(!snakeState) initSnake();
  ctx.fillStyle='#001a00'; ctx.fillRect(0,0,width,height);
  const s=snakeState;
  if (gameActive) {
    s.frame++;
    if(s.frame%6===0){
      const head=s.body[0], next={x:(head.x+s.dir.x+s.cols)%s.cols,y:(head.y+s.dir.y+s.rows)%s.rows};
      s.body.unshift(next);
      if(next.x===s.food.x&&next.y===s.food.y){ s.score+=10; s.food={x:Math.floor(Math.random()*s.cols),y:Math.floor(Math.random()*s.rows)}; }
      else s.body.pop();
      for(let i=1;i<s.body.length;i++) if(s.body[i].x===next.x&&s.body[i].y===next.y){ initSnake(); setGameActive(false); }
    }
  }
  ctx.fillStyle='#ff3333'; ctx.fillRect(s.food.x*s.cell,s.food.y*s.cell,s.cell-2,s.cell-2);
  ctx.fillStyle='#33ff33'; s.body.forEach(seg=>ctx.fillRect(seg.x*s.cell,seg.y*s.cell,s.cell-2,s.cell-2));
  drawGameOverlay(s.score);
}

function drawAsciiVortex() {

  let mx = mouseX || cx, my = mouseY || cy;
  for (let r = 0; r < rows; r++) {
    let line = "";

      let x = c * 14 - cx, y = r * 20 - cy;
      let dist = Math.sqrt(x*x + y*y);
      let index = Math.floor(Math.abs(Math.sin(dist * 0.02 - globalAngle * 3 + (mx-cx)*0.005)) * chars.length);

}

  switch(phase.mode){
    case 'stars': initStars(); break; case 'clean': initClean(); break; case 'matrix': initMatrix(); break; case 'fire': initFire(); break; case 'rain': initRain(); break;
    case 'invaders': initInvaders(); break; case 'dino': initDino(); break; case 'dos': dosLines=[]; dosFrame=0; break; case 'snake': initSnake(); break;
    case 'hockey': initHockey(); break; case 'casino': initCasino(); break; case 'weed': initWeed(); break; case 'aquarium': initAquarium(); break; case 'snowglobe': initSnow(); break;
  }
}

function drawFrame(){
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  switch(phase.mode){
    case 'stars': drawStars(); break; case 'dos': drawDos(); break; case 'cyber': drawCyber(); break; case 'clean': drawClean(); break;
    case 'matrix': drawMatrix(); break; case 'mushroom': drawMushroom(); break; case 'lsd': drawLsd(); break; case 'geocities': drawGeocities(); break;
    case 'dino': drawDino(); break; case 'dvd': ctx.fillStyle='#000'; ctx.fillRect(0,0,width,height); break; case 'fireworks': drawFireworks(); break;
    case 'fire': drawFire(); break; case 'rain': drawRain(); break; case 'invaders': drawInvaders(); break; case 'pong': drawPong(); break;
    case 'snake': drawSnake(); break; case 'hockey': drawHockey(); break; case 'casino': drawCasino(); break;
    case 'asciivortex': drawAsciiVortex(); break; case 'asciiskull': drawAsciiSkull(); break;
    case 'drift': drawDrift(); break; case 'pcbuild': drawPcbuild(); break; case 'weed': drawWeed(); break;
    case 'sm64': drawSm64(); break; case 'meme': drawMeme(); break;
    case 'volcano': drawVolcano(); break; case 'aquarium': drawAquarium(); break; case 'snowglobe': drawSnowglobe(); break;
    case 'vaporwave': drawVaporwave(); break; case 'radioactive': drawRadioactive(); break;

    // NEW CURSED ONES
    case 'bsod': drawBsod(); break;
    case 'tamagotchi': drawTamagotchi(); break;
    case 'loading99': drawLoading99(); break;
    case 'vhs': drawVhs(); break;
    case 'clippy': drawClippy(); break;
    case 'dialup': drawDialup(); break;
    case 'y2k': drawY2k(); break;
    case 'mspaint': drawMspaint(); break;
    case 'blissfire': drawBlissfire(); break;
    case 'safeturnoff': drawSafeturnoff(); break;
    case 'solitaire': drawSolitaire(); break;
    case 'beachball': drawBeachball(); break;
    case 'illegal': drawIllegal(); break;
    case 'win11bsod': drawWin11bsod(); break;
    case 'lowbattery': drawLowbattery(); break;
    case 'winupdate': drawWinupdate(); break;
    case 'momrdp': drawMomrdp(); break;
    case 'crt': drawCrt(); break;
    case 'bsodpersonal': drawBsodpersonal(); break;
    case 'loadingbar': drawLoadingbar(); break;
    case 'error404': drawError404(); break;
    case 'kernelpanic': drawKernelpanic(); break;
    case 'bluescreen': drawBluescreen(); break;
  }
}

/* =====================================================================
   DVD BUMPER
===================================================================== */
let dvdX=50, dvdY=50, dvdSpeedX=2.5, dvdSpeedY=2.0; const DVD_COLORS=['#00ffcc','#ff00ff','#ffff00','#ff3300','#00ff00','#00f0ff'];
function animateDVDLogo(){
  if(phase.mode==='dvd' && !paused){
    const w=window.innerWidth-dvdLogo.offsetWidth-20, h=window.innerHeight-dvdLogo.offsetHeight-80;
    dvdX+=dvdSpeedX; dvdY+=dvdSpeedY;
    if(dvdX>=w||dvdX<=10){ dvdSpeedX=-dvdSpeedX; dvdLogo.style.color=DVD_COLORS[Math.floor(Math.random()*DVD_COLORS.length)]; }
    if(dvdY>=h||dvdY<=10){ dvdSpeedY=-dvdSpeedY; dvdLogo.style.color=DVD_COLORS[Math.floor(Math.random()*DVD_COLORS.length)]; }
    dvdLogo.style.left=`\( {dvdX}px`; dvdLogo.style.top=` \){dvdY}px`;
  }
  requestAnimationFrame(animateDVDLogo);
}
animateDVDLogo();

/* =====================================================================
   MAIN LOOP + PLAY/PAUSE
===================================================================== */
let lastTime = 0;
function animate(time){
  if(paused) return;
  requestAnimationFrame(animate);
  if (time - lastTime < 15) return;
  lastTime = time;
  globalAngle+=0.02;
  if(phase.mode!=='none') drawFrame();
}
function togglePause(e){
  if(e) e.stopPropagation();
  paused=!paused;
  const btn=document.getElementById('playpause-toggle');
  if(paused){
    btn.textContent='▶ PLAY';
    if(phaseTimer) clearInterval(phaseTimer);
    if(scrambleInterval) clearInterval(scrambleInterval);
    if(scrambleTimeout) clearTimeout(scrambleTimeout);
  } else {
    btn.textContent='⏸ PAUSE';
    resetPhaseTimer();
    runScrambleCycle();
    requestAnimationFrame(animate);
  }
}

/* =====================================================================
   VISITOR COUNTER & TOASTS
===================================================================== */
const visitorBox=document.getElementById('visitor-box');
setInterval(()=>{
  if(Math.random()<0.2){ visitorBox.textContent='VISITS: 00666'; visitorBox.style.color='#ff0000'; visitorBox.style.borderColor='#ff0000'; }
  else{ const v=Math.floor(Math.random()*99999).toString().padStart(5,'0'); visitorBox.textContent=`VISITS: ${v}`; visitorBox.style.color='#ff3333'; visitorBox.style.borderColor='#ff1111'; }
},150);

let toastEl=null, toastHideTimer=null;
function showToast(msg){
  if(!toastEl){
    toastEl=document.createElement('div');
    toastEl.style.cssText='position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:999999;font-family:"Press Start 2P",monospace;font-size:11px;background:rgba(0,0,0,.88);border:2px solid currentColor;padding:10px 18px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .3s ease;white-space:nowrap;';
    document.body.appendChild(toastEl);
  }
  toastEl.style.color=phase.color; toastEl.textContent=msg; toastEl.style.opacity='1';
  clearTimeout(toastHideTimer); toastHideTimer=setTimeout(()=>{ toastEl.style.opacity='0'; },1800);
}
function hitContact(e){ if(e) e.stopPropagation(); showToast('>> '+phase.contact.replace(/[\[\]]/g,'').trim()+'...'); }

/* =====================================================================
   PHASE NAVIGATION & INPUT HANDLING
===================================================================== */
function pad(n,len){ return String(n).padStart(len,'0'); }
function setPhase(index){
  currentPhaseIndex=((index%PHASES.length)+PHASES.length)%PHASES.length;
  phase=PHASES[currentPhaseIndex];

  phaseNumEl.textContent=`No. ${pad(currentPhaseIndex+1,3)} / ${PHASES.length}`;
  phaseNameSmEl.textContent=phase.name;
  contactBtn.textContent=phase.contact;

  document.body.style.backgroundColor=phase.bg;
  document.body.classList.toggle('light-mode',!!phase.light);
  canvas.style.filter='';
  canvas.classList.toggle('active',phase.mode!=='none');

  scrambleTextEl.className='title';
  scrambleTextEl.style.color=phase.color;
  scrambleTextEl.style.textShadow=phase.shadow;
  restingFont=phase.font;
  scrambleTextEl.style.fontFamily=restingFont;

  dvdLogo.style.display=phase.mode==='dvd'?'block':'none';

  reinitCurrentMode();
  runScrambleCycle();
}
function prevPhase(){ setPhase(currentPhaseIndex-1); resetPhaseTimer(); }
function nextPhase(){ setPhase(currentPhaseIndex+1); resetPhaseTimer(); }
function randomPhase(){ setPhase(Math.floor(Math.random()*PHASES.length)); resetPhaseTimer(); }
function resetPhaseTimer(){
  if(phaseTimer) clearInterval(phaseTimer);
  if(paused || gameActive) return;
  phaseTimer=setInterval(()=>setPhase(currentPhaseIndex+1),30000);
}

function handleGameInput() {
  if (phase.isGame) {
    if (!gameActive) setGameActive(true);
    if (phase.mode === 'dino' && !dinoState.jumping) { dinoState.jumping = true; dinoState.vy = -13; }
    return true;
  }
  return false;
}

let isScrolling=false;
window.addEventListener('wheel',(e)=>{
  if(isScrolling || gameActive) return; isScrolling=true;
  if(e.deltaY>0) nextPhase(); else if(e.deltaY<0) prevPhase();
  setTimeout(()=>{ isScrolling=false; },200);
});
function handleDrewClick(e){ if(e) e.stopPropagation(); prevPhase(); }
function handleWtfClick(e){ if(e) e.stopPropagation(); nextPhase(); }
function handleDotClick(e){ if(e) e.stopPropagation(); randomPhase(); }

window.addEventListener('pointerdown',(e)=>{
  if(e.target.closest('.clickable-word')||e.target.closest('.ui-box')) return;
  if (handleGameInput()) return;
  if(e.clientY<window.innerHeight/2) prevPhase(); else nextPhase();
});
window.addEventListener('keydown',(e)=>{
  if(phase.isGame && (e.key === ' ' || e.key.startsWith('Arrow'))) {
    e.preventDefault(); handleGameInput(); return;
  }
  if(e.key==='ArrowUp'||e.key==='ArrowRight') nextPhase();
  else if(e.key==='ArrowDown'||e.key==='ArrowLeft') prevPhase();
  else if(e.key===' '){ e.preventDefault(); togglePause(); }
});
window.addEventListener('resize',resizeCanvas);
window.addEventListener('orientationchange',resizeCanvas);

/* =====================================================================
   TEXT MORPH ENGINE
===================================================================== */
function randomizeString(str){
  return str.split('').map(c=>Math.random()<0.35?GLITCH_CHARS[Math.floor(Math.random()*GLITCH_CHARS.length)]:c).join('');
}
let scrambleInterval=null, scrambleTimeout=null;
function runScrambleCycle(){
  if(scrambleInterval) clearInterval(scrambleInterval);
  if(scrambleTimeout) clearTimeout(scrambleTimeout);

  scrambleTextEl.classList.remove(...WILD_CLASSES);
  scrambleTextEl.style.fontFamily=restingFont;
  wordDrewEl.textContent='DREW';
  wordWtfEl.textContent='WTF';

  scrambleTimeout=setTimeout(()=>{
    const variant=MORPH_VARIANTS[Math.floor(Math.random()*MORPH_VARIANTS.length)];
    scrambleTextEl.style.fontFamily=SCRAMBLE_FONT_STACK;
    let frame=0;
    scrambleInterval=setInterval(()=>{
      wordDrewEl.textContent=randomizeString(variant.left);
      wordWtfEl.textContent=randomizeString(variant.right);
      frame++;
      if(frame>=18){
        clearInterval(scrambleInterval);
        scrambleTextEl.style.fontFamily=variant.font;
        wordDrewEl.textContent=variant.left;
        wordWtfEl.textContent=variant.right;

        const wild=phase.wild||(Math.random()<0.4?WILD_CLASSES[Math.floor(Math.random()*WILD_CLASSES.length)]:null);
        if(wild) scrambleTextEl.classList.add(wild);

        scrambleTimeout=setTimeout(()=>{
          scrambleTextEl.classList.remove(...WILD_CLASSES);
          scrambleTextEl.style.fontFamily=restingFont;
          wordDrewEl.textContent='DREW';
          wordWtfEl.textContent='WTF';
          runScrambleCycle();
        },1200);
      }
    },45);
  },2000);
}

/* =====================================================================
   BOOT
===================================================================== */
resizeCanvas();
setPhase(0);
resetPhaseTimer();
requestAnimationFrame(animate);
</script>
