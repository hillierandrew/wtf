<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<style>
:root{--bg:#050508;--fg:#e0e0e0;--a1:#ff0055;--a2:#00ffcc;--a3:#ffaa00;--f:'Courier New',Courier,monospace}
body.demonic{--bg:#050000;--fg:#ff3333;--a1:#aa0000;--a2:#ff0000;--a3:#ff0000;cursor:none !important;}
body.demonic * {cursor:none !important;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f)}
.ns{user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:1}

/* ===== CUSTOM CURSOR FOR OUIJA ===== */
#spirit-cursor {
  position: fixed; width: 40px; height: 40px; border: 2px solid #ff0000; border-radius: 50%;
  pointer-events: none; z-index: 999999; transform: translate(-50%, -50%);
  box-shadow: 0 0 15px #ff0000, inset 0 0 10px #ff0000; display: none;
}
body.demonic #spirit-cursor { display: block; }

/* ===== MOBILE-FIRST SPLASH SCREEN ===== */
#splash {
  position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(circle at center, #0a0a0f 0%, #000 100%); cursor:pointer;
  transition: opacity 1s ease, transform 1s ease;
  width: 100vw; height: 100vh; height: 100dvh;
}
.splash-content { display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; width: 90%; text-align: center; }
.gyro {
  position: relative; width: 130px; height: 130px; transform-style: preserve-3d;
  animation: floatOrb 6s ease-in-out infinite, spinMaster 20s linear infinite; margin-bottom: 30px;
}
.ring {
  position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 15px rgba(0,255,204,0.1);
  border: 1px solid rgba(0, 255, 204, 0.4);
}
.ring:nth-child(1) { transform: rotateX(60deg); animation: spinX 8s linear infinite; border-color: rgba(255, 0, 85, 0.5); }
.ring:nth-child(2) { transform: rotateY(60deg); animation: spinY 12s linear infinite reverse; }
.ring:nth-child(3) { transform: rotateX(45deg) rotateY(45deg); animation: spinZ 10s linear infinite; }
.gyro-core {
  position: absolute; top: 50%; left: 50%; width: 16px; height: 16px; transform: translate(-50%, -50%);
  background: #0fc; border-radius: 50%; box-shadow: 0 0 30px #0fc;
}
.splash-title {
  font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 300; letter-spacing: 0.3rem; margin-bottom: 15px;
  color: #fff; text-transform: uppercase;
}
.splash-prompt {
  color: #0fc; font-size: 0.75rem; letter-spacing: 0.2rem; text-transform: uppercase;
  border-top: 1px solid #333; padding-top: 15px; width: 100%; text-align: center;
}
@keyframes spinMaster { 100% { transform: rotateZ(360deg) rotateX(360deg); } }
@keyframes spinX { 100% { transform: rotateX(420deg); } }
@keyframes spinY { 100% { transform: rotateY(420deg); } }
@keyframes spinZ { 100% { transform: rotateX(405deg) rotateY(405deg); } }
@keyframes floatOrb { 0%, 100% { top: 0; } 50% { top: -15px; } }

/* ===== MAIN UI & BOTTOM CONTROLS ===== */
#main { position:relative; z-index:10; width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.wg { font-size:clamp(3.5rem, 14vw, 8rem); font-weight:bold; display:flex; align-items:baseline; gap:2px; }
.node { cursor:pointer; display:inline-block; transition:transform .1s,color .2s; padding: 8px; }
.n_lt:hover { color:var(--a1); }
#n_dot { color:var(--a2); font-size:0.2em; vertical-align:baseline; line-height:0; display:inline-block; position:relative; top:-0.1em; }
#n_wtf:hover { color:var(--a3); }
.wg { --beat:0; transform:scale(calc(1 + var(--beat)*.06)); }
.shake { animation:shake .15s infinite; }
@keyframes shake{0%{transform:translate(0)}20%{transform:translate(-4px,4px)}40%{transform:translate(4px,-4px)}60%{transform:translate(-4px,-4px)}80%{transform:translate(4px,4px)}100%{transform:translate(0)}}

#btm_ctrl {
  position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px; align-items: center; z-index: 10000;
  background: rgba(15,15,20,0.85); backdrop-filter: blur(10px);
  padding: 8px 16px; border-radius: 30px; border: 1px solid rgba(0,255,204,0.2);
  width: 90%; max-width: 340px; justify-content: space-between;
}
#btm_ctrl button { background: none; border: none; color: #aaa; font-family: var(--f); font-size: 0.85rem; cursor: pointer; padding: 4px 8px; }
#anim_lbl { color: #0fc; font-size: 0.75rem; letter-spacing: 1px; text-align: center; }

/* ===== OUIJA BOARD ===== */
#ouija {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95vw; max-width: 650px;
  display: none; flex-direction: column; opacity: 0; transition: opacity 1s;
  text-align: center; color: #b18862; font-family: 'Times New Roman', serif; z-index: 15;
}
.demonic #main .wg { transform: translateY(-35vh) scale(0.4); }
.demonic #ouija { display: flex; opacity: 1; pointer-events: auto; }
.ouija-row { display: flex; justify-content: center; align-items: center; gap: 1.5vw; flex-wrap: wrap; }
.ouija-btn { cursor: pointer; transition: 0.2s; font-size: clamp(1.1rem, 3.5vw, 1.8rem); font-weight: bold; padding: 4px 8px; text-shadow: 0 2px 8px #000; }
.ouija-btn:hover { color: #f00; transform: scale(1.3); }
#ouija_out { font-family: var(--f); color: #fff; text-shadow: 0 0 10px #f00; font-size: 1rem; min-height: 2rem; margin-top: 15px; letter-spacing: 3px; }

/* ===== PRANK SCREEN ===== */
#prank { display:none; position:fixed; inset:0; background:#000; color:#0f0; font-family:var(--f); z-index:100000; padding:5vw; font-size:2.2vh; }
#p_head { color:#f00; font-size:5vh; text-align:center; }
#p_log { margin-top:20px; line-height:1.6; font-size: 1.8vh; }
#p_cd { font-size:12vh; text-align:center; color:#f00; margin-top:20px; font-weight:bold; }
.pbar { display:inline-block; background:#0f0; height:1em; width:0%; transition:width 1s linear; vertical-align:middle; margin-left:10px; }

/* ===== MOBILE FIRST MODAL & PC BUILDER ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,5,0.96);z-index:1000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;}
.modal.show{display:flex;opacity:1;}
.mc{
  background:linear-gradient(160deg,#10101c,#08080f);border:1px solid rgba(255,255,255,0.1);
  width:100vw;height:100vh;height:100dvh;padding:12px;overflow-y:auto;position:relative;color:#e0e0e0;
  display: flex; flex-direction: column;
}
@media(min-width:768px){.mc{width:92vw;max-width:1100px;height:88vh;border-radius:14px;padding:22px;}}
.x{position:absolute;top:10px;right:14px;background:none;border:0;color:#888;font-size:2.2rem;cursor:pointer;z-index:10;}
h2{background:linear-gradient(90deg,#ff0055,#ff9a00,#00ffcc);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.2rem;letter-spacing:1px;}

.layout{display:flex;flex-direction:column;gap:12px;flex:1;overflow-y:auto;}
@media(min-width:850px){.layout{display:grid;grid-template-columns:1fr 320px;gap:16px;overflow:hidden;}}
.left-pane { display:flex; flex-direction:column; height:100%; overflow-y:auto; padding-right:4px; }

.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-bottom:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch;}

.tools{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tools input,.tools select{background:#000;color:#fff;border:1px solid #333;border-radius:6px;padding:8px;font-family:var(--f);flex:1;min-width:110px;font-size:0.8rem;}

.grid{display:grid;grid-template-columns:1fr;gap:8px;padding-bottom:20px;}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}}
.p{background:linear-gradient(160deg,#171724,#101018);border:1px solid #2a2a33;border-left:4px solid #444;border-radius:8px;padding:12px;cursor:pointer;font-size:.8rem;position:relative;}

.sum{background:linear-gradient(160deg,rgba(0,255,204,0.05),rgba(255,0,85,0.05));border:1px solid rgba(0,255,204,0.2);border-radius:10px;padding:14px;font-size:.8rem;overflow-y:auto;max-height:100%;}
.sum h3{color:#fff;margin-bottom:8px;font-size:1rem;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:6px;}
.sum-item { border-bottom: 1px solid rgba(255,255,255,0.04); padding: 6px 0; }
.sum-row { display:flex; justify-content:space-between; margin-bottom: 2px; }
.sum-cat { color: #888; font-weight: bold; }
.sum-price { color: #aaa; }
.sum-name { color: #0fc; font-size: 0.72rem; display: block; line-height: 1.2; }

.tot{font-size:1.8rem;color:#00ffcc;font-weight:bold;margin:10px 0 2px;}
.btn{background:#222;color:#fff;border:1px solid #555;padding:8px 14px;border-radius:6px;cursor:pointer;font-family:var(--f);margin:6px 4px 0 0;width:100%;text-align:center;font-size:0.85rem;}

.pb-btn{background:rgba(170,0,255,0.1);border-color:#aa00ff;color:#e088ff}.pb-btn.on{background:#aa00ff;color:#fff;font-weight:bold;}

<script>
/* ===== AUDIO & SAFARI FIX ===== */
const bgm=document.getElementById('bgm'),muteBtn=document.getElementById('mute_btn');
let fell=false, AC, muted=false, LIM=300, an, fd;

function beep(f,d=.08,t='square',v=.05){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const chime=()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*90)),sting=()=>{beep(55,.6,'sawtooth',.12);beep(58,.6,'square',.08)};

function setupAn(){if(!/^https?:/.test(location.protocol)||fell)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const sr=AC.createMediaElementSource(bgm);an=AC.createAnalyser();an.fftSize=256;sr.connect(an);an.connect(AC.destination);fd=new Uint8Array(an.frequencyBinCount)}catch(e){an=null}}

function toggleMute() {
  muted = !muted; bgm.muted = muted;
  muteBtn.textContent = muted ? '♪ OFF' : '♪ ON';
  muteBtn.style.color = muted ? '#f05' : '#aaa';
}

let open1=false;
function unlock(e){
  if(open1) return;
  open1=true; bgm.volume=.5; bgm.play().catch(()=>{}); chime(); setupAn();
  const sp = document.getElementById('splash');
  sp.style.opacity = 0; sp.style.pointerEvents = 'none';
  setTimeout(()=>sp.remove(), 1000);
  anim();
}

/* ===== SPIRIT CURSOR ===== */
addEventListener('pointermove', e => {
  const sc = document.getElementById('spirit-cursor');
  sc.style.left = e.clientX + 'px'; sc.style.top = e.clientY + 'px';
});

/* ===== EASTER EGGS ===== */
function pulse(el,col){el.style.color=col;el.style.transform='scale(1.2)';setTimeout(()=>{el.style.color='';el.style.transform=''},150)}
function om(id){document.getElementById(id).classList.add('show')}
function cm(id){document.getElementById(id).classList.remove('show')}

let clk_dew = 0, clk_r = 0, clk_wtf = 0;
const checkDew = (e) => { e.stopPropagation(); pulse(e.target,'#ff0055'); chime(); clk_dew++; if(clk_dew >= 10) { clk_dew=0; om('mb'); draw(); } };
document.getElementById('n_d').onclick = checkDew;
document.getElementById('n_e').onclick = checkDew;
document.getElementById('n_w').onclick = checkDew;
document.getElementById('n_wtf').onclick = e => { e.stopPropagation(); pulse(e.target, '#ffaa00'); chime(); clk_wtf++; if(clk_wtf >= 10) { clk_wtf=0; om('mf'); fshow(); } };

let pranking = false;
document.getElementById('n_r').onclick = e => { e.stopPropagation(); pulse(e.target,'#f00'); chime(); clk_r++; if(clk_r >= 6) { clk_r = 0; cm('mb'); startRizwan(); } };

function startRizwan() {
  if(pranking) return; pranking = true;
  const p = document.getElementById('prank'), log = document.getElementById('p_log'), cd = document.getElementById('p_cd');
  p.style.display = 'block'; log.innerHTML = ''; cd.innerHTML = ''; bgm.pause();
  const steps = [{t: "INITIALIZING PROTOCOL...", d: 1000}, {t: "COPYING PHONE CONTENTS <span class='pbar'></span>", d: 1800}, {t: "UPLOADING TO RUSSIA <span class='pbar'></span>", d: 1800}, {t: "DELETING LOCAL DATA <span class='pbar'></span>", d: 1200}, {t: "CRITICAL FAILURE IMMINENT", d: 800}];
  let s = 0;
  function nextStep() {
    if(s < steps.length) {
      log.innerHTML += `<div>> ${steps[s].t}</div>`; beep(200,.1,'sawtooth',.2);
      let bars = p.querySelectorAll('.pbar'); if(bars.length) setTimeout(()=>{ bars[bars.length-1].style.width = '180px'; }, 50);
      setTimeout(nextStep, steps[s].d); s++;
    } else {
      let count = 15;
      let cdi = setInterval(() => {
        cd.innerHTML = count; beep(1000 + (15-count)*100, .15, 'square', .3); count--;
        if(count < 0) { clearInterval(cdi); cd.innerHTML = "LOL"; cd.style.fontSize = "20vh"; beep(150, 1, 'sawtooth', .4); setTimeout(() => { p.style.display='none'; pranking=false; if(!muted) bgm.play(); }, 2000); }
      }, 1000);
    }
  }
  nextStep();
}

/* ===== OUIJA BOARD ===== */
const mkArch = (id, str) => {
  let html = '';
  for(let i=0; i<str.length; i++) {
    let deg = (i/(str.length-1)) * 45 - 22.5;
    let y = Math.pow(deg, 2) * 0.03;
    html += `<div class="ouija-btn" style="transform:translateY(${y}px) rotate(${deg}deg)" onclick="oj('${str[i]}')">${str[i]}</div>`;
  }
  document.getElementById(id).innerHTML = html;
};
mkArch('o_arch1', 'ABCDEFGHIJKLM');
mkArch('o_arch2', 'NOPQRSTUVWXYZ');

let demon=false;const c={t:0};
document.getElementById('n_dot').onclick = e => {
  e.stopPropagation(); pulse(e.target,'');
  if(demon){ demon=false;c.t=0;document.body.classList.remove('demonic');document.getElementById('main').classList.remove('shake');bgm.playbackRate=1;chime();document.getElementById('ouija_out').innerText = '...'; return; }
  c.t++;beep(110+c.t*45,.12,'sawtooth',.07);
  if(c.t>=6){ c.t=0;demon=true;sting();document.body.classList.add('demonic');document.getElementById('main').classList.add('shake');bgm.playbackRate=.7; }
};

let ojStr = "";
function oj(l) {
  if(!demon) return; beep(150 + Math.random()*100, 0.3, 'sawtooth', 0.1);
  if(l === 'GOODBYE') { ojStr = ""; demon=false; document.body.classList.remove('demonic'); document.getElementById('main').classList.remove('shake'); bgm.playbackRate=1; chime(); }
  else if(l === 'YES' || l === 'NO') { ojStr = l; } else { ojStr += l; }
  document.getElementById('ouija_out').innerText = ojStr || '...';
}

/* ===== 12 BACKGROUND WALLPAPER ANIMATIONS ===== */
const cv=document.getElementById('bg'),cx=cv.getContext('2d'),mc2=document.getElementById('meter'),mx=mc2.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;mc2.width=innerWidth;mc2.height=30}addEventListener('resize',rs);rs();
let bass=0,rip=[];
addEventListener('pointerdown',e=>{
  if(!open1) return;
  if(e.target.closest('button') || e.target.closest('.modal') || e.target.closest('.node')) return;
  rip.push({x:e.clientX,y:e.clientY,r:0});
  chAnim(1); // Tap background to change vibe!
});

const stars=Array.from({length:250},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random()}));
const nodes_web=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.001,vy:(Math.random()-.5)*.001}));
let dr=[], vortex=Array.from({length:150},()=>({ a:Math.random()*Math.PI*2, r:Math.random(), v:0.01+Math.random()*0.02 }));

let mode=0;const C=()=>demon?'255,40,40':'0,255,204';
const MODES=[
  // 1: Earthbound Swirl
  (W,H,t)=>{ for(let i=0;i<6;i++){ cx.fillStyle=`hsla(${(t*30+i*60)%360},100%,50%,0.12)`; cx.beginPath(); cx.arc(W/2,H/2,Math.max(W,H)*(1-((t*0.15+i*0.15)%1)),0,7); cx.fill(); } },
  // 2: Earthbound Raster Bars
  (W,H,t)=>{ let bh=H/15; for(let i=0;i<15;i++){ cx.fillStyle=`hsla(${(t*40+i*24)%360},90%,45%,0.3)`; cx.fillRect(Math.sin(t*2+i)*80,i*bh,W,bh-2); } },
  // 3: Cybernetic Web
  (W,H)=>{ nodes_web.forEach(n=>{n.x=(n.x+n.vx+1)%1;n.y=(n.y+n.vy+1)%1}); nodes_web.forEach((a,i)=>{ cx.fillStyle=demon?'#f33':'#0fc'; cx.beginPath(); cx.arc(a.x*W,a.y*H,2,0,7); cx.fill(); for(let j=i+1;j<nodes_web.length;j++){ const b=nodes_web[j],d=Math.hypot((a.x-b.x)*W,(a.y-b.y)*H); if(d<140){ cx.strokeStyle=`rgba(${C()},${(1-d/140)*0.7})`; cx.beginPath(); cx.moveTo(a.x*W,a.y*H); cx.lineTo(b.x*W,b.y*H); cx.stroke(); } } }); },
  // 4: Warp Speed Starfield
  (W,H,t)=>{ let sp=0.002*(demon?2:1); stars.forEach(s=>{ s.z-=sp; if(s.z<=0)s.z=1; let k=1/s.z, x=W/2+s.x*W*.3*k, y=H/2+s.y*H*.3*k; cx.fillStyle=`rgba(150,220,255,${1-s.z})`; cx.fillRect(x,y, (1-s.z)*3, (1-s.z)*3); }); },
  // 5: Matrix Code Rain
  (W,H)=>{ const n=Math.ceil(W/18); while(dr.length<n)dr.push(Math.random()*H/18); cx.font='14px monospace'; cx.fillStyle=demon?'#f33':'#0fc'; dr.forEach((y,i)=>{ cx.fillText(String.fromCharCode(12448+Math.random()*96|0),i*18,y*18); dr[i]=y*18>H&&Math.random()>.95?0:y+1; }); },
  // 6: Pulsing Sacred Geometry
  (W,H,t)=>{ cx.lineWidth=2; for(let i=1;i<=5;i++){ cx.strokeStyle=`hsla(${150+i*30},100%,50%,0.3)`; let r=i*65+Math.sin(t*3+i)*30; cx.beginPath(); cx.arc(W/2,H/2,r,0,7); cx.stroke(); } },
  // 7: Neon Vortex
  (W,H,t)=>{ vortex.forEach(p=>{ p.a+=p.v; p.r-=0.003; if(p.r<=0)p.r=1; let rad=p.r*Math.max(W,H); cx.fillStyle=`rgba(${C()},${1-p.r})`; cx.fillRect(W/2+Math.cos(p.a+t)*rad, H/2+Math.sin(p.a+t)*rad, 3, 3); }); },
  // 8: Oscilloscope Sine Waves
  (W,H,t)=>{ cx.lineWidth=3; cx.beginPath(); for(let x=0;x<=W;x+=15){ let y=H/2+Math.sin(x*0.01+t*4)*90; cx.strokeStyle=`hsla(${(t*80+x*0.2)%360},100%,60%,0.8)`; x===0?cx.moveTo(x,y):cx.lineTo(x,y); } cx.stroke(); },
  // 9: Digital Grid Wave
  (W,H,t)=>{ let s=45; for(let x=0;x<W;x+=s){ for(let y=0;y<H;y+=s){ let w=Math.sin(x*0.01+t*2)+Math.cos(y*0.01+t*2); cx.fillStyle=`hsla(${(t*40+x)%360},100%,50%,${Math.max(0,w*0.25)})`; cx.fillRect(x+1,y+1,s-2,s-2); } } },
  // 10: Plasma Tunnel
  (W,H,t)=>{ for(let i=1;i<=8;i++){ cx.strokeStyle=`hsla(${i*40+t*50},100%,50%,0.4)`; cx.beginPath(); let rx=W/4+Math.sin(t+i)*100, ry=H/4+Math.cos(t*1.2+i)*100; cx.ellipse(W/2,H/2,rx*i*0.3,ry*i*0.3,t+i,0,7); cx.stroke(); } },
  // 11: Laser Beams
  (W,H,t)=>{ cx.lineWidth=1; for(let i=0;i<12;i++){ cx.strokeStyle=`hsla(${i*30},100%,60%,0.5)`; cx.beginPath(); cx.moveTo(W/2,H/2); cx.lineTo(W/2+Math.cos(t+i*0.5)*W, H/2+Math.sin(t*1.3+i*0.5)*H); cx.stroke(); } },
  // 12: Retro Starburst
  (W,H,t)=>{ cx.lineWidth=2; for(let i=0;i<16;i++){ let a=t+i*(Math.PI/8); cx.strokeStyle=`hsla(${i*20},100%,50%,0.4)`; cx.beginPath(); cx.moveTo(W/2,H/2); cx.lineTo(W/2+Math.cos(a)*Math.max(W,H), H/2+Math.sin(a)*Math.max(W,H)); cx.stroke(); } }
];

function chAnim(dir) {
  mode = (mode + dir + MODES.length) % MODES.length;
  document.getElementById('anim_lbl').innerText = `VIBE ${mode+1}/${MODES.length}`;
  cx.globalAlpha=.2; cx.fillStyle='#000'; cx.fillRect(0,0,cv.width,cv.height); cx.globalAlpha=1;
  beep(500+mode*50,.05,'triangle',.04);
}

function anim(){
  const W=cv.width,H=cv.height,t=performance.now()/1000,N=64,lv=[],idle=bgm.paused||bgm.muted;
  if(an&&!idle){an.getByteFrequencyData(fd);for(let i=0;i<N;i++)lv.push(fd[i]/255);bass=(fd[1]+fd[2]+fd[3]+fd[4])/1020}
  else{const b=idle?0:Math.pow(Math.max(0,Math.sin(t*Math.PI*2*1.9)),6);bass=bass*.8+b*.2;for(let i=0;i<N;i++)lv.push(idle?0:(.25+.5*Math.abs(Math.sin(t*3+i*.5)))*(.4+bass))}
  document.querySelector('.wg').style.setProperty('--beat',bass.toFixed(3));
  
  cx.fillStyle=demon?'rgba(10,0,0,.3)':'rgba(5,5,8,.3)'; cx.fillRect(0,0,W,H);
  MODES[mode](W,H,t);
  
  rip=rip.filter(r=>(r.r+=8)<300);
  rip.forEach(r=>{cx.strokeStyle=`rgba(${C()},${1-r.r/300})`;cx.lineWidth=2;cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.stroke()});
  
  const mw=mc2.width,mh=30; mx.clearRect(0,0,mw,mh); mx.strokeStyle=demon?'#f00':'#0fc'; mx.lineWidth=2; mx.beginPath();
  for(let i=0;i<N;i++){const x=i/(N-1)*mw,y=mh/2-(i%2?1:-1)*lv[i]*mh*.45;i?mx.lineTo(x,y):mx.moveTo(x,y)} mx.stroke();
  requestAnimationFrame(anim);
}

for(const k in RAW){const r=RAW[k],ks=r.k.split(' ');CAT[k]=r.t.split('\n').map(l=>{const v=l.split('|'),o={id:k+(id++),cat:k};ks.forEach((q,i)=>{o[q]=v[i]===undefined?'':v[i]}); o.price=+o.price; o.f=o.f||''; o.sold=o.f.includes('x'); ['w','rec','ddr','form','board','rad','igpu','sfx','sfxo'].forEach(q=>{if(o[q]!==undefined&&o[q]!=='')o[q]=+o[q]}); return o})}

const S={};let tab='cpu', pbMode=false;

const P_BUILDS = [
  { n: "🟢 Budget Tier ($1,500)", desc: "Rock-solid 1080p gaming & fast daily tasks.", p: {cpu:"AMD Ryzen 5 7600X 6-Core (Best Value)", gpu:"ASUS Dual GeForce RTX 5050 8GB (Solid 1080p)", mb:"GIGABYTE B650 EAGLE AX (Reliable & Popular)", ram:"CORSAIR VENGEANCE RGB 32GB 6000MHz (Fast & Stable)", psu:"CORSAIR RM850x 850W Gold (Quiet & Safe)", cpucooler:"DeepCool AK400 G2 Air Cooler (Simple & Dependable)", case:"NZXT H7 Flow (Easy Cable Management)", ssd:"WD Black SN850X 2TB NVMe (Lightning Fast)"} },

  { n: "🟣 Extreme Enthusiast ($5,500+)", desc: "Absolute top-tier 4K performance with zero limits.", p: {cpu:"AMD Ryzen 9 9950X3D 16-Core (Extreme Powerhouse)", gpu:"ASUS PRIME GeForce RTX 5080 16GB (Ultimate 4K)", mb:"ASUS ROG STRIX X870E-E GAMING (High End Enthusiast)", ram:"CORSAIR VENGEANCE 96GB 6000MHz (Maximum Capacity)", psu:"CORSAIR HX1500i 1500W Platinum (Overkill Capacity)", cpucooler:"CORSAIR iCUE LINK TITAN 360 AIO (Liquid Cooled)", case:"ASUS ROG Hyperion GR701 (Massive Showcase)", ssd:"Samsung 990 Pro 4TB NVMe (Massive Storage)"} }
];

function togglePB() { pbMode = !pbMode; document.getElementById('btn_pb').classList.toggle('on', pbMode); draw(); }
function loadPB(idx) {
  for(let k in S) delete S[k]; let bp = P_BUILDS[idx].p;
  for(let cat in bp) { let f = CAT[cat].find(x => x.name === bp[cat]); if(f) S[cat] = f; }
  pbMode = false; document.getElementById('btn_pb').classList.remove('on'); draw();
}

function pair(a,b){
  const [x,y]=a.cat<b.cat?[a,b]:[b,a];const k=x.cat+'-'+y.cat;
  const M={cpu:a.cat==='cpu'?a:b,mb:a.cat==='mb'?a:b,ram:a.cat==='ram'?a:b,psu:a.cat==='psu'?a:b,gpu:a.cat==='gpu'?a:b,case:a.cat==='case'?a:b,cpucooler:a.cat==='cpucooler'?a:b};
  if(k==='cpu-mb'&&M.cpu.sock!==M.mb.sock)return 'Socket mismatch';
  if(k==='mb-ram'&&M.ram.ddr!==M.mb.ddr)return 'RAM/Board DDR mismatch';
  return null;
}
function why(p){const r=[];for(const c in S){if(c===p.cat)continue;const m=pair(p,S[c]);if(m)r.push(m)}return r}

const $=i=>document.getElementById(i),usd=n=>'$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});

function draw(){
  $('tabs').innerHTML=Object.keys(LAB).map(k=>`<button class="tab ${k===tab?'on':''} ${S[k]?'has':''}" onclick="tab='${k}';LIM=300;draw()">${LAB[k]}</button>`).join('');
  const q=$('q').value.toLowerCase(),so=$('so').value,others=Object.keys(S).filter(k=>k!==tab).length;
  let L=CAT[tab].filter(p=>!q||p.name.toLowerCase().includes(q));
  L.sort((a,b)=>so==='a'?a.price-b.price:so==='d'?b.price-a.price:a.name.localeCompare(b.name));
  
  if(pbMode) {
    $('grid_wrap').innerHTML = `<div style="display:flex; flex-direction:column; gap:10px; padding-bottom:20px;">` + P_BUILDS.map((b,i) => `
      <div class="pb-card">
        <h3>${b.n}</h3><p style="color:#888;margin-bottom:8px;font-size:0.75rem;">${b.desc}</p>
        <button class="btn" onclick="loadPB(${i})" style="background:#aa00ff;border-color:#aa00ff;width:100%;">TAP TO LOAD THIS TIER</button>
      </div>`).join('') + `</div>`;
  } else {
    $('grid_wrap').innerHTML = `<div class="grid" id="grid">` + L.slice(0,LIM).map(p=>{
      const w=why(p),bad=w.length>0,sel=S[tab]&&S[tab].id===p.id;
      return `<div class="p ${sel?'sel':''}" onclick="pick('${p.id}')">
      <span class="em">${bad?'❌':'✅'}</span>
      <div class="n"><b>${p.name}</b></div><span class="pr">${usd(p.price)}</span>
      ${bad?`<div style="color:#f05;font-size:0.7rem;margin-top:4px;">${w[0]}</div>`:''}</div>`
    }).join('') + `</div>`;
  }
  summary();
}

function pick(i){
  const p=CAT[tab].find(x=>x.id===i); beep(1200,.05,'square',.04);
  if(S[tab]&&S[tab].id===i) delete S[tab]; else { S[tab]=p; for(const c in S) if(c!==tab&&pair(p,S[c])) delete S[c]; }
  draw();
}

function summary(){
  if(pbMode) { $('sum').innerHTML = `<h3>STATUS</h3><p style="color:#aaa;">Choose a tier above.</p>`; return; }
  const it=Object.values(S),tot=it.reduce((a,b)=>a+b.price,0);
  let sumHTML = `<h3>YOUR PC BUILD</h3>`;
  Object.keys(LAB).forEach(k => {
    if(!S[k]) { sumHTML += `<div class="sum-item"><div class="sum-row"><span class="sum-cat">${LAB[k]}</span><span class="sum-price">-</span></div></div>`; }
    else { sumHTML += `<div class="sum-item"><div class="sum-row"><span class="sum-cat">${LAB[k]}</span><span class="sum-price">${usd(S[k].price)}</span></div><span class="sum-name">${S[k].name}</span></div>`; }
  });
  sumHTML += `<div class="tot">${usd(tot)}</div>
  <button class="btn" onclick="for(const k in S)delete S[k];draw()" style="background:#333;border-color:#555;">Clear Build</button>`;
  $('sum').innerHTML = sumHTML;
}
