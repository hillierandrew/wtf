/* =====================================================================
   LOFI 8-BIT STUDY-BEAT ENGINE
===================================================================== */
let audioCtx=null, masterGain=null, lofiFilter=null, hatBuffer=null;
let isPlaying=false, nextChordTime=0, barCount=0, schedulerID=null;

const NOTE_FREQS={
  C2:65.41,D2:73.42,E2:82.41,F2:87.31,G2:98.00,A2:110.00,B2:123.47,
  C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,A3:220.00,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,B4:493.88,
  C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99,A5:880.00,B5:987.77
};
const CHORD_PROGRESSION=[
  {tones:['A3','C4','E4','G4'],bass:'A2'},
  {tones:['D3','F3','A3','C4'],bass:'D2'},
  {tones:['G3','B3','D4','F4'],bass:'G2'},
  {tones:['C3','E3','G3','B3'],bass:'C2'}
];
const BPM=74, beatDur=60/BPM, eighth=beatDur/2;

function makeNoiseBuffer(duration){
  const size=audioCtx.sampleRate*duration;
  const buf=audioCtx.createBuffer(1,size,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<size;i++) d[i]=Math.random()*2-1;
  return buf;
}
function playTone(freq,t,dur,vol){
  if(!freq) return;
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type='triangle'; osc.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  osc.connect(g); g.connect(lofiFilter);
  osc.start(t); osc.stop(t+dur+0.05);
}
function playKick(t){
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(140,t);
  osc.frequency.exponentialRampToValueAtTime(42,t+0.15);
  g.gain.setValueAtTime(0.22,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t+0.2);
}
function playHat(t){
  const src=audioCtx.createBufferSource(); src.buffer=hatBuffer;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=7500; bp.Q.value=0.8;
  const g=audioCtx.createGain();
  g.gain.setValueAtTime(0.035,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+0.06);
}
function scheduleLofi(){
  if(!isPlaying||!audioCtx||audioCtx.state!=='running') return;
  while(nextChordTime<audioCtx.currentTime+0.3){
    const chord=CHORD_PROGRESSION[barCount%CHORD_PROGRESSION.length];
    const barStart=nextChordTime;
    playKick(barStart);
    playKick(barStart+beatDur*2);
    playTone(NOTE_FREQS[chord.bass],barStart,beatDur*4*0.9,0.13);
    const pattern=[0,1,2,3,2,1,0,1];
    for(let i=0;i<8;i++){
      const t=barStart+i*eighth;
      playTone(NOTE_FREQS[chord.tones[pattern[i]]],t,eighth*0.9,0.05);
      if(i%2===1) playHat(t);
    }
    nextChordTime+=beatDur*4;
    barCount++;
  }
  schedulerID=setTimeout(scheduleLofi,100);
}
function toggleAudio(e){
  if(e) e.stopPropagation();
  const btn=document.getElementById('audio-toggle');
  if(!isPlaying){
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      masterGain=audioCtx.createGain(); masterGain.gain.value=0.9;
      lofiFilter=audioCtx.createBiquadFilter(); lofiFilter.type='lowpass'; lofiFilter.frequency.value=1600; lofiFilter.Q.value=0.5;
      lofiFilter.connect(masterGain);
      masterGain.connect(audioCtx.destination);
      hatBuffer=makeNoiseBuffer(0.1);
      const crackleSrc=audioCtx.createBufferSource();
      crackleSrc.buffer=makeNoiseBuffer(2); crackleSrc.loop=true;
      const crackleFilter=audioCtx.createBiquadFilter();
      crackleFilter.type='bandpass'; crackleFilter.frequency.value=3000; crackleFilter.Q.value=0.4;
      const crackleGain=audioCtx.createGain(); crackleGain.gain.value=0.012;
      crackleSrc.connect(crackleFilter); crackleFilter.connect(crackleGain); crackleGain.connect(masterGain);
      crackleSrc.start();
    }
    const start=()=>{
      if(audioCtx.state!=='running') return;
      nextChordTime=audioCtx.currentTime+0.1;
      barCount=0; isPlaying=true;
      btn.textContent='🔊 MUTE LOFI';
      scheduleLofi();
    };
    if(audioCtx.state==='suspended') audioCtx.resume().then(start).catch(start);
    else start();
  } else {
    isPlaying=false;
    if(schedulerID) clearTimeout(schedulerID);
    btn.textContent='🔇 UNMUTE LOFI';
  }
}
