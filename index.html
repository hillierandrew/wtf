<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>No internet connection</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, select, input { font: inherit; }
  button { cursor: pointer; }
  #gate { min-height: 100%; background: #fff; color: #5f6368; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .offline { width: min(540px, 100%); text-align: left; }
  #dino { display: block; width: min(100%, 420px); height: auto; background: #fff; touch-action: manipulation; }
  .offline h1 { font-weight: 500; font-size: 1.6em; color: #202124; margin: 18px 0 14px; }
  .offline ul { margin: 8px 0 16px; padding-left: 28px; }
  .secret { background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; cursor: pointer; }
  .code { color: #80868b; font-size: 13px; }
  .cover { position: fixed; inset: 0; background: rgba(255,255,255,.78); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: min(440px, 100%); background: #fff; color: #202124; border: 1px solid #dadce0; border-radius: 8px; padding: 22px; box-shadow: 0 1px 3px rgba(60,64,67,.3); }
  .card h2 { font-weight: 500; margin: 0 0 8px; }
  .card p { color: #5f6368; margin: 0 0 12px; }
  .card input { width: 100%; min-height: 48px; border: 1px solid #dadce0; border-radius: 4px; padding: 0 12px; }
  .card .err { color: #c5221f; font-weight: 700; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .stack button, .go { min-height: 52px; border: 1px solid #dadce0; background: #fff; color: #202124; border-radius: 4px; text-align: left; padding: 0 14px; font-weight: 650; }
  #app { display: none; min-height: 100%; background: #fbfbfd; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #app.on { display: block; }
  .buy { max-width: 1180px; margin: 0 auto; padding: 0 20px 120px; }
  .nav { position: sticky; top: 0; z-index: 4; background: rgba(251,251,253,.9); border-bottom: 1px solid #d2d2d7; padding: 14px 22px; font-weight: 600; letter-spacing: -0.02em; }
  .hero-col { padding: 28px 0 8px; }
  .imac { width: min(100%, 420px); margin: 0 auto 12px; }
  .display { height: 230px; border-radius: 18px 18px 0 0; background: linear-gradient(160deg, #8ec5ff, #1d4e89); border: 10px solid #d7d7dc; border-bottom-width: 18px; }
  .chin { height: 14px; background: #c8c8ce; border-radius: 0 0 10px 10px; }
  .stand { width: 86px; height: 70px; margin: 0 auto; background: linear-gradient(#d2d2d7, #eee); clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%); }
  .foot { width: 150px; height: 8px; margin: -2px auto 0; background: #c7c7cc; border-radius: 8px; }
  .eyebrow { color: #6e6e73; margin: 0; font-size: 17px; }
  .hero-col h1 { font-size: clamp(48px, 8vw, 72px); font-weight: 600; letter-spacing: -0.04em; margin: 0; line-height: .95; }
  .price { font-size: 24px; margin: 8px 0; }
  .status { margin: 0; color: #1d1d1f; }
  .status.bad { color: #b00020; }
  .group h2 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 34px 0 4px; }
  .group .hint { color: #6e6e73; margin: 0 0 12px; }
  .opt { display: block; width: 100%; text-align: left; background: #fff; border: 1px solid #d2d2d7; border-radius: 12px; min-height: 76px; padding: 14px 16px; margin: 0 0 10px; color: #1d1d1f; }
  .opt.on { border: 2px solid #0071e3; }
  .opt:disabled { opacity: .38; }
  .opt b { display: block; font-size: 17px; font-weight: 600; }
  .opt span { display: block; color: #6e6e73; font-size: 14px; margin-top: 2px; }
  .opt i { float: right; font-style: normal; font-size: 14px; }
  .note { color: #6e6e73; font-size: 12px; }
  .bag { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 12px 22px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.88); border-top: 1px solid #d2d2d7; backdrop-filter: blur(16px); }
  .bag b { font-size: 21px; }
  .bag button { background: #0071e3; color: #fff; border: 0; border-radius: 980px; min-height: 44px; padding: 0 20px; font-weight: 600; }
  body.desk .buy { display: grid; grid-template-columns: minmax(280px, 42%) minmax(0, 1fr); column-gap: 28px; max-width: 1180px; }
  body.desk .hero-col { position: sticky; top: 52px; align-self: start; height: calc(100vh - 52px); display: flex; flex-direction: column; justify-content: center; }
  body.desk .opts { padding-top: 24px; }
  body.tv .hero-col h1 { font-size: 80px; }
  body.tv .opt { min-height: 96px; font-size: 22px; }
  body.tv .group h2 { font-size: 40px; }
  body.kindle #app { background: #fff; color: #000; font-family: Georgia, "Times New Roman", serif; }
  body.kindle .opt, body.kindle .bag button { border-radius: 0; }
  body.kindle .display { background: #fff; border-color: #000; }
  .step { display: flex; gap: 8px; }
  .step button { flex: 1; min-height: 52px; background: #fff; border: 1px solid #111; font-weight: 700; }
</style>
</head>
<body>
<div id="gate">
  <div class="offline">
    <canvas id="dino" width="420" height="110" aria-label="Offline dinosaur"></canvas>
    <h1>No internet co<button type="button" class="secret" id="n1">n</button><button type="button" class="secret" id="n2">n</button>ectio<button type="button" class="secret" id="n3">n</button></h1>
    <p>Try:</p>
    <ul>
      <li>Checking the network cables, modem, and router</li>
      <li>Reconnecting to Wi-Fi</li>
      <li>Running Windows Network Diagnostics</li>
    </ul>
    <div class="code">ERR_INTERNET_DISCONNECTED</div>
  </div>
</div>
<div id="modal"></div>
<div id="app"></div>
<script>
(function () {
  var PARTS = {
    cpu: [
      { id: "12400", name: "Intel Core i5-12400", price: 229, sock: "LGA1700", ddr: "4", ig: 1, w: 117, plain: "Fine for school and work. Can draw a picture without a picture card." },
      { id: "5600", name: "AMD Ryzen 5 5600", price: 159, sock: "AM4", ddr: "4", ig: 0, w: 65, plain: "Cheap brain for games. It cannot draw a picture by itself." },
      { id: "7600", name: "AMD Ryzen 5 7600", price: 269, sock: "AM5", ddr: "5", ig: 1, w: 88, plain: "A normal new brain. Can draw a picture by itself." },
      { id: "7800x3d", name: "AMD Ryzen 7 7800X3D", price: 549, sock: "AM5", ddr: "5", ig: 0, w: 120, plain: "Very good at games. Needs a picture card." }
    ],
    mb: [
      { id: "b760", name: "GIGABYTE B760M DS3H DDR4", price: 139, sock: "LGA1700", ddr: "4", form: "mATX", plain: "A small board for the Intel school brain." },
      { id: "b550", name: "MSI B550M PRO-VDH WiFi", price: 149, sock: "AM4", ddr: "4", form: "mATX", plain: "A small board for the cheap AMD brain." },
      { id: "b650m", name: "MSI MAG B650M Mortar WiFi", price: 249, sock: "AM5", ddr: "5", form: "mATX", plain: "A small board for a new AMD brain." },
      { id: "b650", name: "GIGABYTE B650 EAGLE AX", price: 229, sock: "AM5", ddr: "5", form: "ATX", plain: "A full-size board for a new AMD brain." }
    ],
    ram: [
      { id: "d4-16", name: "16GB DDR4 memory", price: 55, ddr: "4", plain: "Enough for school, work, and lighter games." },
      { id: "d4-32", name: "32GB DDR4 memory", price: 99, ddr: "4", plain: "More room for lots of tabs and programs." },
      { id: "d5-16", name: "16GB DDR5 memory", price: 89, ddr: "5", plain: "Enough memory for a new AMD board." },
      { id: "d5-32", name: "32GB DDR5 memory", price: 179, ddr: "5", plain: "The comfortable amount for games and work." }
    ],
    gpu: [
      { id: "none", name: "No picture card", price: 0, w: 0, len: 0, need: 0, plain: "Only works if the brain can draw a picture itself." },
      { id: "3050", name: "NVIDIA GeForce RTX 3050", price: 219, w: 70, len: 200, need: 450, plain: "Plays games at 1080p. Not a big card." },
      { id: "4060", name: "NVIDIA GeForce RTX 4060", price: 389, w: 115, len: 200, need: 550, plain: "A normal card for 1080p and some 1440p." },
      { id: "5070", name: "NVIDIA GeForce RTX 5070", price: 779, w: 250, len: 242, need: 650, plain: "A strong card for 1440p." }
    ],
    ssd: [
      { id: "500", name: "500GB storage", price: 49, plain: "Enough for Windows and some homework." },
      { id: "1tb", name: "1TB storage", price: 99, plain: "Windows plus a bunch of games." },
      { id: "2tb", name: "2TB storage", price: 219, plain: "Lots of games, music, or video." }
    ],
    cool: [
      { id: "ax", name: "Small tower fan", price: 29, h: 148, plain: "Quiet enough. Fits most boxes." },
      { id: "pa", name: "Big tower fan", price: 49, h: 155, plain: "Keeps a hotter brain cool." }
    ],
    psu: [
      { id: "500", name: "500W power box", price: 49, watts: 500, plain: "Only for a PC with no big picture card." },
      { id: "650", name: "650W power box", price: 99, watts: 650, plain: "Enough for a normal picture card." },
      { id: "750", name: "750W power box", price: 149, watts: 750, plain: "Room for a stronger picture card." },
      { id: "850", name: "850W power box", price: 179, watts: 850, plain: "For a strong picture card." }
    ],
    box: [
      { id: "air", name: "Small Montech box", price: 79, form: "mATX", cool: 160, gpu: 330, plain: "A small box. The board must be small too." },
      { id: "h5", name: "NZXT H5 Flow box", price: 119, form: "ATX", cool: 165, gpu: 365, plain: "A normal tower. Fits a full-size board." },
      { id: "d", name: "Corsair 4000D box", price: 129, form: "ATX", cool: 170, gpu: 360, plain: "A normal tower with room for a long picture card." }
    ]
  };

  var ORDER = ["cpu", "mb", "ram", "gpu", "ssd", "cool", "psu", "box"];
  var LABEL = { cpu: "Brain", mb: "Board", ram: "Memory", gpu: "Picture card", ssd: "Storage", cool: "Fan", psu: "Power box", box: "Box" };
  var RANK = { ITX: 1, mATX: 2, ATX: 3 };

  var RECIPES = {
    school: { cpu: "12400", mb: "b760", ram: "d4-16", gpu: "none", ssd: "500", cool: "ax", psu: "500", box: "air" },
    work: { cpu: "7600", mb: "b650m", ram: "d5-16", gpu: "none", ssd: "1tb", cool: "ax", psu: "650", box: "air" },
    games: { cpu: "5600", mb: "b550", ram: "d4-16", gpu: "3050", ssd: "1tb", cool: "ax", psu: "650", box: "air" },
    "games-big": { cpu: "7600", mb: "b650", ram: "d5-32", gpu: "4060", ssd: "1tb", cool: "pa", psu: "750", box: "h5" },
    "games-huge": { cpu: "7800x3d", mb: "b650", ram: "d5-32", gpu: "5070", ssd: "2tb", cool: "pa", psu: "850", box: "d" },
    music: { cpu: "7600", mb: "b650m", ram: "d5-32", gpu: "none", ssd: "2tb", cool: "pa", psu: "650", box: "air" },
    web: { cpu: "12400", mb: "b760", ram: "d4-16", gpu: "none", ssd: "500", cool: "ax", psu: "500", box: "air" }
  };

  var mode = "phone";
  var screen = "job";
  var job = "school";
  var build = copy(RECIPES.school);
  var budget = 700;
  var section = 0;
  var dinoHits = 0;
  var cactusHits = 0;
  var nHits = 0;

  function copy(o) { var n = {}; for (var k in o) n[k] = o[k]; return n; }
  function find(group, id) {
    var list = PARTS[group];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return list[0];
  }
  function money(n) { return "$" + n.toLocaleString(); }
  function total() {
    var t = 0;
    for (var i = 0; i < ORDER.length; i++) t += find(ORDER[i], build[ORDER[i]]).price;
    return t;
  }
  function problems() {
    var cpu = find("cpu", build.cpu), mb = find("mb", build.mb), ram = find("ram", build.ram);
    var gpu = find("gpu", build.gpu), cool = find("cool", build.cool), psu = find("psu", build.psu), box = find("box", build.box);
    var out = [];
    if (cpu.sock !== mb.sock) out.push("The brain does not fit this board. It needs a " + cpu.sock + " board.");
    if (ram.ddr !== mb.ddr) out.push("The memory is the wrong kind. This board wants DDR" + mb.ddr + ".");
    if (!cpu.ig && gpu.id === "none") out.push("This brain cannot draw a picture. Add a picture card or the screen stays black.");
    if (gpu.id !== "none" && psu.watts < gpu.need) out.push("The power box is too small for that picture card. It wants " + gpu.need + " watts or more.");
    var draw = cpu.w + gpu.w + 80;
    if (psu.watts < draw) out.push("The power box should be at least " + draw + " watts for this brain and picture card.");
    if (RANK[mb.form] > RANK[box.form]) out.push("The board is too big for that box.");
    if (cool.h > box.cool) out.push("The fan is too tall for that box.");
    if (gpu.len > box.gpu) out.push("The picture card is too long for that box.");
    return out;
  }
  function fits(group, id) {
    var old = build[group];
    build[group] = id;
    var ok = problems().length === 0;
    build[group] = old;
    return ok;
  }

  function recipeFor(which, dollars) {
    if (which === "games" && dollars >= 2500) return "games-huge";
    if (which === "games" && dollars >= 1500) return "games-big";
    if (which === "games") return "games";
    if (which === "music") return "music";
    if (which === "work" && dollars >= 1000) return "work";
    if (which === "web") return "web";
    return "school";
  }

  function el(html) { app.innerHTML = html; }

  var gate = document.getElementById("gate");
  var app = document.getElementById("app");
  var modal = document.getElementById("modal");

  function showApp() {
    gate.style.display = "none";
    modal.innerHTML = "";
    app.className = "on";
    screen = "buy";
    document.body.className = mode;
    document.title = "Build a PC";
    draw();
  }

  function askDevice() {
    modal.innerHTML = '<div class="cover"><div class="card"><h2>What are you using?</h2><p>This only changes the buttons. The computer parts stay the same.</p><div class="stack" id="devs"></div></div></div>';
    var opts = [["phone", "Phone"], ["desk", "Computer"], ["tv", "TV"], ["kindle", "Kindle"]];
    var box = document.getElementById("devs");
    for (var i = 0; i < opts.length; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = opts[i][1];
      b.setAttribute("data-mode", opts[i][0]);
      b.onclick = function () { mode = this.getAttribute("data-mode"); showApp(); };
      box.appendChild(b);
    }
  }

  function askPassword() {
    modal.innerHTML = '<div class="cover"><form class="card" id="pw"><h2>System authentication</h2><p>Capital letters matter.</p><input id="pwv" type="password" autocomplete="off" placeholder="Password"><p class="err" id="pwe" hidden></p><div class="stack"><button type="submit">Authenticate</button></div></form></div>';
    document.getElementById("pw").onsubmit = function (e) {
      e.preventDefault();
      var v = document.getElementById("pwv").value.trim();
      if (v === "Password1") { mode = "desk"; showApp(); return; }
      var err = document.getElementById("pwe");
      err.hidden = false;
      err.textContent = "That password is not on the list. Sending you to Bing.";
      setTimeout(function () { location.href = "https://www.bing.ca/"; }, 900);
    };
    document.getElementById("pwv").focus();
  }

  var WALL = { school: "linear-gradient(160deg,#b7f5c8,#1f7a4d)", work: "linear-gradient(160deg,#d9e4ff,#3a4d7c)", games: "linear-gradient(160deg,#8ec5ff,#123a73)", music: "linear-gradient(160deg,#f3c6ff,#5b2a6b)", web: "linear-gradient(160deg,#ffe7a3,#c47b16)" };

  function delta(group, item) {
    var now = find(group, build[group]).price;
    var d = item.price - now;
    if (item.id === build[group]) return "";
    if (d === 0) return "same price";
    return (d > 0 ? "+ " : "− ") + money(Math.abs(d));
  }

  function optButton(group, item, on) {
    var ok = fits(group, item.id) || on;
    var why = "";
    if (!ok) {
      var old = build[group];
      build[group] = item.id;
      why = problems()[0] || "Does not fit.";
      build[group] = old;
    }
    return '<button type="button" class="opt' + (on ? " on" : "") + '" data-g="' + group + '" data-id="' + item.id + '"' + (ok ? "" : " disabled") + '><i>' + (on ? "" : delta(group, item)) + '</i><b>' + item.name + '</b><span>' + (ok ? item.plain : why) + '</span></button>';
  }

  function draw() {
    var bad = problems();
    var groups = "";
    var uses = [["school", "School", "Homework and videos."], ["work", "Work", "Email, sheets, and calls."], ["games", "Games", "Play on a monitor."], ["music", "Music", "Record and make songs."], ["web", "Internet", "Browsing and YouTube."]];
    var useHtml = "";
    for (var u = 0; u < uses.length; u++) useHtml += '<button type="button" class="opt' + (job === uses[u][0] ? " on" : "") + '" data-job="' + uses[u][0] + '"><b>' + uses[u][1] + '</b><span>' + uses[u][2] + '</span></button>';
    var cashHtml = "";
    var cashes = [700, 1000, 1500, 2500];
    for (var c = 0; c < cashes.length; c++) cashHtml += '<button type="button" class="opt' + (budget === cashes[c] ? " on" : "") + '" data-cash="' + cashes[c] + '"><b>' + money(cashes[c]) + '</b><span>Suggested PC around this price.</span></button>';
    var partHtml = "";
    for (var n = 0; n < ORDER.length; n++) {
      var gname = ORDER[n];
      var cards = "";
      var list = PARTS[gname];
      for (var j = 0; j < list.length; j++) cards += optButton(gname, list[j], list[j].id === build[gname]);
      partHtml += '<section class="group" data-sec="' + (n + 2) + '"><h2>' + LABEL[gname] + '.</h2><p class="hint">Only a choice that fits can be selected.</p>' + cards + '</section>';
    }
    groups = '<section class="group" data-sec="0"><h2>Use.</h2><p class="hint">This picks a starting PC. You can change every part after.</p>' + useHtml + '</section>' +
      '<section class="group" data-sec="1"><h2>Budget.</h2><p class="hint">Example catalog prices, not a store.</p>' + cashHtml + '</section>' + partHtml;
    if (mode === "kindle") {
      var secs = groups.match(/<section[\s\S]*?<\/section>/g) || [];
      if (section >= secs.length) section = 0;
      groups = secs[section] + '<div class="step"><button type="button" id="prev">Previous</button><button type="button" id="next">Next</button></div>';
    }
    el('<div class="nav">DREW · PC</div><div class="buy"><div class="hero-col"><div class="imac" aria-hidden="true"><div class="display" id="screen"></div><div class="chin"></div><div class="stand"></div><div class="foot"></div></div><p class="eyebrow">Buy</p><h1>PC</h1><p class="price">' + money(total()) + '</p><p class="status ' + (bad.length ? "bad" : "") + '">' + (bad.length ? bad[0] : "This PC works.") + '</p></div><div class="opts">' + groups + '<p class="note">No monitor in this list. Prices are catalog examples.</p></div></div><div class="bag"><div><b>' + money(total()) + '</b><div class="note">' + (bad.length ? "Fix the part above" : "Ready") + '</div></div><button type="button" id="bag">Add to Bag</button></div>');
    var screenEl = document.getElementById("screen");
    if (screenEl) screenEl.style.background = WALL[job] || WALL.web;
    var jobBtns = document.querySelectorAll("[data-job]");
    for (var a = 0; a < jobBtns.length; a++) jobBtns[a].onclick = function () {
      job = this.getAttribute("data-job");
      build = copy(RECIPES[recipeFor(job, budget)]);
      draw();
    };
    var cashBtns = document.querySelectorAll("[data-cash]");
    for (var b = 0; b < cashBtns.length; b++) cashBtns[b].onclick = function () {
      budget = Number(this.getAttribute("data-cash"));
      build = copy(RECIPES[recipeFor(job, budget)]);
      draw();
    };
    var partBtns = document.querySelectorAll("[data-g]");
    for (var p = 0; p < partBtns.length; p++) partBtns[p].onclick = function () {
      if (this.disabled) return;
      build[this.getAttribute("data-g")] = this.getAttribute("data-id");
      draw();
    };
    var prev = document.getElementById("prev");
    var next = document.getElementById("next");
    if (prev) prev.onclick = function () { section = Math.max(0, section - 1); draw(); };
    if (next) next.onclick = function () { section += 1; draw(); };
    document.getElementById("bag").onclick = function () {
      var lines = "PC " + money(total());
      for (var i = 0; i < ORDER.length; i++) lines += "\n" + LABEL[ORDER[i]] + ": " + find(ORDER[i], build[ORDER[i]]).name;
      var self = this;
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(lines);
      self.textContent = bad.length ? "Not yet" : "Added";
    };
  }

  var canvas = document.getElementById("dino");
  var g = canvas.getContext("2d");
  var cactus = [280, 540];
  var run = 0, dy = 0, vy = 0;
  function frame() {
    g.clearRect(0, 0, 420, 110);
    g.fillStyle = "#535353";
    if (run) {
      for (var i = 0; i < cactus.length; i++) {
        cactus[i] -= 4;
        if (cactus[i] < -30) cactus[i] = 500 + Math.random() * 200;
      }
    }
    if (vy || dy) { dy += vy; vy -= 0.8; if (dy < 0) { dy = 0; vy = 0; } }
    g.fillRect(24, 78 - dy, 18, 22);
    g.fillRect(36, 70 - dy, 10, 8);
    g.fillRect(24, 96 - dy, 6, 8);
    g.fillRect(34, 96 - dy, 6, 8);
    for (var c = 0; c < cactus.length; c++) {
      var x = cactus[c];
      g.fillRect(x, 70, 8, 30);
      g.fillRect(x - 8, 80, 8, 6);
      g.fillRect(x + 8, 76, 8, 6);
    }
    g.fillRect(0, 104, 420, 2);
    requestAnimationFrame(frame);
  }
  frame();
  canvas.addEventListener("pointerdown", function (e) {
    var r = canvas.getBoundingClientRect();
    var x = ((e.clientX - r.left) / r.width) * 420;
