<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>drew.wtf</title>
<style>
:root{--bg:#050508;--fg:#e0e0e0;--a1:#ff0055;--a2:#00ffcc;--a3:#ffaa00;--f:'Courier New',Courier,monospace}
body.demonic{--bg:#050000;--fg:#ff3333;--a1:#aa0000;--a2:#ff0000;--a3:#ff0000;cursor:none !important;}
body.demonic * {cursor:none !important;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f);transition:background 1s,color 1s, transform 1s}
.ns{user-select:none;-webkit-user-select:none}
#bg{position:absolute;inset:0;width:100%;height:100%;z-index:1}

/* ===== CUSTOM CURSOR FOR OUIJA ===== */
#spirit-cursor {
  position: fixed; width: 40px; height: 40px; border: 2px solid #ff0000; border-radius: 50%;
  pointer-events: none; z-index: 999999; transform: translate(-50%, -50%);
  box-shadow: 0 0 15px #ff0000, inset 0 0 10px #ff0000; display: none; transition: width 0.1s, height 0.1s;
}
body.demonic #spirit-cursor { display: block; }

/* ===== ARTSY CODE-DRIVEN SPLASH SCREEN ===== */
#splash {
  position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(circle at center, #0a0a0f 0%, #000 100%); cursor:pointer;
  transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), filter 1.2s;
  perspective: 1000px;
}
.splash-content { display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2; width: 90%; text-align: center; }
.gyro {
  position: relative; width: 150px; height: 150px; transform-style: preserve-3d;
  animation: floatOrb 6s ease-in-out infinite, spinMaster 20s linear infinite; margin-bottom: 40px;
}
.ring {
  position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 15px rgba(0,255,204,0.1), inset 0 0 15px rgba(0,255,204,0.1);
  border: 1px solid rgba(0, 255, 204, 0.4);
}
.ring:nth-child(1) { transform: rotateX(60deg) rotateY(0deg); animation: spinX 8s linear infinite; border-color: rgba(255, 0, 85, 0.5); box-shadow: 0 0 20px rgba(255,0,85,0.2), inset 0 0 20px rgba(255,0,85,0.2); }
.ring:nth-child(2) { transform: rotateX(0deg) rotateY(60deg); animation: spinY 12s linear infinite reverse; }
.ring:nth-child(3) { transform: rotateX(45deg) rotateY(45deg); animation: spinZ 10s linear infinite; border: 2px solid rgba(0, 255, 204, 0.1); }
.gyro-core {
  position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%);
  background: #0fc; border-radius: 50%; box-shadow: 0 0 40px #0fc, 0 0 80px #0fc, 0 0 120px #0fc;
  animation: corePulse 3s infinite alternate;
}
.splash-title {
  font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 300; letter-spacing: 0.5rem; margin-bottom: 20px;
  color: #fff; text-transform: uppercase; text-shadow: 0 0 20px rgba(255,255,255,0.3);
  animation: titleGlow 4s infinite alternate;
}
.splash-prompt {
  color: #888; font-size: 0.7rem; letter-spacing: 0.2rem; text-transform: uppercase;
  animation: promptBlink 2s infinite; border-top: 1px solid #222; padding-top: 20px; width: 100%; text-align: center;
  white-space: nowrap;
}
.splash-overlay { position: absolute; inset: 0; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.3) 2px, rgba(0,0,0,0.3) 4px); pointer-events: none; z-index: 10; opacity: 0.5; }
@keyframes spinMaster { 100% { transform: rotateZ(360deg) rotateX(360deg); } }
@keyframes spinX { 100% { transform: rotateX(420deg) rotateY(0deg); } }
@keyframes spinY { 100% { transform: rotateX(0deg) rotateY(420deg); } }
@keyframes spinZ { 100% { transform: rotateX(405deg) rotateY(405deg); } }
@keyframes floatOrb { 0%, 100% { top: 0; } 50% { top: -20px; } }
@keyframes corePulse { 0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; } 100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
@keyframes titleGlow { 0% { text-shadow: 0 0 10px rgba(255,255,255,0.1); } 100% { text-shadow: 0 0 30px rgba(0,255,204,0.6); } }
@keyframes promptBlink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; color: #0fc; } }

/* ===== MAIN UI & BOTTOM CONTROLS ===== */
#main { position:relative; z-index:10; width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; }
.wg { font-size:clamp(4rem, 15vw, 9rem); font-weight:bold; display:flex; align-items:baseline; gap:2px; transition: transform 1s cubic-bezier(0.16,1,0.3,1); }
.node { cursor:pointer; display:inline-block; transition:transform .1s,color .2s,text-shadow .2s; padding: 5px; }
.n_lt:hover { color:var(--a1); text-shadow:0 0 20px var(--a1); }
#n_dot { color:var(--a2); font-size:0.2em; vertical-align:baseline; line-height:0; display:inline-block; position:relative; top:-0.1em; }
#n_dot:hover { text-shadow:0 0 20px var(--a2); }
#n_wtf:hover { color:var(--a3); text-shadow:0 0 20px var(--a3); }
.wg { --beat:0; transform:scale(calc(1 + var(--beat)*.07)); text-shadow:0 0 calc(10px + var(--beat)*40px) var(--a2); }
.shake { animation:shake .15s infinite; }
@keyframes shake{0%{transform:translate(0)}20%{transform:translate(-4px,4px) skewX(2deg)}40%{transform:translate(4px,-4px) skewY(-2deg)}60%{transform:translate(-4px,-4px) skewX(-2deg);filter:hue-rotate(45deg)}80%{transform:translate(4px,4px) skewY(2deg)}100%{transform:translate(0)}}

#btm_ctrl {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 10px; align-items: center; z-index: 10000;
  background: rgba(15,15,20,0.8); backdrop-filter: blur(10px);
  padding: 8px 16px; border-radius: 40px; border: 1px solid rgba(0,255,204,0.15);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 90%; max-width: 400px; justify-content: space-around;
}
#btm_ctrl button { background: none; border: none; color: #aaa; font-family: var(--f); font-size: 0.9rem; cursor: pointer; padding: 6px 12px; transition: 0.2s; }
#btm_ctrl button:hover { color: #0fc; text-shadow: 0 0 10px #0fc; }
#anim_lbl { color: #fff; font-size: 0.75rem; letter-spacing: 1px; text-align: center; }

/* ===== OUIJA BOARD MOBILE OPTIMIZED ===== */
#ouija {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95vw; max-width: 700px;
  display: none; flex-direction: column; opacity: 0; transition: opacity 1.5s;
  text-align: center; color: #b18862; font-family: 'Times New Roman', serif; z-index: 15;
}
.demonic #main .wg { transform: translateY(-38vh) scale(0.4); }
.demonic #ouija { display: flex; opacity: 1; pointer-events: auto; }
.ouija-row { display: flex; justify-content: center; align-items: center; gap: 1vw; flex-wrap: wrap; }
.ouija-btn { cursor: pointer; transition: 0.2s; font-size: clamp(1rem, 3.5vw, 2rem); font-weight: bold; text-shadow: 0 2px 10px rgba(0,0,0,0.8); padding: 4px 8px; }
.ouija-btn:hover { color: #f00; text-shadow: 0 0 20px #f00; transform: scale(1.3); }
#ouija_out { font-family: var(--f); color: #fff; text-shadow: 0 0 10px #f00; font-size: 1rem; min-height: 2rem; margin-top: 15px; letter-spacing: 3px; }

/* ===== PRANK SCREEN ===== */
#prank { display:none; position:fixed; inset:0; background:#000; color:#0f0; font-family:var(--f); z-index:100000; padding:5vw; font-size:2.5vh; text-shadow:0 0 10px #0f0; }
#p_head { color:#f00; font-size:6vh; text-align:center; animation:pr 0.1s infinite; text-shadow:0 0 20px #f00; }
@keyframes pr{0%,100%{transform:translate(0)}50%{transform:translate(5px,-5px)}}
#p_log { margin-top:30px; line-height:1.8; font-size: 2vh; }
#p_cd { font-size:15vh; text-align:center; color:#f00; margin-top:30px; font-weight:bold; text-shadow:0 0 40px #f00; }
.pbar { display:inline-block; background:#0f0; height:1em; width:0%; transition:width 1.5s linear; vertical-align:middle; margin-left:10px; }

/* ===== MOBILE OPTIMIZED MODAL & PC BUILDER ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,5,0.95);backdrop-filter:blur(15px);z-index:1000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s;}
.modal.show{display:flex;opacity:1;}
.mc{background:linear-gradient(160deg,#10101c,#08080f);border:1px solid rgba(255,255,255,0.08);border-radius:12px;width:100%;height:100%;max-width:none;max-height:none;padding:16px;overflow-y:auto;position:relative;color:#e0e0e0;}
@media(min-width:768px){.mc{width:96%;max-width:1200px;height:auto;max-height:92vh;border-radius:12px;padding:24px;}}
.x{position:absolute;top:12px;right:16px;background:none;border:0;color:#888;font-size:2.5rem;cursor:pointer;}
h2{background:linear-gradient(90deg,#ff0055,#ff9a00,#00ffcc);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:1.3rem;letter-spacing:1px;margin-bottom:2px;}
h2 .tg{display:block;font-size:.6rem;letter-spacing:2px;color:#8a8aa0;-webkit-text-fill-color:#8a8aa0;margin-top:2px;text-transform:uppercase}
.sub{color:#888;font-size:.75rem;margin-bottom:10px}
.layout{display:flex;flex-direction:column;gap:16px}
@media(min-width:900px){.layout{display:grid;grid-template-columns:1fr 340px;gap:20px}}
.tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;margin-bottom:10px;padding-bottom:5px;-webkit-overflow-scrolling:touch;}
.tab{background:#15151a;border:1px solid #333;color:#aaa;padding:10px 14px;border-radius:999px;cursor:pointer;font-family:var(--f);font-size:.8rem;white-space:nowrap;flex-shrink:0;}
.tab.on{border-color:#00ffcc;color:#00ffcc;background:rgba(0,255,204,0.1);}.tab.has::after{content:" ✓";color:#00ffcc}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input,.tools select{background:#000;color:#fff;border:1px solid #333;border-radius:6px;padding:10px;font-family:var(--f);flex:1;min-width:120px;}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}}
.p{background:linear-gradient(160deg,#171724,#101018);border:1px solid #2a2a33;border-left:4px solid #444;border-radius:10px;padding:14px;cursor:pointer;font-size:.85rem;position:relative;}
.p:hover{border-left-color:#00ffcc;}
.p.sel{border-color:#00ffcc;background:rgba(0,255,204,0.05);border-left-color:#00ffcc;}
.p .n{margin-bottom:6px;line-height:1.3;word-break:break-word}.p .pr{color:#00ffcc;font-weight:bold;font-size:1.15em;}
.b{display:inline-block;font-size:.7rem;padding:2px 6px;border-radius:4px;margin-left:4px;background:#333;color:#ddd;letter-spacing:1px;}
.em{position:absolute;top:10px;right:10px}
.why{color:#ff7799;font-size:.72rem;margin-top:5px}

.sum{background:linear-gradient(160deg,rgba(0,255,204,0.05),rgba(255,0,85,0.05));border:1px solid rgba(0,255,204,0.2);border-radius:12px;padding:16px;font-size:.85rem;}
@media(min-width:900px){.sum{position:sticky;top:0;}}
.sum h3{color:#fff;margin-bottom:12px;font-size:1.1rem;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;}
.sum-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 8px 0; }
.sum-row { display:flex; justify-content:space-between; margin-bottom: 2px; }
.sum-cat { color: #888; font-weight: bold; }
.sum-price { color: #aaa; }
.sum-name { color: #0fc; font-size: 0.78rem; display: block; line-height: 1.3; }

.tot{font-size:2rem;color:#00ffcc;font-weight:bold;margin:12px 0 4px;text-shadow:0 0 15px rgba(0,255,204,0.4);}
.bar{height:6px;background:#222;border-radius:3px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:#00ffcc}
.btn{background:#222;color:#fff;border:1px solid #555;padding:10px 16px;border-radius:6px;cursor:pointer;font-family:var(--f);margin:8px 6px 0 0;width:100%;text-align:center;}
.btn:hover{background:#333;border-color:#00ffcc;color:#00ffcc;}
.vs-btn{background:rgba(255,0,85,0.1);border-color:#ff0055;color:#ff0055}.vs-btn.on{background:#ff0055;color:#000;font-weight:bold;}
.pb-btn{background:rgba(170,0,255,0.1);border-color:#aa00ff;color:#e088ff}.pb-btn.on{background:#aa00ff;color:#fff;font-weight:bold;}
.vs-view{display:flex;flex-direction:column;gap:12px}
@media(min-width:600px){.vs-view{flex-direction:row;}}
.vs-card{flex:1;background:#15151a;border:1px solid #333;border-radius:12px;padding:16px;}
.vs-card h3{color:#0fc;font-size:1.1rem;margin-bottom:12px;}
.vs-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222;font-size:0.9rem}
.vs-win{color:#0fc;font-weight:bold;}.vs-lose{color:#f05;text-decoration:line-through;opacity:0.6}
.pb-card{background:linear-gradient(135deg,#151520,#0a0a10);border:1px solid #aa00ff;border-radius:12px;padding:16px;text-align:center;margin-bottom:10px;}
.pb-card h3{color:#e088ff;margin-bottom:8px;font-size:1.2rem;}

#meter{position:fixed;left:0;right:0;bottom:0;width:100%;height:40px;z-index:5;pointer-events:none}
html,body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style></head><body>
<audio id="bgm" src="dream.mp3" loop preload="auto"></audio>
<div id="spirit-cursor"></div>

<div id="prank" class="ns">
  <div id="p_head">HELLO RIZWAN</div>
  <div id="p_log"></div>
  <div id="p_cd"></div>
</div>

<div id="splash" class="ns">
  <div class="splash-overlay"></div>
  <div class="splash-content">
    <div class="gyro">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="gyro-core"></div>
    </div>
    <h1 class="splash-title">drew.wtf</h1>
    <div class="splash-prompt">[ TAP ANYWHERE TO ENTER ]</div>
  </div>
</div>

<div id="btm_ctrl" class="ns">
  <button onclick="chAnim(-1)">◀ VIBE</button>
  <span id="anim_lbl">MODE 1</span>
  <button onclick="chAnim(1)">VIBE ▶</button>
  <button id="mute_btn" onclick="toggleMute()">♪ ON</button>
</div>

<canvas id="bg"></canvas>
<canvas id="meter"></canvas>

<div id="main" class="ns">
  <div class="wg">
    <div id="n_d" class="node n_lt">d</div>
    <div id="n_r" class="node n_lt">r</div>
    <div id="n_e" class="node n_lt">e</div>
    <div id="n_w" class="node n_lt">w</div>
    <div id="n_dot" class="node">🎃</div>
    <div id="n_wtf" class="node">wtf</div>
  </div>
  
  <div id="ouija">
    <div class="ouija-row" style="justify-content:space-between; width:100%; font-size:2rem; margin-bottom:10px;">
      <div class="ouija-btn" onclick="oj('YES')">YES</div>
      <div class="ouija-btn" onclick="oj('NO')">NO</div>
    </div>
    <div class="ouija-row" id="o_arch1" style="gap:2vw;"></div>
    <div class="ouija-row" id="o_arch2" style="margin-top:10px; gap:2vw;"></div>
    <div class="ouija-row" style="margin-top:20px; gap:2vw;">
      <div class="ouija-btn" onclick="oj('1')">1</div><div class="ouija-btn" onclick="oj('2')">2</div>
      <div class="ouija-btn" onclick="oj('3')">3</div><div class="ouija-btn" onclick="oj('4')">4</div>
      <div class="ouija-btn" onclick="oj('5')">5</div><div class="ouija-btn" onclick="oj('6')">6</div>
      <div class="ouija-btn" onclick="oj('7')">7</div><div class="ouija-btn" onclick="oj('8')">8</div>
      <div class="ouija-btn" onclick="oj('9')">9</div><div class="ouija-btn" onclick="oj('0')">0</div>
    </div>
    <div class="ouija-row" style="margin-top:25px;">
      <div class="ouija-btn" style="font-size:1.8rem; letter-spacing:5px;" onclick="oj('GOODBYE')">GOODBYE</div>
    </div>
    <div id="ouija_out">...</div>
  </div>
</div>

<div id="mb" class="modal"><div class="mc"><button class="x" onclick="cm('mb');vsMode=false;pbMode=false;vsItems=[];draw()">&times;</button>
<h2>GRANDPA'S PC HELPER<span class="tg">simple 1-click part picker</span></h2>
<p class="sub">Tap tabs below to pick parts. Grandpa-approved & guaranteed to work together!</p>
<div class="layout"><div>
  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input id="q" placeholder="Search part name..." oninput="draw()">
    <select id="so" onchange="draw()">
      <option value="n">Sort: Name</option>

  </div>
  <div id="grid_wrap"><div class="grid" id="grid"></div></div>
</div>
<div class="sum" id="sum"></div></div></div></div>

<div id="mf" class="modal"><div class="mc fo"><button class="x" onclick="cm('mf')">&times;</button>
<h2>WTF TOOLBOX<span class="tg">useful copy-paste terminal commands</span></h2>
<div class="tabs" id="ft"></div><div id="fb" style="margin-top:10px;"></div></div></div>

<script>
/* ===== AUDIO ===== */
const bgm=document.getElementById('bgm'),muteBtn=document.getElementById('mute_btn');
let fell=false;
bgm.addEventListener('error',()=>{if(!fell){fell=true;bgm.crossOrigin="anonymous";bgm.src='https://raw.githubusercontent.com/hillierandrew/wtf/main/dream.mp3';bgm.load();if(open1)bgm.play().catch(()=>{})}});
let AC,muted=false,LIM=300,an,fd;
function beep(f,d=.08,t='square',v=.05){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const chime=()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle'),i*90)),sting=()=>{beep(55,.6,'sawtooth',.12);beep(58,.6,'square',.08)},buzz=()=>beep(90,.12,'sawtooth',.06),tick=()=>beep(900,.03,'square',.03);
function setupAn(){if(!/^https?:/.test(location.protocol)||fell)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const sr=AC.createMediaElementSource(bgm);an=AC.createAnalyser();an.fftSize=256;sr.connect(an);an.connect(AC.destination);fd=new Uint8Array(an.frequencyBinCount)}catch(e){an=null}}

function toggleMute() {
  muted = !muted; bgm.muted = muted;
  muteBtn.textContent = muted ? '♪ OFF' : '♪ ON';
  muteBtn.style.color = muted ? '#f05' : '#aaa';
}

/* ===== ENTRY ===== */
let open1=false;const sp=document.getElementById('splash');
function unlock(e){
  if(open1) return;
  open1=true;bgm.volume=.5;bgm.play().catch(()=>{});chime();setupAn();
  sp.style.opacity=0;sp.style.transform='scale(1.2)';sp.style.filter='blur(10px)';sp.style.pointerEvents='none';
  setTimeout(()=>sp.remove(),1200);
  ['click','keydown','wheel','touchend','pointerup'].forEach(t=>removeEventListener(t,unlock));anim();
}
['click','keydown','wheel','touchend','pointerup'].forEach(t=>addEventListener(t,unlock));

/* ===== SPIRIT CURSOR ===== */
addEventListener('pointermove', e => {
  const sc = document.getElementById('spirit-cursor');
  sc.style.left = e.clientX + 'px'; sc.style.top = e.clientY + 'px';
});

/* ===== CLICK COUNTERS & EASTER EGGS ===== */
function pulse(el,col){el.style.color=col;el.style.transform='scale(1.2)';setTimeout(()=>{el.style.color='';el.style.transform=''},150)}
function om(id){document.getElementById(id).classList.add('show')}
function cm(id){document.getElementById(id).classList.remove('show')}

let clk_dew = 0, clk_r = 0, clk_wtf = 0;
const checkDew = (e) => { e.stopPropagation(); pulse(e.target,'#ff0055'); chime(); clk_dew++; if(clk_dew >= 10) { clk_dew=0; om('mb'); draw(); } };
document.getElementById('n_d').onclick = checkDew;
document.getElementById('n_e').onclick = checkDew;
document.getElementById('n_w').onclick = checkDew;

document.getElementById('n_wtf').onclick = e => { e.stopPropagation(); pulse(e.target, '#ffaa00'); chime(); clk_wtf++; if(clk_wtf >= 10) { clk_wtf=0; om('mf'); fshow(); } };

let pranking = false;
document.getElementById('n_r').onclick = e => { e.stopPropagation(); pulse(e.target,'#f00'); chime(); clk_r++; if(clk_r >= 6) { clk_r = 0; cm('mb'); startRizwan(); } };

function startRizwan() {
  if(pranking) return; pranking = true;
  const p = document.getElementById('prank'), log = document.getElementById('p_log'), cd = document.getElementById('p_cd');
  p.style.display = 'block'; log.innerHTML = ''; cd.innerHTML = ''; bgm.pause();
  const steps = [{t: "INITIALIZING PROTOCOL...", d: 1000}, {t: "COPYING PHONE CONTENTS <span class='pbar'></span>", d: 2000}, {t: "UPLOADING TO RUSSIA <span class='pbar'></span>", d: 2000}, {t: "DELETING LOCAL DATA <span class='pbar'></span>", d: 1500}, {t: "CRITICAL FAILURE IMMINENT", d: 1000}];
  let s = 0;
  function nextStep() {
    if(s < steps.length) {

const stars=Array.from({length:300},()=>({x:(Math.random()-.5)*2,y:(Math.random()-.5)*2,z:Math.random(),t:Math.random()*6}));
const nodes_web=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.001,vy:(Math.random()-.5)*.001}));
let dr=[], vortex=Array.from({length:200},()=>({ a:Math.random()*Math.PI*2, r:Math.random(), v:0.01+Math.random()*0.02 }));

let mode=0;const C=()=>demon?'255,40,40':'0,255,204';
const MODES=[
  // 1: Earthbound Psychedelic Swirl 1
  (W,H,t)=>{
    const cx_c = W/2, cy_c = H/2;
    for(let i=0; i<8; i++) {
      cx.fillStyle = `hsla(${(t*40 + i*45)%360}, 100%, 50%, 0.15)`;
      cx.beginPath();
      let r = Math.max(W,H) * (1 - ((t*0.2 + i*0.12)%1));
      cx.arc(cx_c, cy_c, r, 0, 7); cx.fill();
    }
  },
  // 2: Earthbound Wave Raster Bars
  (W,H,t)=>{
    let barH = H / 20;
    for(let i=0; i<20; i++) {
      let hue = (t*50 + i*18)%360;
      cx.fillStyle = `hsla(${hue}, 90%, 40%, 0.35)`;
      let offset = Math.sin(t*3 + i*0.4) * 100 * (1+bass*2);
      cx.fillRect(offset, i*barH, W, barH-2);
    }
  },
  // 3: Interconnected Web
  (W,H)=>{
    nodes_web.forEach(n=>{n.x=(n.x+n.vx*(1+bass*4)+1)%1;n.y=(n.y+n.vy*(1+bass*4)+1)%1});
    nodes_web.forEach((a,i)=>{
      cx.fillStyle=demon?'#f33':'#0fc'; cx.beginPath(); cx.arc(a.x*W,a.y*H,2+bass*4,0,7); cx.fill();
      for(let j=i+1;j<nodes_web.length;j++){
        const b=nodes_web[j],d=Math.hypot((a.x-b.x)*W,(a.y-b.y)*H);
        if(d<160){
          cx.strokeStyle=`rgba(${C()},${(1-d/160)*.8})`; cx.lineWidth=1+bass*2;
          cx.beginPath(); cx.moveTo(a.x*W,a.y*H); cx.lineTo(b.x*W,b.y*H); cx.stroke();
        }
      }
    });
  },
  // 4: Deep Starfield Warp
  (W,H,t)=>{
    let speed = 0.0015 * (1 + bass * 5) * (demon?2:1);
    stars.forEach(s=>{
      s.z -= speed; if(s.z<=0){s.z=1;s.x=(Math.random()-.5)*2;s.y=(Math.random()-.5)*2;}
      const k=1/s.z, x=W/2+s.x*W*.3*k, y=H/2+s.y*H*.3*k;
      const a=Math.min(1,(1-s.z)*1.5);
      cx.fillStyle = demon ? `rgba(255,50,50,${a})` : `rgba(150,220,255,${a})`;
      cx.beginPath(); cx.arc(x,y,(1-s.z)*3.5+.5,0,7); cx.fill();
    });
  },
  // 5: Matrix Rain
  (W,H)=>{
    const n=Math.ceil(W/18);while(dr.length<n)dr.push(Math.random()*H/18);
    cx.font='16px monospace'; cx.fillStyle=demon?'#ff3030':'#00ffcc';
    dr.forEach((y,i)=>{
      cx.fillText(String.fromCharCode(12448+Math.random()*96|0),i*18,y*18);
      dr[i]=y*18>H&&Math.random()>.97?0:y+1+bass*2;
    });
  },
  // 6: Geometric Audio visualizer
  (W,H,t)=>{
    cx.lineWidth = 2 + bass * 10; const cx_c = W/2, cy_c = H/2;
    for(let i=1; i<=6; i++) {
      cx.strokeStyle = `hsla(${demon?0:160}, 100%, ${50-i*5}%, ${0.2 + bass*0.3})`;
      let r = i*40 + bass*120 + Math.sin(t*2 + i)*20;
      cx.beginPath();
      for(let j=0; j<=6; j++) {
        let a = j*(Math.PI*2/6) + t*(i%2?1:-1)*0.5;
        let px = cx_c + Math.cos(a)*r, py = cy_c + Math.sin(a)*r;
        j===0?cx.moveTo(px,py):cx.lineTo(px,py);
      }
      cx.stroke();
    }
  },
  // 7: Particle Vortex
  (W,H,t)=>{
    const cx_c = W/2, cy_c = H/2;
    vortex.forEach(p => {
      p.a += p.v * (1+bass*2); p.r -= 0.002;
      if(p.r <= 0) { p.r = 1; p.a = Math.random()*Math.PI*2; }
      let rad = p.r * Math.max(W,H);
      let x = cx_c + Math.cos(p.a + t)*rad; let y = cy_c + Math.sin(p.a + t)*rad;
      cx.fillStyle = `rgba(${C()}, ${1-p.r})`;
      cx.beginPath(); cx.arc(x,y, 2+bass*4, 0, 7); cx.fill();
    });
  },
  // 8: RGB Oscilloscope Wave
  (W,H,t)=>{
    cx.lineWidth = 4 + bass*5; cx.beginPath();
    for(let x=0; x<=W; x+=10) {
      let y = H/2 + Math.sin(x*0.01 + t*3)*80*(1+bass);
      cx.strokeStyle = `hsla(${(t*100 + x*0.1)%360}, 100%, 60%, 0.8)`;
      x===0 ? cx.moveTo(x,y) : cx.lineTo(x,y);
    }
    cx.stroke();
  },
  // 9: Neon Dancefloor Grid
  (W,H,t)=>{
    const s = 40;
    for(let x=0; x<W; x+=s) {
      for(let y=0; y<H; y+=s) {
        let wave = Math.sin(x*0.01 + t*2) + Math.cos(y*0.01 + t*2);
        cx.fillStyle = `hsla(${(t*50 + x*0.1)%360}, 100%, 60%, ${Math.max(0, wave * 0.3)})`;
        cx.fillRect(x+1, y+1, s-2, s-2);
      }
    }
  }
];

function chAnim(dir) {
  mode = (mode + dir + MODES.length) % MODES.length;
  document.getElementById('anim_lbl').innerText = `VIBE ${mode+1}/${MODES.length}`;
  cx.globalAlpha=.18;cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.globalAlpha=1;
  beep(480+mode*80,.07,'triangle',.05);
}

function anim(){
  const W=cv.width,H=cv.height,t=performance.now()/1000,N=64,lv=[],idle=bgm.paused||bgm.muted;
  if(an&&!idle){an.getByteFrequencyData(fd);for(let i=0;i<N;i++)lv.push(fd[i]/255);bass=(fd[1]+fd[2]+fd[3]+fd[4])/1020}
  else{const b=idle?0:Math.pow(Math.max(0,Math.sin(t*Math.PI*2*1.9)),6);bass=bass*.8+b*.2;for(let i=0;i<N;i++)lv.push(idle?0:(.25+.5*Math.abs(Math.sin(t*3+i*.5)))*(.4+bass))}
  document.querySelector('.wg').style.setProperty('--beat',bass.toFixed(3));
  
  cx.fillStyle=demon?'rgba(10,0,0,.3)':'rgba(5,5,8,.3)';cx.fillRect(0,0,W,H);
  MODES[mode](W,H,t);
  
  rip=rip.filter(r=>(r.r+=8)<300);
  rip.forEach(r=>{cx.strokeStyle=`rgba(${C()},${1-r.r/300})`;cx.lineWidth=2;cx.beginPath();cx.arc(r.x,r.y,r.r,0,7);cx.stroke()});
  
  const mw=mc2.width,mh=40;mx.clearRect(0,0,mw,mh);mx.strokeStyle=demon?'#f00':'#0fc';mx.lineWidth=2;mx.beginPath();
  for(let i=0;i<N;i++){const x=i/(N-1)*mw,y=mh/2-(i%2?1:-1)*lv[i]*mh*.45;i?mx.lineTo(x,y):mx.moveTo(x,y)}mx.stroke();
  requestAnimationFrame(anim);
}

function loadPB(idx) {
  for(let k in S) delete S[k]; let bp = P_BUILDS[idx].p;
  for(let cat in bp) { let f = CAT[cat].find(x => x.name === bp[cat]); if(f) S[cat] = f; }
  pbMode = false; document.getElementById('btn_pb').classList.remove('on'); draw();

function pair(a,b){
  const [x,y]=a.cat<b.cat?[a,b]:[b,a];const k=x.cat+'-'+y.cat;
  const M={cpu:a.cat==='cpu'?a:b,mb:a.cat==='mb'?a:b,ram:a.cat==='ram'?a:b,psu:a.cat==='psu'?a:b,gpu:a.cat==='gpu'?a:b,case:a.cat==='case'?a:b,cpucooler:a.cat==='cpucooler'?a:b};
  if(k==='cpu-mb'&&M.cpu.sock!==M.mb.sock)return 'Parts do not fit together';
  if(k==='mb-ram'&&M.ram.ddr!==M.mb.ddr)return 'Memory mismatch';
  return null;
}
function why(p){const r=[];for(const c in S){if(c===p.cat)continue;const m=pair(p,S[c]);if(m)r.push(m)}return r}

const $=i=>document.getElementById(i),usd=n=>'$'+n.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});

function draw(){
  $('tabs').innerHTML=Object.keys(LAB).map(k=>`<button class="tab ${k===tab?'on':''} ${S[k]?'has':''}" onclick="tab='${k}';LIM=300;draw()">${LAB[k]}</button>`).join('');
  const q=$('q').value.toLowerCase(),so=$('so').value,others=Object.keys(S).filter(k=>k!==tab).length;
  let L=CAT[tab].filter(p=>!q||p.name.toLowerCase().includes(q));
  L.sort((a,b)=>so==='a'?a.price-b.price:so==='d'?b.price-a.price:a.name.localeCompare(b.name));
  
  if(pbMode) {
    $('grid_wrap').innerHTML = `<div style="display:grid; grid-template-columns:1fr; gap:15px; padding:10px 0;">` + P_BUILDS.map((b,i) => `

      </div>`).join('') + `</div>`;
  }
  else if(vsMode && vsItems.length === 2) {
    $('grid_wrap').innerHTML = renderVS(vsItems[0], vsItems[1]);   } else {$('grid_wrap').innerHTML = `<div class="grid" id="grid">` + L.slice(0,LIM).map(p=>{

function pick(i){
  const p=CAT[tab].find(x=>x.id===i);beep(1200,.05,'square',.04);
  if(vsMode) {
    if(vsItems.includes(p)) vsItems = vsItems.filter(x=>x!==p);

    if(S[tab]&&S[tab].id===i) delete S[tab]; else { S[tab]=p; for(const c in S) if(c!==tab&&pair(p,S[c])) delete S[c]; }

}
