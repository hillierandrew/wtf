<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>UWU - Industry Builder</title>
<style>
:root {
    --bg: #090314;
    --bg-card: #150f24;
    --bg-cart: #2d1b4e;
    --fg: #e0e0e0;
    --a1: #ff0055;
    --a2: #00ffcc;
    --a3: #7b2cbf;
    --f: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Courier New';
    --radius: 16px;
}

body.demonic {
    --bg: #110000; --bg-card: #220000; --bg-cart: #330000;
    --fg: #ff3333; --a1: #aa0000; --a2: #ff0000; --a3: #ff0000;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { 
    width: 100%; height: 100%; overflow: hidden; 
    background: var(--bg); color: var(--fg); font-family: var(--f); 
    transition: background 1s, color 1s; touch-action: manipulation;
}
.ns { user-select: none; -webkit-user-select: none; }

/* Backgrounds */
#bg, #meter { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
#meter { z-index: 5; height: 64px; top: auto; bottom: 0; }
#ascii-bg {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    font-family: monospace; font-size: 2vw; line-height: 1.1; font-weight: bold;
    color: rgba(123, 44, 191, 0.05); white-space: pre; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    text-align: center; animation: asciiPulse 4s infinite;
}
@keyframes asciiPulse { 0%,100%{opacity: 0.5;} 50%{opacity: 1; text-shadow: 0 0 20px var(--a3);} }

/* Intro / UWU / Password */
#uwu {
    position: fixed; left: 0; top: 0; z-index: 10; cursor: pointer; 
    padding: 8px 16px; line-height: 1; color: var(--a2);
}
#uwut { display: inline-block; font-size: clamp(3.4rem, 22vw, 10rem); font-weight: bold; letter-spacing: .04em; font-family: 'Courier New'; }
.wg { --beat: 0; transform: scale(calc(1 + var(--beat)*.07)); text-shadow: 0 0 calc(10px + var(--beat)*40px) var(--a2); transition: text-shadow 0.1s; }
.hint { position: fixed; bottom: 74px; width: 100%; text-align: center; color: #ffffff66; font-size: 0.8rem; letter-spacing: 3px; z-index: 6; text-transform: uppercase; font-family: monospace;}

/* Modals */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); z-index: 9999; display: none; align-items: center; justify-content: center; }
.modal.show { display: flex; animation: fadeUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.pwd-box { background: var(--bg-card); padding: 40px; border-radius: var(--radius); border: 2px solid var(--a3); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 30px rgba(123, 44, 191, 0.4); }
.pwd-box h2 { margin-bottom: 20px; color: var(--a2); }
.pwd-box input { background: #000; border: 1px solid #555; color: #fff; padding: 12px 20px; font-size: 1.5rem; text-align: center; border-radius: 8px; letter-spacing: 5px; outline: none; margin-bottom: 20px; text-transform: uppercase; }
.pwd-box input:focus { border-color: var(--a1); box-shadow: 0 0 15px var(--a1); }
.pwd-box button { background: var(--a1); color: #fff; border: none; padding: 12px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; font-weight: bold; }

/* Main Builder Layout */
.app-container {
    position: fixed; inset: 0; display: none; background: var(--bg); z-index: 100;
    flex-direction: column; overflow: hidden;
}
.app-container.show { display: flex; }
.header { padding: 16px; background: rgba(9, 3, 20, 0.9); backdrop-filter: blur(10px); z-index: 10; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.5px; background: linear-gradient(90deg, #fff, #aaa); -webkit-background-clip: text; color: transparent; }
.close-btn { background: none; border: none; color: #aaa; font-size: 2rem; cursor: pointer; }

/* Two-column Desktop Layout */
.layout { display: flex; flex: 1; overflow: hidden; }
.main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* UberEats Style Sticky Categories */
.cat-scroll { display: flex; overflow-x: auto; gap: 12px; padding: 16px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-btn {
    flex: 0 0 auto; background: var(--bg-card); border: 2px solid transparent; color: #aaa;
    padding: 16px 24px; border-radius: var(--radius); font-weight: bold; font-size: 1rem;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;
    scroll-snap-align: start; transition: 0.2s;
}
.cat-btn.on { border-color: var(--a3); background: rgba(123, 44, 191, 0.15); color: #fff; }
.cat-btn.has::after { content: "✓"; color: var(--a2); position: absolute; top: 8px; right: 12px; font-size: 0.8rem; }
.cat-icon { font-size: 1.8rem; }

/* Filter & Tag Bar */
.filter-bar { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
.search-input { background: #000; border: 1px solid #333; color: #fff; padding: 12px 16px; border-radius: 12px; font-size: 1rem; width: 100%; outline: none; }
.search-input:focus { border-color: var(--a2); }
.tags-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.tag-btn { background: #1a1a24; border: 1px solid #333; color: #aaa; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
.tag-btn.on { background: var(--a2); color: #000; border-color: var(--a2); font-weight: bold; }

/* Parts List */
.parts-list { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-content: start; }
.part-card {
    background: var(--bg-card); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px;
    border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; position: relative;
    animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
}
@keyframes popIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }

.part-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); border-color: var(--a3); }
.part-card.sel { border-color: var(--a2); background: rgba(0, 255, 204, 0.05); }
.part-card.dis { opacity: 0.5; filter: grayscale(0.8); cursor: not-allowed; }
.part-card.dis:hover { transform: none; border-color: rgba(255,0,85,0.5); }
.p-name { font-weight: bold; font-size: 1.05rem; line-height: 1.3; color: #fff; }
.p-price { color: var(--a2); font-weight: 900; font-size: 1.2rem; }
.p-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.p-badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; background: #333; color: #ccc; font-weight: 600; text-transform: uppercase; }
.p-badge.warn { background: rgba(255,170,0,0.2); color: #fa0; }
.p-badge.itx { background: rgba(123,44,191,0.3); color: #d08cff; }
.p-reason { color: var(--a1); font-size: 0.8rem; margin-top: 4px; background: rgba(255,0,85,0.1); padding: 6px; border-radius: 6px; }

/* Right Sidebar (Cart) */
.cart-sidebar {
    width: 380px; background: var(--bg-cart); display: flex; flex-direction: column;
    border-left: 1px solid rgba(255,255,255,0.05);
}
.cart-header { padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.2); }
.cart-header h2 { font-size: 1.3rem; color: #fff; }
.cart-items { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.c-item { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.05); }
.c-item-info { display: flex; flex-direction: column; gap: 4px; flex: 1; padding-right: 12px; }
.c-cat { font-size: 0.7rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
.c-name { font-size: 0.9rem; font-weight: bold; color: #fff; }
.c-price { font-weight: bold; color: var(--a2); }
.c-remove { background: #442233; color: var(--a1); border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-weight: bold; }

.cart-footer { padding: 20px; background: rgba(0,0,0,0.5); border-top: 1px solid rgba(255,255,255,0.05); }
.c-tot-row { display: flex; justify-content: space-between; font-size: 1.5rem; font-weight: 900; color: #fff; margin-bottom: 16px; }
.btn-primary { background: var(--a3); color: #fff; border: none; padding: 16px; width: 100%; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; gap: 8px; transition: 0.2s; }
.btn-primary:hover { background: #903cdc; }

/* Mobile Floating Cart Button */
.mobile-cart-btn {
    display: none; position: fixed; bottom: 20px; left: 20px; right: 20px;
    background: var(--a3); color: #fff; padding: 16px 20px; border-radius: 16px;
    font-size: 1.1rem; font-weight: bold; align-items: center; justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 90; border: none; cursor: pointer;
}
.m-count { background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 20px; font-size: 0.9rem; }

/* Mobile overrides */
@media (max-width: 900px) {
    .cart-sidebar { display: none; } /* Hidden by default on mobile */
    .mobile-cart-btn { display: flex; }
    
    /* Bottom Sheet Logic */
    .cart-sidebar.bottom-sheet {
        display: flex; position: fixed; inset: 0; top: 15vh; width: 100%;
        border-radius: 24px 24px 0 0; z-index: 200; box-shadow: 0 -20px 60px rgba(0,0,0,0.8);
        transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .cart-sidebar.bottom-sheet.open { transform: translateY(0); }
    
    /* Mobile drag handle */
    .cart-header::before {
        content: ''; display: block; width: 40px; height: 5px; background: #555;
        border-radius: 3px; margin: 0 auto 16px;
    }
    
    .cat-btn { padding: 12px 16px; }
    .cat-icon { font-size: 1.4rem; }
    .parts-list { padding-bottom: 90px; } /* space for floating btn */
}
</style>
</head>
<body>

<!-- Audio -->
<audio id="bgm" src="https://raw.githubusercontent.com/hillierandrew/wtf/main/dream.mp3" loop preload="auto"></audio>

<!-- Background Visuals -->
<canvas id="bg"></canvas>
<div id="ascii-bg"></div>
<canvas id="meter"></canvas>

<!-- Idle Splash -->
<div id="uwu" class="ns"><span class="wg" id="uwut">UWU</span></div>
<div class="hint ns" id="hint-txt">tap the background &middot; click UWU to unlock</div>

<!-- Password Modal -->
<div id="pwd-modal" class="modal">
    <div class="pwd-box">
        <h2>SYSTEM LOCKED</h2>
        <input type="password" id="pwd-input" placeholder="****" maxlength="4">
        <br>
        <button onclick="checkPwd()">AUTHORIZE</button>
    </div>
</div>

<!-- Main Builder UI -->
<div id="builder-app" class="app-container">
    <header class="header">
        <h1>INDUSTRY BUILDER</h1>
        <button class="close-btn" onclick="closeBuilder()">&times;</button>
    </header>
    
    <div class="layout">
        <!-- Main Left/Center Content -->
        <main class="main-content">
            <!-- Categories (UberEats Horizontal Scroll) -->
            <div class="cat-scroll" id="cat-scroll"></div>
            
            <!-- Filter / Search / Tags -->
            <div class="filter-bar">
                <input type="text" class="search-input" id="search-input" placeholder="Search components..." oninput="drawParts()">
                <div class="tags-row" id="tags-row">
                    <button class="tag-btn on" data-tag="all" onclick="toggleTag('all')">All Forms</button>
                    <button class="tag-btn" data-tag="Mini-ITX" onclick="toggleTag('Mini-ITX')">Mini-ITX</button>
                    <button class="tag-btn" data-tag="Micro-ATX" onclick="toggleTag('Micro-ATX')">Micro-ATX</button>
                    <button class="tag-btn" data-tag="ATX" onclick="toggleTag('ATX')">ATX</button>
                    <button class="tag-btn" data-tag="E-ATX" onclick="toggleTag('E-ATX')">E-ATX</button>
                </div>
            </div>

            <!-- Parts Grid -->
            <div class="parts-list" id="parts-grid"></div>
        </main>

        <!-- Right Sidebar Cart (Transforms to Bottom Sheet on Mobile) -->
        <aside class="cart-sidebar" id="cart-sidebar">
            <div class="cart-header" onclick="closeCartMobile()">
                <h2>YOUR PRODUCTS</h2>
            </div>
            <div class="cart-items" id="cart-items">
                <!-- Selected items inject here -->
            </div>
            <div class="cart-footer">
                <div class="c-tot-row">
                    <span>Total Range</span>
                    <span id="cart-total">$0.00</span>
                </div>
                <button class="btn-primary" onclick="copyBuild()">
                    <span style="font-size:1.2rem">📋</span> Copy Build
                </button>
            </div>
        </aside>
    </div>
    
    <!-- Mobile Floating Cart Button -->
    <button class="mobile-cart-btn" id="mobile-cart-btn" onclick="openCartMobile()">
        <div style="display:flex;align-items:center;gap:12px;">
            <span class="m-count" id="m-count">0</span>
            <span>View Build</span>
        </div>
        <span id="m-total">$0.00</span>
    </button>
</div>

<script>
/* =========================================
   1. CORE AUDIO & BACKGROUND ANIMATIONS
   (Kept from original per instructions)
========================================= */
const bgm = document.getElementById('bgm');
let AC, an, fd, bass = 0, ms = {x:0, y:0}, rip = [];
let muted = false;
let mode = 0;
let fell = false;

bgm.addEventListener('error', () => { if(!fell){ fell=true; bgm.crossOrigin="anonymous"; bgm.src='https://raw.githubusercontent.com/hillierandrew/wtf/main/dream.mp3'; bgm.load(); }});

function beep(f, d=.08, t='square', v=.05){
    if(muted) return;
    try {
        AC = AC || new (window.AudioContext || window.webkitAudioContext)();
        if(AC.state === 'suspended') AC.resume();
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = t; o.frequency.value = f;
        g.gain.setValueAtTime(v, AC.currentTime);
        g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
        o.connect(g); g.connect(AC.destination);
        o.start(); o.stop(AC.currentTime + d);
    } catch(e){}
}
const chime = () => [660, 880, 1320].forEach((f, i) => setTimeout(() => beep(f, .15, 'triangle'), i * 90));
const buzz = () => beep(90, .12, 'sawtooth', .06);
const tick = () => beep(900, .03, 'square', .03);

const cv = document.getElementById('bg'), cx = cv.getContext('2d');
const mc2 = document.getElementById('meter'), mx = mc2.getContext('2d');
function rs(){ cv.width = innerWidth; cv.height = innerHeight; mc2.width = innerWidth; mc2.height = 64; }
addEventListener('resize', rs); rs();

addEventListener('pointermove', e => { ms.x = e.clientX/innerWidth - .5; ms.y = e.clientY/innerHeight - .5; });
addEventListener('pointerdown', e => { rip.push({x: e.clientX, y: e.clientY, r: 0}); });

const nodes = Array.from({length: 70}, () => ({x: Math.random(), y: Math.random(), vx: (Math.random()-.5)*.0006, vy: (Math.random()-.5)*.0006}));

// ASCII Background Animation Layer
const ASCII_FRAMES = [
`
    .----.
   /  ..  \\
  |  /  \\  |
  |  \\__/  |
   \\      /
    \`----\`
  (SYSTEM)
`,
`
    .----.
   /  --  \\
  |  >  <  |
  |  \\__/  |
   \\      /
    \`----\`
  (ONLINE)
`,
`
   _______
  |.-----.|
  ||x . x||
  ||_.-._||
  \`--)-(--\`
 __[=== o]___
|:::::::::::|\\
\`-=========-\`()
 (HACKING...)
`,
`
   _______
  |.-----.|
  ||> . <||
  ||_.-._||
  \`--)-(--\`
 __[=== o]___
|:::::::::::|\\
\`-=========-\`()
 (UWU O.O )
`
];
let aIdx = 0;
setInterval(() => {
    document.getElementById('ascii-bg').textContent = ASCII_FRAMES[aIdx];
    aIdx = (aIdx + 1) % ASCII_FRAMES.length;
}, 600);

function anim(){
    const W = cv.width, H = cv.height, t = performance.now()/1000, N = 64, lv = [];
    let idle = bgm.paused || bgm.muted;
    
    // Fake audio visualizer if no context
    const b = idle ? 0 : Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 * 1.9)), 6);
    bass = bass * .8 + b * .2;
    for(let i=0; i<N; i++) lv.push(idle ? 0 : (.25 + .5 * Math.abs(Math.sin(t*3 + i*.5))) * (.4 + bass));
    
    document.getElementById('uwut').style.setProperty('--beat', bass.toFixed(3));
    
    cx.fillStyle = 'rgba(9, 3, 20, 0.3)';
    cx.fillRect(0, 0, W, H);
    
    // Nodes (Original Mode 2 modified)
    nodes.forEach(n => { n.x = (n.x + n.vx * (1+bass*8) + 1) % 1; n.y = (n.y + n.vy * (1+bass*8) + 1) % 1; });
    cx.lineWidth = 1;
    nodes.forEach((a, i) => {
        cx.fillStyle = '#00ffcc';
        cx.beginPath(); cx.arc(a.x*W, a.y*H, 2+bass*3, 0, 7); cx.fill();
        for(let j=i+1; j<nodes.length; j++){
            const b = nodes[j], d = Math.hypot((a.x-b.x)*W, (a.y-b.y)*H);
            if(d < 130) {
                cx.strokeStyle = `rgba(123, 44, 191, ${(1-d/130)*0.6})`;
                cx.beginPath(); cx.moveTo(a.x*W, a.y*H); cx.lineTo(b.x*W, b.y*H); cx.stroke();
            }
        }
    });

    rip = rip.filter(r => (r.r += 6) < 300);
    rip.forEach(r => {
        cx.strokeStyle = `rgba(0, 255, 204, ${1 - r.r/300})`;
        cx.beginPath(); cx.arc(r.x, r.y, r.r, 0, 7); cx.stroke();
    });

    // Meter
    const mw = mc2.width, mh = 64;
    mx.clearRect(0,0,mw,mh);
    mx.strokeStyle = '#0fc'; mx.lineWidth = 2; mx.shadowBlur = 10; mx.shadowColor = mx.strokeStyle;
    mx.beginPath();
    for(let i=0; i<N; i++){
        const x = i/(N-1)*mw, y = mh/2 - (i%2 ? 1 : -1) * lv[i]*mh*.45;
        i ? mx.lineTo(x, y) : mx.moveTo(x, y);
    }
    mx.stroke();
    requestAnimationFrame(anim);
}
anim();

/* =========================================
   2. PASSWORD LOCK LOGIC (P123)
========================================= */
const uwu = document.getElementById('uwu');
let clicks = 0;
uwu.addEventListener('click', e => {
    e.stopPropagation();
    clicks++;
    beep(300 + clicks*70);
    if(clicks === 1 && bgm.paused) { bgm.volume=0.5; bgm.play().catch(()=>{}); }
    
    // Original bounce effect pulse
    document.getElementById('uwut').style.filter = 'brightness(2.2)';
    setTimeout(() => document.getElementById('uwut').style.filter='', 120);

    if(clicks >= 10) {
        document.getElementById('pwd-modal').classList.add('show');
        document.getElementById('pwd-input').focus();
        clicks = 0; // reset
        chime();
    }
});

// Original bounce logic
let ux=40, uy=80, vx=2, vy=1.6, hue=300;
function bounce(){
    const W = innerWidth, H = innerHeight-70, w = uwu.offsetWidth, h = uwu.offsetHeight, k = 1+bass*1.5;
    ux+=vx*k; uy+=vy*k; let hit=0;
    if(ux<=0){ux=0; vx=Math.abs(vx); hit=1;} if(ux+w>=W){ux=Math.max(0,W-w); vx=-Math.abs(vx); hit=1;}
    if(uy<=0){uy=0; vy=Math.abs(vy); hit=1;} if(uy+h>=H){uy=Math.max(0,H-h); vy=-Math.abs(vy); hit=1;}
    if(hit){
        hue = (hue+57)%360; const col = `hsl(${hue},100%,65%)`;
        uwu.style.color = col; uwu.style.setProperty('--a2', col);
    }
    uwu.style.transform = `translate(${ux}px,${uy}px)`;
    requestAnimationFrame(bounce);
}
bounce();

function checkPwd() {
    const val = document.getElementById('pwd-input').value.toUpperCase();
    if(val === 'P123') {
        document.getElementById('pwd-modal').classList.remove('show');
        document.getElementById('pwd-input').value = '';
        openBuilder();
    } else {
        buzz();
        const box = document.querySelector('.pwd-box');
        box.style.transform = 'translate(10px, 0)';
        setTimeout(()=>box.style.transform='translate(-10px, 0)', 50);
        setTimeout(()=>box.style.transform='translate(0, 0)', 100);
        document.getElementById('pwd-input').value = '';
    }
}
document.getElementById('pwd-input').addEventListener('keyup', e => {
    if(e.key === 'Enter') checkPwd();
});

/* =========================================
   3. CATALOG & DATA ENGINE 
   (From source [11] with Tagging attached)
========================================= */
const RAW={
cpu:{k:'name price f sock w igpu',t:`AMD Ryzen 7 9800X3D 8-Core|619.99||AM5|120|0
AMD Ryzen 9 9950X 16-Core|729.99|p|AM5|170|1

Intel Core i9-14900K 24-Core|749.99||LGA1700|253|1
Intel Core i5-14600K 14-Core|349.99|p|LGA1700|181|1`},
mb:{k:'name price f sock ddr form',t:`GIGABYTE B650 EAGLE AX ATX|249.99||AM5|5|3
ASUS ROG STRIX B850-I GAMING WIFI Mini-ITX|489.99|x|AM5|5|1
MSI PRO B760M-P DDR4 mATX|139.99||LGA1700|4|2
ASUS Z790 GAMING WIFI7 DDR5 ATX|269.99||LGA1700|5|3`},
ram:{k:'name price f ddr',t:`CORSAIR VENGEANCE RGB 32GB (2x16GB) DDR5 6000 CL36|799.99||5
Kingston FURY Beast 32GB (2x16GB) DDR4 3200|379.99||4`},
gpu:{k:'name price f rec w tag',t:`GIGABYTE AORUS GeForce RTX 5090 INFINITY 32GB|8499.00|x|1000|575|
ASUS PRIME GeForce RTX 5080 16GB GDDR7|2229.99||850|360|
MSI GeForce RTX 5070 Ti 16G SHADOW 3X OC|1689.99||750|300|
GIGABYTE GeForce RTX 5060 EAGLE OC 8G|669.99||550|145|`},

Samsung 990 Pro 2TB M.2 NVMe PCIe 4.0|649.99|`},

DeepCool AK400 G2 Air Cooler|34.99||0`},
psu:{k:'name price f w sfx',t:`CORSAIR RM850x 850W Gold|209.99||850|0
CORSAIR SF850 850W Platinum SFX|279.99||850|1`},
case:{k:'name price f board rad sfxo',t:`CORSAIR 3500X Tempered Glass (ATX)|129.99||3|360|0

DeepCool CH260 (Micro-ATX)|104.99||2|240|0
FRACTAL DESIGN North (ATX)|167.99||3|360|0`}
};

const CATEGORIES = [
    { id: 'cpu', icon: '🧠', label: 'CPU' },
    { id: 'mb', icon: '🕹️', label: 'Motherboard' },
    { id: 'ram', icon: '📼', label: 'Memory' },
    { id: 'gpu', icon: '🎮', label: 'Graphics' },
    { id: 'ssd', icon: '💾', label: 'Storage' },
    { id: 'cooler', icon: '❄️', label: 'Cooling' },
    { id: 'psu', icon: '⚡', label: 'Power' },
    { id: 'case', icon: '📦', label: 'Case' }
];

const FORMS = { 1: 'Mini-ITX', 2: 'Micro-ATX', 3: 'ATX', 4: 'E-ATX' };
const CAT = {}; let pId = 0;

for(const k in RAW) {
    const r = RAW[k], ks = r.k.split(' ');
    CAT[k] = r.t.split('\n').map(l => {
        const v = l.split('|'), o = {id: k+(pId++), cat: k};
        ks.forEach((q, i) => { o[q] = v[i]===undefined ? '' : v[i]; });
        o.price = +o.price; o.sold = o.f.includes('x'); o.used = o.f.includes('u');
        ['w','rec','ddr','form','board','rad','igpu','sfx','sfxo'].forEach(q => { if(o[q]!==undefined && o[q]!=='') o[q] = +o[q]; });
        
        // Add form tag for filtering
        o.tags = [];
        if(o.form && FORMS[o.form]) o.tags.push(FORMS[o.form]);
        if(o.board && FORMS[o.board]) o.tags.push(FORMS[o.board]);
        
        return o;
    });
}

/* =========================================
   4. BUILDER & COMPATIBILITY LOGIC
========================================= */
const S = {}; // Selected items
let activeTab = 'cpu';
let activeTag = 'all';

// UberEats layout / Interaction
function openBuilder() {
    chime();
    document.getElementById('builder-app').classList.add('show');
    renderTabs();
    renderParts();
    renderCart();
}

function closeBuilder() {
    document.getElementById('builder-app').classList.remove('show');
}

function setTab(cat) {
    activeTab = cat;
    tick();
    document.getElementById('search-input').value = ''; // Clear search on tab switch
    renderTabs();
    renderParts();
}

function toggleTag(tag) {
    activeTag = tag;
    tick();
    document.querySelectorAll('.tag-btn').forEach(b => {
        b.classList.toggle('on', b.dataset.tag === tag);
    });
    renderParts();
}

// Render horizontal categories
function renderTabs() {
    const scroll = document.getElementById('cat-scroll');
    scroll.innerHTML = CATEGORIES.map(c => `
        <div class="cat-btn ${c.id === activeTab ? 'on' : ''} ${S[c.id] ? 'has' : ''}" onclick="setTab('${c.id}')">
            <span class="cat-icon">${c.icon}</span>
            <span>${c.label}</span>
        </div>
    `).join('');
}

// Compatibility Engine[cite: 11]
function checkPair(a, b) {
    const [x, y] = a.cat < b.cat ? [a, b] : [b, a];
    const t = x.cat + '-' + y.cat;
    const M = {
        cpu: a.cat==='cpu'?a:b, mb: a.cat==='mb'?a:b, ram: a.cat==='ram'?a:b, 
        psu: a.cat==='psu'?a:b, gpu: a.cat==='gpu'?a:b, case: a.cat==='case'?a:b, cooler: a.cat==='cooler'?a:b
    };
    const k = [a.cat, b.cat].sort().join('-');
    
    if(k==='cpu-mb' && M.cpu.sock !== M.mb.sock) return `Needs ${M.cpu.sock} board`;
    if(k==='mb-ram' && M.ram.ddr !== M.mb.ddr) return `Board uses DDR${M.mb.ddr}`;
    if(k==='case-mb' && M.mb.form > M.case.board) return `${FORMS[M.mb.form]} won't fit`;
    if(k==='case-cooler' && M.cooler.rad > M.case.rad) return `Max rad ${M.case.rad}mm`;
    if(k==='case-psu' && M.case.sfxo && !M.psu.sfx) return `Needs SFX PSU`;
    if(k==='gpu-psu' && M.psu.w < M.gpu.rec) return `Needs ${M.gpu.rec}W PSU`;
    return null;
}

function getIssues(p) {
    const r = [];
    for(const c in S) {
        if(c === p.cat) continue;
        const m = checkPair(p, S[c]);
        if(m) r.push(m);
    }
    return r;
}

// Render the grid of parts (Inspired by[cite: 12] style cards)
function renderParts() {
    const q = document.getElementById('search-input').value.toLowerCase();
    
    let list = CAT[activeTab].filter(p => {
        if(q && !p.name.toLowerCase().includes(q)) return false;
        if(activeTag !== 'all' && !p.tags.includes(activeTag)) return false;
        return true;
    });

    const html = list.map((p, idx) => {
        const issues = getIssues(p);
        const bad = issues.length > 0;
        const sel = S[activeTab] && S[activeTab].id === p.id;
        
        // CSS animation delay for cascading entrance
        const delay = (idx % 10) * 0.05; 
        
        let badges = '';
        if(p.tags) p.tags.forEach(t => badges += `<span class="p-badge itx">${t}</span>`);
        if(p.sold) badges += `<span class="p-badge warn">Sold Out</span>`;
        
        return `
        <div class="part-card ${sel ? 'sel' : ''} ${bad && !sel ? 'dis' : ''}" 
             style="animation-delay: ${delay}s"
             onclick="selectPart('${p.id}')">
            <div class="p-name">${p.name}</div>
            <div class="p-tags">${badges}</div>
            <div style="flex:1"></div>
            <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                <div class="p-price">$${p.price.toFixed(2)}</div>
                ${sel ? `<span style="color:var(--a2);font-weight:bold;font-size:1.2rem">✓</span>` : `<span style="color:#aaa;font-weight:bold">+ ADD</span>`}
            </div>
            ${bad && !sel ? `<div class="p-reason">${issues[0]}</div>` : ''}
        </div>`;
    }).join('');

    document.getElementById('parts-grid').innerHTML = html || `<p style="color:#666; grid-column:1/-1;">No parts found matching criteria.</p>`;
}

function selectPart(id) {
    const p = CAT[activeTab].find(x => x.id === id);
    if(getIssues(p).length > 0 && !(S[activeTab] && S[activeTab].id === id)) { buzz(); return; } // Don't allow selecting incompatible
    
    beep(1200, .05, 'square', .04);
    if(S[activeTab] && S[activeTab].id === id) {
        delete S[activeTab];
    } else {
        S[activeTab] = p;
    }
    renderTabs();
    renderParts();
    renderCart();
}

function removePart(cat) {
    delete S[cat];
    tick();
    renderTabs();
    renderParts();
    renderCart();
}

/* =========================================
   5. CART & BOTTOM SHEET (UberEats Style)
========================================= */
function renderCart() {
    const itemsDiv = document.getElementById('cart-items');
    let total = 0;
    let count = 0;
    let html = '';

    CATEGORIES.forEach(c => {
        if(S[c.id]) {
            const p = S[c.id];
            total += p.price;
            count++;
            html += `
            <div class="c-item">
                <div class="c-item-info">
                    <span class="c-cat">${c.label}</span>
                    <span class="c-name">${p.name}</span>
                    <span class="c-price">$${p.price.toFixed(2)}</span>
                </div>
                <button class="c-remove" onclick="removePart('${c.id}')">X</button>
            </div>`;
        }
    });

    itemsDiv.innerHTML = html || `<p style="color:#666;text-align:center;margin-top:20px;">Your build is empty.</p>`;
    
    const totStr = `$${total.toLocaleString('en-CA', {minimumFractionDigits: 2})}`;
    document.getElementById('cart-total').textContent = totStr;
    document.getElementById('m-total').textContent = totStr;
    document.getElementById('m-count').textContent = count;
}

function openCartMobile() {
    chime();
    document.getElementById('cart-sidebar').classList.add('bottom-sheet', 'open');
}

function closeCartMobile() {
    const sb = document.getElementById('cart-sidebar');
    if(sb.classList.contains('bottom-sheet')) {
        tick();
        sb.classList.remove('open');
    }
}

function copyBuild() {
    let txt = "My Custom Build:\n";
    let tot = 0;
    CATEGORIES.forEach(c => {
        if(S[c.id]) {
            txt += `${c.label}: ${S[c.id].name} - $${S[c.id].price.toFixed(2)}\n`;
            tot += S[c.id].price;
        }
    });
    txt += `Total: $${tot.toFixed(2)}`;
    
    if(navigator.clipboard) {
        navigator.clipboard.writeText(txt);
        alert("Build copied to clipboard!");
    }
}

// Initial draw (in background)
renderTabs();
renderParts();
renderCart();
</script>
