<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>lol 404 come back soon uwu</title>
<style>
  :root {
    --pink: #ff7ad9;
    --blue: #7ad7ff;
    --yellow: #ffe27a;
    --mint: #7dffa8;
    --ink: #1a1024;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    overflow: hidden;
    color: white;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    background: #120818;
    cursor: crosshair;
  }
  .sky {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, #ff7ad955, transparent 28%),
      radial-gradient(circle at 80% 10%, #7ad7ff55, transparent 26%),
      radial-gradient(circle at 50% 90%, #ffe27a33, transparent 30%),
      linear-gradient(160deg, #1a0730, #3a1458 40%, #12304a 100%);
    animation: sky 12s ease-in-out infinite alternate;
  }
  .grid {
    position: fixed;
    inset: -20%;
    background-image:
      linear-gradient(#ffffff14 1px, transparent 1px),
      linear-gradient(90deg, #ffffff14 1px, transparent 1px);
    background-size: 48px 48px;
    transform: perspective(400px) rotateX(58deg);
    animation: grid 8s linear infinite;
    opacity: 0.45;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .orbit, .floaty, .marquee, .stage { pointer-events: none; }
  .stage {
    position: relative;
    z-index: 2;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px 16px 88px;
    text-align: center;
  }
  .card {
    position: relative;
    width: min(920px, 100%);
    padding: 28px 18px 22px;
    border-radius: 28px;
    background: #ffffff14;
    border: 2px solid #ffffff55;
    box-shadow: 0 0 0 6px #ff7ad933, 0 20px 80px #0008;
    animation: card 3.2s ease-in-out infinite, pop 0.8s cubic-bezier(.2,1.4,.4,1);
    backdrop-filter: blur(6px);
  }
  .card::before, .card::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 34px;
    border: 2px dashed #ffe27a;
    animation: spin 14s linear infinite;
  }
  .card::after { inset: -16px; border-style: dotted; border-color: #7ad7ff; animation-direction: reverse; animation-duration: 22s; }
  h1 {
    margin: 0;
    font-size: clamp(64px, 16vw, 150px);
    line-height: 0.85;
    letter-spacing: -0.04em;
  }
  .lol, .four, .sub, .face { display: block; }
  .lol {
    font-size: 0.42em;
    letter-spacing: 0.2em;
    text-transform: lowercase;
    animation: rainbow 2.4s linear infinite, wobble 1.1s ease-in-out infinite;
  }
  .four {
    background: linear-gradient(90deg, #fff, #ff7ad9, #7ad7ff, #ffe27a, #fff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hue 2s linear infinite, jump 0.7s ease-in-out infinite, glitch 2.2s steps(2, end) infinite;
    filter: drop-shadow(0 8px 0 #ff4db833);
  }
  .sub {
    margin-top: 8px;
    font-size: clamp(28px, 6vw, 54px);
    animation: wave 2s ease-in-out infinite;
  }
  .sub span { display: inline-block; animation: letter 1.4s ease-in-out infinite; }
  .face {
    margin-top: 8px;
    font-size: clamp(42px, 8vw, 72px);
    animation: blush 1.6s ease-in-out infinite, spin-soft 4s ease-in-out infinite;
  }
  .soon {
    margin: 14px 0 0;
    font-size: 18px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    animation: flicker 1.8s steps(2, end) infinite;
  }
  .orbit {
    position: fixed;
    left: 50%;
    top: 46%;
    width: min(78vmin, 640px);
    height: min(78vmin, 640px);
    margin: calc(min(78vmin, 640px) / -2) 0 0 calc(min(78vmin, 640px) / -2);
    z-index: 1;
    animation: spin 18s linear infinite;
  }
  .orbit i, .floaty span {
    position: absolute;
    font-style: normal;
    animation: twinkle 1.2s ease-in-out infinite;
  }
  .floaty { position: fixed; inset: 0; z-index: 1; overflow: hidden; }
  .floaty span { animation: rise 9s linear infinite, twinkle 1s ease-in-out infinite; font-size: 22px; }
  .marquee {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 3;
    display: flex;
    gap: 32px;
    white-space: nowrap;
    padding: 10px 0;
    background: #ff7ad9;
    color: #1a1024;
    font-weight: 800;
    animation: huebg 4s linear infinite;
    overflow: hidden;
  }
  .marquee b { display: inline-block; padding-left: 100%; animation: ticker 8s linear infinite; }
  .blob {
    position: fixed;
    width: 180px; height: 180px;
    border-radius: 42% 58% 63% 37% / 42% 36% 64% 58%;
    filter: blur(2px);
    opacity: 0.55;
    animation: morph 6s ease-in-out infinite, drift 10s ease-in-out infinite alternate;
    z-index: 0;
  }
  .b1 { background: #ff7ad9; left: -40px; top: 10%; }
  .b2 { background: #7ad7ff; right: -50px; bottom: 12%; animation-delay: -2s; }
  .b3 { background: #ffe27a; left: 30%; bottom: -70px; width: 240px; height: 140px; animation-delay: -4s; }
  .walker {
    position: fixed;
    bottom: 54px;
    left: -80px;
    z-index: 4;
    font-size: 42px;
    animation: walk 9s linear infinite;
    filter: drop-shadow(0 6px 0 #0006);
  }
  .dvd {
    position: fixed;
    z-index: 4;
    left: 0; top: 0;
    padding: 6px 10px;
    border: 3px solid #fff;
    font-weight: 900;
    letter-spacing: 0.12em;
    animation: dvd 7.5s linear infinite alternate, rainbow 3s linear infinite;
  }
  button {
    pointer-events: auto;
    margin-top: 16px;
    border: 0;
    border-radius: 999px;
    padding: 12px 18px;
    font: inherit;
    font-weight: 800;
    color: #1a1024;
    background: linear-gradient(90deg, #ffe27a, #ff7ad9, #7ad7ff);
    background-size: 200% 100%;
    cursor: pointer;
    animation: hue 3s linear infinite, heartbeat 1.1s ease-in-out infinite;
  }
  button:hover { transform: scale(1.08) rotate(-2deg); }
  button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
  @keyframes sky { to { filter: hue-rotate(40deg) saturate(1.2); } }
  @keyframes grid { to { background-position: 0 48px; } }
  @keyframes card { 50% { transform: translateY(-8px) rotate(-0.4deg); } }
  @keyframes pop { from { transform: scale(0.6) rotate(-6deg); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spin-soft { 50% { transform: rotate(8deg) scale(1.08); } }
  @keyframes rainbow { to { filter: hue-rotate(360deg); } }
  @keyframes hue { to { background-position: 300% 0; } }
  @keyframes huebg { to { filter: hue-rotate(360deg); } }
  @keyframes wobble { 50% { transform: rotate(-4deg) scale(1.05); } }
  @keyframes jump { 50% { transform: translateY(-12px) scale(1.04, 0.96); } }
  @keyframes glitch {
    0% { text-shadow: 4px 0 #7ad7ff, -4px 0 #ff7ad9; }
    40% { text-shadow: -3px 1px #ffe27a, 3px -1px #7dffa8; transform: translateX(2px); }
    100% { text-shadow: 2px 0 #fff, -2px 0 #ff7ad9; }
  }
  @keyframes wave { 50% { transform: skewX(-6deg); } }
  @keyframes letter { 50% { transform: translateY(-10px) rotate(6deg); } }
  @keyframes blush { 50% { transform: scale(1.12); filter: drop-shadow(0 0 12px #ff7ad9); } }
  @keyframes flicker { 0%, 100% { opacity: 1; } 45% { opacity: 0.55; } 50% { opacity: 1; } 70% { opacity: 0.2; } }
  @keyframes twinkle { 50% { opacity: 0.2; transform: scale(0.6) rotate(20deg); } }
  @keyframes rise { from { transform: translateY(110vh); } to { transform: translateY(-10vh); } }
  @keyframes ticker { to { transform: translateX(-100%); } }
  @keyframes morph {
    50% { border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%; }
  }
  @keyframes drift { to { transform: translate(40px, -30px) rotate(12deg); } }
  @keyframes walk { to { transform: translateX(110vw) rotate(360deg); } }
  @keyframes dvd {
    0% { left: 0; top: 0; }
    25% { left: calc(100% - 90px); top: 8%; }
    50% { left: 6%; top: calc(100% - 120px); }
    75% { left: calc(100% - 110px); top: 46%; }
    100% { left: 12%; top: 4%; }
  }
  @keyframes heartbeat { 30% { transform: scale(1.06); } 45% { transform: scale(0.96); } 60% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="sky"></div>
  <div class="grid"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <canvas id="bits"></canvas>
  <div class="orbit" id="orbit"></div>
  <div class="floaty" id="floaty"></div>
  <div class="dvd">uwu</div>
  <div class="walker">✧</div>
  <main class="stage">
    <div class="card">
      <h1>
        <span class="lol">lol</span>
        <span class="four">404</span>
        <span class="sub" id="sub"></span>
        <span class="face">(◕‿◕)♡</span>
      </h1>
      <p class="soon">come back soon uwu</p>
      <button type="button" id="again">boop</button>
    </div>
  </main>
  <div class="marquee"><b>lol 404 · come back soon uwu · lol 404 · come back soon uwu ·&nbsp;</b></div>
  <script>
    const phrase = "come back soon uwu";
    const sub = document.getElementById("sub");
    sub.innerHTML = [...phrase].map((ch, i) => `<span style="animation-delay:${i * 0.06}s">${ch === " " ? "&nbsp;" : ch}</span>`).join("");

    const glyphs = ["★", "♥", "✿", "✧", "♡", "✦", "❀", "✳"];
    const orbit = document.getElementById("orbit");
    for (let i = 0; i < 14; i++) {
      const el = document.createElement("i");
      const turn = (i / 14) * Math.PI * 2;
      el.textContent = glyphs[i % glyphs.length];
      el.style.left = `${50 + Math.cos(turn) * 46}%`;
      el.style.top = `${50 + Math.sin(turn) * 46}%`;
      el.style.animationDelay = `${i * 0.1}s`;
      orbit.appendChild(el);
    }
    const floaty = document.getElementById("floaty");
    for (let i = 0; i < 28; i++) {
      const el = document.createElement("span");
      el.textContent = glyphs[i % glyphs.length];
      el.style.left = `${(i * 37) % 100}%`;
      el.style.animationDuration = `${7 + (i % 6)}s`;
      el.style.animationDelay = `${-i * 0.4}s`;
      el.style.fontSize = `${14 + (i % 5) * 6}px`;
      floaty.appendChild(el);
    }

    const canvas = document.getElementById("bits");
    const ctx = canvas.getContext("2d");
    const dots = Array.from({ length: 80 }, () => spawn());
    function spawn() {
      return { x: Math.random(), y: Math.random(), v: 0.15 + Math.random() * 0.6, s: 1 + Math.random() * 3, h: Math.random() * 360 };
    }
    function resize() {
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }
    addEventListener("resize", resize);
    resize();
    function frame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const d of dots) {
        d.y -= d.v / 300;
        d.x += Math.sin(d.y * 20) * 0.0008;
        if (d.y < 0) Object.assign(d, spawn(), { y: 1 });
        ctx.fillStyle = `hsl(${d.h} 90% 70%)`;
        ctx.beginPath();
        ctx.arc(d.x * canvas.width, d.y * canvas.height, d.s, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(frame);
    }
    frame();

    const faces = ["(◕‿◕)♡", "(˶ᵔ ᵕ ᵔ˶)", "uwu", "(ﾉ◕ヮ◕)ﾉ*:･ﾟ✧", "(づ｡◕‿‿◕｡)づ", ">w<"];
    const face = document.querySelector(".face");
    setInterval(() => {
      face.textContent = faces[Math.floor(Math.random() * faces.length)];
    }, 900);

    document.getElementById("again").addEventListener("click", () => {
      document.querySelector(".card").animate(
        [{ transform: "scale(1) rotate(0)" }, { transform: "scale(1.08) rotate(3deg)" }, { transform: "scale(1) rotate(0)" }],
        { duration: 450, easing: "ease-out" }
      );
      for (let i = 0; i < 18; i++) {
        const bit = document.createElement("span");
        bit.textContent = glyphs[i % glyphs.length];
        bit.style.position = "fixed";
        bit.style.left = "50%";
        bit.style.top = "50%";
        bit.style.zIndex = "6";
        bit.style.fontSize = "28px";
        document.body.appendChild(bit);
        const x = (Math.random() - 0.5) * innerWidth * 0.8;
        const y = (Math.random() - 0.6) * innerHeight * 0.8;
        bit.animate(
          [{ transform: "translate(-50%, -50%) scale(0.4)" }, { transform: `translate(${x}px, ${y}px) scale(1.4) rotate(180deg)`, opacity: 0 }],
          { duration: 900, easing: "cubic-bezier(.1,.7,.2,1)" }
        ).finished.then(() => bit.remove());
      }
    });
  </script>
</body>
</html>
