<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DREW.WTF</title>
  
  <!-- BRAND & INTERNATIONAL WEBFONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Comic+Neue:wght@700&family=Courier+Prime:wght@700&family=Fira+Code:wght@700&family=Noto+Sans+SC:wght@900&family=Noto+Sans+Devanagari:wght@900&family=Orbitron:wght@900&family=Permanent+Marker&family=Press+Start+2P&family=Russo+One&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --crt-red: #ff1111;
      --crt-dim: #660000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      background-color: #000;
      color: var(--crt-red);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    /* Canvas Background */
    #starfield {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      height: 100dvh;
      z-index: 1;
      display: block;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    #starfield.active { opacity: 1; }

    /* Screen Curvature & Vignette Overlay */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.92) 100%);
      pointer-events: none !important;
      z-index: 10;
    }

    /* Scanlines Overlay */
    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(20, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 4px;
      pointer-events: none !important;
      z-index: 11;
    }

    /* Centered Fixed Container */
    .container {
      text-align: center;
      z-index: 50;
      padding: 10px;
      max-width: 92vw;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      pointer-events: none;
    }

    /* Main Title Styling */
    .title {
      font-size: clamp(1.2rem, 6vw, 4.5rem);
      font-weight: bold;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px var(--crt-red), 0 0 25px var(--crt-dim), 0 0 40px #ff0000;
      animation: flicker 0.12s infinite;
      min-height: 1.2em;
      display: inline-block;
      white-space: nowrap;
      transition: filter 0.3s ease, color 0.3s ease, text-shadow 0.3s ease, font-family 0.2s ease;
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    /* Large Interactive Safari/iPhone Phase Watermark Badge */
    .phase-watermark {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom, 24px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      letter-spacing: 0.1em;
      user-select: none;
      -webkit-user-select: none;
      padding: 12px 26px;
      border-radius: 30px;
      background-color: rgba(15, 15, 15, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.8);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.95), 0 0 15px rgba(255, 255, 255, 0.3);
      pointer-events: none;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    /* Dynamic Visual Animation Classes */
    .spin { animation: spin-hue 3s linear infinite !important; }
    @keyframes spin-hue { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

    .liquid-wave { animation: flicker 0.12s infinite, liquid 1.8s ease-in-out infinite alternate !important; }
    @keyframes liquid {
      0% { letter-spacing: 0.1em; }
      100% { letter-spacing: 0.3em; filter: blur(1px); }
    }

    .pulse-glow { animation: flicker 0.12s infinite, glow 0.8s ease-in-out infinite alternate !important; }
    @keyframes glow { 0% { filter: brightness(1); } 100% { filter: brightness(2) drop-shadow(0 0 30px #ffffff); } }

    .slice-glitch { animation: slice 0.2s steps(2) infinite !important; }
    @keyframes slice {
      0% { clip-path: inset(0 0 0 0); }
      50% { clip-path: inset(20% 0 30% 0); }
      100% { clip-path: inset(60% 0 10% 0); }
    }
  </style>
</head>
<body>

  <!-- Canvas Background -->
  <canvas id="starfield"></canvas>

  <!-- Locked Center Container -->
  <div id="main-container" class="container">
    <div id="scramble-text" class="title">DREW.WTF</div>
  </div>

  <!-- Interactive Phase Badge -->
  <div id="phase-badge" class="phase-watermark">
    PHASE NO. 0
  </div>

  <script>
    /* --- BRAND FONTS --- */
    const companyFonts = [
      { font: "'Press Start 2P', monospace" },
      { font: "'Orbitron', sans-serif" },
      { font: "'Russo One', sans-serif" },
      { font: "'Permanent Marker', cursive" },
      { font: "'Cinzel', serif" },
      { font: "'Comic Neue', cursive" },
      { font: "'VT323', monospace" },
      { font: "'Fira Code', monospace" },
      { font: "'Courier Prime', monospace" },
      { font: "'Noto Sans SC', sans-serif" },
      { font: "'Noto Sans Devanagari', sans-serif" },
      { font: "'Courier New', Courier, monospace" }
    ];

    /* --- CANVAS ENGINE --- */
    const canvas = document.getElementById("starfield");
    const ctx = canvas.getContext("2d");

    let particles = [];
    const numParticles = 650;
    let width, height, cx, cy;
    let warpSpeed = 4;
    let renderMode = "stars";
    let reverseWarp = false;

    const mEmojis = ["🍄", "🍆", "✨", "💫"];
    const dEmojis = ["😈", "👿", "🔥", "⚡"];
    const sEmojis = ["💀", "☠️", "☣️", "🟢"];
    const $Emojis = ["💸", "💰", "💵", "✨"];
    const alienEmojis = ["👽", "🛸", "👾", "🌌"];

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }

    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = initial ? Math.random() * width : width;
        this.pz = this.z;
        this.mE = mEmojis[Math.floor(Math.random() * mEmojis.length)];
        this.dE = dEmojis[Math.floor(Math.random() * dEmojis.length)];
        this.sE = sEmojis[Math.floor(Math.random() * sEmojis.length)];
        this.$E = $Emojis[Math.floor(Math.random() * $Emojis.length)];
        this.aE = alienEmojis[Math.floor(Math.random() * alienEmojis.length)];
      }

      update() {
        this.pz = this.z;
        if (reverseWarp) {
          this.z += warpSpeed;
          if (this.z >= width) this.reset(false);
        } else {
          this.z -= warpSpeed;
          if (this.z <= 0) this.reset(false);
        }
      }

      draw() {
        const sx = (this.x / this.z) * cx + cx;
        const sy = (this.y / this.z) * cy + cy;

        if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) {
          if (renderMode === "mushrooms") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.mE, sx, sy);
          } else if (renderMode === "devils") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.dE, sx, sy);
          } else if (renderMode === "skulls") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.sE, sx, sy);
          } else if (renderMode === "money") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.$E, sx, sy);
          } else if (renderMode === "aliens") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.aE, sx, sy);
          } else if (renderMode === "all") {
            ctx.font = `${Math.max(10, (1 - this.z / width) * 40)}px serif`;
            ctx.fillText(this.dE, sx, sy);
          } else {
            const alpha = Math.min(1, (1 - this.z / width) * 1.8);
            const size = (1 - this.z / width) * 3;
            ctx.strokeStyle = `rgba(255, 17, 17, ${alpha})`;
            ctx.lineWidth = Math.max(0.5, size);
            ctx.beginPath();
            ctx.moveTo((this.x / this.pz) * cx + cx, (this.y / this.pz) * cy + cy);
            ctx.lineTo(sx, sy);
            ctx.stroke();
          }
        }
      }
    }

    function initParticles() {
      resizeCanvas();
      particles = [];
      for (let i = 0; i < numParticles; i++) particles.push(new Particle());
    }

    function animateParticles() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillRect(0, 0, width, height);

      for (let p of particles) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(animateParticles);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    initParticles();

    /* --- 200+ PROCEDURAL & DEMONIC PHASE ENGINE --- */
    let currentPhase = 0;
    let phaseTimer = null;
    let activeTargetText = "DREW.WTF";

    const customTextVariants = [
      "DREW.WTF", "DREW.666", "DR3W.W7F", "666.666.666", "DREW_NULL", 
      "HELL_WTF", "TRIP.WTF", "UFO.DREW", "RICH.WTF", "CYBER_DREW", 
      "VOID.WTF", "ACID_DREW", "4NNDR3W", "DEAD_WTF", "DEMON_MODE"
    ];

    function setPhase(p) {
      currentPhase = p;
      if (currentPhase > 200) currentPhase = 0;
      if (currentPhase < 0) currentPhase = 200;

      const el = document.getElementById("scramble-text");
      const badge = document.getElementById("phase-badge");
      
      badge.textContent = `PHASE NO. ${currentPhase}`;

      // Random font assignment
      const randomFont = companyFonts[Math.floor(Math.random() * companyFonts.length)];
      el.style.fontFamily = randomFont.font;

      // Base style resets
      document.body.style.backgroundColor = "#000";
      document.body.style.filter = "none";
      el.className = "title";
      el.style.color = "";
      el.style.filter = "";
      el.style.textShadow = "";
      renderMode = "stars";
      reverseWarp = false;
      canvas.classList.add("active");

      if (currentPhase === 0) {
        activeTargetText = "DREW.WTF";
        canvas.classList.remove("active");
        return;
      }

      // Procedural generation for 200 distinct phases
      activeTargetText = customTextVariants[currentPhase % customTextVariants.length];
      warpSpeed = (currentPhase % 25) + 2;

      // Dynamic visual effects based on phase modulo
      if (currentPhase % 10 === 0) {
        renderMode = "devils";
        el.style.color = "#ff0000";
      } else if (currentPhase % 8 === 0) {
        renderMode = "mushrooms";
        el.style.color = "#00ffff";
        el.classList.add("liquid-wave");
      } else if (currentPhase % 6 === 0) {
        renderMode = "skulls";
        el.style.color = "#00ff66";
      } else if (currentPhase % 5 === 0) {
        document.body.style.backgroundColor = "#fff";
        document.body.style.filter = "invert(100%)";
      } else if (currentPhase % 4 === 0) {
        renderMode = "aliens";
        el.classList.add("spin");
      } else if (currentPhase % 3 === 0) {
        el.classList.add("slice-glitch");
        el.style.textShadow = "-10px 0 20px #ff00ff, 10px 0 20px #00ffff";
      } else if (currentPhase % 2 === 0) {
        reverseWarp = true;
        el.classList.add("pulse-glow");
      }
    }

    function prevPhase() {
      currentPhase--;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function nextPhase() {
      currentPhase++;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function resetPhaseTimer() {
      if (phaseTimer) clearInterval(phaseTimer);
      phaseTimer = setInterval(() => {
        currentPhase++;
        setPhase(currentPhase);
      }, 5000);
    }

    /* --- RELIABLE IPHONE & DESKTOP TOUCH/CLICK ENGINE --- */
    window.addEventListener("pointerdown", (e) => {
      const centerY = window.innerHeight / 2;
      if (e.clientY < centerY) {
        prevPhase();
      } else {
        nextPhase();
      }
    });

    /* --- KEYBOARD CONTROLS --- */
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") {
        nextPhase();
      } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
        prevPhase();
      }
    });

    /* --- INTERNATIONAL & EMOJI GLITCH ENGINE --- */
    const el = document.getElementById("scramble-text");
    const intlGlitchChars = [
      "0","1","3","7","_","/#","\\|","@","$","%","*","!",
      "中","文","鬼","魔","神","龍","悟", // Chinese/Kanji
      "अ","आ","इ","उ","ऋ","क","ख", // Hindi
      "Д","Р","Е","В","У","Ш","К", // Cyrillic
      "🔥","💀","😈","☣️","🟢","🛸","👽" // Emojis
    ];

    function runScrambleCycle() {
      el.textContent = activeTargetText;
      setTimeout(() => {
        let frame = 0;
        const interval = setInterval(() => {
          el.textContent = activeTargetText.split('').map(c => 
            Math.random() < 0.4 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c
          ).join('');
          frame++;
          if (frame >= 15) {
            clearInterval(interval);
            el.textContent = activeTargetText;
            runScrambleCycle();
          }
        }, 40);
      }, 1800);
    }

    // Startup Execution
    setPhase(0);
    resetPhaseTimer();
    animateParticles();
    runScrambleCycle();
  </script>
</body>
</html>
