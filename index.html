<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <style>
    :root {
      --crt-red: #ff1111;
      --crt-dim: #660000;
      --ui-accent: #ff1111;
      --ui-bg: rgba(10, 0, 0, 0.92);
      --ui-border: #ff1111;
      --text-color: #ff1111;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      min-height: -webkit-fill-available;
      background-color: #000000;
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #bg-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      height: 100dvh;
      z-index: 1;
      display: block;
      opacity: 1;
      pointer-events: none;
    }

    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none !important;
      z-index: 10;
    }

    body::after {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(20, 0, 0, 0) 50%, rgba(0, 0, 0, 0.45) 50%);
      background-size: 100% 4px;
      pointer-events: none !important;
      z-index: 11;
    }

    .container {
      text-align: center;
      z-index: 50;
      padding: 10px;
      max-width: 92vw;
      user-select: none;
      -webkit-user-select: none;
      position: relative;
      pointer-events: none;
    }

    .title {
      font-size: clamp(1.4rem, 7vw, 4.8rem);
      font-weight: bold;
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px var(--ui-accent), 0 0 25px var(--crt-dim), 0 0 40px var(--ui-accent);
      animation: flicker 0.12s infinite;
      min-height: 1.2em;
      display: inline-block;
      white-space: nowrap;
      transition: filter 0.3s ease, color 0.3s ease, text-shadow 0.3s ease, font-family 0.2s ease;
    }

    .clickable-word {
      cursor: pointer;
      display: inline-block;
      pointer-events: auto;
      padding: 0 6px;
      position: relative;
    }

    .clickable-word:active {
      transform: scale(0.92);
      filter: brightness(1.8);
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      50% { opacity: 1; }
      100% { opacity: 0.97; }
    }

    /* Mobile-Optimized Top Right Controls */
    .top-right-ui {
      position: fixed;
      top: max(16px, env(safe-area-inset-top, 16px));
      right: max(16px, env(safe-area-inset-right, 16px));
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      user-select: none;
      pointer-events: auto;
    }

    .top-row-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .phase-badge-top {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: var(--ui-accent);
      background: var(--ui-bg);
      border: 2px solid var(--ui-border);
      padding: 8px 12px;
      border-radius: 8px;
      box-shadow: 0 0 12px var(--ui-accent);
      letter-spacing: 0.05em;
      text-align: right;
      cursor: pointer;
    }

    .top-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      color: #fff;
      background: var(--ui-bg);
      border: 2px solid var(--ui-border);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--ui-accent);
    }

    .top-btn:active, .phase-badge-top:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }

    .visitor-counter {

      font-size: 9px;
      color: var(--ui-accent);
      background: var(--ui-bg);
      border: 1px solid var(--ui-border);
      padding: 5px 9px;
      border-radius: 6px;
      letter-spacing: 0.05em;
      pointer-events: none;
    }

    /* Enlarged iPhone-Friendly Bottom Control Bar */
    .bottom-ui-container {
      position: fixed;
      bottom: max(32px, env(safe-area-inset-bottom, 32px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      width: clamp(300px, 90vw, 540px);
    }

    .ui-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
      width: 100%;
    }

    .ui-box {
      flex: 1;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      font-weight: 900;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      letter-spacing: 0.06em;
      user-select: none;
      -webkit-user-select: none;
      padding: 16px 20px;
      border-radius: 36px;
      background-color: rgba(18, 18, 18, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.85);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85), 0 0 12px rgba(255, 255, 255, 0.25);
      text-align: center;
      white-space: nowrap;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .ui-box:active {
      transform: scale(0.94);
      background-color: rgba(255, 255, 255, 0.3);
    }

    .contact-btn {
      width: 100%;
      border-color: var(--ui-border);
      box-shadow: 0 0 16px var(--ui-accent);
      font-size: 15px;
      text-transform: uppercase;
    }

    .phase-bottom-banner {
      position: fixed;
      bottom: max(108px, env(safe-area-inset-bottom, 108px));
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.9);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 8px 18px;
      border-radius: 24px;
      cursor: pointer;
      user-select: none;
      text-transform: uppercase;
      pointer-events: auto;
    }

    .phase-bottom-banner:active {
      transform: translateX(-50%) scale(0.94);
      background: rgba(255, 255, 255, 0.25);
    }

    .watermark-footer {
      position: fixed;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.05em;
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999999;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      border: 2px solid var(--ui-border);
      background: #050a05;
      padding: 30px;
      text-align: center;
      box-shadow: 0 0 30px var(--ui-accent);
      border-radius: 12px;
      max-width: 90vw;
    }

    .modal-content a {
      color: var(--ui-accent);
      text-decoration: none;
      font-size: 1.2rem;
      display: block;
      margin: 20px 0;
      text-shadow: 0 0 8px var(--ui-accent);
      word-break: break-all;
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--ui-border);
      color: var(--ui-accent);
      padding: 8px 20px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <script>
    /* --- FAST 90S KEYGEN CHIPTUNE SYNTHESIZER --- */
    let audioCtx = null;
    let masterGain = null;
    let isPlaying = false;
    let nextNoteTime = 0;
    let timerID = null;
    let currentStep = 0;

    const keygenNoteFreqs = {
      'C4': 261.63, 'D4': 293.66, 'Eb4': 311.13, 'F4': 349.23, 'G4': 392.00, 'Ab4': 415.30, 'Bb4': 466.16,
      'C5': 523.25, 'D5': 587.33, 'Eb5': 622.25, 'F5': 698.46, 'G5': 783.99, 'Ab5': 830.61, 'Bb5': 932.33,
      'C6': 1046.50
    };

    const keygenLeadPattern = [
      'C5', 'Eb5', 'G5', 'C6', 'Bb5', 'G5', 'Eb5', 'D5',
      'C5', 'C5', 'Eb5', 'G5', 'F5', 'Eb5', 'D5', 'Bb4',
      'C5', 'Eb5', 'G5', 'C6', 'D6', 'Eb6', 'D6', 'C6',
      'G5', 'Ab5', 'G5', 'F5', 'Eb5', 'D5', 'C5', 'G4'
    ];

    const keygenBassPattern = [
      'C4', 'C4', 'C4', 'C4', 'Ab4', 'Ab4', 'Bb4', 'Bb4',
      'C4', 'C4', 'C4', 'C4', 'F4', 'F4', 'G4', 'G4'
    ];

    function playKeygenNote(freq, startTime, duration, waveType = 'square', gainLevel = 0.06) {
      if (!freq || !audioCtx || !masterGain) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(gainLevel, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      } catch (e) {}
    }

    function scheduleKeygenTrack() {
      if (!isPlaying || !audioCtx || audioCtx.state !== 'running') return;
      const lookAhead = 0.1;
      const scheduleAheadTime = 0.2;
      const noteTime = (60.0 / 140) / 2; // Fast 140 BPM Arpeggiated Keygen Tempo

      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        // Fast Arp Lead
        const leadNote = keygenLeadPattern[currentStep % keygenLeadPattern.length];
        if (keygenNoteFreqs[leadNote]) {
          playKeygenNote(keygenNoteFreqs[leadNote], nextNoteTime, noteTime * 0.8, 'square', 0.06);
        }

        // Driving Bass Line
        if (currentStep % 2 === 0) {
          const bassNote = keygenBassPattern[Math.floor(currentStep / 2) % keygenBassPattern.length];
          if (keygenNoteFreqs[bassNote]) {
            playKeygenNote(keygenNoteFreqs[bassNote] / 2, nextNoteTime, noteTime * 1.6, 'sawtooth', 0.09);
          }
        }

        nextNoteTime += noteTime;
        currentStep++;
      }
      timerID = setTimeout(scheduleKeygenTrack, lookAhead * 1000);
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      const btn = document.getElementById("audio-toggle");

      if (!isPlaying) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 1;
          masterGain.connect(audioCtx.destination);
        }

        const start = () => {
          if (audioCtx.state !== 'running') return;
          nextNoteTime = audioCtx.currentTime + 0.05;
          currentStep = 0;
          isPlaying = true;
          btn.textContent = '🔊 MUTE KEYGEN CHIPTUNE';
          scheduleKeygenTrack();
        };

        if (audioCtx.state === 'suspended') {
          audioCtx.resume().then(start).catch(start);
        } else {
          start();
        }
      } else {
        isPlaying = false;
        if (timerID) clearTimeout(timerID);
        btn.textContent = '🔇 90S KEYGEN CHIPTUNE';
      }
    }

    /* --- EXPANDED CONTACT PHRASES --- */
    const contactTexts = [
      "[ CONTACT ]", "[ CALL ]", "[ PING HOST ]", "[ TRANSMIT DATA ]",
      "[ INITIALIZE HANDSHAKE ]", "[ DIAL-UP (56K) ]", "[ SEND EMAIL ]", "[ EXECUTE TALK.EXE ]",
      "[ SEND TELEPATHICALLY ]", "[ TELEPORT MESSAGE ]", "[ PROJECT ASTRAL BODY ]", "[ COMMUNICATE VIA DREAMS ]",
      "[ CONSULT THE OUJA BOARD ]", "[ TRANSMIT VIBES ]", "[ BEAM UP ]", "[ SEND SMOKE SIGNAL ]",
      "[ KNOCK ON DOOR ]", "[ DISPATCH CARRIER PIGEON ]", "[ WRITE PARCHMENT LETTER ]", "[ SHOUT VERY LOUDLY ]",
      "[ RING DOORBELL ]", "[ SEND MORSE CODE ]", "[ THROW BOTTLE IN OCEAN ]", "[ PET THE CAT ]",
      "[ BARK AT DOOR ]", "[ PRESS F TO PAY RESPECTS ]", "[ SUMMON DREW ]", "[ BLINK TWICE ]",
      "[ SEND POKE ]", "[ SLIDE IN DMs ]", "[ HONK HORN ]", "[ WHISTLE LOUDLY ]"
    ];

    const companyFonts = [
      { font: "'Press Start 2P', monospace" },
      { font: "'Orbitron', sans-serif" },
      { font: "'Russo One', sans-serif" },
      { font: "'Permanent Marker', cursive" },
      { font: "'Cinzel', serif" },
      { font: "'Comic Neue', cursive" },
      { font: "'VT323', monospace" },
      { font: "'Fira Code', monospace" },
      { font: "'Courier Prime', monospace" },
      { font: "'Courier New', Courier, monospace" }
    ];

    const scrambleFontStack = "'Noto Sans Devanagari','Noto Sans Arabic','Noto Sans Hebrew','Noto Sans Thai','Noto Sans SC','Noto Sans JP','Noto Sans KR', sans-serif";

    /* --- CANVAS ANIMATION ENGINE --- */
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");
    let width, height, cx, cy;
    let globalAngle = 0;
    let autoAdvancePaused = false;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Visual Render States
    let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    let snakeDir = {x: 1, y: 0};
    let snakeFood = {x: 15, y: 15};
    let dinoY = 0, dinoVY = 0, cactusX = width;
    let matrixCols = [];
    let particles = [];
    let fireworks = [];

    for (let i = 0; i < 200; i++) particles.push({ x: Math.random() * width, y: Math.random() * height, z: Math.random() * width });

    const renderers = {
      hackery: () => {
        ctx.fillStyle = "rgba(0, 10, 0, 0.2)"; ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "#00ff66"; ctx.font = "14px 'Fira Code', monospace";
        for (let i = 0; i < 12; i++) {
          let y = (globalAngle * 200 + i * 40) % height;
          ctx.fillText(`[ROOT@DREW-WTF]# sudo inject_payload_0x${Math.floor((i+globalAngle)*1000).toString(16)}`, 20, y);
        }
      },
      martha_stewart: () => {
        ctx.fillStyle = "rgba(255, 245, 238, 0.25)"; ctx.fillRect(0, 0, width, height);
        ctx.font = "32px serif";
        for (let i = 0; i < 6; i++) {
          let x = cx + Math.sin(globalAngle + i) * 180, y = cy + Math.cos(globalAngle + i) * 120;
          ctx.fillText("🥧 🧵 🌿 ☕", x, y);
        }
      },
      phonk_drift: () => {
        ctx.fillStyle = "rgba(10, 0, 15, 0.3)"; ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = "#ff0055"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, height * 0.8); ctx.lineTo(width, height * 0.8); ctx.stroke();
        let carX = (globalAngle * 400) % (width + 100) - 50;
        ctx.font = "36px serif"; ctx.fillText("🏎️💨", carX, height * 0.8 - 10);
      },
      cyberpunk_matrix: () => {
        ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(0,0,width,height);
        ctx.fillStyle = "#00ffff"; ctx.font = "16px monospace";
        if (matrixCols.length < Math.floor(width/20)) {
          for(let i=0;i<width/20;i++) matrixCols[i] = Math.random()*height;
        }
        matrixCols.forEach((y, i) => {
          ctx.fillText(String.fromCharCode(0x30A0 + Math.random()*96), i*20, y);
          matrixCols[i] = y > height || Math.random() > 0.975 ? 0 : y + 20;
        });
      },
      snake: () => {
        ctx.fillStyle = "rgba(0, 20, 0, 0.3)"; ctx.fillRect(0, 0, width, height);
        const gs = 20;
        if (Math.random() < 0.1) {
          const dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
          snakeDir = dirs[Math.floor(Math.random()*dirs.length)];
        }
        let head = {x: (snake[0].x + snakeDir.x + Math.floor(width/gs)) % Math.floor(width/gs), y: (snake[0].y + snakeDir.y + Math.floor(height/gs)) % Math.floor(height/gs)};
        snake.unshift(head);
        if (Math.abs(head.x - snakeFood.x) < 1 && Math.abs(head.y - snakeFood.y) < 1) {
          snakeFood = {x: Math.floor(Math.random()*(width/gs)), y: Math.floor(Math.random()*(height/gs))};
        } else if (snake.length > 15) { snake.pop(); }
        ctx.fillStyle = "#00ff00"; snake.forEach(p => ctx.fillRect(p.x*gs, p.y*gs, gs-2, gs-2));
        ctx.fillStyle = "#ff0000"; ctx.fillRect(snakeFood.x*gs, snakeFood.y*gs, gs-2, gs-2);
      },
      hockey: () => {
        ctx.fillStyle = "#112233"; ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = "#ff0000"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(cx, cy, 80, 0, Math.PI*2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, height); ctx.stroke();
        let puckX = cx + Math.sin(globalAngle*3)*200;
        let puckY = cy + Math.cos(globalAngle*2)*150;
        ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.arc(puckX, puckY, 15, 0, Math.PI*2); ctx.fill();
      },
      casino: () => {
        ctx.fillStyle = "#1a0005"; ctx.fillRect(0, 0, width, height);
        ctx.font = "40px serif";
        const symbols = ["777", "🍒", "🍋", "🔔", "💎", "BAR"];
        for(let i=0; i<3; i++) {
          let sym = symbols[Math.floor((globalAngle*5 + i)%symbols.length)];
          ctx.fillStyle = "#ffcc00"; ctx.fillText(sym, cx - 120 + i*90, cy);
        }
      },
      angelic: () => {
        ctx.fillStyle = "rgba(255, 255, 240, 0.1)"; ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = "rgba(255, 215, 0, 0.3)"; ctx.lineWidth = 3;
        for(let i=0; i<12; i++) {
          ctx.beginPath(); ctx.moveTo(cx, cy);
          ctx.lineTo(cx + Math.cos(globalAngle + i)*width, cy + Math.sin(globalAngle + i)*height);
          ctx.stroke();
        }
      },
      demonic: () => {
        ctx.fillStyle = "rgba(20, 0, 0, 0.4)"; ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = "#ff0000"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy, 120, 0, Math.PI*2); ctx.stroke();
        for(let i=0; i<5; i++) {
          let a = (i * 4 * Math.PI / 5) - Math.PI/2;
          let x = cx + 120 * Math.cos(a), y = cy + 120 * Math.sin(a);
          if (i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath(); ctx.stroke();
      },
      dino: () => {
        ctx.fillStyle = "#f7f7f7"; ctx.fillRect(0,0,width,height);
        ctx.strokeStyle = "#535353"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, cy+50); ctx.lineTo(width, cy+50); ctx.stroke();
        dinoVY += 1.2; dinoY += dinoVY;
        if(dinoY >= 0) { dinoY = 0; dinoVY = 0; }
        if(cactusX < 0 && Math.random()<0.05) { dinoVY = -16; }
        cactusX -= 8; if(cactusX < -20) cactusX = width;
        ctx.font = "30px serif"; ctx.fillText("🦖", cx - 100, cy + 45 + dinoY);
        ctx.fillText("🌵", cactusX, cy + 48);
      },
      stars: () => {
        ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(0,0,width,height);
        particles.forEach(p => {
          p.z -= 6; if(p.z <= 0) p.z = width;
          let sx = (p.x - cx) * (width/p.z) + cx, sy = (p.y - cy) * (width/p.z) + cy;
          ctx.fillStyle = "#ffffff"; ctx.fillRect(sx, sy, 2, 2);
        });
      },
      mushrooms: () => {
        ctx.fillStyle = "rgba(10,0,20,0.2)"; ctx.fillRect(0,0,width,height);
        ctx.font = "32px serif";
        for(let i=0; i<8; i++) {
          let x = cx + Math.sin(globalAngle + i)*150, y = cy + Math.cos(globalAngle + i)*150;
          ctx.fillText("🍄", x, y);
        }
      },
      lsd: () => {
        ctx.fillStyle = `hsl(${(globalAngle*50)%360}, 80%, 20%)`; ctx.fillRect(0,0,width,height);
      },
      rain: () => {
        ctx.fillStyle = "rgba(0,5,15,0.3)"; ctx.fillRect(0,0,width,height);
        ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 1;
        for(let i=0;i<30;i++) {
          let x = (Math.sin(i*99)+1)*width/2, y = (globalAngle*500 + i*50)%height;
          ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+15); ctx.stroke();
        }
      },
      tron: () => {
        ctx.fillStyle = "#000510"; ctx.fillRect(0,0,width,height);
        ctx.strokeStyle = "#00f0ff"; ctx.lineWidth = 1;
        for(let x=0; x<width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,height); ctx.stroke(); }
        for(let y=0; y<height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(width,y); ctx.stroke(); }
      },
      fireworks: () => {
        ctx.fillStyle = "rgba(0,0,0,0.2)"; ctx.fillRect(0,0,width,height);
        if(Math.random()<0.1) fireworks.push({x:Math.random()*width, y:Math.random()*height/2, r:2, c:`hsl(${Math.random()*360},100%,50%)`});
        fireworks.forEach((f,i) => {
          ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fillStyle = f.c; ctx.fill(); f.r += 2;
          if(f.r > 30) fireworks.splice(i,1);
        });
      },
      geocities: () => {
        ctx.fillStyle = "#000080"; ctx.fillRect(0,0,width,height);
        ctx.font = "20px 'Comic Sans MS', cursive"; ctx.fillStyle = "#ffff00";
        ctx.fillText("UNDER CONSTRUCTION!", cx-120, cy);
      },
      pong: () => {
        ctx.fillStyle = "#000000"; ctx.fillRect(0,0,width,height);
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(20, cy + Math.sin(globalAngle*3)*100, 10, 60);
        ctx.fillRect(width-30, cy + Math.cos(globalAngle*3)*100, 10, 60);
        ctx.fillRect(cx + Math.sin(globalAngle*2)*200, cy + Math.cos(globalAngle*4)*100, 10, 10);
      }
    };

    const rendererKeys = Object.keys(renderers);

    function animateCanvas() {
      globalAngle += 0.02;
      let currentRendererKey = rendererKeys[(currentPhase - 1) % rendererKeys.length];
      if(renderers[currentRendererKey]) renderers[currentRendererKey]();
      requestAnimationFrame(animateCanvas);
    }

    /* --- 300 PROCEDURAL PHASES SYSTEM --- */
    const phaseNames = [
      "HACKER TERMINAL", "MARTHA STEWART COTTAGE", "PHONK DRIFT ZONE", "CYBERPUNK MATRIX",
      "SNAKE AUTOMATA", "HOCKEY RINK", "CASINO JACKPOT", "ANGELIC LIGHTS",
      "DEMONIC REALM", "OFFLINE DINO", "HYPERSPACE WARP", "SHROOM TRIP",
      "LSD PLASMA", "ACID RAIN", "TRON GRID", "FIREWORKS DISPLAY",
      "GEOCITIES 2000", "PONG PROTOCOL"
    ];

    const phaseColors = [
      "#000000", "#1a0f00", "#0a0015", "#000a10", "#001005",
      "#000000", "#1877f2", "#ffff00", "#00ffcc", "#ff007f", "#150022"
    ];

    let currentPhase = 1;
    let phaseTimer = null;

    function setPhase(p) {
      currentPhase = p;
      if (currentPhase > 300) currentPhase = 1;
      if (currentPhase < 1) currentPhase = 300;

      const pName = phaseNames[(currentPhase - 1) % phaseNames.length];
      document.getElementById("phase-badge-top").textContent = `PHASE ${String(currentPhase).padStart(3, '0')}`;
      document.getElementById("phase-bottom-banner").textContent = pName;

      const themeBg = phaseColors[(currentPhase - 1) % phaseColors.length];
      document.body.style.backgroundColor = themeBg;

      const randomFont = companyFonts[Math.floor(Math.random() * companyFonts.length)];
      document.getElementById("scramble-text").style.fontFamily = randomFont.font;

      glitchContactButtonText();
      runScrambleCycle();
    }

    function glitchContactButtonText() {
      const btn = document.getElementById("contact-btn");
      const targetText = contactTexts[(currentPhase - 1) % contactTexts.length];
      let frame = 0;
      const interval = setInterval(() => {
        btn.textContent = targetText.split('').map(c => Math.random() < 0.4 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c).join('');
        frame++;
        if (frame >= 10) {
          clearInterval(interval);
          btn.textContent = targetText;
        }
      }, 40);
    }

    function prevPhase() { setPhase(currentPhase - 1); resetPhaseTimer(); }
    function nextPhase() { setPhase(currentPhase + 1); resetPhaseTimer(); }

    function resetPhaseTimer() {
      if (phaseTimer) clearInterval(phaseTimer);
      if (!autoAdvancePaused) {
        phaseTimer = setInterval(() => {
          nextPhase();
        }, 30000); // 30 seconds
      }
    }

    function toggleAutoAdvance(e) {
      if(e) e.stopPropagation();
      autoAdvancePaused = !autoAdvancePaused;
      document.getElementById("pause-toggle").textContent = autoAdvancePaused ? "▶️ PLAY" : "⏸️ PAUSE";
      resetPhaseTimer();
    }

    /* --- INPUT CONTROLS --- */
    let isScrolling = false;
    window.addEventListener("wheel", (e) => {
      if (isScrolling) return;
      isScrolling = true;
      if (e.deltaY > 0) nextPhase(); else if (e.deltaY < 0) prevPhase();
      setTimeout(() => { isScrolling = false; }, 200);
    });

    function handleDrewClick(e) { if(e) e.stopPropagation(); prevPhase(); }
    function handleWtfClick(e) { if(e) e.stopPropagation(); nextPhase(); }
    function handleDotClick(e) { if(e) e.stopPropagation(); setPhase(Math.floor(Math.random()*300) + 1); resetPhaseTimer(); }

    function toggleModal(show) {
      document.getElementById('contact-modal').style.display = show ? 'flex' : 'none';
    }

    /* --- DREW.WTF + DREW.666 + MULTI-SCRIPT MORPH ENGINE --- */
    const langVariants = [
      { left: "DREW",     right: "666",              font: "'Press Start 2P', monospace" },
      { left: "DREW",     right: "777",              font: "'Orbitron', sans-serif" },
      { left: "DREW",     right: "NULL",             font: "'Fira Code', monospace" },
      { left: "DREW",     right: "VOID",             font: "'VT323', monospace" },
      { left: "DREW",     right: "EXE",              font: "'Courier Prime', monospace" },
      { left: "ड्रू",     right: "डब्ल्यूटीएफ़",     font: "'Noto Sans Devanagari', sans-serif" },
      { left: "ڈریو",     right: "ڈبلیوٹی\u200cایف", font: "'Noto Sans Arabic', sans-serif" },
      { left: "ДРЕВ",     right: "ВТФ",              font: "'Courier New', monospace" },
      { left: "德鲁",      right: "网站",              font: "'Noto Sans SC', sans-serif" },
      { left: "ドリュー",   right: "ワット",            font: "'Noto Sans JP', sans-serif" },
      { left: "드류",      right: "더블유티에프",       font: "'Noto Sans KR', sans-serif" },
      { left: "ΔΡΕΩ",     right: "ΩΤΦ",              font: "'Cinzel', serif" },
      { left: "דרו",      right: "וטף",              font: "'Noto Sans Hebrew', sans-serif" },
      { left: "ดรูว์",     right: "ดับเบิลยูทีเอฟ",    font: "'Noto Sans Thai', sans-serif" }
    ];

    const intlGlitchChars = ["0", "1", "3", "7", "_", "@", "$", "%", "*", "!", "中", "鬼", "魔", "龙", "अ", "Д", "ا", "א", "ก", "가", "あ", "🔥", "💀", "😈", "666"];

    const scrambleTextEl = document.getElementById("scramble-text");
    const wordDrewEl = document.getElementById("word-drew");
    const wordWtfEl = document.getElementById("word-wtf");

    let scrambleInterval = null, scrambleTimeout = null;

    function runScrambleCycle() {
      if (scrambleInterval) clearInterval(scrambleInterval);
      if (scrambleTimeout) clearTimeout(scrambleTimeout);

      wordDrewEl.textContent = "DREW";
      wordWtfEl.textContent = "WTF";

      scrambleTimeout = setTimeout(() => {
        const variant = langVariants[Math.floor(Math.random() * langVariants.length)];
        scrambleTextEl.style.fontFamily = scrambleFontStack;

        let frame = 0;
        scrambleInterval = setInterval(() => {
          wordDrewEl.textContent = variant.left.split('').map(c => Math.random()<0.35 ? intlGlitchChars[Math.floor(Math.random()*intlGlitchChars.length)] : c).join('');
          wordWtfEl.textContent = variant.right.split('').map(c => Math.random()<0.35 ? intlGlitchChars[Math.floor(Math.random()*intlGlitchChars.length)] : c).join('');

          frame++;
          if (frame >= 18) {
            clearInterval(scrambleInterval);
            scrambleTextEl.style.fontFamily = variant.font;
            wordDrewEl.textContent = variant.left;
            wordWtfEl.textContent = variant.right;

            scrambleTimeout = setTimeout(() => {
              wordDrewEl.textContent = "DREW";
              wordWtfEl.textContent = "WTF";
              runScrambleCycle();
            }, 1200);
          }
        }, 45);
      }, 2000);
    }

    // POSSESSED COUNTER
    setInterval(() => {
      const vb = document.getElementById("visitor-box");
      if (Math.random() < 0.15) {
        vb.textContent = "VISITS: 00666";
      } else {
        vb.textContent = `VISITS: ${Math.floor(Math.random() * 99999).toString().padStart(5, '0')}`;
      }
    }, 150);

    setPhase(1);
    resetPhaseTimer();
    animateCanvas();
  </script>
</body>
</html>
