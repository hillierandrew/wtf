<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pwndemonium</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07080c; overflow: hidden; }
  body { font-family: "IBM Plex Sans", "Segoe UI", sans-serif; color: #f6f3ea; }
  .fit { width: 1920px; height: 1080px; transform-origin: 0 0; }
  .stage {
    width: 1920px;
    height: 1080px;
    position: relative;
    background:
      radial-gradient(900px 500px at 15% 0%, #ff2d7b33, transparent 60%),
      radial-gradient(800px 480px at 80% 100%, #c6ff4a22, transparent 55%),
      #07080c;
    overflow: hidden;
  }
  .aurora, .grid {
    position: absolute;
    inset: -10%;
    pointer-events: none;
  }
  .aurora {
    background:
      radial-gradient(circle at 20% 30%, #ff2d7b55, transparent 28%),
      radial-gradient(circle at 70% 60%, #7ee7ff33, transparent 26%);
    filter: blur(8px);
    animation: drift 14s ease-in-out infinite alternate;
  }
  .grid {
    background-image:
      linear-gradient(#ffffff10 1px, transparent 1px),
      linear-gradient(90deg, #ffffff10 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: linear-gradient(#000, transparent 85%);
    animation: pan 18s linear infinite;
    opacity: 0.35;
  }
  .layout {
    position: absolute;
    inset: 20px;
    display: grid;
    grid-template-columns: 1fr 560px;
    grid-template-rows: 1fr 300px;
    gap: 18px;
  }
  .panel {
    position: relative;
    border-radius: 22px;
    background: #10131b;
    box-shadow: 0 0 0 2px #000, 0 0 0 4px #c6ff4a55;
    overflow: hidden;
  }
  .game { grid-column: 1; grid-row: 1; display: flex; flex-direction: column; }
  .namebar {
    height: 64px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    background: linear-gradient(90deg, #161922, #10131b 70%);
    border-bottom: 2px solid #ffffff14;
  }
  .namebar img {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    box-shadow: 0 0 0 3px #c6ff4a;
  }
  .namebar b {
    font-family: Syne, sans-serif;
    font-size: 28px;
    letter-spacing: -0.04em;
  }
  .namebar em {
    font-style: normal;
    color: #f6f3ea99;
    font-size: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .who { min-width: 0; display: flex; flex-direction: column; }
  .pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 999px;
    padding: 6px 12px;
    background: #000;
    font-weight: 600;
    letter-spacing: 0.12em;
    font-size: 13px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #667;
    box-shadow: 0 0 0 0 #ff2d7b;
  }
  .pill.on { color: #ffd0e0; }
  .pill.on .dot { background: #ff2d7b; animation: pulse 1.2s ease-out infinite; }
  .hole {
    flex: 1;
    margin: 16px;
    border-radius: 16px;
    position: relative;
    background:
      repeating-linear-gradient(-45deg, #0b0d12, #0b0d12 12px, #12151c 12px, #12151c 24px);
    display: grid;
    place-items: center;
    color: #ffffff55;
    font-family: Syne, sans-serif;
    letter-spacing: 0.18em;
    font-size: 28px;
  }
  .hole span { position: relative; z-index: 1; }
  .scan {
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent, #c6ff4a22, transparent);
    height: 30%;
    animation: scan 3.4s linear infinite;
  }
  .bottom { grid-column: 1; grid-row: 2; display: grid; grid-template-columns: 480px 1fr; gap: 18px; }
  .cam { display: flex; }
  .alerts { padding: 18px 22px; display: flex; flex-direction: column; justify-content: center; }
  .idle b {
    font-family: Syne, sans-serif;
    font-size: 54px;
    letter-spacing: -0.05em;
    display: block;
    background: linear-gradient(90deg, #f6f3ea, #c6ff4a 40%, #7ee7ff 70%, #ff2d7b);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: sheen 4s linear infinite;
  }
  .idle span { color: #f6f3ea99; letter-spacing: 0.16em; font-size: 14px; }
  .card { display: none; }
  .card.show { display: block; animation: slam 0.45s cubic-bezier(.2,1.4,.4,1) both; }
  .kicker {
    font-family: Syne, sans-serif;
    font-size: 18px;
    letter-spacing: 0.22em;
  }
  .card strong {
    display: block;
    font-family: Syne, sans-serif;
    font-size: 52px;
    line-height: 0.95;
    letter-spacing: -0.04em;
  }
  .card p { margin: 8px 0 0; font-size: 20px; color: #f6f3eaee; }
  .card.raid .kicker { color: #ff2d7b; }
  .card.follow .kicker { color: #c6ff4a; }
  .card.sub .kicker { color: #ffe27a; }
  .card.bits .kicker { color: #7ee7ff; }
  .chat {
    grid-column: 2;
    grid-row: 1 / span 2;
    display: flex;
    flex-direction: column;
    background: #0d1016ee;
  }
  .chat-head {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    font-family: Syne, sans-serif;
    letter-spacing: 0.16em;
    border-bottom: 2px solid #ffffff14;
  }
  .log { flex: 1; overflow: hidden; padding: 12px 14px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; }
  .msg {
    animation: pop 0.35s ease both;
    line-height: 1.35;
    font-size: 18px;
    word-wrap: break-word;
  }
  .msg b { margin-right: 6px; }
  .emote { height: 28px; vertical-align: middle; }
  .quiet { color: #f6f3ea66; font-size: 16px; }
  @keyframes drift { to { transform: translate3d(3%, -2%, 0) scale(1.05); } }
  @keyframes pan { to { background-position: 64px 64px; } }
  @keyframes scan { from { top: -30%; } to { top: 100%; } }
  @keyframes pulse { 70% { box-shadow: 0 0 0 10px #ff2d7b00; } }
  @keyframes sheen { to { background-position: 200% 0; } }
  @keyframes slam { from { transform: translateY(24px) scale(0.96); opacity: 0; } }
  @keyframes pop { from { transform: translateX(12px); opacity: 0; } }
</style>
</head>
<body>
  <div class="fit" id="fit">
    <div class="stage">
      <div class="aurora"></div>
      <div class="grid"></div>
      <div class="layout">
        <section class="panel game">
          <div class="namebar">
            <img alt="" src="https://static-cdn.jtvnw.net/jtv_user_pictures/1e95469a-febb-4347-a2c5-20aa07be3f61-profile_image-300x300.png" />
            <div class="who">
              <b>pwndemonium</b>
              <em id="title">loading title</em>
            </div>
            <div class="pill" id="live"><i class="dot"></i><span id="liveLabel">OFFLINE</span></div>
          </div>
          <div class="hole" id="gameHole"><i class="scan"></i><span>GAME</span></div>
        </section>
        <div class="bottom">
          <section class="panel cam">
            <div class="hole" id="camHole"><i class="scan"></i><span>CAM</span></div>
          </section>
          <section class="panel alerts">
            <div class="idle" id="idle">
              <b>pwndemonium</b>
              <span id="meta">RAIDS · FOLLOWS · SUBS</span>
            </div>
            <div class="card" id="card">
              <div class="kicker" id="kicker">RAID</div>
              <strong id="ahead">NAME</strong>
              <p id="asub"></p>
            </div>
          </section>
        </div>
        <aside class="panel chat">
          <div class="chat-head">CHAT <span id="chatDot">···</span></div>
          <div class="log" id="log"><div class="quiet">chat will show up here</div></div>
        </aside>
      </div>
    </div>
  </div>
<script>
const CHANNEL = "pwndemonium";
const fit = document.getElementById("fit");
function scale() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  fit.style.transform = "scale(" + s + ")";
}
addEventListener("resize", scale);
scale();

const titleEl = document.getElementById("title");
const live = document.getElementById("live");
const liveLabel = document.getElementById("liveLabel");
const meta = document.getElementById("meta");
let lastFollowers = null;

async function poll() {
  try {
    const res = await fetch("https://api.ivr.fi/v2/twitch/user?login=" + CHANNEL);
    const user = (await res.json())[0];
    const stream = user.stream;
    const on = !!(stream && (stream.title || stream.viewers || stream.viewerCount || stream.startedAt));
    live.classList.toggle("on", on);
    const viewers = stream && (stream.viewers ?? stream.viewerCount);
    liveLabel.textContent = on ? ("LIVE" + (viewers != null ? " " + viewers : "")) : "OFFLINE";
    titleEl.textContent = (stream && stream.title) || (user.lastBroadcast && user.lastBroadcast.title) || CHANNEL;
    if (typeof user.followers === "number") {
      meta.textContent = user.followers + " FOLLOWERS · RAIDS · SUBS";
      if (lastFollowers != null && user.followers > lastFollowers) {
        const n = user.followers - lastFollowers;
        enqueue("follow", n === 1 ? "NEW FOLLOWER" : "+" + n + " FOLLOWERS", n === 1 ? "someone just followed" : "new people just followed");
      }
      lastFollowers = user.followers;
    }
  } catch (e) {}
}
poll();
setInterval(poll, 20000);

const idle = document.getElementById("idle");
const card = document.getElementById("card");
const kicker = document.getElementById("kicker");
const ahead = document.getElementById("ahead");
const asub = document.getElementById("asub");
const queue = [];
let showing = false;

function enqueue(kind, head, sub) {
  queue.push({ kind, head, sub });
  pump();
}
function pump() {
  if (showing || !queue.length) return;
  showing = true;
  const item = queue.shift();
  card.className = "card show " + item.kind;
  kicker.textContent = item.kind.toUpperCase();
  ahead.textContent = item.head;
  asub.textContent = item.sub || "";
  idle.style.display = "none";
  setTimeout(() => {
    card.className = "card";
    idle.style.display = "";
    showing = false;
    pump();
  }, 7000);
}

const log = document.getElementById("log");
const chatDot = document.getElementById("chatDot");
const rows = new Map();

function addLine(id, name, color, text, emotes) {
  const quiet = log.querySelector(".quiet");
  if (quiet) quiet.remove();
  const row = document.createElement("div");
  row.className = "msg";
  const who = document.createElement("b");
  who.textContent = name;
  who.style.color = color || "#c6ff4a";
  row.append(who);
  row.append(renderText(text, emotes));
  log.append(row);
  if (id) rows.set(id, row);
  while (log.children.length > 40) {
    const first = log.firstElementChild;
    log.removeChild(first);
  }
  log.scrollTop = log.scrollHeight;
}

function renderText(text, emotes) {
  const frag = document.createDocumentFragment();
  const ranges = [];
  if (emotes) {
    emotes.split("/").forEach((part) => {
      const cut = part.split(":");
      const id = cut[0];
      if (!cut[1]) return;
      cut[1].split(",").forEach((place) => {
        const pair = place.split("-").map(Number);
        if (Number.isFinite(pair[0])) ranges.push({ a: pair[0], b: pair[1], id });
      });
    });
    ranges.sort((a, b) => a.a - b.a);
  }
  let i = 0;
  ranges.forEach((range) => {
    if (range.a < i || range.a > text.length) return;
    if (range.a > i) frag.append(document.createTextNode(text.slice(i, range.a)));
    const img = document.createElement("img");
    img.className = "emote";
    img.alt = "";
    img.src = "https://static-cdn.jtvnw.net/emoticons/v2/" + range.id + "/default/dark/2.0";
    frag.append(img);
    i = range.b + 1;
  });
  if (i < text.length) frag.append(document.createTextNode(text.slice(i)));
  return frag;
}

function unescapeTag(value) {
  return value.replace(/\\s/g, " ").replace(/\\:/g, ";").replace(/\\r/g, "").replace(/\\n/g, " ").replace(/\\\\/g, "\\");
}
function parseLine(line) {
  let rest = line;
  const tags = {};
  if (rest.startsWith("@")) {
    const space = rest.indexOf(" ");
    rest.slice(1, space).split(";").forEach((pair) => {
      const eq = pair.indexOf("=");
      if (eq > 0) tags[pair.slice(0, eq)] = unescapeTag(pair.slice(eq + 1));
    });
    rest = rest.slice(space + 1);
  }
  if (rest.startsWith(":")) rest = rest.slice(rest.indexOf(" ") + 1);
  const trailAt = rest.indexOf(" :");
  const main = trailAt === -1 ? rest : rest.slice(0, trailAt);
  const trailing = trailAt === -1 ? "" : rest.slice(trailAt + 2);
  const parts = main.split(" ");
  return { tags, cmd: parts[0], trailing };
}

function onIrc(line) {
  if (!line) return;
  if (line.startsWith("PING")) {
    socket.send(line.replace("PING", "PONG"));
    return;
  }
  const msg = parseLine(line);
  if (msg.cmd === "PRIVMSG") {
    const name = msg.tags["display-name"] || "chat";
    addLine(msg.tags.id, name, msg.tags.color, msg.trailing, msg.tags.emotes);
    if (msg.tags.bits) enqueue("bits", name, "cheered " + msg.tags.bits);
  } else if (msg.cmd === "USERNOTICE") {
    const id = msg.tags["msg-id"] || "";
    const name = msg.tags["display-name"] || msg.tags["msg-param-displayName"] || "someone";
    if (id === "raid") {
      enqueue("raid", name, "raiding with " + (msg.tags["msg-param-viewerCount"] || "?") + " viewers");
    } else if (id === "sub" || id === "resub") {
      enqueue("sub", name, msg.tags["system-msg"] || "subscribed");
    } else if (id.indexOf("subgift") !== -1 || id === "submysterygift") {
      enqueue("sub", name, msg.tags["system-msg"] || "gifted a sub");
    }
    if (msg.trailing) addLine(msg.tags.id, name, msg.tags.color, msg.trailing, msg.tags.emotes);
  } else if (msg.cmd === "CLEARCHAT") {
    const who = (msg.trailing || "").toLowerCase();
    Array.from(log.children).forEach((row) => {
      const b = row.querySelector("b");
      if (!who || (b && b.textContent.toLowerCase() === who)) row.remove();
    });
  }
}

let socket;
let retry = 1000;
function connect() {
  chatDot.textContent = "···";
  socket = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  socket.onopen = () => {
    retry = 1000;
    chatDot.textContent = "LIVE";
    socket.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
    socket.send("PASS SCHMOEPILOT");
    socket.send("NICK justinfan" + Math.floor(Math.random() * 100000));
    socket.send("JOIN #" + CHANNEL);
  };
  socket.onmessage = (ev) => String(ev.data).split(/\r?\n/).forEach(onIrc);
  socket.onclose = () => {
    chatDot.textContent = "RETRY";
    setTimeout(connect, retry);
    retry = Math.min(retry * 2, 15000);
  };
}
connect();
</script>
</body>
</html>
