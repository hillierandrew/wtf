<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>No internet connection</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #fff; }
  body { color: #5f6368; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #fff; }
  .offline { width: min(540px, 100%); }
  #dino { display: block; width: min(100%, 420px); height: auto; background: #fff; touch-action: manipulation; }
  .offline h1 { font-weight: 500; font-size: 1.6em; color: #202124; margin: 18px 0 14px; }
  .offline ul { margin: 8px 0 16px; padding-left: 28px; }
  .secret { background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; }
  .code { color: #80868b; font-size: 13px; }

  #app { display: none; min-height: 100vh; background: #f5f5f7; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
  #app.on { display: block; }
  .nav { position: sticky; top: 0; z-index: 4; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: rgba(245,245,247,.86); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0,0,0,.06); }
  .nav b { font-size: 17px; letter-spacing: -0.02em; }
  .nav button { background: none; border: 0; color: #1d1d1f; font-size: 17px; min-height: 44px; padding: 0 4px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 22px 80px; }
  .wrap h1 { font-size: clamp(40px, 6vw, 56px); font-weight: 600; letter-spacing: -0.035em; margin: 8px 0 6px; }
  .lede { color: #6e6e73; font-size: 19px; margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .pcard, .detail { background: #fff; border-radius: 24px; text-align: center; padding: 28px 22px 26px; }
  .pcard h2, .detail h2 { font-size: 32px; font-weight: 600; letter-spacing: -0.03em; margin: 8px 0 4px; }
  .pcard p, .detail .line { color: #6e6e73; margin: 0; font-size: 17px; }
  .pcard .cost, .detail .cost { color: #1d1d1f; font-size: 17px; margin: 8px 0 16px; }
  .add, .auth button[type="submit"] { background: #0071e3; color: #fff; border: 0; border-radius: 980px; min-height: 44px; padding: 0 20px; font-size: 17px; }
  .detail .add { display: block; margin: 28px auto 0; }
  .auth p { user-select: none; }
  .back { background: none; border: 0; color: #0066cc; font-size: 17px; min-height: 44px; padding: 0; }
  .specs { text-align: left; max-width: 460px; margin: 8px auto 22px; }
  .specs div { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-top: 1px solid #e8e8ed; font-size: 17px; }
  .specs small { color: #6e6e73; }
  .choice { margin: 18px auto 0; max-width: 460px; text-align: left; }
  .choice h3 { font-size: 17px; margin: 0 0 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pills button { min-height: 44px; padding: 0 16px; border-radius: 980px; border: 1px solid #d2d2d7; background: #fff; color: #1d1d1f; }
  .pills button.on { border: 2px solid #0071e3; color: #0071e3; }
  .fine { color: #6e6e73; font-size: 12px; text-align: center; margin-top: 22px; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 6; }
  .bag { position: fixed; z-index: 7; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: #fff; color: #1d1d1f; padding: 22px 22px calc(22px + env(safe-area-inset-bottom)); overflow: auto; box-shadow: -8px 0 30px rgba(0,0,0,.08); }
  .bag h2 { font-size: 32px; font-weight: 600; letter-spacing: -0.03em; margin: 12px 0 18px; }
  .item { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 14px 0; border-top: 1px solid #e8e8ed; }
  .item b { display: block; font-size: 17px; }
  .item span { color: #6e6e73; font-size: 14px; }
  .item button { background: none; border: 0; color: #0066cc; min-height: 44px; }
  .total { display: flex; justify-content: space-between; font-size: 21px; font-weight: 600; margin-top: 12px; }
  .cover { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth { width: min(380px, 100%); background: #fff; color: #1d1d1f; border-radius: 18px; padding: 28px 24px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.12); }
  .auth h2 { font: 600 28px/1.1 -apple-system, "Segoe UI", sans-serif; letter-spacing: -0.03em; margin: 0 0 8px; }
  .auth p { color: #6e6e73; margin: 0 0 16px; font-size: 15px; }
  .auth input { width: 100%; height: 48px; border: 1px solid #d2d2d7; border-radius: 12px; padding: 0 14px; font-size: 17px; background: #fff; color: #1d1d1f; margin-bottom: 10px; }
  .auth .err { color: #b6443c; min-height: 0; margin: 0 0 12px; }
  .auth button[type="submit"] { width: 100%; }
  .auth .close { background: none; border: 0; color: #0066cc; margin-top: 8px; min-height: 44px; width: 100%; }
  .dev { display: flex; flex-direction: column; gap: 8px; }
  .dev button { min-height: 52px; border-radius: 14px; border: 1px solid #d2d2d7; background: #fff; color: #1d1d1f; text-align: left; padding: 0 16px; font-size: 17px; }
  svg.machine { width: min(240px, 70%); height: auto; display: block; margin: 0 auto; }
  @media (min-width: 800px) { .grid { grid-template-columns: 1fr 1fr; gap: 20px; } }
  body.tv #app { font-size: 22px; }
  body.tv .pcard h2 { font-size: 48px; }
  body.kindle #app { background: #fff; color: #000; font-family: Georgia, "Times New Roman", serif; }
  body.kindle .pcard, body.kindle .detail, body.kindle .bag, body.kindle .auth { border-radius: 0; border: 1px solid #000; }
  body.kindle .add, body.kindle .auth button[type="submit"] { background: #000; border-radius: 0; }
</style>
</head>
<body>
<div id="gate">
  <div class="offline">
    <canvas id="dino" width="420" height="110" aria-label="Offline dinosaur"></canvas>
    <h1>No internet co<button type="button" class="secret" id="n1">n</button><button type="button" class="secret" id="n2">n</button>ectio<button type="button" class="secret" id="n3">n</button></h1>
    <p>Try:</p>
    <ul>
      <li>Checking the network cables, modem, and router</li>
      <li>Reconnecting to Wi-Fi</li>
      <li>Running Windows Network Diagnostics</li>
    </ul>
    <div class="code">ERR_INTERNET_DISCONNECTED</div>
  </div>
</div>
<div id="modal"></div>
<div id="app"></div>
<script>
(function () {
  function machine(color) {
    return '<svg class="machine" viewBox="0 0 320 250" aria-hidden="true"><rect x="46" y="18" width="228" height="150" rx="16" fill="#e8e8ed"/><rect x="58" y="30" width="204" height="118" rx="6" fill="' + color + '"/><circle cx="160" cy="40" r="2" fill="#d0d0d5"/><rect x="46" y="168" width="228" height="14" rx="3" fill="#d2d2d7"/><path d="M146 182 h28 l18 36 h-64 z" fill="#e4e4e8"/><rect x="112" y="218" width="96" height="6" rx="3" fill="#d2d2d7"/></svg>';
  }
  var PRODUCTS = [
    { id: "study", name: "Study", line: "Class, writing, and video.", price: 629, color: "#8fd0a8", parts: [["Processor", "Core i5-12400"], ["Memory", "16GB"], ["Graphics", "Built in"], ["Storage", "512GB"], ["Power", "500W"], ["Case", "Compact"]], memory: ["16GB", "32GB"], memPrice: [0, 44], storage: ["512GB", "1TB", "2TB"], storePrice: [0, 50, 170], graphics: ["Built in"], gpuPrice: [0] },
    { id: "desk", name: "Desk", line: "Mail, documents, and calls.", price: 913, color: "#9eb6e0", parts: [["Processor", "Ryzen 5 7600"], ["Memory", "16GB"], ["Graphics", "Built in"], ["Storage", "1TB"], ["Power", "650W"], ["Case", "Compact"]], memory: ["16GB", "32GB"], memPrice: [0, 90], storage: ["1TB", "2TB"], storePrice: [0, 120], graphics: ["Built in"], gpuPrice: [0] },
    { id: "play", name: "Play", line: "1080p games.", price: 888, color: "#7ea6e0", parts: [["Processor", "Ryzen 5 5600"], ["Memory", "16GB"], ["Graphics", "RTX 3050"], ["Storage", "1TB"], ["Power", "650W"], ["Case", "Compact"]], memory: ["16GB", "32GB"], memPrice: [0, 44], storage: ["1TB", "2TB"], storePrice: [0, 120], graphics: ["RTX 3050", "RTX 4060"], gpuPrice: [0, 170] },
    { id: "pro", name: "Pro", line: "1440p games.", price: 1482, color: "#5c7cfa", parts: [["Processor", "Ryzen 5 7600"], ["Memory", "32GB"], ["Graphics", "RTX 4060"], ["Storage", "1TB"], ["Power", "750W"], ["Case", "Standard"]], memory: ["32GB"], memPrice: [0], storage: ["1TB", "2TB"], storePrice: [0, 120], graphics: ["RTX 4060", "RTX 5070"], gpuPrice: [0, 390] }
  ];
  var mode = "phone";
  var view = "store";
  var openId = "study";
  var picks = {};
  var cart = [];
  var bag = false;
  var dinoHits = 0, cactusHits = 0, nHits = 0;
  for (var i = 0; i < PRODUCTS.length; i++) picks[PRODUCTS[i].id] = { m: 0, s: 0, g: 0 };

  function product(id) { for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i]; return PRODUCTS[0]; }
  function priceOf(p) { var c = picks[p.id]; return p.price + p.memPrice[c.m] + p.storePrice[c.s] + p.gpuPrice[c.g]; }
  function specOf(p) {
    var c = picks[p.id];
    var bits = [];
    for (var i = 0; i < p.parts.length; i++) {
      var label = p.parts[i][0], value = p.parts[i][1];
      if (label === "Memory") value = p.memory[c.m];
      if (label === "Storage") value = p.storage[c.s];
      if (label === "Graphics") value = p.graphics[c.g];
      bits.push([label, value]);
    }
    return bits;
  }
  function money(n) { return "$" + Math.round(n).toLocaleString(); }

  var gate = document.getElementById("gate");
  var app = document.getElementById("app");
  var modal = document.getElementById("modal");

  function showApp() {
    gate.style.display = "none";
    modal.innerHTML = "";
    app.className = "on";
    document.body.className = mode;
    document.title = "Store";
    view = "store";
    draw();
  }
  function askDevice() {
    modal.innerHTML = '<div class="cover"><form class="auth" onsubmit="return false"><h2>Where are you?</h2><p>Same computers. The type gets larger.</p><div class="dev" id="devs"></div><button type="button" class="close" id="x">Close</button></form></div>';
    var opts = [["phone", "iPhone"], ["desk", "Desktop"], ["tv", "TV"], ["kindle", "Kindle"]];
    var box = document.getElementById("devs");
    for (var i = 0; i < opts.length; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = opts[i][1];
      b.setAttribute("data-mode", opts[i][0]);
      b.onclick = function () { mode = this.getAttribute("data-mode"); showApp(); };
      box.appendChild(b);
    }
    document.getElementById("x").onclick = function () { modal.innerHTML = ""; };
  }
  function askPassword() {
    modal.innerHTML = '<div class="cover"><form class="auth" id="pw"><h2>Password</h2><p>Capital letters matter.</p><input id="pwv" type="password" autocomplete="off" placeholder="Password"><p class="err" id="pwe" hidden></p><button type="submit">Continue</button><button type="button" class="close" id="x">Cancel</button></form></div>';
    document.getElementById("x").onclick = function () { modal.innerHTML = ""; };
    document.getElementById("pw").onsubmit = function (e) {
      e.preventDefault();
      var v = document.getElementById("pwv").value.trim();
      if (v === "Password1") { mode = "desk"; showApp(); return; }
      var err = document.getElementById("pwe");
      err.hidden = false;
      err.textContent = "That password is not on the list.";
      setTimeout(function () { location.href = "https://www.bing.ca/"; }, 700);
    };
    document.getElementById("pwv").focus();
  }

  function draw() {
    var count = cart.length;
    var html = '<div class="nav"><b>Store</b><button type="button" id="bagbtn">Bag' + (count ? " (" + count + ")" : "") + '</button></div><div class="wrap">';
    if (view === "store") {
      html += '<h1>Four computers.</h1><p class="lede">Each one is finished. Add it to your bag, or open it and change memory, storage, or graphics.</p><div class="grid">';
      for (var i = 0; i < PRODUCTS.length; i++) {
        var p = PRODUCTS[i];
        html += '<article class="pcard">' + machine(p.color) + '<h2>' + p.name + '</h2><p>' + p.line + '</p><p class="cost">' + money(priceOf(p)) + '</p><button type="button" class="add" data-add="' + p.id + '">Add to Bag</button><div><button type="button" class="back" data-open="' + p.id + '">See what’s inside</button></div></article>';
      }
      html += '</div><p class="fine">Catalog prices, not a store. No display is included.</p>';
    } else {
      var cur = product(openId);
      var bits = specOf(cur);
      html += '<button type="button" class="back" id="back">Store</button><div class="detail">' + machine(cur.color) + '<h2>' + cur.name + '</h2><p class="line">' + cur.line + '</p><p class="cost">' + money(priceOf(cur)) + '</p><div class="specs">';
      for (var s = 0; s < bits.length; s++) html += '<div><small>' + bits[s][0] + '</small><b>' + bits[s][1] + '</b></div>';
      html += '</div>';
      html += pills("Memory", cur.memory, picks[cur.id].m, "m");
      html += pills("Storage", cur.storage, picks[cur.id].s, "s");
      if (cur.graphics.length > 1) html += pills("Graphics", cur.graphics, picks[cur.id].g, "g");
      html += '<button type="button" class="add" data-add="' + cur.id + '">Add to Bag</button></div>';
    }
    html += '</div>';
    if (bag) {
      html += '<div class="scrim" id="scrim"></div><aside class="bag"><button type="button" class="back" id="closebag">Close</button><h2>Bag</h2>';
      if (!cart.length) html += '<p class="lede">Your bag is empty.</p>';
      var sum = 0;
      for (var c = 0; c < cart.length; c++) {
        sum += cart[c].price;
        html += '<div class="item"><div><b>' + cart[c].name + '</b><span>' + cart[c].blurb + '</span></div><button type="button" data-del="' + c + '">Remove</button></div>';
      }
      if (cart.length) html += '<div class="total"><span>Total</span><span>' + money(sum) + '</span></div><p class="fine">A list on this page. Nothing is charged.</p>';
      html += '</aside>';
    }
    app.innerHTML = html;
    window.scrollTo(0, 0);
    var bagBtn = document.getElementById("bagbtn");
    if (bagBtn) bagBtn.onclick = function () { bag = !bag; draw(); };
    var scrim = document.getElementById("scrim");
    if (scrim) scrim.onclick = function () { bag = false; draw(); };
    var close = document.getElementById("closebag");
    if (close) close.onclick = function () { bag = false; draw(); };
    var back = document.getElementById("back");
    if (back) back.onclick = function () { view = "store"; draw(); };
    var adds = document.querySelectorAll("[data-add]");
    for (var a = 0; a < adds.length; a++) adds[a].onclick = function () {
      var p = product(this.getAttribute("data-add"));
      var bits = specOf(p);
      var blurb = [];
      for (var k = 0; k < bits.length; k++) if (bits[k][0] === "Processor" || bits[k][0] === "Graphics" || bits[k][0] === "Memory" || bits[k][0] === "Storage") blurb.push(bits[k][1]);
      cart.push({ name: p.name, price: priceOf(p), blurb: blurb.join(" · ") });
      bag = true;
      draw();
    };
    var opens = document.querySelectorAll("[data-open]");
    for (var o = 0; o < opens.length; o++) opens[o].onclick = function () { openId = this.getAttribute("data-open"); view = "detail"; bag = false; draw(); };
    var opts = document.querySelectorAll("[data-pick]");
    for (var n = 0; n < opts.length; n++) opts[n].onclick = function () {
      picks[openId][this.getAttribute("data-pick")] = Number(this.getAttribute("data-i"));
      draw();
    };
    var dels = document.querySelectorAll("[data-del]");
    for (var d = 0; d < dels.length; d++) dels[d].onclick = function () { cart.splice(Number(this.getAttribute("data-del")), 1); draw(); };
  }
  function pills(title, labels, on, key) {
    var html = '<div class="choice"><h3>' + title + '</h3><div class="pills">';
    for (var i = 0; i < labels.length; i++) html += '<button type="button" class="' + (i === on ? "on" : "") + '" data-pick="' + key + '" data-i="' + i + '">' + labels[i] + '</button>';
    return html + '</div></div>';
  }

  var canvas = document.getElementById("dino");
  var ctx = canvas.getContext("2d");
  var cactusX = 250, dy = 0, vy = 0;
  function frame() {
    ctx.clearRect(0, 0, 420, 110);
    ctx.fillStyle = "#535353";
    if (vy || dy) { dy += vy; vy -= 0.8; if (dy < 0) { dy = 0; vy = 0; } }
    ctx.fillRect(24, 78 - dy, 18, 22);
    ctx.fillRect(36, 70 - dy, 10, 8);
    ctx.fillRect(24, 96 - dy, 6, 8);
    ctx.fillRect(34, 96 - dy, 6, 8);
    ctx.fillRect(cactusX, 62, 10, 42);
    ctx.fillRect(cactusX - 12, 74, 12, 7);
    ctx.fillRect(cactusX + 10, 70, 12, 7);
    ctx.fillRect(0, 104, 420, 2);
    requestAnimationFrame(frame);
  }
  frame();
  canvas.addEventListener("pointerdown", function (e) {
    var r = canvas.getBoundingClientRect();
    var x = ((e.clientX - r.left) / r.width) * 420;
    var y = ((e.clientY - r.top) / r.height) * 110;
    if (x > cactusX - 24 && x < cactusX + 36 && y > 50 && y < 108) {
      cactusHits += 1;
      if (cactusHits >= 3) showApp();
      return;
    }
    if (x < 70 && y > 30) {
      dinoHits += 1;
      if (dinoHits >= 3) { askPassword(); return; }
    }
    if (!dy && !vy) vy = 10;
  });
  function hitN() { nHits += 1; if (nHits >= 3) askDevice(); }
  document.getElementById("n1").onclick = hitN;
  document.getElementById("n2").onclick = hitN;
  document.getElementById("n3").onclick = hitN;
  if (window.innerWidth > 900) mode = "desk";
})();
</script>
</body>
</html>
