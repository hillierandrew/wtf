  <script>
    /* --- COMPLETE NOV_DC PIANO ARRANGEMENT SYNTHESIZER ENGINE --- */
    let audioCtx = null;

      'G6', 'F6', 'D6', 'B5', 'G5', 'F5', 'D5', 'B4',
      'C5', 'G4', 'B4', 'F#4', 'C5', 'G4', 'B4', 'F#4',

    ];

    // Nov_DC Section A / Section B Bass & Harmony Line
    const novDcBassline = [
      null, null, null, null, null, null, null, null,
      'C3', 'G3', 'C3', 'G3', 'C3', 'G3', 'C3', 'G3',
      'G2', 'D3', 'G2', 'D3', 'G2', 'D3', 'G2', 'D3',

      'F#2', 'C#3', 'F#2', 'C#3', 'F#2', 'C#3', 'F#2', 'C#3'
    ];

    function playNote(freq, startTime, duration, waveType = 'sine', gainLevel = 0.08) {
      if (!freq || !audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = waveType;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(gainLevel, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration - 0.01);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + duration);
      } catch(e) {}
    }

    function scheduleMultiTrackLoop() {
      if (!isPlaying || !audioCtx) return;
      const lookAhead = 0.1;
      const scheduleAheadTime = 0.2;
      const noteTime = (60.0 / 108) / 2; // Rubato Grave/Affettuoso Tempo

      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        // Track 1: Nov_DC High Arpeggios
        const leadNote = novDcIntroOstinato[currentStep % novDcIntroOstinato.length];
        if (freqs[leadNote]) playNote(freqs[leadNote], nextNoteTime, noteTime * 0.9, 'sine', 0.07);

        // Track 2: Accompaniment Bass
        if (currentStep % 2 === 0) {
          const bassIdx = Math.floor(currentStep / 2) % novDcBassline.length;
          const bassNote = novDcBassline[bassIdx];
          if (bassNote && freqs[bassNote]) playNote(freqs[bassNote], nextNoteTime, noteTime * 1.8, 'triangle', 0.1);
        }

        nextNoteTime += noteTime;
        currentStep++;
      }
      timerID = setTimeout(scheduleMultiTrackLoop, lookAhead * 1000);
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      const btn = document.getElementById("audio-toggle");
      
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!isPlaying) {
        nextNoteTime = audioCtx.currentTime + 0.05;
        currentStep = 0;
        isPlaying = true;
        btn.textContent = '🔊 MUTE MUSIC';
        scheduleMultiTrackLoop();
      } else {
        isPlaying = false;
        if (timerID) clearTimeout(timerID);
        btn.textContent = '🔇 UNMUTE MUSIC';
      }
    }

    /* --- BRAND WEBFONTS --- */
    const companyFonts = [
      { font: "'Press Start 2P', monospace" },
      { font: "'Orbitron', sans-serif" },
      { font: "'Russo One', sans-serif" },
      { font: "'Permanent Marker', cursive" },
      { font: "'Cinzel', serif" },
      { font: "'Comic Neue', cursive" },
      { font: "'VT323', monospace" },
      { font: "'Fira Code', monospace" },
      { font: "'Courier Prime', monospace" },
      { font: "'Noto Sans SC', sans-serif" },
      { font: "'Noto Sans Devanagari', sans-serif" },
      { font: "'Courier New', Courier, monospace" }
    ];

    /* --- CANVAS BACKGROUND VISUAL ENGINE --- */
    const canvas = document.getElementById("bg-canvas");
    const ctx = canvas.getContext("2d");

    let particles = [];
    const numParticles = 650;
    let width, height, cx, cy;
    let warpSpeed = 4;
    let renderMode = "stars";
    let reverseWarp = false;
    let globalAngle = 0;

    const mEmojis = ["🍄", "🍆", "✨", "💫"];
    const dEmojis = ["😈", "👿", "🔥", "⚡", "666"];
    const sEmojis = ["💀", "☠️", "☣️", "🟢"];
    const flowerEmojis = ["🌸", "🌺", "🌼", "🌻", "☁️", "✨"];
    const catEmojis = ["🐱", "🙀", "😸", "🐾"];
    const dogEmojis = ["🐕", "🦮", "🐩", "🦴"];
    const dinoEmojis = ["🦖", "🌵", "🏃", "👾"];
    const rainEmojis = ["💧", "🌧️", "⚡", "🌊"];
    const asciiArt = ["[::]", "<=>", "{*}", "|||", "///", "@@@", "###"];

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      cx = width / 2;
      cy = height / 2;
    }

    class Particle {
      constructor() { this.reset(true); }

      reset(initial = false) {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = initial ? Math.random() * width : width;
        this.pz = this.z;
        this.mE = mEmojis[Math.floor(Math.random() * mEmojis.length)];
        this.dE = dEmojis[Math.floor(Math.random() * dEmojis.length)];
        this.sE = sEmojis[Math.floor(Math.random() * sEmojis.length)];
        this.flE = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
        this.cE = catEmojis[Math.floor(Math.random() * catEmojis.length)];
        this.dogE = dogEmojis[Math.floor(Math.random() * dogEmojis.length)];
        this.dinoE = dinoEmojis[Math.floor(Math.random() * dinoEmojis.length)];
        this.rE = rainEmojis[Math.floor(Math.random() * rainEmojis.length)];
        this.ascii = asciiArt[Math.floor(Math.random() * asciiArt.length)];
      }

      update() {
        this.pz = this.z;
        if (renderMode === "rain" || renderMode === "wind") {
          this.y += warpSpeed * 3;
          if (renderMode === "wind") this.x += warpSpeed * 4;
          if (this.y > height) { this.y = -20; this.x = (Math.random() - 0.5) * width * 2; }
        } else if (renderMode === "ocean") {
          this.x += Math.sin(globalAngle + this.y) * 2;
          this.y -= warpSpeed * 0.5;
          if (this.y < 0) this.y = height;
        } else if (reverseWarp) {
          this.z += warpSpeed;
          if (this.z >= width) this.reset(false);
        } else {
          this.z -= warpSpeed;
          if (this.z <= 0) this.reset(false);
        }
      }

      draw() {
        const sx = (this.x / this.z) * cx + cx;
        const sy = (this.y / this.z) * cy + cy;

        if (renderMode === "rain" || renderMode === "wind") {
          ctx.font = `20px monospace`;
          ctx.fillText(this.rE, this.x, this.y);
          return;
        } else if (renderMode === "ocean") {
          ctx.font = `16px monospace`;
          ctx.fillStyle = "#00ffff";
          ctx.fillText("~ ~ ~", this.x, this.y);
          return;
        } else if (renderMode === "ascii") {
          ctx.font = `14px monospace`;
          ctx.fillStyle = "#00ff00";
          ctx.fillText(this.ascii, sx, sy);
          return;
        }

        if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) {
          if (renderMode === "dino") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.dinoE, sx, sy);
          } else if (renderMode === "flowers") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 42)}px serif`;
            ctx.fillText(this.flE, sx, sy);
          } else if (renderMode === "cats") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.cE, sx, sy);
          } else if (renderMode === "dogs") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 38)}px serif`;
            ctx.fillText(this.dogE, sx, sy);
          } else if (renderMode === "mushrooms") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 36)}px serif`;
            ctx.fillText(this.mE, sx, sy);
          } else if (renderMode === "devils") {
            ctx.font = `${Math.max(12, (1 - this.z / width) * 40)}px serif`;
            ctx.fillText(this.dE, sx, sy);
          } else {
            const alpha = Math.min(1, (1 - this.z / width) * 1.8);
            const size = (1 - this.z / width) * 3;
            ctx.strokeStyle = renderMode === "tron" ? `rgba(0, 240, 255, ${alpha})` : `rgba(255, 17, 17, ${alpha})`;
            ctx.lineWidth = Math.max(0.5, size);
            ctx.beginPath();
            ctx.moveTo((this.x / this.pz) * cx + cx, (this.y / this.pz) * cy + cy);
            ctx.lineTo(sx, sy);
            ctx.stroke();
          }
        }
      }
    }

    function initParticles() {
      resizeCanvas();
      particles = [];
      for (let i = 0; i < numParticles; i++) particles.push(new Particle());
    }

    function drawCustomBackgrounds() {
      globalAngle += 0.02;

      if (renderMode === "tron" || renderMode === "driving") {
        ctx.fillStyle = renderMode === "driving" ? "rgba(10, 10, 20, 0.3)" : "rgba(0, 5, 20, 0.3)";
        ctx.fillRect(0, 0, width, height);

        ctx.strokeStyle = renderMode === "driving" ? "rgba(255, 0, 128, 0.5)" : "rgba(0, 240, 255, 0.4)";
        ctx.lineWidth = 1.5;
        const horizon = height * 0.55;

        for (let x = -width; x < width * 2; x += 80) {
          ctx.beginPath();
          ctx.moveTo(x, height);
          ctx.lineTo(cx + (x - cx) * 0.1, horizon);
          ctx.stroke();
        }
        for (let y = horizon; y < height; y += 20) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
      } else if (renderMode === "spiral") {
        ctx.fillStyle = "rgba(10, 0, 15, 0.2)";
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(globalAngle);
        for (let i = 0; i < 360; i += 15) {
          const rad = i * Math.PI / 180;
          ctx.strokeStyle = `hsl(${(i + globalAngle * 50) % 360}, 100%, 50%)`;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, i * 1.5, rad, rad + 0.5);
          ctx.stroke();
        }
        ctx.restore();
      } else {
        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.fillRect(0, 0, width, height);

        for (let p of particles) {
          p.update();
          p.draw();
        }
      }
    }

    function animateCanvas() {
      drawCustomBackgrounds();
      requestAnimationFrame(animateCanvas);

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", resizeCanvas);
    initParticles();

    /* --- POSSESSED ROLLING VISITOR COUNTER --- */
    const visitorBox = document.getElementById("visitor-box");
    function runPossessedCounter() {
      setInterval(() => {
        if (Math.random() < 0.2) {
          visitorBox.textContent = "VISITS: 00666";
          visitorBox.style.color = "#ff0000";

          visitorBox.textContent = `VISITS: ${randVal}`;

          visitorBox.style.borderColor = "#ff1111";

    runPossessedCounter();

    /* --- BACKGROUND SPECTRUM & PROFESSIONAL PALETTES --- */
    const phaseColors = [
      "#000000", "#120000", "#00051a", "#10001a", "#001a0a",
      "#f5f5f7", "#1877f2", "#00ffcc", "#ffcc00", "#7b00ff", "#150022"
    ];

    /* --- 300 PHASE ENGINE --- */
    let currentPhase = 0;
    let phaseTimer = null;

    const customTextVariants = [
      ["DREW", "WTF"], ["APPLE", "MAC"], ["FACE", "BOOK"], ["MUTHUR", "6000"],
      ["MEOW", "PURR"], ["DOGE", "WOW"], ["TRON", "GRID"], ["HEAVEN", "ANGEL"],

      ["MSDOS", "PROMPT"], ["SHROOM", "LSD"], ["DR3W", "W7F"], ["VOID", "NULL"],
      ["CHROME", "DINO"], ["RAIN", "WIND"], ["OCEAN", "WAVE"], ["DRIVE", "FAST"]

    function setPhase(p) {
      currentPhase = p;
      if (currentPhase > 300) currentPhase = 0;
      if (currentPhase < 0) currentPhase = 300;

      const el = document.getElementById("scramble-text");
      const badge = document.getElementById("phase-badge");
      
      badge.textContent = `PHASE NO. ${currentPhase}`;

      const randomFont = companyFonts[Math.floor(Math.random() * companyFonts.length)];
      el.style.fontFamily = randomFont.font;

      const themeBg = phaseColors[currentPhase % phaseColors.length];
      document.body.style.backgroundColor = themeBg;
      document.body.style.filter = "none";
      el.className = "title";
      
      // Professional Apple/Facebook styling for clean light phases
      if (themeBg === "#f5f5f7") {
        el.style.color = "#1d1d1f";
        el.style.textShadow = "0 0 5px rgba(0,0,0,0.1)";
        el.style.fontFamily = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif";
      } else if (themeBg === "#1877f2") {
        el.style.color = "#ffffff";
        el.style.textShadow = "0 0 10px rgba(255,255,255,0.5)";
        el.style.fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
      } else {
        el.style.color = "";
        el.style.textShadow = "";
      }

      renderMode = "stars";
      reverseWarp = false;
      canvas.classList.add("active");

      warpSpeed = (currentPhase % 30) + 2;

      // Phase Background Modes
      if (currentPhase % 24 === 0) {
        renderMode = "driving";
      } else if (currentPhase % 22 === 0) {
        renderMode = "ocean";
      } else if (currentPhase % 20 === 0) {
        renderMode = "ascii";
      } else if (currentPhase % 18 === 0) {
        renderMode = "dino";
      } else if (currentPhase % 16 === 0) {
        renderMode = "rain";
      } else if (currentPhase % 14 === 0) {
        renderMode = "tron";
      } else if (currentPhase % 12 === 0) {
        renderMode = "flowers";
      } else if (currentPhase % 10 === 0) {
        renderMode = "devils";
      } else if (currentPhase % 8 === 0) {
        renderMode = "spiral";
      } else if (currentPhase % 6 === 0) {
        renderMode = "cats";
      } else if (currentPhase % 4 === 0) {
        renderMode = "dogs";
      } else {
        reverseWarp = currentPhase % 2 === 0;
      }
    }

    function prevPhase() {
      currentPhase--;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function nextPhase() {
      currentPhase++;
      setPhase(currentPhase);
      resetPhaseTimer();
    }

    function randomPhase() {
      let rand = Math.floor(Math.random() * 300) + 1;
      setPhase(rand);
      resetPhaseTimer();
    }

    function resetPhaseTimer() {
      if (phaseTimer) clearInterval(phaseTimer);
      phaseTimer = setInterval(() => {
        currentPhase++;
        setPhase(currentPhase);
      }, 5000);
    }

    /* --- WORD NAVIGATION HANDLERS --- */
    function handleDrewClick(e) {
      if (e) e.stopPropagation();
      prevPhase();
    }

    function handleWtfClick(e) {
      if (e) e.stopPropagation();
      nextPhase();
    }

    function handleDotClick(e) {
      if (e) e.stopPropagation();
      randomPhase();
    }

    window.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".clickable-word") || e.target.closest(".audio-btn")) return;
      const centerY = window.innerHeight / 2;
      if (e.clientY < centerY) {
        prevPhase();
      } else {
        nextPhase();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") {
        nextPhase();
      } else if (e.key === "ArrowDown" || e.key === "ArrowLeft") {
        prevPhase();
      }
    });

    const wordDrewEl = document.getElementById("word-drew");
    const wordWtfEl = document.getElementById("word-wtf");

    const intlGlitchChars = [
      "0","1","3","7","_","/#","\\|","@","$","%","*","!",
      "中","文","鬼","魔","神","龍","悟",
      "अ","आ","इ","उ","ऋ","क","ख",
      "Д","Р","Е","В","У","Ш","К",
      "🔥","💀","😈","☣️","🟢","🛸","👽","🌸","🐱","🐕","🦖","🌧️","666"
    ];

    /* Always start phase showing DREW.WTF -> Glitch to variant -> Return back to DREW.WTF */
    function runScrambleCycle() {
      wordDrewEl.textContent = "DREW";
      wordWtfEl.textContent = "WTF";

      setTimeout(() => {
        const variant = customTextVariants[currentPhase % customTextVariants.length];
        const glitchLeft = variant[0];
        const glitchRight = variant[1];

        let frame = 0;
        const interval = setInterval(() => {
          wordDrewEl.textContent = glitchLeft.split('').map(c => 
            Math.random() < 0.35 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c
          ).join('');
          wordWtfEl.textContent = glitchRight.split('').map(c => 
            Math.random() < 0.35 ? intlGlitchChars[Math.floor(Math.random() * intlGlitchChars.length)] : c
          ).join('');
          
          frame++;
          if (frame >= 18) {
            clearInterval(interval);
            wordDrewEl.textContent = glitchLeft;
            wordWtfEl.textContent = glitchRight;

            // Hold phase word briefly before returning back to DREW.WTF
            setTimeout(() => {
              wordDrewEl.textContent = "DREW";
              wordWtfEl.textContent = "WTF";
              runScrambleCycle();
            }, 1200);
          }
        }, 45);
      }, 2000);
    }

    setPhase(0);
    resetPhaseTimer();
    animateCanvas();
    runScrambleCycle();
  </script>

</html>
