<style>
  :root { color-scheme: light; }
  [data-theme="light"] {

    --shadow: 0 16px 40px rgba(0,0,0,.35);

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: #fff; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .cover { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .sheet { width: min(400px, 100%); background: #fff; color: #1c1915; border-radius: 18px; padding: 28px 24px 20px; font-family: Georgia, Palatino, serif; }
  .sheet h2 { font-size: 28px; font-weight: 500; margin: 0 0 6px; }

  .sheet .go { width: 100%; margin-top: 16px; background: #1c1915; color: #fffaf6; border: 0; border-radius: 8px; min-height: 48px; font-family: "Segoe UI", sans-serif; font-size: 16px; }
  .sheet .cancel, .dev button { width: 100%; background: none; border: 0; color: #8c3a22; min-height: 48px; font-family: "Segoe UI", sans-serif; font-size: 16px; }
  .dev button { text-align: left; border-top: 1px solid rgba(28,25,21,.12); }

  #app { display: none; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif; }
  #app.on { display: block; background: #eef2f8; color: #4a5364; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #app.on .display { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 650; letter-spacing: 0; }
  .topbar { position: sticky; top: 0; z-index: 5; min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 8px; background: #3d74e8; color: #fff; }
  .topbar button { background: none; border: 0; color: #fff; min-height: 44px; font-size: 16px; display: flex; align-items: center; gap: 6px; padding: 0; }
  .topbar svg { flex: 0 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 6px; max-width: 480px; margin: 0 auto; padding: 16px 10px 28px; }
  .tile { position: relative; background: transparent; border: 0; color: #7b8494; min-height: 112px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; line-height: 1.15; text-align: center; }
  .tile .ico { width: 74px; height: 66px; border-radius: 14px; background: rgba(255,255,255,.72); display: flex; align-items: center; justify-content: center; }
  .tile .badge { position: absolute; top: 2px; right: 18px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: #e53935; color: #fff; font-size: 12px; font-weight: 700; line-height: 22px; }
  #app.on .block { background: #fff; border-radius: 12px; border-color: rgba(61,116,232,.12); }
  #app.on .part.warn, #app.on .part:disabled { opacity: 1; background: #fff4bf; border-color: #e2b400; color: #5c4a00; cursor: not-allowed; }
  #app.on .warnbox { background: #fff4bf; color: #5c4a00; border: 1px solid #e2b400; border-radius: 12px; padding: 12px 14px; margin: 0 0 10px; }
  #app.on .ticket { background: #fff; border-radius: 16px; overflow: hidden; margin: 8px 0 12px; }
  #app.on .layer { display: flex; justify-content: space-between; gap: 10px; align-items: center; width: 100%; text-align: left; background: #fff; border: 0; border-bottom: 1px solid #e8edf5; padding: 14px 16px; min-height: 68px; color: #243044; }
  #app.on .layer b { display: block; font-size: 16px; }
  #app.on .layer small, #app.on .k { display: block; color: #7b8494; font-size: 12px; }
  #app.on .addline { width: 100%; text-align: left; background: #f7f9fc; border: 0; border-bottom: 1px solid #e8edf5; min-height: 52px; padding: 0 16px; color: #3d74e8; font-weight: 650; }
  #app.on .ticket .qty { display: flex; align-items: center; gap: 6px; }
  #app.on .ticket .qty b { display: inline; min-width: 16px; text-align: center; }
  #app.on .ticket .qty button { width: 44px; height: 44px; border-radius: 22px; border: 1px solid #d5dbe6; background: #fff; font-size: 22px; color: #243044; }
  #app.on .ticket .qty button:disabled { background: #fff4bf; border-color: #e2b400; color: #5c4a00; }
  #app.on #q { width: 100%; height: 48px; border: 1px solid #d5dbe6; border-radius: 12px; padding: 0 14px; font-size: 16px; margin: 0 0 12px; background: #fff; color: #243044; }
  #app.on .back { color: #3d74e8; }
  .display { font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; font-weight: 500; letter-spacing: -0.03em; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .nav { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 18px; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px); }
  .mark { background: none; border: 0; color: var(--ink); font-weight: 650; letter-spacing: .08em; font-size: 13px; min-height: 44px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--paper); }
  .seg button { border: 0; background: transparent; color: var(--muted); min-height: 32px; padding: 0 10px; border-radius: 999px; font-size: 12px; }

  .bagbtn { background: none; border: 0; color: var(--ink); min-height: 44px; font-size: 14px; }

  .dots { display: flex; gap: 4px; margin-top: 4px; }

  .qty { display: flex; align-items: center; gap: 6px; }

  .sil { width: 64px; height: 40px; color: var(--ink); }

  summary { min-height: 36px; cursor: pointer; color: var(--accent); }
  .issue { border-left: 3px solid var(--bad); padding: 8px 0 8px 12px; margin: 8px 0; }

  .sum { position: sticky; top: 70px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }

    .track i { transition: none; }
  }

    var cpu = find(CPU, state.cpu), mb = find(MB, state.mb), gpu = find(GPU, state.gpu), cool = find(COOL, state.cool), psu = find(PSU, state.psu), box = find(CASE, state.box);
    var h = '<h2 class="display">Your order</h2><p class="fine">Tap a line to change it. Add another drive only while a slot is open. Yellow means it does not fit.</p>';
    if (note) h += '<p class="warnbox">' + note + '</p>';
    var list = issues();
    for (var i = 0; i < list.length; i++) h += '<p class="warnbox"><b>' + list[i].t + '</b> ' + list[i].f + '</p>';
    h += '<div class="ticket">';
    h += orderLine("Case", box ? box.name : "Add a case", box ? (box.form || "Size not listed") : "The box everything goes in", box ? box.price : null, "box");
    h += orderLine("Board", mb ? mb.name : "Add a board", mb ? boardBrief(mb) : "This decides what else you can order", mb ? mb.price : null, "mb");
    h += orderLine("CPU", cpu ? cpu.name : "Add a processor", cpu ? (cpu.cores || "") + " · " + cpu.sock : "The chip", cpu ? cpu.price : null, "cpu");
    h += orderLine("Cooler", cool ? cool.name : "Add a cooler", cool ? (cool.kind === "aio" ? (cool.rad ? cool.rad + "mm radiator" : "Liquid cooler") : "Air cooler") : "Sits on the processor", cool ? cool.price : null, "cool");
    if (!state.ram.length) h += '<button type="button" class="addline" data-act="goto" data-id="ram">Add memory</button>';
    for (var r = 0; r < state.ram.length; r++) {
      var stick = find(RAM, state.ram[r].id);
      h += topping("Memory", stick.name, stick.speed + " · " + stick.cl, stick.price * state.ram[r].qty, state.ram[r].qty, stick.id, "ram");
    }
    if (state.ram.length) h += '<button type="button" class="addline" data-act="goto" data-id="ram">Add memory</button>';
    h += orderLine("GPU", gpu ? gpu.name : "Add graphics", gpu ? (gpu.w ? gpu.w + "W" : "No extra plug") : "Or use graphics built into the processor", gpu ? gpu.price : null, "gpu");
    h += driveGroup("NVMe", "nvme", "Add an NVMe");
    h += driveGroup("SSD", "ssd", "Add an SSD");
    h += driveGroup("Hard drive", "hdd", "Add a hard drive");
    if (!state.fans.length) h += '<button type="button" class="addline" data-act="goto" data-id="fans">Add a fan</button>';
    for (var f = 0; f < state.fans.length; f++) {
      var fan = find(FAN, state.fans[f].id);
      h += topping("Fan", fan.name, fan.size + "mm · " + fan.rpm + " RPM", fan.price * state.fans[f].qty, state.fans[f].qty, fan.id, "fans");
    }
    if (state.fans.length) h += '<button type="button" class="addline" data-act="goto" data-id="fans">Add a fan</button>';
    if (!(state.extra || []).length) h += '<button type="button" class="addline" data-act="goto" data-id="extra">Add an extra</button>';
    for (var e = 0; e < (state.extra || []).length; e++) {
      var ex = find(EXTRA, state.extra[e].id);
      h += topping(ex.cat, ex.name, "Optional", ex.price * state.extra[e].qty, state.extra[e].qty, ex.id, "extra");
    }
    if ((state.extra || []).length) h += '<button type="button" class="addline" data-act="goto" data-id="extra">Add an extra</button>';
    h += orderLine("Power", psu ? psu.name : "Add power", (psu ? psu.watts + "W · " : "") + "about " + watts() + "W used, suggest " + recommend() + "W", psu ? psu.price : null, "psu");
    h += '</div>';
    if (mb) h += '<p class="fine">NVMe ' + (mb.m2 ? nvmeCount() + ' / ' + mb.m2 : 'slots not listed') + ' · SATA ' + (mb.sata ? sataCount() + ' / ' + mb.sata : 'ports not listed') + ' · Memory ' + ramMods() + (mb.dimm ? ' / ' + mb.dimm : ' · slots not listed') + '</p>';
    else h += '<p class="fine">Add a board before memory, NVMe, SSD, or a hard drive. The board is the tray.</p>';
    h += '<p class="fine">Total ' + money(total()) + '. Nothing is charged.</p>';
    return h;
  }
  function fitText(ok, yes, no) { return { ok: ok, text: ok ? yes : no }; }
  function menuItem(kind, name, spec, msg, price, act, id, tech, owned) {
    var ok = !msg;
    var label = ok ? (owned ? "On this order · add another" : "Add it") : msg;
    if (ok && owned && act.indexOf("set") === 0) label = "On this order";
    return partBtn(kind, name, spec, fitText(ok, label, msg), price, act, id, tech);
  }
  function viewPick() {
    var h = '<input id="q" type="search" placeholder="Search these parts" value="' + esc(query) + '" autocomplete="off">';
    var shown = 0, skipped = 0;
    function allow(name) {
      if (query && String(name).toLowerCase().indexOf(query.toLowerCase()) < 0) return false;
      if (!query && !showAll && shown >= 40) { skipped++; return false; }
      shown++;
      return true;
    }
    if (note) h += '<p class="warnbox">' + note + '</p>';
    if (section === "cpu") {
      h += '<h2 class="display">Processor</h2><p class="fine">One processor. It has to match the board.</p>';
      for (var i = 0; i < CPU.length; i++) {
        if (!allow(CPU[i].name)) continue;
        var msg = previewMsg(function (s) { s.cpu = CPU[i].id; });
        h += menuItem("cpu", CPU[i].name, CPU[i].cores + " · " + CPU[i].sock, msg, CPU[i].price, "setcpu", CPU[i].id, CPU[i].plain + (CPU[i].ig === 1 ? " Graphics are listed." : CPU[i].ig === 0 ? " No graphics are listed." : " Graphics are not stated."), state.cpu === CPU[i].id);
      }
    }
    if (section === "mb") {
      h += '<h2 class="display">Board</h2><p class="fine">One board. Slots on the board limit memory and drives.</p>';
      for (var b = 0; b < MB.length; b++) {
        if (!allow(MB[b].name)) continue;
        var msgb = previewMsg(function (s) { s.mb = MB[b].id; });
        h += menuItem("mb", MB[b].name, boardBrief(MB[b]), msgb, MB[b].price, "setmb", MB[b].id, MB[b].plain, state.mb === MB[b].id);
      }
    }
    if (section === "ram") {
      var board = find(MB, state.mb);
      h += '<h2 class="display">Memory</h2><p class="fine">' + (board ? (board.ddr ? "DDR" + board.ddr : "DDR not listed") + " · " + (board.dimm ? board.dimm + " slots · " : "slots not listed · ") + ramMods() + " modules on this order" : "Add a board first.") + '</p>';
      for (var r = 0; r < RAM.length; r++) {
        if (!allow(RAM[r].name)) continue;
        var msgr = moreBlocked("ram", RAM[r].id);
        h += menuItem("ram", RAM[r].name, RAM[r].speed + " · " + RAM[r].cl + (lineQty(state.ram, RAM[r].id) ? " · ×" + lineQty(state.ram, RAM[r].id) : ""), msgr, RAM[r].price, "addram", RAM[r].id, RAM[r].plain + " " + RAM[r].gb + "GB per module.", lineQty(state.ram, RAM[r].id) > 0);
      }
    }
    if (section === "gpu") {
      h += '<h2 class="display">Graphics</h2><p class="fine">One card, or the graphics built into the processor.</p>';
      for (var g = 0; g < GPU.length; g++) {
        if (!allow(GPU[g].name)) continue;
        var msgg = previewMsg(function (s) { s.gpu = GPU[g].id; });
        var gspec = GPU[g].id === "none" ? "No card" : ((GPU[g].vram ? GPU[g].vram + "GB" : "Memory size not listed"));
        h += menuItem("gpu", GPU[g].name, gspec, msgg, GPU[g].price, "setgpu", GPU[g].id, GPU[g].plain, state.gpu === GPU[g].id);
      }
    }
    if (section === "store") {
      var mb2 = find(MB, state.mb);
      var storeTitle = driveKind === "nvme" ? "NVMe" : driveKind === "ssd" ? "SSD" : driveKind === "hdd" ? "Hard drive" : "Storage";
      h += '<h2 class="display">' + storeTitle + '</h2>';
      h += mb2 ? '<p class="fine">NVMe ' + (mb2.m2 ? nvmeCount() + ' / ' + mb2.m2 : 'slot count not listed') + ' · SATA ' + (mb2.sata ? sataCount() + ' / ' + mb2.sata : 'port count not listed') + '. Add another while a listed slot is open.</p>' + boardSlots() : '<p class="fine">Add a board first. Drives need its slots.</p>';
      for (var s = 0; s < DRIVE.length; s++) {
        var d = DRIVE[s];
        if (!driveSort(d, driveKind)) continue;
        if (!allow(d.name)) continue;
        var spec = d.kind === "nvme" ? (d.gb / 1000) + "TB · NVMe" + (d.gen ? " · PCIe " + d.gen : "") : (d.hdd ? (d.gb / 1000) + "TB · " + (d.rpm ? d.rpm + " RPM · " : "") + d.form : (d.gb / 1000) + "TB · SATA SSD");
        var msgs = moreBlocked("drives", d.id);
        h += menuItem(d.kind === "nvme" ? "nvme" : "hdd", d.name, spec + (lineQty(state.drives, d.id) ? " · ×" + lineQty(state.drives, d.id) : ""), msgs, d.price, "adddrive", d.id, d.plain, lineQty(state.drives, d.id) > 0);
      }
    }
    if (section === "cool") {
      h += '<h2 class="display">Cooler</h2><p class="fine">One cooler. It has to be short enough for the case.</p>';
      for (var c = 0; c < COOL.length; c++) {
        if (!allow(COOL[c].name)) continue;
        var msgc = previewMsg(function (s) { s.cool = COOL[c].id; });
        var cspec = COOL[c].kind === "aio" ? (COOL[c].rad ? COOL[c].rad + "mm radiator" : "Liquid cooler") : "Air cooler";
        h += menuItem("cool", COOL[c].name, cspec, msgc, COOL[c].price, "setcool", COOL[c].id, COOL[c].plain, state.cool === COOL[c].id);
      }
    }
    if (section === "psu") {
      h += '<h2 class="display">Power</h2><p class="fine">One power supply. About ' + watts() + 'W is known. Suggest ' + recommend() + 'W. Card wattage is included only when the listing states it.</p>';
      for (var p = 0; p < PSU.length; p++) {
        if (!allow(PSU[p].name)) continue;
        var msgp = previewMsg(function (s) { s.psu = PSU[p].id; });
        h += menuItem("psu", PSU[p].name, PSU[p].watts + "W", msgp, PSU[p].price, "setpsu", PSU[p].id, PSU[p].plain, state.psu === PSU[p].id);
      }
    }
    if (section === "box") {
      h += '<h2 class="display">Case</h2><p class="fine">One case. The board, card, and cooler have to fit inside it.</p>';
      for (var k = 0; k < CASE.length; k++) {
        if (!allow(CASE[k].name)) continue;
        var msgk = previewMsg(function (s) { s.box = CASE[k].id; });
        h += menuItem("box", CASE[k].name, CASE[k].form || "Size not listed", msgk, CASE[k].price, "setbox", CASE[k].id, CASE[k].plain, state.box === CASE[k].id);
      }
    }
    if (section === "fans") {
      h += '<h2 class="display">Fans</h2><p class="fine">Fan mounts are not in the case listings, so a fan is not blocked for space.</p>';
      for (var n = 0; n < FAN.length; n++) {
        if (!allow(FAN[n].name)) continue;
        var msgn = moreBlocked("fans", FAN[n].id);
        h += menuItem("fan", FAN[n].name, FAN[n].size + "mm" + (FAN[n].pack > 1 ? " · pack of " + FAN[n].pack : "") + (FAN[n].rpm ? " · " + FAN[n].rpm + " RPM" : ""), msgn, FAN[n].price, "addfan", FAN[n].id, FAN[n].plain, lineQty(state.fans, FAN[n].id) > 0);
      }
    }
    if (section === "extra") {
      h += '<h2 class="display">Extras</h2><p class="fine">Paste, cables, lighting, adapters, and controller cards from the same price list. None of these are required.</p>';
      for (var ex = 0; ex < EXTRA.length; ex++) {
        if (!allow(EXTRA[ex].name + " " + EXTRA[ex].cat)) continue;
        h += menuItem("box", EXTRA[ex].name, EXTRA[ex].cat + (lineQty(state.extra || [], EXTRA[ex].id) ? " · ×" + lineQty(state.extra || [], EXTRA[ex].id) : ""), "", EXTRA[ex].price, "addextra", EXTRA[ex].id, EXTRA[ex].plain, lineQty(state.extra || [], EXTRA[ex].id) > 0);
      }
    }
    if (!shown) h += '<p class="fine">Nothing matches.</p>';
    if (skipped) h += '<button type="button" class="texty" data-act="showall">Show the rest</button>';
    return '<div class="block">' + h + '</div>';
  }

  function draw() {
    var y = 0;
    var mainEl = document.querySelector(".main");
    if (mainEl) y = mainEl.scrollTop || window.scrollY;
    var html = '<header class="topbar"><button type="button" data-act="home">PC</button><button type="button" data-act="bag">Bag' + (cart.length ? " " + cart.length : "") + '</button></header>';
    if (boot) {
      html += '<div class="boot"><p class="kicker">' + boot.name + '</p><h1 class="display">Building it.</h1><ul>';
      for (var i = 0; i < boot.steps.length; i++) html += '<li class="' + (i <= boot.at ? "on" : "") + '">' + (i < boot.at ? "✓ " : i === boot.at ? "● " : "○ ") + boot.steps[i] + '</li>';
      html += '</ul></div>';
    } else if (section === "home") html += viewHome();
    else if (section === "orders") html += '<div class="workspace"><button type="button" class="back" data-act="home">‹ Menu</button>' + viewOrders() + '</div>';
    else if (section === "build") {
      html += '<div class="workspace"><button type="button" class="back" data-act="home">‹ Menu</button>' + viewBuild();
      var list = issues();
      html += '<div class="mobbar"><div><b>' + money(total()) + '</b><div class="fine">' + doneCount() + '/6' + (list.length ? ' · Fix the yellow' : ' · Ready') + '</div></div><button type="button" class="texty primary" data-act="save">Add to Bag</button></div></div>';
    } else {
      html += '<div class="workspace"><button type="button" class="back" data-act="goto" data-id="build">‹ Order</button>' + viewPick() + '</div>';
    }
    if (bag) {
      html += '<div class="drop"><h2 class="display">Bag</h2>';
      if (!cart.length) html += '<p class="fine">Your bag is empty. A finished build can sit here as a list.</p>';
      for (var c = 0; c < cart.length; c++) html += '<div class="chosen"><div><b>' + cart[c].name + '</b><small>' + cart[c].blurb + '</small></div><div><em>' + money(cart[c].price) + '</em><button type="button" class="texty" data-act="openbag" data-id="' + c + '">Open</button><button type="button" class="texty" data-act="delbag" data-id="' + c + '">Remove</button></div></div>';
      html += '<button type="button" class="texty" data-act="bag">Close</button></div>';
    }
    app.innerHTML = html;
    if (y) window.scrollTo(0, y);
  }

  function limitRam(next) {
    var mb = find(MB, state.mb);
    if (!mb) return "Choose a board first. Memory has to match it.";
    if (!mb.ddr) return "This board's memory type is not in the price list.";
    var n = 0;
    for (var i = 0; i < next.length; i++) {
      var stick = find(RAM, next[i].id);
      if (String(stick.ddr) !== String(mb.ddr)) return "This board takes DDR" + mb.ddr + ".";
      n += (stick.mods || 1) * next[i].qty;
    }
    if (mb.dimm && n > mb.dimm) return "This board lists " + mb.dimm + " memory slots.";
    return "";
  }
  function limitDrive(next) {
    var mb = find(MB, state.mb);
    if (!mb) return "Choose a board first.";
    var nv = 0, sa = 0;
    for (var i = 0; i < next.length; i++) {
      var d = find(DRIVE, next[i].id);
      if (d.kind === "nvme") nv += next[i].qty; else sa += next[i].qty;
    }
    if (mb.m2 && nv > mb.m2) return "This board lists " + mb.m2 + " M.2 slots.";
    if (mb.sata && sa > mb.sata) return "This board lists " + mb.sata + " SATA ports.";
    return "";
  }
  function limitFan(next) { return fansFit(find(CASE, state.box), next); }

  function blurb() {
    var bits = [];
    var cpu = find(CPU, state.cpu);
    if (cpu) bits.push(cpu.name);
    if (qtySum(state.ram)) bits.push(qtySum(state.ram) + " memory");
    var gpu = find(GPU, state.gpu);
    if (gpu) bits.push(gpu.name);
    if (qtySum(state.drives)) bits.push(qtySum(state.drives) + " drives");
    return bits.join(" · ") || "Empty";
  }

  app.addEventListener("input", function (e) {
    if (e.target.id !== "q") return;
    query = e.target.value;
    showAll = false;
    draw();
    var field = document.getElementById("q");
    if (field) { field.focus(); var n = field.value.length; field.setSelectionRange(n, n); }
  });
  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || !app.contains(t)) return;
    var act = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");
    if (act === "theme") { appearance = id; applyTheme(); draw(); return; }
    if (act === "home") { section = "home"; bag = false; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "pick") { section = state.cpu ? "build" : "orders"; bag = false; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "bag") { bag = !bag; draw(); return; }
    if (act === "goto") { driveKind = ""; query = ""; showAll = false; section = id; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "drives") { driveKind = id; section = "store"; query = ""; showAll = false; note = ""; bag = false; draw(); window.scrollTo(0, 0); return; }
    if (act === "showall") { showAll = true; draw(); return; }
    if (act === "recipe") { bag = false; startBoot(RECIPES[id]); return; }
    if (act === "empty") { state = blank(); section = "build"; note = ""; draw(); return; }
    if (act === "setcpu") { state.cpu = id; section = "build"; draw(); return; }
    if (act === "setmb") { state.mb = id; section = "build"; draw(); return; }
    if (act === "setgpu") { state.gpu = id; section = "build"; draw(); return; }
    if (act === "setcool") { state.cool = id; section = "build"; draw(); return; }
    if (act === "setpsu") { state.psu = id; section = "build"; draw(); return; }
    if (act === "setbox") { state.box = id; section = "build"; draw(); return; }
    if (act === "addram") { state.ram = bump(state.ram, id, 1, limitRam); draw(); return; }
    if (act === "adddrive") { state.drives = bump(state.drives, id, 1, limitDrive); draw(); return; }
    if (act === "addfan") { state.fans = bump(state.fans, id, 1, limitFan); draw(); return; }
    if (act === "addextra") { if (!state.extra) state.extra = []; state.extra = bump(state.extra, id, 1, function () { return ""; }); draw(); return; }
    if (act === "inc" || act === "dec") {
      var group = t.getAttribute("data-group");
      if (act === "inc") {
        var blocked = moreBlocked(group, id);
        if (blocked) { note = blocked; draw(); return; }
      }
      var lim = group === "ram" ? limitRam : group === "drives" ? limitDrive : group === "extra" ? function () { return ""; } : limitFan;
      state[group] = bump(state[group], id, act === "inc" ? 1 : -1, lim);
      draw();
      return;
    }
    if (act === "save") {
      cart.push({ name: state.name, price: total(), blurb: blurb(), build: copyBuild(state) });
      bag = true; draw(); return;
    }
    if (act === "openbag") { state = copyBuild(cart[Number(id)].build); section = "build"; bag = false; draw(); return; }
    if (act === "delbag") { cart.splice(Number(id), 1); draw(); }
  });

  var canvas = document.getElementById("dino");
  var ctx = canvas.getContext("2d");
  var cactusX = 250, dy = 0, vy = 0;
  function frame() {
    ctx.clearRect(0, 0, 420, 110);
    ctx.fillStyle = "#535353";
    if (vy || dy) { dy += vy; vy -= 0.8; if (dy < 0) { dy = 0; vy = 0; } }
    ctx.fillRect(24, 78 - dy, 18, 22);
    ctx.fillRect(36, 70 - dy, 10, 8);
    ctx.fillRect(24, 96 - dy, 6, 8);
    ctx.fillRect(34, 96 - dy, 6, 8);
    ctx.fillRect(cactusX, 62, 10, 42);
    ctx.fillRect(cactusX - 12, 74, 12, 7);
    ctx.fillRect(cactusX + 10, 70, 12, 7);
    ctx.fillRect(0, 104, 420, 2);
    requestAnimationFrame(frame);
  }
  frame();
  canvas.addEventListener("pointerdown", function (e) {
    var r = canvas.getBoundingClientRect();
    var x = ((e.clientX - r.left) / r.width) * 420;
    var y = ((e.clientY - r.top) / r.height) * 110;
    if (x > cactusX - 24 && x < cactusX + 36 && y > 50 && y < 108) { cactusHits += 1; if (cactusHits >= 3) showApp(); return; }
    if (x < 70 && y > 30) { dinoHits += 1; if (dinoHits >= 3) { askPassword(); return; } }
    if (!dy && !vy) vy = 10;
  });
  function hitN() { nHits += 1; if (nHits >= 3) askDevice(); }
  document.getElementById("n1").onclick = hitN;
  document.getElementById("n2").onclick = hitN;
  document.getElementById("n3").onclick = hitN;
  if (window.innerWidth > 980) mode = "desk";
})();
</script>
</body>
</html>
