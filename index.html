    var keys = [["study", "Class, writing, and video."], ["desk", "A full day of work."], ["play", "Games at 1080p."], ["pro", "Games at 1440p."]];
    var h = '<div class="block"><h2>Computers</h2><p class="fine">Four finished computers. Pick one and it loads.</p>';
    for (var i = 0; i < keys.length; i++) {
      var r = RECIPES[keys[i][0]];
      h += '<button type="button" class="part" data-act="recipe" data-id="' + keys[i][0] + '"><span><b>' + r.name + '</b><small>' + keys[i][1] + '</small></span><em>' + money(priceOf(r)) + '</em></button>';
    }
    h += '<button type="button" class="texty" data-act="empty">Start empty</button></div>';
    return h;
  }
  function previewMsg(mut, extra) {
    var prev = state;
    state = copyBuild(prev);
    mut(state);
    var msg = extra ? extra() : "";
    if (!msg) {
      var list = issues();
      if (list.length) msg = list[0].t + " " + list[0].f;
    }
    state = prev;
    return msg;
  }
  function moreBlocked(group, id) {
    return previewMsg(function (s) {
      var list = s[group];
      var found = false;
      for (var i = 0; i < list.length; i++) if (list[i].id === id) { list[i].qty += 1; found = true; }
      if (!found) list.push({ id: id, qty: 1 });
    }, function () {
      if (group === "ram") return limitRam(state.ram);
      if (group === "drives") return limitDrive(state.drives);
      return limitFan(state.fans);
    });
  }
  function driveSort(d, kind) {
    if (kind === "nvme") return d.kind === "nvme";
    if (kind === "hdd") return d.rpm > 0;
    if (kind === "ssd") return d.kind === "sata" && !(d.rpm > 0);
    return true;
  }
  function orderLine(k, name, sub, price, id) {
    return '<button type="button" class="layer" data-act="goto" data-id="' + id + '"><span><span class="k">' + k + '</span><b>' + name + '</b><small>' + sub + '</small></span><em>' + (price == null ? "Add" : money(price)) + '</em></button>';
  }
  function topping(label, title, sub, price, qty, id, group) {
    var blocked = moreBlocked(group, id);
    return '<div class="layer"><span><span class="k">' + label + '</span><b>' + title + '</b><small>' + sub + '</small></span><span class="qty"><button type="button" data-act="dec" data-group="' + group + '" data-id="' + id + '" aria-label="Fewer">−</button><b>' + qty + '</b><button type="button" data-act="inc" data-group="' + group + '" data-id="' + id + '" aria-label="More"' + (blocked ? " disabled" : "") + '>+</button><em>' + money(price) + '</em></span></div>';
  }
  function driveGroup(label, kind, addLabel) {
    var h = "";
    for (var i = 0; i < state.drives.length; i++) {
      var d = find(DRIVE, state.drives[i].id);
      if (!driveSort(d, kind)) continue;
      var sub = d.kind === "nvme" ? "PCIe " + d.gen + " · M.2" : (d.rpm ? d.rpm + " RPM · SATA" : "SATA SSD");
      h += topping(label, d.name, sub, d.price * state.drives[i].qty, state.drives[i].qty, d.id, "drives");
    }
    h += '<button type="button" class="addline" data-act="drives" data-id="' + kind + '">' + addLabel + '</button>';
    return h;
  }
  function viewBuild() {
    var cpu = find(CPU, state.cpu), mb = find(MB, state.mb), gpu = find(GPU, state.gpu), cool = find(COOL, state.cool), psu = find(PSU, state.psu), box = find(CASE, state.box);
    var h = '<h2 class="display">Your order</h2><p class="fine">Tap a line to change it. Add another drive only while a slot is open. Yellow means it does not fit.</p>';
    if (note) h += '<p class="warnbox">' + note + '</p>';
    var list = issues();
    for (var i = 0; i < list.length; i++) h += '<p class="warnbox"><b>' + list[i].t + '</b> ' + list[i].f + '</p>';
    h += '<div class="ticket">';
    h += orderLine("Case", box ? box.name : "Add a case", box ? box.form + " · graphics to " + box.gpu + "mm" : "The box everything goes in", box ? box.price : null, "box");
    h += orderLine("Board", mb ? mb.name : "Add a board", mb ? mb.m2.length + " NVMe · " + mb.sata + " SATA · " + mb.dimm + " memory · " + mb.sock : "This decides what else you can order", mb ? mb.price : null, "mb");
    h += orderLine("CPU", cpu ? cpu.name : "Add a processor", cpu ? cpu.cores + " · " + cpu.sock : "The chip", cpu ? cpu.price : null, "cpu");
    h += orderLine("Cooler", cool ? cool.name : "Add a cooler", cool ? cool.h + "mm tall" : "Sits on the processor", cool ? cool.price : null, "cool");
    if (!state.ram.length) h += '<button type="button" class="addline" data-act="goto" data-id="ram">Add memory</button>';
    for (var r = 0; r < state.ram.length; r++) {
      var stick = find(RAM, state.ram[r].id);
      h += topping("Memory", stick.name, stick.speed + " · " + stick.cl, stick.price * state.ram[r].qty, state.ram[r].qty, stick.id, "ram");
    }
    if (state.ram.length) h += '<button type="button" class="addline" data-act="goto" data-id="ram">Add memory</button>';
    h += orderLine("GPU", gpu ? gpu.name : "Add graphics", gpu ? (gpu.w ? gpu.w + "W" : "No extra plug") : "Or use graphics built into the processor", gpu ? gpu.price : null, "gpu");
    h += driveGroup("NVMe", "nvme", "Add an NVMe");
    h += driveGroup("SSD", "ssd", "Add an SSD");
    h += driveGroup("Hard drive", "hdd", "Add a hard drive");
    if (!state.fans.length) h += '<button type="button" class="addline" data-act="goto" data-id="fans">Add a fan</button>';
    for (var f = 0; f < state.fans.length; f++) {
      var fan = find(FAN, state.fans[f].id);
      h += topping("Fan", fan.name, fan.size + "mm · " + fan.rpm + " RPM", fan.price * state.fans[f].qty, state.fans[f].qty, fan.id, "fans");
    }
    if (state.fans.length) h += '<button type="button" class="addline" data-act="goto" data-id="fans">Add a fan</button>';
    h += orderLine("Power", psu ? psu.name : "Add power", (psu ? psu.watts + "W · " : "") + "about " + watts() + "W used, suggest " + recommend() + "W", psu ? psu.price : null, "psu");
    h += '</div>';
    if (mb) h += '<p class="fine">NVMe ' + nvmeCount() + ' / ' + mb.m2.length + ' · SSD and hard drives ' + sataCount() + ' / ' + mb.sata + ' · Memory ' + qtySum(state.ram) + ' / ' + mb.dimm + '</p>';
    else h += '<p class="fine">Add a board before memory, NVMe, SSD, or a hard drive. The board is the tray.</p>';
    h += '<p class="fine">Total ' + money(total()) + '. Nothing is charged.</p>';
    return h;
  }
  function fitText(ok, yes, no) { return { ok: ok, text: ok ? yes : no }; }
  function menuItem(kind, name, spec, msg, price, act, id, tech, owned) {
    var ok = !msg;
    var label = ok ? (owned ? "On this order · add another" : "Add it") : msg;
    if (ok && owned && act.indexOf("set") === 0) label = "On this order";
    return partBtn(kind, name, spec, fitText(ok, label, msg), price, act, id, tech);
  }
  function viewPick() {
    var h = '';
    if (note) h += '<p class="warnbox">' + note + '</p>';
    if (section === "cpu") {
      h += '<h2 class="display">Processor</h2><p class="fine">One processor. It has to match the board.</p>';
      for (var i = 0; i < CPU.length; i++) {
        var msg = previewMsg(function (s) { s.cpu = CPU[i].id; });
        h += menuItem("cpu", CPU[i].name, CPU[i].cores + " · " + CPU[i].sock, msg, CPU[i].price, "setcpu", CPU[i].id, CPU[i].plain + " " + CPU[i].tdp + ". " + CPU[i].pcie + ". Cache " + CPU[i].cache + ". " + (CPU[i].ig ? "Has graphics." : "Needs a graphics card."), state.cpu === CPU[i].id);
      }
    }
    if (section === "mb") {
      h += '<h2 class="display">Board</h2><p class="fine">One board. Slots on the board limit memory and drives.</p>';
      for (var b = 0; b < MB.length; b++) {
        var msgb = previewMsg(function (s) { s.mb = MB[b].id; });
        h += menuItem("mb", MB[b].name, MB[b].sock + " · " + MB[b].m2.length + " NVMe · " + MB[b].sata + " SATA · " + MB[b].dimm + " memory", msgb, MB[b].price, "setmb", MB[b].id, MB[b].plain + " DDR" + MB[b].ddr + ". M.2 is PCIe " + MB[b].m2.join(" and ") + ".", state.mb === MB[b].id);
      }
    }
    if (section === "ram") {
      var board = find(MB, state.mb);
      h += '<h2 class="display">Memory</h2><p class="fine">' + (board ? board.dimm + " slots · DDR" + board.ddr + " · " + qtySum(state.ram) + " on this order" : "Add a board first.") + '</p>';
      for (var r = 0; r < RAM.length; r++) {
        var msgr = moreBlocked("ram", RAM[r].id);
        h += menuItem("ram", RAM[r].name, RAM[r].speed + " · " + RAM[r].cl + (lineQty(state.ram, RAM[r].id) ? " · ×" + lineQty(state.ram, RAM[r].id) : ""), msgr, RAM[r].price, "addram", RAM[r].id, RAM[r].plain + " " + RAM[r].gb + "GB per module.", lineQty(state.ram, RAM[r].id) > 0);
      }
    }
    if (section === "gpu") {
      h += '<h2 class="display">Graphics</h2><p class="fine">One card, or the graphics built into the processor.</p>';
      for (var g = 0; g < GPU.length; g++) {
        var msgg = previewMsg(function (s) { s.gpu = GPU[g].id; });
        h += menuItem("gpu", GPU[g].name, GPU[g].id === "none" ? "No card" : GPU[g].w + "W · " + GPU[g].len + "mm", msgg, GPU[g].price, "setgpu", GPU[g].id, GPU[g].plain, state.gpu === GPU[g].id);
      }
    }
    if (section === "store") {
      var mb2 = find(MB, state.mb);
      var storeTitle = driveKind === "nvme" ? "NVMe" : driveKind === "ssd" ? "SSD" : driveKind === "hdd" ? "Hard drive" : "Storage";
      h += '<h2 class="display">' + storeTitle + '</h2>';
      h += mb2 ? '<p class="fine">NVMe ' + nvmeCount() + ' / ' + mb2.m2.length + ' · SATA ' + sataCount() + ' / ' + mb2.sata + '. Add another while a slot is open.</p>' + boardSlots() : '<p class="fine">Add a board first. Drives need its slots.</p>';
      for (var s = 0; s < DRIVE.length; s++) {
        var d = DRIVE[s];
        if (!driveSort(d, driveKind)) continue;
        var spec = d.kind === "nvme" ? "PCIe " + d.gen + " ×4 · " + d.read.toLocaleString() + " / " + d.write.toLocaleString() + " MB/s" : (d.rpm ? d.rpm + " RPM · " + d.cache + " cache · " + d.iface : d.iface + " · " + d.form);
        var msgs = moreBlocked("drives", d.id);
        var slow = "";
        if (!msgs && d.kind === "nvme" && mb2 && d.gen === "5.0" && mb2.m2[0] !== "5.0") slow = "Fits, but this board tops out at PCIe 4.0, so the drive will be slower.";
        h += menuItem(d.kind === "nvme" ? "nvme" : "hdd", d.name, spec + (lineQty(state.drives, d.id) ? " · ×" + lineQty(state.drives, d.id) : ""), msgs, d.price, "adddrive", d.id, d.plain + (d.tbw ? " TBW " + d.tbw + "." : "") + (slow ? " " + slow : ""), lineQty(state.drives, d.id) > 0);
      }
    }
    if (section === "cool") {
      h += '<h2 class="display">Cooler</h2><p class="fine">One cooler. It has to be short enough for the case.</p>';
      for (var c = 0; c < COOL.length; c++) {
        var msgc = previewMsg(function (s) { s.cool = COOL[c].id; });
        h += menuItem("cool", COOL[c].name, COOL[c].h + "mm", msgc, COOL[c].price, "setcool", COOL[c].id, COOL[c].plain, state.cool === COOL[c].id);
      }
    }
    if (section === "psu") {
      h += '<h2 class="display">Power</h2><p class="fine">One power supply. About ' + watts() + 'W used. Suggest ' + recommend() + 'W.</p>';
      for (var p = 0; p < PSU.length; p++) {
        var msgp = previewMsg(function (s) { s.psu = PSU[p].id; });
        h += menuItem("psu", PSU[p].name, PSU[p].watts + "W", msgp, PSU[p].price, "setpsu", PSU[p].id, PSU[p].plain, state.psu === PSU[p].id);
      }
    }
    if (section === "box") {
      h += '<h2 class="display">Case</h2><p class="fine">One case. The board, card, and cooler have to fit inside it.</p>';
      for (var k = 0; k < CASE.length; k++) {
        var msgk = previewMsg(function (s) { s.box = CASE[k].id; });
        h += menuItem("box", CASE[k].name, CASE[k].form + " · " + fanSlots(CASE[k]) + " fan positions", msgk, CASE[k].price, "setbox", CASE[k].id, CASE[k].plain, state.box === CASE[k].id);
      }
    }
    if (section === "fans") {
      h += '<h2 class="display">Fans</h2><p class="fine">Add one per open mount. A 120mm fan can use a larger mount. A 140mm fan cannot use a 120mm mount.</p>' + caseFans();
      for (var n = 0; n < FAN.length; n++) {
        var msgn = moreBlocked("fans", FAN[n].id);
        h += menuItem("fan", FAN[n].name, FAN[n].size + "mm · " + FAN[n].rpm + " RPM · " + FAN[n].cfm + " CFM", msgn, FAN[n].price, "addfan", FAN[n].id, FAN[n].plain + " " + FAN[n].noise + ". " + FAN[n].conn + ".", lineQty(state.fans, FAN[n].id) > 0);
      }
    }
    return '<div class="block">' + h + '</div>';
  }

  function draw() {
    var y = 0;
    var mainEl = document.querySelector(".main");
    if (mainEl) y = mainEl.scrollTop || window.scrollY;
    var html = '<header class="topbar"><button type="button" data-act="home">PC</button><button type="button" data-act="bag">Bag' + (cart.length ? " " + cart.length : "") + '</button></header>';
    if (boot) {
      html += '<div class="boot"><p class="kicker">' + boot.name + '</p><h1 class="display">Building it.</h1><ul>';
      for (var i = 0; i < boot.steps.length; i++) html += '<li class="' + (i <= boot.at ? "on" : "") + '">' + (i < boot.at ? "✓ " : i === boot.at ? "● " : "○ ") + boot.steps[i] + '</li>';
      html += '</ul></div>';
    } else if (section === "home") html += viewHome();
    else if (section === "orders") html += '<div class="workspace"><button type="button" class="back" data-act="home">‹ Menu</button>' + viewOrders() + '</div>';
    else if (section === "build") {
      html += '<div class="workspace"><button type="button" class="back" data-act="home">‹ Menu</button>' + viewBuild();
      var list = issues();
      html += '<div class="mobbar"><div><b>' + money(total()) + '</b><div class="fine">' + doneCount() + '/6' + (list.length ? ' · Fix the yellow' : ' · Ready') + '</div></div><button type="button" class="texty primary" data-act="save">Add to Bag</button></div></div>';
    } else {
      html += '<div class="workspace"><button type="button" class="back" data-act="goto" data-id="build">‹ Order</button>' + viewPick() + '</div>';
    }
    if (bag) {
      html += '<div class="drop"><h2 class="display">Bag</h2>';
      if (!cart.length) html += '<p class="fine">Your bag is empty. A finished build can sit here as a list.</p>';
      for (var c = 0; c < cart.length; c++) html += '<div class="chosen"><div><b>' + cart[c].name + '</b><small>' + cart[c].blurb + '</small></div><div><em>' + money(cart[c].price) + '</em><button type="button" class="texty" data-act="openbag" data-id="' + c + '">Open</button><button type="button" class="texty" data-act="delbag" data-id="' + c + '">Remove</button></div></div>';
      html += '<button type="button" class="texty" data-act="bag">Close</button></div>';
    }
    app.innerHTML = html;
    if (y) window.scrollTo(0, y);
  }

  function limitRam(next) {
    var mb = find(MB, state.mb);
    if (!mb) return "Choose a board first. Memory has to match its slots.";
    var n = 0;
    for (var i = 0; i < next.length; i++) {
      n += next[i].qty;
      if (find(RAM, next[i].id).ddr !== mb.ddr) return "This board takes DDR" + mb.ddr + ".";
    }
    if (n > mb.dimm) return "Your motherboard has " + mb.dimm + " memory slots.";
    return "";
  }
  function limitDrive(next) {
    var mb = find(MB, state.mb);
    if (!mb) return "Choose a board first.";
    var nv = 0, sa = 0;
    for (var i = 0; i < next.length; i++) {
      var d = find(DRIVE, next[i].id);
      if (d.kind === "nvme") nv += next[i].qty; else sa += next[i].qty;
    }
    if (nv > mb.m2.length) return "This board has " + mb.m2.length + " M.2 slots.";
    if (sa > mb.sata) return "This board has " + mb.sata + " SATA ports.";
    return "";
  }
  function limitFan(next) { return fansFit(find(CASE, state.box), next); }

  function blurb() {
    var bits = [];
    var cpu = find(CPU, state.cpu);
    if (cpu) bits.push(cpu.name);
    if (qtySum(state.ram)) bits.push(qtySum(state.ram) + " memory");
    var gpu = find(GPU, state.gpu);
    if (gpu) bits.push(gpu.name);
    if (qtySum(state.drives)) bits.push(qtySum(state.drives) + " drives");
    return bits.join(" · ") || "Empty";
  }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || !app.contains(t)) return;
    var act = t.getAttribute("data-act");
    var id = t.getAttribute("data-id");
    if (act === "theme") { appearance = id; applyTheme(); draw(); return; }
    if (act === "home") { section = "home"; bag = false; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "pick") { section = state.cpu ? "build" : "orders"; bag = false; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "bag") { bag = !bag; draw(); return; }
    if (act === "goto") { driveKind = ""; section = id; note = ""; draw(); window.scrollTo(0, 0); return; }
    if (act === "drives") { driveKind = id; section = "store"; note = ""; bag = false; draw(); window.scrollTo(0, 0); return; }
    if (act === "recipe") { bag = false; startBoot(RECIPES[id]); return; }
    if (act === "empty") { state = blank(); section = "build"; note = ""; draw(); return; }
    if (act === "setcpu") { state.cpu = id; section = "build"; draw(); return; }
    if (act === "setmb") { state.mb = id; section = "build"; draw(); return; }
    if (act === "setgpu") { state.gpu = id; section = "build"; draw(); return; }
    if (act === "setcool") { state.cool = id; section = "build"; draw(); return; }
    if (act === "setpsu") { state.psu = id; section = "build"; draw(); return; }
    if (act === "setbox") { state.box = id; section = "build"; draw(); return; }
    if (act === "addram") { state.ram = bump(state.ram, id, 1, limitRam); draw(); return; }
    if (act === "adddrive") { state.drives = bump(state.drives, id, 1, limitDrive); draw(); return; }
    if (act === "addfan") { state.fans = bump(state.fans, id, 1, limitFan); draw(); return; }
    if (act === "inc" || act === "dec") {
      var group = t.getAttribute("data-group");
      if (act === "inc") {
        var blocked = moreBlocked(group, id);
        if (blocked) { note = blocked; draw(); return; }
      }
      var lim = group === "ram" ? limitRam : group === "drives" ? limitDrive : limitFan;
      state[group] = bump(state[group], id, act === "inc" ? 1 : -1, lim);
      draw();
      return;
    }
    if (act === "save") {
      cart.push({ name: state.name, price: total(), blurb: blurb(), build: copyBuild(state) });
      bag = true; draw(); return;
    }
    if (act === "openbag") { state = copyBuild(cart[Number(id)].build); section = "build"; bag = false; draw(); return; }
    if (act === "delbag") { cart.splice(Number(id), 1); draw(); }
  });

  var canvas = document.getElementById("dino");
  var ctx = canvas.getContext("2d");
  var cactusX = 250, dy = 0, vy = 0;
  function frame() {
    ctx.clearRect(0, 0, 420, 110);
    ctx.fillStyle = "#535353";
    if (vy || dy) { dy += vy; vy -= 0.8; if (dy < 0) { dy = 0; vy = 0; } }
    ctx.fillRect(24, 78 - dy, 18, 22);
    ctx.fillRect(36, 70 - dy, 10, 8);
    ctx.fillRect(24, 96 - dy, 6, 8);
    ctx.fillRect(34, 96 - dy, 6, 8);
    ctx.fillRect(cactusX, 62, 10, 42);
    ctx.fillRect(cactusX - 12, 74, 12, 7);
    ctx.fillRect(cactusX + 10, 70, 12, 7);
    ctx.fillRect(0, 104, 420, 2);
    requestAnimationFrame(frame);
  }
  frame();
  canvas.addEventListener("pointerdown", function (e) {
    var r = canvas.getBoundingClientRect();
    var x = ((e.clientX - r.left) / r.width) * 420;
    var y = ((e.clientY - r.top) / r.height) * 110;
    if (x > cactusX - 24 && x < cactusX + 36 && y > 50 && y < 108) { cactusHits += 1; if (cactusHits >= 3) showApp(); return; }
    if (x < 70 && y > 30) { dinoHits += 1; if (dinoHits >= 3) { askPassword(); return; } }
    if (!dy && !vy) vy = 10;
  });
  function hitN() { nHits += 1; if (nHits >= 3) askDevice(); }
  document.getElementById("n1").onclick = hitN;
  document.getElementById("n2").onclick = hitN;
  document.getElementById("n3").onclick = hitN;
  if (window.innerWidth > 980) mode = "desk";
})();
</script>
</body>
</html>
